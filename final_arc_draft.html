<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Final arc — dialogue draft</title>
<style>
  :root { --bg:#f2f2f7; --panel:#fff; --line:#e3e3e8; --ink:#1c1c1e; --dim:#8e8e93; --blue:#0a84ff;
          --alex:#0a84ff; --jordan:#af52de; --priya:#34a853; --amber:#b25000; }
  * { box-sizing:border-box; margin:0; }
  body { font:15px/1.5 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); }
  header { position:sticky; top:0; z-index:5; background:var(--panel); border-bottom:1px solid var(--line); padding:12px 20px; }
  header h1 { font-size:17px; }
  header p.sub { color:var(--dim); font-size:13px; margin-top:2px; }
  main { max-width:820px; margin:0 auto; padding:20px 16px; }

  .intro { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 22px; margin-bottom:22px; font-size:14px; }
  .intro h2 { font-size:15px; margin-bottom:6px; }
  .intro ol { padding-left:20px; }
  .intro li { margin:4px 0; }

  .act { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px 22px; margin-bottom:22px; }
  .act-h { display:flex; align-items:baseline; gap:10px; margin-bottom:4px; flex-wrap:wrap; }
  .act-h .time { font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#7b3fb5; }
  .act-h h2 { font-size:18px; }
  .act-note { color:var(--dim); font-size:13px; margin:4px 0 16px; }

  .beat { margin:18px 0; padding-top:14px; border-top:1px dashed var(--line); }
  .beat:first-child { border-top:0; padding-top:0; }
  .beat-tag { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }

  .row { display:flex; gap:9px; margin:7px 0; align-items:flex-start; }
  .row.out { justify-content:flex-end; }
  .av { width:26px; height:26px; border-radius:50%; color:#fff; font-weight:700; font-size:12px;
        display:flex; align-items:center; justify-content:center; flex:none; margin-top:2px; }
  .av.alex { background:var(--alex); } .av.jordan { background:var(--jordan); } .av.priya { background:var(--priya); }
  .who { font-size:11px; color:var(--dim); margin-bottom:2px; }
  .who.to { text-align:right; }
  .bub { background:#e9e9eb; border-radius:16px; border-bottom-left-radius:5px; padding:8px 13px; max-width:66ch; white-space:pre-wrap; margin-bottom:3px; }
  .bub.me { background:var(--blue); color:#fff; border-bottom-left-radius:16px; border-bottom-right-radius:5px; }
  .bub.img { background:#fff; border:1px dashed #c7c7cc; color:var(--dim); font-style:italic; }
  .stage { text-align:center; color:var(--dim); font-size:12px; font-style:italic; margin:8px 0; }
  .system { text-align:center; color:var(--dim); font-size:12px; margin:12px 0; }
  .system span { background:#f2f2f7; border-radius:10px; padding:3px 10px; }
  .typing { display:inline-flex; gap:4px; background:#e9e9eb; border-radius:16px; padding:11px 13px; }
  .typing i { width:7px; height:7px; border-radius:50%; background:#9a9aa0; animation:blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay:.2s; } .typing i:nth-child(3) { animation-delay:.4s; }
  .typing.stopped i { animation:none; opacity:.35; }
  @keyframes blink { 0%,80%,100% { opacity:.3; } 40% { opacity:1; } }

  .card { border:1px solid #d6d6db; border-radius:12px; padding:12px 16px; background:#fbfbfd; margin:8px 0; }
  .card .k { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin-bottom:4px; }

  .fork { margin-top:12px; }
  .fork-h { font-size:12px; font-weight:700; color:var(--amber); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px; }
  .opt { border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:10px; background:#fafafc; }
  .opt-label { font-weight:700; font-size:13.5px; margin-bottom:6px; }
  .opt-label .key { font-size:10.5px; font-weight:600; color:#2456c4; background:#eef4ff; border-radius:4px; padding:1px 5px; margin-right:6px; }
  .opt-label .gate { font-size:10.5px; font-weight:600; color:#8a5a00; background:#fff3d6; border-radius:4px; padding:1px 5px; margin-left:6px; }
  .opt .row { margin:6px 0; }
  .opt-note { color:var(--dim); font-size:12px; margin-top:6px; font-style:italic; }
  .opt-next { font-size:12px; font-weight:600; color:#7b3fb5; margin-top:6px; }

  .paths { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0 18px; position:sticky; top:66px; z-index:4;
           background:var(--bg); padding:8px 0; }
  .paths button { border:1px solid var(--line); background:#fff; border-radius:20px; padding:6px 14px; font-size:13px; cursor:pointer; }
  .paths button.on { background:#7b3fb5; color:#fff; border-color:#7b3fb5; }
  .path-body { display:none; }
  .path-body.on { display:block; }
  .path-sum { color:var(--dim); font-size:13px; margin:0 0 14px; }

  .callback { background:#fffbe8; border:1px solid #f0e6b8; color:#5b5340; border-radius:10px; padding:8px 13px; margin:10px 0; font-size:13px; }
  .callback b { color:#3d372a; }
  h3.split { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:28px 0 10px; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>Final arc — "what are we building monday" · dialogue draft</h1>
  <p class="sub">One night, all over chat. The pivot call → who builds v2 → Alex's DM → Jordan's thread. No option ever says "fire".</p>
</header>
<main id="app"></main>

<script>
const NAME = { alex: "Alex", jordan: "Jordan", priya: "Priya", founder: "You" };
const arr = (x) => Array.isArray(x) ? x : [x];
const A = (who, lines) => ({ who, lines: arr(lines) });
const OUT = (to, lines) => ({ who: "founder", to, lines: arr(lines) });
const STAGE = (text) => ({ stage: text });
const SYS = (text) => ({ system: text });
const TYPING = (stopped) => ({ typing: true, stopped });
const IMG = (who, caption) => ({ who, img: caption });
const CARD = (kicker, text) => ({ card: text, kicker });
const CB = (html) => ({ callback: html });

function esc(s) { return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function renderMsg(m) {
  if (m.stage) return `<div class="stage">${esc(m.stage)}</div>`;
  if (m.system) return `<div class="system"><span>${esc(m.system)}</span></div>`;
  if (m.callback) return `<div class="callback">${m.callback}</div>`;
  if (m.card) return `<div class="card"><div class="k">${esc(m.kicker)}</div>${esc(m.card)}</div>`;
  if (m.typing) return `<div class="row"><div class="av jordan">J</div><div><div class="typing${m.stopped ? " stopped" : ""}"><i></i><i></i><i></i></div></div></div>`;
  if (m.img) return `<div class="row"><div class="av ${m.who}">${NAME[m.who][0]}</div>
    <div><div class="who">${NAME[m.who]}</div><div class="bub img">[photo] ${esc(m.img)}</div></div></div>`;
  if (m.who === "founder") {
    const b = m.lines.map(l => `<div class="bub me">${esc(l)}</div>`).join("");
    return `<div class="row out"><div><div class="who to">to ${esc(m.to)}</div>${b}</div></div>`;
  }
  const b = m.lines.map(l => `<div class="bub">${esc(l)}</div>`).join("");
  return `<div class="row"><div class="av ${m.who}">${NAME[m.who][0]}</div>
    <div><div class="who">${NAME[m.who]}</div>${b}</div></div>`;
}

function renderOpt(o, to) {
  const reply = o.reply ? renderMsg(OUT(o.to || to, o.reply)) : "";
  const reactions = (o.then || []).map(renderMsg).join("");
  const gate = o.gate ? `<span class="gate">⚑ ${esc(o.gate)}</span>` : "";
  const note = o.note ? `<div class="opt-note">${esc(o.note)}</div>` : "";
  const next = o.next ? `<div class="opt-next">→ ${esc(o.next)}</div>` : "";
  return `<div class="opt">
    <div class="opt-label"><span class="key">${esc(o.key)}</span>${esc(o.label)}${gate}</div>
    ${reply}${reactions}${note}${next}
  </div>`;
}

function renderBeat(b) {
  const msgs = (b.msgs || []).map(renderMsg).join("");
  const forkH = b.fork ? `<div class="fork-h">${esc(b.fork)}</div>` : "";
  const opts = (b.options || []).map(o => renderOpt(o, b.to)).join("");
  const after = (b.after || []).map(renderMsg).join("");
  return `<div class="beat">
    ${b.tag ? `<div class="beat-tag">${esc(b.tag)}</div>` : ""}
    ${msgs}
    ${b.options ? `<div class="fork">${forkH}${opts}</div>` : ""}
    ${after}
  </div>`;
}

function renderAct(act) {
  return `<div class="act"><div class="act-h">${act.time ? `<span class="time">${esc(act.time)}</span>` : ""}<h2>${esc(act.title)}</h2></div>
    ${act.note ? `<div class="act-note">${esc(act.note)}</div>` : ""}
    ${(act.beats || []).map(renderBeat).join("")}
  </div>`;
}

// ═════════════════════════════════════════════════════════════════════════
// SHARED — the door, the product question, who builds what, Alex's DM
// ═════════════════════════════════════════════════════════════════════════

const door = {
  time: "wk ~18 · 6:10pm · Alex's DM",
  title: "The door — Alex wants to spend the money",
  note: "Not a founder card: the arc opens because someone pushes over chat. Alex has a plan, a budget and momentum — and the big decision is whether to stop him.",
  beats: [
    {
      msgs: [
        A("alex", [
          "ok. i'm done watching the graph go down. i have a plan.",
          "mixer at the climbing gym, referral codes, flyers on three campuses. $1,500. six weeks and we're at 300 users — and at 300 the app finally has enough people in it to work.",
          "that's a quarter of what's left in the bank. i need a yes from you before i book the gym. they want an answer tonight.",
        ]),
      ],
      fork: "founder's reply",
      to: "Alex",
      options: [
        { key: "go", label: "Do it. Book the gym.", reply: "do it. book the gym.",
          then: [A("alex", "booking it now. you won't regret this.")],
          note: "The growth path, taken without a word to anyone — today's pivot_choice: growth, minus the debate. Priya's fifty-match tally can still rescue it later, at a price." },
        { key: "hold", label: "Hold on. Everyone on one thread tonight — Priya too.",
          reply: "hold on. before we spend a quarter of the bank, i want everyone on one thread tonight. priya too.",
          then: [A("alex", ["…fine. but i'm bringing the numbers, and i'm going to argue for this.", "the gym holds the slot till midnight."])],
          next: "Act 1" },
        { key: "@ignored", label: "(left on read)",
          note: "Alex books it anyway at midnight. Silence is a yes." },
      ],
      after: [CB("<b>Why this feels big:</b> the default is <i>yes</i>. Alex has a plan, a price, a deadline (“the gym holds the slot till midnight”) and a quarter of the bank on the table. The player's move isn't “start the pivot” — it's <i>stopping a confident co-founder to ask a question nobody has asked</i>. That's the decision the game wants to teach.")],
    },
    {
      msgs: [SYS("You named the conversation “what are we building monday”"), SYS("Alex, Jordan and Priya were added")],
    },
  ],
};

const act1 = {
  time: "8:40pm · group",
  title: "Act 1 — The product question",
  note: "The player runs the meeting: every message in this act is an answer to someone the player called on. The pivot is not on the table at the start — it has to be dug out.",
  beats: [
    {
      tag: "round 1 · you call on each of them (any order)",
      msgs: [OUT("group", "ok. everyone's here. one question tonight: what are we building monday. i want to hear all three of you before anyone decides anything.")],
      fork: "who speaks first — all three get called on, in the order you pick",
      to: "group",
      options: [
        { key: "alex", label: "Alex — make your case.", reply: "alex, you first. make your case.",
          then: [A("alex", ["the room's empty. nine users. anyone would leave an empty app — even hinge would die at nine users.", "$1,500, six weeks, 300 users. then we'll know if anything's actually broken."])] },
        { key: "priya", label: "Priya — what do you see?", reply: "priya — what do you see from the outside?",
          then: [A("priya", ["retention, not signups. the people who come don't stay — even the ones who matched.", "i don't know why yet. and neither do you. that's the problem with spending the $1,500."])] },
        { key: "jordan", label: "Jordan — you watched launch day.", reply: "jordan, you watched launch day closer than anyone. what did you see?",
          then: [A("jordan", ["honestly? it looked like it was working. maya signed up, filled out everything, matched in an hour.", "…and then i kind of stopped watching. i figured the hard part was done."])] },
      ],
      after: [CB("<b>One chip, one or two messages.</b> Three chips, all taken (the one you've asked disappears). Nothing lands without the player asking — the group chat never floods.<br>Note what each says: Alex has a plan, Priya has a symptom without a cause, Jordan has a clue she doesn't know is a clue.")],
    },
    {
      tag: "the first fork — one way to stop, two ways down",
      msgs: [A("alex", "so? mixer or not?")],
      fork: "founder's move",
      to: "group",
      options: [
        { key: "users", label: "Alex is right — get the users.", reply: "alex is right. the room's empty. book the gym.",
          note: "Growth path, as today. No pivot surfaced. The fifty-match verdict can still bring it back.", next: "end of act (no pivot)" },
        { key: "dig_alex", label: "Wait. Alex — pull the best matches. What happened to them?",
          reply: "wait. before we decide — alex, pull our best matches. the ones that should have worked. what happened to them?",
          next: "dig 1" },
        { key: "dig_priya", label: "Priya — why don't they stay?",
          reply: "priya, you said even the ones who matched don't stay. why?",
          then: [A("priya", "i don't know. but alex does, he just hasn't looked. alex — pull your best matches. the ones that should have worked.")],
          next: "dig 1" },
      ],
      after: [CB("<b>Harder to miss, still missable.</b> One chip takes Alex's Hail Mary. Two are plain curiosity — follow up on Alex's numbers, or on Priya's symptom — and both lead down the same hole.")],
    },
    {
      tag: "dig 1 · Alex looks",
      msgs: [
        A("alex", ["…give me a minute.", "okay. eleven best matches since launch. both people liked each other, both still had the app.", "ten of them: match → 'hey' → 'hey' → nothing."]),
      ],
      fork: "founder's move",
      to: "group",
      options: [
        { key: "users2", label: "Still an empty room. Book the gym.", reply: "that's still an empty room. people get bored when there's nobody around. book the gym.",
          then: [A("priya", "…okay. your call.")], next: "end of act (no pivot)" },
        { key: "jordan_maya", label: "Jordan — what did Maya do after she matched?",
          reply: "jordan. maya. what did she do after she matched?",
          then: [A("jordan", ["…nothing. she didn't do anything. there was nothing TO do.", "she matched with a guy she liked, and the app gave her a chat box and walked away."])],
          next: "dig 2" },
        { key: "maya_quote", label: "Maya told me herself.", gate: "called Maya in the trough",
          reply: "i called maya last month. her words: 'it was just a chat window. i already have seven of those. plusone made me feel worse.'",
          next: "dig 2" },
      ],
    },
    {
      tag: "dig 2 · the eureka — one tap, one voice",
      fork: "founder's move (single choice)",
      to: "group",
      options: [
        { key: "priya", label: "Priya — is that it?", reply: "priya. is that it?",
          then: [A("priya", ["that's it. you don't have a matching problem. you have an 'and then what' problem.", "nobody knows what to say after 'hey'. so give them something to say yes to."])] },
      ],
    },
    {
      fork: "founder's move (single choice)",
      to: "group",
      options: [
        { key: "jordan", label: "Jordan — what would that look like?", reply: "jordan — what would that look like? something to say yes to.",
          then: [A("jordan", ["a plan. thursday, climbing gym, six people, two spots.", "you don't message a stranger. you just tap 'i'm in'."])] },
      ],
    },
    {
      fork: "founder's move (single choice)",
      to: "group",
      options: [
        { key: "alex", label: "Alex?", reply: "alex?",
          then: [A("alex", ["…so the $1,500 would have paid for 300 more people to get stuck at 'hey'.", "cancel the gym.", "good news: the matching engine survives. picking people for a plan is the same math. what has to go is every screen."])] },
      ],
      after: [CB("<b>Everyone gets there together, one tap at a time</b> — Priya names the cause, Jordan (the clue-holder) names the product, Alex cancels his own Hail Mary. Single-choice beats pace the eureka so no two voices land at once. That's today's alex_converted, earned by digging instead of by an evidence chip.")],
    },
    {
      tag: "the call",
      fork: "founder's move",
      to: "group",
      options: [
        { key: "pivot", label: "We pivot. You browse plans, not people.", reply: "we pivot. you browse plans, not people. monday we start building it.", next: "Act 2" },
        { key: "cautious", label: "Too risky. Get users first, then rebuild.", reply: "it's a good idea. it's also a rebuild with seven weeks of cash. users first, then we rebuild.",
          then: [A("priya", "then watch one number: of the next fifty matches, how many turn into a plan to meet.")],
          note: "Saw it and flinched — the fifty-match verdict comes due, as today." },
      ],
    },
  ],
};

const act2 = {
  time: "9:55pm · group",
  title: "Act 2 — Who builds it",
  note: "The pivot is called. The practical question gets asked in front of everyone, which is exactly why nobody can say the real thing here.",
  beats: [
    {
      msgs: [
        A("alex", ["ok. if we're doing this: three weeks, no slack, no second try. we'll be relaunching on fumes.", "i'll repoint the matching. who wants the board — the screen people actually see?"]),
        A("jordan", ["board's mine.", "it's the intake screen idea all grown up — asking people what they want to *do* instead of who they want to look at.", "i'll have a first version by sunday. this is the fun part."]),
        A("priya", "that's a good design instinct, jordan. go to bed, all of you. big three weeks."),
        SYS("Priya left the conversation"),
        A("alex", "👍"),
        CB("<b>Jordan has no idea anything is wrong</b> — she thinks she's been doing fine, which is what makes the rest of the night hurt. <b>The 👍 is the only thing Alex says to her offer.</b> A player who's been paying attention notices. A player who hasn't reads it as a thumbs-up. (The system line is the same one that closes the arc, used here first, harmlessly.)"),
      ],
    },
  ],
};

const act2b = {
  time: "10:12pm · Alex's DM",
  title: "Act 2b — The door to the Jordan question",
  note: "The old mechanism (Alex's DM about Jordan's performance → “I'll talk to her”), seventeen minutes after she volunteered, lit up.",
  beats: [
    {
      msgs: [A("alex", "can i say something i've been sitting on. not in the group.")],
      fork: "founder's reply",
      to: "Alex",
      options: [
        { key: "say", label: "Say it.", reply: "say it.", next: "continues below" },
        { key: "later", label: "Not tonight.", reply: "not tonight. it's been a long one.",
          then: [A("alex", "sure.")],
          note: "Door closed for tonight — Jordan keeps the board. Alex brings it back in two weeks, when it's harder (path ⑤)." },
      ],
    },
    {
      msgs: [
        A("alex", [
          "she's great. i mean that. the intake screen is still the best thing we've made.",
          "she's also been a week behind on everything since demo night. the picker. the ios sprint. the review on my PR. every time there's a good reason. every time it's a week.",
          "and v2 doesn't have a week in it.",
          "…or maybe that's on me. i wanted 40% in week two. i don't know if i'm being fair to her. that's why i'm telling you and not her.",
        ]),
      ],
      fork: "founder's reply",
      to: "Alex",
      options: [
        { key: "talk", label: "I'll talk to her.", reply: "i'll talk to her. tonight, if she's up.",
          then: [A("alex", "thank you. i'm sorry it's yours.")], next: "Act 3 — Jordan's thread (paths ①③④)" },
        { key: "week", label: "Let's see how her first week goes.", reply: "let's see how her first week on the board goes. then we talk.",
          then: [A("alex", "okay. one week.")],
          note: "Sounds like management. It's a delay — and Alex is now counting.", next: "path ② / ⑤" },
        { key: "unfair", label: "That's not fair to her.", reply: "that's not fair to her. she's been here since before there was anything to be here for.",
          then: [A("alex", "maybe not. forget i said it.")],
          note: "The most loyal-sounding answer in the game. Costs Alex morale and trust — he said the hard thing and got told off.", next: "path ② / ⑤" },
      ],
      after: [CB("<b>Why this isn't obvious:</b> it lands right after the best thing Jordan has said all run; Alex opens with praise and closes by doubting his own motives (the 40% callback is real — the player was there); and both other chips read as patience or loyalty. Nothing says “fire” — only <i>“I'll talk to her”</i>, which could mean anything.")],
    },
  ],
};

const priya = {
  time: "10:20pm · Priya's DM · optional",
  title: "Priya — appears only after Alex has spoken",
  note: "Cut candidate. Once Alex has raised it, Priya's thread gets one chip until Jordan's text arrives. She gives a way to think, not an answer. If it's cut, the arc goes straight to Jordan's thread.",
  beats: [
    {
      msgs: [
        OUT("Priya", "can i ask you something that isn't about the product?"),
        A("priya", [
          "always. is it jordan? i saw the thumbs up.",
          "i kept a co-founder a year too long once. lovely guy. always one week behind, and every week he had a good reason.",
          "the question isn't whether she's good. she's good. it's whether she can run at the speed you need now — and whether anyone has ever told her what that speed is.",
        ]),
      ],
    },
  ],
};

// ═════════════════════════════════════════════════════════════════════════
// JORDAN'S THREAD — the ladder, shared by paths ①③④
// ═════════════════════════════════════════════════════════════════════════

const opener = {
  tag: "11:48pm — before you can write, she texts first. she has no idea.",
  msgs: [
    A("jordan", "couldn't sleep."),
    IMG("jordan", "a hand-drawn board: “THU · climbing gym · 6 going · 2 spots · [ i'm in ]”"),
    A("jordan", ["no profiles on the front screen. no chat until you've said yes to something.", "i'm going to do the whole thing this weekend. tell me it's not beautiful."]),
  ],
};

const rung1 = (warmNext, realNext) => ({
  tag: "rung 1",
  fork: "founder's reply",
  to: "Jordan",
  options: [
    { key: "beautiful", label: "It's beautiful. Go to bed.", reply: "it's beautiful. go to bed.",
      then: [A("jordan", "💜 night")], note: "You lost your nerve. Nothing happened — which is the point. She keeps the board.", next: warmNext },
    { key: "real", label: "Can I ask you something real?", reply: "it is beautiful. can i ask you something real?",
      then: [A("jordan", "…that's a scary sentence at midnight. go.")], next: realNext },
  ],
});

const rung2 = (warmNext, realNext) => ({
  tag: "rung 2",

const intro = `<div class="intro">
  <h2>What changed in this draft</h2>
  <ol>
    <li><b>The door is a chat, not a card.</b> Alex wants to spend $1,500 of what's left on a growth push and needs a yes tonight. The big decision is whether to <i>stop him</i> and get everyone on one thread.</li>
    <li><b>The player runs the meeting.</b> Every message in Act 1 answers someone the player called on, so the group chat never floods.</li>
    <li><b>The pivot has to be dug out.</b> Taking Alex's plan ends the night without it; plain curiosity (asking Alex or Priya to go deeper) leads there, one reply per tap. Asking “what happened to the best matches?” and then “what did Maya do after she matched?” leads everyone to the idea together.</li>
    <li><b>Alex's DM is still the door to the Jordan question</b>, right after she claims the board. At most 3 options per beat, and none of them says “fire”.</li>
    <li><b>Priya's side chat</b> only appears after Alex has spoken, and is marked as a cut candidate.</li>
  </ol>
  <p style="margin-top:8px;color:var(--dim);font-size:13px">⚑ marks an option that only exists if the run earned it. All texts are drafts.</p>
</div>`;

function renderPaths() {
  const keys = Object.keys(paths);
  const buttons = keys.map((k, i) => `<button data-path="${k}" class="${i === 0 ? "on" : ""}">${esc(paths[k].label)}</button>`).join("");
  const bodies = keys.map((k, i) => `
    <div class="path-body ${i === 0 ? "on" : ""}" data-path="${k}">
      <p class="path-sum">${esc(paths[k].sum)}</p>
      ${paths[k].acts.map(renderAct).join("")}
    </div>`).join("");
  return `<h3 class="split">— the paths split here —</h3><div class="paths">${buttons}</div>${bodies}`;
}

document.getElementById("app").innerHTML =
  intro + renderAct(door) + renderAct(act1) + renderAct(act2) + renderAct(act2b) + renderAct(priya) + renderPaths();

document.querySelectorAll(".paths button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll(".paths button").forEach(x => x.classList.toggle("on", x === b));
    document.querySelectorAll(".path-body").forEach(x => x.classList.toggle("on", x.dataset.path === b.dataset.path));
  };
});
