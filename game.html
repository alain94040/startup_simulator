<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Kindred — founder chat</title>
<style>
  :root{
    --bg:#ecebf1; --panel:#ffffff; --rail:#f7f7fa; --line:#e3e3e8;
    --ink:#1c1c1e; --muted:#8a8a8e; --faint:#aeaeb2;
    --in:#e9e9eb; --out1:#0b84ff; --out2:#0a6fe0;
    --accent:#0b84ff; --green:#34c759; --gold:#ffb340;
    --shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.06);
    --r:18px;
    /* hand card dimensions (ported from the old card build) */
    --card-w:154px; --card-h:212px;
    /* handwritten stack for the journal — degrades to generic cursive, no web fonts */
    --hand:"Segoe Print","Bradley Hand","Noteworthy","Marker Felt","Comic Sans MS",cursive;
    --paper:#faf4e6; --jink:#4a4233; --jink-blue:#2a5db0; --rule:#e6d9bb; --margin:#e6b0a6;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{height:100vh;display:flex;flex-direction:column;max-width:1340px;margin:0 auto;padding:16px;gap:12px}

  /* ── top bar ─────────────────────────────────────────── */
  .topbar{
    display:flex;align-items:center;gap:18px;
    background:var(--panel);border-radius:16px;padding:12px 18px;box-shadow:var(--shadow);
  }
  .brand{display:flex;flex-direction:column;line-height:1.1}
  .brand b{font-size:17px;letter-spacing:.2px}
  .brand span{font-size:12px;color:var(--muted)}
  .runway{display:flex;flex-direction:column;gap:5px;min-width:210px;max-width:300px;flex:1}
  .runway-top{display:flex;align-items:baseline;gap:6px}
  .runway-num{font-size:23px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;transition:color .5s}
  .runway-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .runway-cash{margin-left:auto;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
  .runway-bar{height:9px;border-radius:999px;background:var(--rail);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
  .runway-fill{height:100%;border-radius:999px;width:100%;background:#34c759}
  .runway.low .runway-num{color:#ff3b30}
  .runway.low .runway-fill{animation:pulseRed 1.1s ease-in-out infinite}
  @keyframes pulseRed{0%,100%{opacity:1}50%{opacity:.45}}
  .stats{display:flex;gap:8px;margin-left:auto;align-items:center}
  .stat{
    display:flex;flex-direction:column;align-items:center;min-width:64px;
    background:var(--rail);border:1px solid var(--line);border-radius:12px;padding:6px 10px;
  }
  .stat .v{font-weight:700;font-size:14px}
  .stat .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .stat.warn .v{color:#ff3b30}
  .actions-budget{display:flex;align-items:center;gap:8px;padding-left:6px}
  .actions-budget .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);transition:.2s}
  .dot.full{background:var(--accent)}

  /* ── main split ──────────────────────────────────────── */
  .main{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
  .top-row{flex:1;display:flex;gap:12px;min-height:0}
  .rail{
    width:236px;flex:none;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);
    overflow:hidden;display:flex;flex-direction:column;
  }
  .rail h2{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);margin:0;padding:16px 18px 8px}
  .convs{overflow-y:auto;padding:0 8px 10px}
  .conv{
    display:flex;gap:11px;align-items:center;padding:10px 10px;border-radius:13px;cursor:pointer;
    transition:background .12s;position:relative;
  }
  .conv:hover{background:var(--rail)}
  .conv.active{background:#eaf3ff}
  .avatar{
    width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;
    color:#fff;font-weight:600;font-size:15px;
  }
  .conv-body{min-width:0;flex:1}
  .conv-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .conv-name{font-weight:600;font-size:14.5px}
  .conv-prev{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{
    width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;
    box-shadow:0 0 0 3px #eaf3ff;
  }
  .conv:not(.active) .badge{box-shadow:0 0 0 3px var(--panel)}

  /* ── chat panel ──────────────────────────────────────── */
  .chat{
    flex:1;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;min-width:0;overflow:hidden;position:relative;
  }
  .chat-head{
    display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);
  }
  .chat-head .avatar{width:34px;height:34px;font-size:13px}
  .chat-head .nm{font-weight:600}
  .chat-head .rl{font-size:12px;color:var(--muted)}
  .thread{flex:1;overflow-y:auto;padding:20px 22px 16px;display:flex;flex-direction:column;gap:3px}

  .divider{align-self:center;margin:14px 0 6px;font-size:11px;color:var(--faint);
    text-transform:uppercase;letter-spacing:.8px;font-weight:600}

  .row{display:flex;margin-top:4px;animation:rise .32s cubic-bezier(.2,.8,.2,1)}
  .row.in{justify-content:flex-start}
  .row.out{justify-content:flex-end}
  .bubble{
    max-width:74%;padding:9px 14px;border-radius:20px;font-size:14.5px;
    white-space:pre-wrap;word-wrap:break-word;
  }
  .in .bubble{background:var(--in);color:var(--ink);border-bottom-left-radius:6px}
  .out .bubble{background:linear-gradient(180deg,var(--out1),var(--out2));color:#fff;border-bottom-right-radius:6px}
  .subtext{align-self:flex-start;max-width:74%;color:var(--faint);font-size:12px;
    font-style:italic;margin:1px 0 4px 6px}
  .dbg-card{font-size:10px;color:#aaa;font-family:monospace;margin:1px 0 2px 6px;user-select:all}
  .chat-empty{margin:auto;color:var(--faint);font-size:13px;text-align:center;padding:20px}
  .chat-blocked{align-self:center;margin:20px 0 8px;font-size:12px;color:var(--faint);
    text-align:center;font-style:italic}
  /* "respond" pill at the end of a thread — bridges the chat to its hand card */
  .chat-cta{align-self:center;margin:16px 0 6px}
  .cta-btn{
    border:0;background:linear-gradient(180deg,var(--out1),var(--out2));color:#fff;font-weight:600;
    font-size:13px;padding:9px 18px;border-radius:14px;cursor:pointer;
    box-shadow:0 4px 14px rgba(11,132,255,.3);transition:.15s;animation:rise .3s ease both;
  }
  .cta-btn:hover{transform:translateY(-1px)}
  .cta-btn:disabled{opacity:.5;cursor:default;background:var(--faint);box-shadow:none}
  /* inline response card — the expanded options, in-flow at the end of the thread
     (reserves space, never overlays the latest message). Mirrors the hand card. */
  .thread-card{
    align-self:stretch;flex:none;margin:14px 0 6px;background:#fff;border-radius:14px;overflow:hidden;
    box-shadow:0 6px 22px rgba(11,132,255,.16),0 0 0 1.5px rgba(11,132,255,.4);
    animation:rise .25s cubic-bezier(.2,.8,.2,1) both;
  }
  .tc-stripe{height:5px}
  .tc-head{display:flex;align-items:center;gap:9px;padding:10px 12px 4px}
  .tc-id{flex:1;min-width:0}
  .tc-from{font-size:12.5px;font-weight:700;color:#0f0f1e}
  .tc-role{font-size:10.5px;color:#999}
  .tc-close{border:0;background:none;font-size:18px;color:var(--faint);cursor:pointer;line-height:1}
  .tc-opts{display:flex;flex-direction:column;gap:8px;padding:4px 12px 12px}

  /* typing indicator */
  .typing{display:inline-flex;gap:4px;padding:12px 15px;background:var(--in);border-radius:20px;border-bottom-left-radius:6px}
  .typing i{width:7px;height:7px;border-radius:50%;background:#b6b6bb;animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}

  /* ── journal column (right, full height) ─────────────── */
  .journal-col{
    width:330px;flex:none;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;overflow:hidden;
  }
  .journal-head{
    display:flex;align-items:center;gap:10px;padding:12px 18px;
    border-bottom:1px solid var(--line);flex:none;
  }
  .journal-head .jh-icon{font-size:18px}
  .journal-head .jh-title{font-weight:600;font-size:14px}
  .journal-head .jh-sub{font-size:11px;color:var(--muted);margin-left:auto}
  .journal-scroll{
    flex:1;overflow-y:auto;
    background-color:var(--paper);
    background-image:
      repeating-linear-gradient(var(--paper), var(--paper) 33px, var(--rule) 33px, var(--rule) 34px),
      linear-gradient(90deg, transparent 0 50px, var(--margin) 50px 52px, transparent 52px);
    background-attachment:local;
    padding:16px 26px 20px 70px;
    display:flex;flex-direction:column;
  }
  .journal-entry{
    font-family:var(--hand);color:var(--jink);
    font-size:17px;line-height:34px;margin:0 0 6px;white-space:pre-wrap;
    animation:inkin .5s ease both;
  }
  .journal-entry.is-outcome{color:#5a513f}
  .journal-choice{
    font-family:var(--hand);color:var(--jink-blue);
    font-size:17px;line-height:34px;margin:0 0 6px;animation:inkin .45s ease both;
  }
  .journal-source{
    display:block;font-family:-apple-system,sans-serif;font-size:10px;line-height:1;
    letter-spacing:.6px;text-transform:uppercase;color:#bca978;margin:-2px 0 8px;
  }
  .journal-date{position:relative;align-self:stretch;min-height:26px;margin:22px 0 0}
  .journal-date:first-child{margin-top:4px}
  .journal-date .num{
    position:absolute;left:-66px;top:2px;width:44px;text-align:right;
    font-family:var(--hand);color:#b5654a;line-height:1;
  }
  .journal-date .num b{display:block;font-size:19px;font-weight:700}
  .journal-date .num i{
    display:block;font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;
    font-style:normal;color:#c9a98f;margin-top:3px;
  }
  .journal-stamp{
    align-self:flex-start;margin:12px 0 16px;padding:5px 15px;
    border:3px double currentColor;border-radius:6px;
    font-family:"Arial Black",Impact,sans-serif;font-weight:800;font-size:14px;
    letter-spacing:2px;text-transform:uppercase;opacity:.78;
    transform:rotate(-7deg);animation:stampin .4s cubic-bezier(.2,1.5,.4,1) both;
  }
  .journal-stamp.green{color:#2e8b57}
  .journal-stamp.blue{color:#2a5db0}
  .journal-stamp.red{color:#c0392b}
  .journal-empty{font-family:var(--hand);color:#b6a585;font-size:16px;line-height:30px}
  .jnl-mockup{display:block;margin:8px 0 4px;font-size:8px}

  /* ── action hand (bottom) ────────────────────────────── */
  .hand-panel{
    flex:none;position:relative;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);
    padding:10px 16px 16px;display:flex;flex-direction:column;gap:8px;
  }
  .hand-top{display:flex;align-items:center;gap:12px}
  .hand-lbl{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
  .hand-hint{font-size:12px;color:var(--accent)}
  .hand-plays{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .hand-plays .dot{width:12px;height:12px}
  .hand-end{
    border:0;background:var(--ink);color:#fff;font-weight:600;font-size:12px;
    padding:7px 14px;border-radius:11px;cursor:pointer;transition:.15s;align-self:flex-end;
  }
  .hand-end:hover{transform:translateY(-1px);opacity:.92}
  .hand-end:disabled{opacity:.4;cursor:default;transform:none}
  .hand-panel.focus-active .hand-end{align-self:center;margin-top:4px}
  .hand-cards{
    display:flex;gap:12px;align-items:flex-end;justify-content:center;
    min-height:var(--card-h);overflow-x:auto;padding-top:6px;
  }
  .hand-empty{margin:auto;color:var(--faint);font-size:13px}

  .hcard{
    width:var(--card-w);height:var(--card-h);background:#fff;border-radius:13px;cursor:pointer;
    position:relative;overflow:hidden;flex:none;display:flex;flex-direction:column;
    box-shadow:0 3px 14px rgba(0,0,0,.14);border:1px solid var(--line);
    transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease,opacity .3s ease;
    transform-origin:bottom center;animation:dealIn .4s cubic-bezier(.34,1.56,.64,1) backwards;
  }
  .hcard:hover{transform:translateY(-16px);box-shadow:0 16px 40px rgba(0,0,0,.22);z-index:5}
  /* the card tied to the conversation you're reading — the chat→hand link */
  .hcard.linked{transform:translateY(-10px);box-shadow:0 10px 30px rgba(11,132,255,.2),0 0 0 2px rgba(11,132,255,.55)}
  .hcard.selected{transform:translateY(-20px);box-shadow:0 18px 46px rgba(11,132,255,.34),0 0 0 2px var(--accent);z-index:10}
  .hcard.played{opacity:.32;pointer-events:none;filter:grayscale(.5)}
  @keyframes dealIn{from{opacity:0;transform:translateY(40px) scale(.86)}to{opacity:1}}
  .hcard-stripe{height:5px;flex:none}
  .hcard-inner{padding:10px 11px 6px;flex:1;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .hcard-av-row{display:flex;align-items:center;gap:7px}
  .hcard-av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
  .hcard-sender{flex:1;overflow:hidden}
  .hcard-from{font-size:12px;font-weight:700;color:#0f0f1e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hcard-role{font-size:10px;color:#999;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hcard-preview{font-size:12.5px;color:#444;line-height:1.4;flex:1;overflow:hidden}
  .hcard-foot{padding:0 11px 9px;display:flex;align-items:center;justify-content:space-between;flex:none}
  .hcard-cat-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.4px}
  .hcard-urg{width:7px;height:7px;border-radius:50%}
  .urg-3{background:#ef4444;box-shadow:0 0 5px #ef4444}
  .urg-2{background:#f59e0b}
  .urg-1{background:#22c55e}

  /* selected-card option tray (floats above the hand) */
  .hand-detail{
    position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
    width:min(640px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);
    border-radius:16px;box-shadow:0 14px 50px rgba(0,0,0,.22);padding:16px 18px;z-index:30;
    animation:rise .22s cubic-bezier(.2,.8,.2,1);
  }
  .hand-detail .hd-from{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .hand-detail .hd-body{font-size:14px;color:var(--ink);line-height:1.5;margin-bottom:14px}
  .hand-detail .hd-prompt{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:11px}
  .hand-detail .hd-opts{display:flex;flex-direction:column;gap:9px}
  .chip{
    text-align:left;border:1px solid var(--line);background:#f8f9fb;color:var(--ink);
    padding:11px 15px;border-radius:13px;cursor:pointer;font-size:14px;transition:.13s;line-height:1.35;
  }
  .chip:hover{border-color:var(--accent);background:#eef5ff;transform:translateY(-1px)}
  .hd-close{position:absolute;top:10px;right:14px;border:0;background:none;font-size:18px;color:var(--faint);cursor:pointer;line-height:1}

  /* ── prototype mockups: pure-CSS phone "screenshots" ───────
     Everything is em-based, so the same markup is a 108px thumbnail in the chat
     and a ~250px image in the lightbox. Three variants: rich / minimal / generic. */
  .mk-phone{
    position:relative;width:13.5em;background:#fff;
    border-radius:2.1em;overflow:hidden;display:flex;flex-direction:column;
    border:1px solid rgba(20,8,30,.07);box-shadow:0 .3em 1.1em rgba(30,12,40,.18);
    font-family:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,system-ui,sans-serif;
  }
  .mk-notch{position:absolute;top:.55em;left:50%;transform:translateX(-50%);
    width:2.9em;height:.55em;background:#15151b;border-radius:1em;z-index:9}
  .mk-statusbar{display:flex;align-items:center;justify-content:space-between;
    padding:.55em 1.1em .1em;font-size:.6em;font-weight:800;color:#1c1c22;flex:none}
  .mk-statusbar .mk-sysicons{display:flex;gap:.32em;align-items:center}
  .mk-statusbar .mk-sysicons i{width:.85em;height:.6em;border-radius:.12em;background:#1c1c22}
  .mk-statusbar .mk-sysicons i.bat{width:1.35em;opacity:.9}

  /* shared "photo": a warm gradient with an abstract silhouette, no image files */
  .mk-portrait{position:absolute;inset:0;overflow:hidden;
    background:
      radial-gradient(58% 38% at 70% 14%, rgba(255,255,255,.22), transparent 60%),
      linear-gradient(160deg,#ff9a35 0%,#ff5d63 34%,#f53197 64%,#8b1ec2 100%);
  }
  .mk-portrait::before{content:"";position:absolute;left:50%;bottom:-9%;width:86%;height:52%;
    transform:translateX(-50%);border-radius:46% 46% 0 0;background:rgba(28,5,40,.30)}
  .mk-portrait::after{content:"";position:absolute;left:50%;bottom:31%;width:30%;aspect-ratio:1;
    transform:translateX(-50%);border-radius:50%;background:rgba(28,5,40,.30)}

  /* ===== A · RICH — looks loaded with features ===== */
  .v-rich .mk-rhead{display:flex;align-items:center;justify-content:space-between;padding:.15em 1em .55em}
  .v-rich .mk-brand{font-size:1.15em;font-weight:800;letter-spacing:-.02em;
    background:linear-gradient(92deg,#ff8a5b,#ff4f81);-webkit-background-clip:text;background-clip:text;color:transparent}
  .v-rich .mk-brand b{-webkit-text-fill-color:#ff4f81;color:#ff4f81;font-size:.72em;margin-left:.15em}
  .v-rich .mk-rhead-ico{display:flex;gap:.6em;align-items:center}
  .v-rich .mk-rhead-ico i{position:relative;width:1.05em;height:1.05em;border:.15em solid #adadb8;border-radius:.28em}
  .v-rich .mk-rhead-ico i.ic-bell{border-radius:50% 50% .28em .28em}
  .v-rich .mk-rhead-ico i.ic-bell em{position:absolute;top:-.42em;right:-.42em;min-width:1em;height:1em;border-radius:1em;
    background:#ff4f81;color:#fff;font-size:.5em;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 .15em}
  .v-rich .mk-stories{display:flex;gap:.52em;padding:0 1em .55em}
  .v-rich .st{width:2em;height:2em;border-radius:50%;flex:none;background:linear-gradient(150deg,#ff9d5c,#ff4f81);
    box-shadow:0 0 0 .13em #fff,0 0 0 .27em #ff5e88}
  .v-rich .st-you{background:#eef0f4;box-shadow:0 0 0 .13em #fff,0 0 0 .24em #d9dbe2}
  .v-rich .mk-prof{position:relative;aspect-ratio:3/4;margin:0 .85em;border-radius:1.2em;overflow:hidden;
    box-shadow:0 .45em 1.1em rgba(150,30,95,.26)}
  .v-rich .mk-match{position:absolute;top:.6em;left:.6em;z-index:3;font-size:.52em;font-weight:800;color:#fff;
    padding:.42em .7em;border-radius:1em;background:rgba(20,8,28,.32);backdrop-filter:blur(3px);border:1px solid rgba(255,255,255,.4)}
  .v-rich .mk-verif{position:absolute;top:.55em;right:.55em;z-index:3;width:1.5em;height:1.5em;border-radius:50%;
    background:#3897ff;color:#fff;font-size:.58em;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 .12em #fff}
  .v-rich .mk-prof-info{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:1.5em .8em .7em;
    background:linear-gradient(transparent,rgba(18,5,24,.85));color:#fff}
  .v-rich .mk-name{font-size:.86em;font-weight:800;display:flex;align-items:center;gap:.32em}
  .v-rich .mk-name .vdot{width:.42em;height:.42em;border-radius:50%;background:#69e08a}
  .v-rich .mk-sub{font-size:.55em;opacity:.92;margin-top:.12em}
  .v-rich .mk-chips{display:flex;gap:.32em;margin-top:.5em}
  .v-rich .mk-chips span{font-size:.49em;font-weight:700;padding:.42em .62em;border-radius:1em;
    background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.34)}
  .v-rich .mk-actions{display:flex;align-items:center;justify-content:center;gap:.5em;padding:.75em 0 .55em;flex:none}
  .v-rich .act{border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;
    box-shadow:0 .18em .5em rgba(40,12,40,.16);font-weight:800;line-height:1}
  .v-rich .a-rewind{width:1.7em;height:1.7em;color:#ffb23e;font-size:.82em}
  .v-rich .a-no{width:2.1em;height:2.1em;color:#ff5773;font-size:.92em}
  .v-rich .a-super{width:1.7em;height:1.7em;color:#3897ff;font-size:.82em}
  .v-rich .a-like{width:2.55em;height:2.55em;font-size:1.18em;color:#fff;
    background:linear-gradient(150deg,#ff8a5b,#ff4f81);box-shadow:0 .25em .7em rgba(255,79,129,.5)}
  .v-rich .a-boost{width:1.7em;height:1.7em;color:#a45cff;font-size:.78em}
  .v-rich .mk-tabs5{display:flex;align-items:center;justify-content:space-around;padding:.5em .4em .65em;
    background:#fff;border-top:1px solid #f0f0f4;flex:none}
  .v-rich .tb{position:relative;font-style:normal;font-size:.8em;color:#c6c6ce;line-height:1}
  .v-rich .tb.on{color:#ff4f81}
  .v-rich .tb em{position:absolute;top:-.55em;right:-.7em;background:#ff4f81;color:#fff;font-size:.46em;font-style:normal;
    min-width:1.5em;height:1.5em;padding:0 .2em;border-radius:1em;display:flex;align-items:center;justify-content:center;font-weight:800}

  /* ===== B · MINIMAL — calm, confident, lots of air ===== */
  .v-minimal{padding-bottom:.3em}
  .v-minimal .mk-mhead{text-align:center;font-size:.8em;font-weight:800;letter-spacing:.4em;color:#1c1c22;padding:.45em 0 .1em}
  .v-minimal .mk-mphoto{position:relative;aspect-ratio:4/5;margin:1.4em 1.5em 0;border-radius:1.6em;overflow:hidden;
    box-shadow:0 .55em 1.4em rgba(40,12,50,.18)}
  .v-minimal .mk-mmeta{text-align:center;padding:1em 1.5em .2em}
  .v-minimal .mk-mname{font-size:.95em;font-weight:800;color:#1c1c22}
  .v-minimal .mk-mbio{font-size:.58em;color:#9a9aa3;margin-top:.3em;letter-spacing:.01em}
  .v-minimal .mk-mactions{display:flex;justify-content:center;align-items:center;gap:1.7em;padding:1em 0 1.3em}
  .v-minimal .mact{width:2.6em;height:2.6em;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.05em;line-height:1}
  .v-minimal .m-no{background:#fff;border:1.5px solid #e9e9ee;color:#bdbdc6}
  .v-minimal .m-like{border:0;color:#fff;background:linear-gradient(150deg,#ff8a5b,#ff4f81);box-shadow:0 .3em .7em rgba(255,79,129,.42)}

  /* ===== C · GENERIC — a competent, faceless dating-app clone ===== */
  .v-generic .mk-ghead{display:flex;align-items:center;justify-content:space-between;padding:.2em 1.05em .6em}
  .v-generic .mk-gbrand{font-size:1.02em;font-weight:800;color:#ff4f6d;letter-spacing:-.01em}
  .v-generic .mk-ggear{width:1.1em;height:1.1em;border-radius:50%;border:.15em solid #c9c9d0}
  .v-generic .mk-gcard{position:relative;aspect-ratio:5/7;margin:0 .9em;border-radius:1em;overflow:hidden;
    box-shadow:0 .35em .9em rgba(40,12,40,.16)}
  .v-generic .mk-ginfo{position:absolute;left:0;right:0;bottom:0;padding:1.4em .8em .65em;
    background:linear-gradient(transparent,rgba(14,5,18,.78));color:#fff}
  .v-generic .mk-gname{font-size:.82em;font-weight:800}
  .v-generic .mk-gsub{font-size:.55em;opacity:.9;margin-top:.08em}
  .v-generic .mk-gacts{display:flex;align-items:center;justify-content:center;gap:1.15em;padding:.85em 0 .6em}
  .v-generic .gact{border:0;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 .16em .45em rgba(40,12,40,.14);font-weight:800;line-height:1}
  .v-generic .g-no{width:2.1em;height:2.1em;color:#ff5773;font-size:.92em}
  .v-generic .g-star{width:1.7em;height:1.7em;color:#3897ff;font-size:.82em}
  .v-generic .g-like{width:2.1em;height:2.1em;color:#fff;background:#ff4f6d;font-size:.95em}
  .v-generic .mk-gtabs{display:flex;align-items:center;justify-content:space-around;padding:.55em 1.4em .65em;
    background:#fff;border-top:1px solid #f0f0f4}
  .v-generic .gt{width:1.05em;height:1.05em;border-radius:.28em;background:#d4d4dc}
  .v-generic .gt.on{background:#ff4f6d}

  .mk-photos{display:flex;gap:9px;align-self:flex-start;max-width:88%;margin:8px 2px 2px;flex-wrap:wrap}
  .mk-thumb{
    position:relative;border:0;background:none;padding:0;cursor:pointer;font-size:8px;
    border-radius:2.1em;transition:transform .15s,filter .15s;line-height:0;filter:saturate(1);
  }
  .mk-thumb:hover{transform:translateY(-3px)}
  .mk-thumb:hover .mk-phone{box-shadow:0 .7em 1.7em rgba(40,12,50,.32)}
  .mk-badge{
    position:absolute;bottom:.7em;left:.7em;z-index:5;background:rgba(16,6,22,.62);color:#fff;
    font-weight:800;border-radius:50%;width:2em;height:2em;display:flex;align-items:center;
    justify-content:center;font-size:1.25em;backdrop-filter:blur(2px);line-height:1;box-shadow:0 0 0 1.5px rgba(255,255,255,.5)}

  .lightbox{
    position:fixed;inset:0;background:rgba(14,14,20,.82);backdrop-filter:blur(7px);
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:60;
  }
  .lightbox.show{display:flex;animation:fade .25s ease}
  .lb-close{
    position:absolute;top:18px;right:22px;border:0;background:rgba(255,255,255,.16);color:#fff;
    width:40px;height:40px;border-radius:50%;font-size:24px;cursor:pointer;line-height:1;
  }
  .lb-stage{position:relative;font-size:18px}
  .lb-thumbs{display:flex;gap:10px}
  .lb-dot{
    width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.22);color:#fff;
    font-weight:800;font-size:13px;cursor:pointer;transition:.13s;
  }
  .lb-dot.on{background:#fff;color:#1c1c1e}

  /* ── overlay ─────────────────────────────────────────── */
  .overlay{
    position:fixed;inset:0;background:rgba(20,20,30,.55);backdrop-filter:blur(6px);
    display:none;place-items:center;z-index:50;
  }
  .overlay.show{display:grid;animation:fade .3s ease}
  .card-modal{
    background:var(--panel);border-radius:22px;max-width:440px;padding:34px 32px;text-align:center;
    box-shadow:var(--shadow);animation:rise .4s cubic-bezier(.2,.8,.2,1)
  }
  .card-modal .em{font-size:42px}
  .card-modal h3{margin:14px 0 6px;font-size:22px}
  .card-modal p{color:var(--muted);font-size:14px;margin:0 0 22px}
  .card-modal .split{font-weight:700;color:var(--accent);font-size:16px}
  .card-modal button{border:0;background:var(--ink);color:#fff;font-weight:600;padding:11px 22px;
    border-radius:13px;cursor:pointer;font-size:14px}

  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes inkin{from{opacity:0;filter:blur(1.5px)}to{opacity:1;filter:blur(0)}}
  @keyframes stampin{0%{opacity:0;transform:rotate(-7deg) scale(2.2)}60%{opacity:.92}100%{opacity:.78;transform:rotate(-7deg) scale(1)}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes blink{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  /* turn-end diff highlights (calm, in stable surfaces — no tab switching) */
  /* a soft luminous halo around each new entry — a glow (blurred box-shadow), not a fill */
  @keyframes jHighlight{
    0%  {box-shadow:0 0 16px 5px rgba(255,176,46,.6)}
    55% {box-shadow:0 0 9px 2px rgba(255,176,46,.28)}
    100%{box-shadow:0 0 0 0 rgba(255,176,46,0)}
  }
  .journal-entry.arrive,.journal-choice.arrive{
    animation:inkin .5s ease both, jHighlight 1.9s ease .15s both;
    border-radius:6px;
  }
  /* while the journal inks in this week's outcomes, the whole column glows to pull the
     eye to the right BEFORE any chat notification buzzes */
  .journal-col{transition:box-shadow .45s ease}
  .journal-col.updating{box-shadow:0 0 0 1.5px rgba(255,179,64,.5),0 0 26px rgba(255,179,64,.4),var(--shadow)}
  @keyframes jHeadFlash{0%,100%{box-shadow:inset 0 0 0 0 transparent}45%{box-shadow:inset 0 0 20px rgba(255,179,64,.3)}}
  .journal-head.flash{animation:jHeadFlash 1.1s ease}
  @keyframes statPulse{0%{transform:scale(1)}40%{transform:scale(1.13);box-shadow:0 0 0 3px rgba(52,199,89,.3)}100%{transform:scale(1);box-shadow:none}}
  .stat.changed{animation:statPulse .85s ease}

  /* ── iPhone-style notification bubbles (week-turn consequences) ── */
  .notes{
    position:fixed;top:84px;right:22px;z-index:45;width:330px;
    display:flex;flex-direction:column;gap:10px;pointer-events:none;
  }
  .note{
    pointer-events:auto;display:flex;gap:11px;align-items:flex-start;cursor:pointer;
    background:rgba(255,255,255,.93);backdrop-filter:blur(12px);
    border:1px solid var(--line);border-radius:16px;padding:11px 13px;
    box-shadow:0 10px 34px rgba(0,0,0,.2);transition:transform .12s;
    animation:noteIn .34s cubic-bezier(.2,.9,.3,1) both;
  }
  .note:hover{transform:translateY(-1px)}
  .note.leaving{animation:noteOut .12s ease forwards}
  .note-av{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
  .note-body{min-width:0;flex:1}
  .note-from{font-weight:700;font-size:13px;margin-bottom:1px}
  .note-text{font-size:12.5px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  @keyframes noteIn{from{opacity:0;transform:translateX(34px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes noteOut{to{opacity:0;transform:translateX(34px)}}
  /* bell + notification center (reopen this week's notifications) */
  .bell{
    position:relative;border:1px solid var(--line);background:var(--rail);
    width:38px;height:38px;border-radius:11px;cursor:pointer;font-size:16px;
    display:grid;place-items:center;transition:.13s;
  }
  .bell:hover{background:#eef0f4;transform:translateY(-1px)}
  .bell-badge{
    position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;
    border-radius:9px;background:#ff3b30;color:#fff;font-size:11px;font-weight:700;
    display:grid;place-items:center;box-shadow:0 0 0 2px var(--panel);
  }
  .note-center{
    position:fixed;top:84px;right:22px;z-index:46;width:330px;max-height:64vh;overflow-y:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:18px;
    box-shadow:0 18px 50px rgba(0,0,0,.24);padding:8px;display:none;
  }
  .note-center.show{display:block;animation:noteIn .24s ease both}
  .note-center h4{margin:6px 9px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint)}
  .nc-item{display:flex;gap:10px;align-items:flex-start;padding:9px 9px;border-radius:12px;cursor:pointer;transition:background .12s}
  .nc-item:hover{background:var(--rail)}
  .nc-empty{padding:16px 10px;color:var(--faint);font-size:13px;text-align:center}

  /* topbar icon button (roadmap), matches .bell */
  .hdr-btn{
    border:1px solid var(--line);background:var(--rail);
    width:38px;height:38px;border-radius:11px;cursor:pointer;font-size:16px;
    display:grid;place-items:center;transition:.13s;
  }
  .hdr-btn:hover{background:#eef0f4;transform:translateY(-1px)}
  .hdr-btn[disabled]{opacity:.4;cursor:default;transform:none}

  /* shared top-right dropdown panel (roadmap / bank) */
  .pop{
    position:fixed;top:84px;right:22px;z-index:46;width:330px;max-height:72vh;overflow-y:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:18px;
    box-shadow:0 18px 50px rgba(0,0,0,.24);padding:14px 16px;display:none;
  }
  .pop.show{display:block;animation:noteIn .22s ease both}

  /* growth chart (users-over-time) */
  .growth-chart{width:100%;height:200px}
  .growth-meta{padding:8px 12px 2px;display:flex;flex-direction:column;gap:4px}
  .growth-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
  .growth-row b{color:var(--ink);font-weight:700}
  .growth-legend{display:flex;gap:14px;justify-content:center;padding:8px 0 4px;font-size:11px;color:var(--muted)}
  .growth-legend span{display:flex;align-items:center;gap:5px}
  .growth-swatch{width:14px;height:3px;border-radius:2px}
  .stat.clickable{cursor:pointer;transition:background .12s,transform .12s}
  .stat.clickable:hover{background:#eef0f4;transform:translateY(-1px)}

  /* dev-map stepper (roadmap) — light theme port of game_cards .dm-* */
  .dm-hdr{
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
    border-bottom:1px solid var(--line);padding-bottom:7px;margin-bottom:9px;
    display:flex;justify-content:space-between;align-items:center;gap:8px;
  }
  .dm-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.4px}
  .dm-badge-lean{background:#e6f7ec;color:#1a8a44;border:1px solid #bce8cd}
  .dm-badge-full{background:#e7f0ff;color:#2563eb;border:1px solid #c2d8ff}
  .dm-badge-sprint{background:#f0f0f3;color:#888;border:1px solid #e0e0e6}
  .dm-badge-pivot{background:#fff1e6;color:#d2691e;border:1px solid #f6d3b3}
  .dm-badge-shipped{background:#e6f7ec;color:#1a8a44;border:1px solid #bce8cd}
  .dm-grp{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#a0a0a8;font-weight:700;padding:8px 0 3px}
  .dm-grp:first-of-type{padding-top:0}
  .dm-step{display:flex;gap:9px}
  .dm-step-track{display:flex;flex-direction:column;align-items:center;width:12px;flex-shrink:0}
  .dm-step-dot{
    width:11px;height:11px;border-radius:50%;flex-shrink:0;margin-top:3px;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;line-height:1;
  }
  .dm-step-dot.st-done{border-color:#22c55e;color:#16a34a}
  .dm-step-dot.st-active{border:2px solid #cfe0ff;border-top-color:#2563eb;animation:dm-spin .8s linear infinite}
  .dm-step-dot.st-todo{border-color:#d6d6dd}
  .dm-step-dot.st-obsolete{border-color:#e3b3bd}
  @keyframes dm-spin{to{transform:rotate(360deg)}}
  .dm-step-line{width:2px;background:var(--line);flex:1;min-height:7px;margin-top:3px}
  .dm-step-body{flex:1;display:flex;align-items:center;gap:6px;padding-bottom:8px}
  .dm-step-lbl{flex:1;font-size:12.5px}
  .dm-step-lbl.st-done{color:#15803d}
  .dm-step-lbl.st-active{color:#1d4ed8;font-weight:600}
  .dm-step-lbl.st-todo{color:#9a9aa3}
  .dm-step-lbl.st-defer{color:#b0b0b8;font-style:italic;text-decoration:line-through}
  .dm-step-lbl.st-obsolete{color:#c06a78;font-style:italic;text-decoration:line-through}
  .dm-step-who{font-size:8px;font-weight:800;padding:2px 5px;border-radius:4px;flex-shrink:0}
  .dm-step-tag{font-size:8px;font-weight:800;padding:2px 5px;border-radius:4px;flex-shrink:0;text-transform:uppercase;letter-spacing:.3px;background:#f0f0f3;color:#888;border:1px solid #e0e0e6}
  .dm-step-tag.tag-licensed{background:#fff1e6;color:#d2691e;border:1px solid #f6d3b3}
  .dm-empty{color:var(--faint);font-size:13px;padding:6px 2px;line-height:1.5}

  /* bank statement — light theme port of game_cards .bank-* */
  .runway{cursor:pointer;border-radius:10px;transition:background .13s}
  .runway:hover{background:var(--rail)}
  .runway-cash{text-decoration:underline dotted var(--faint);text-underline-offset:3px}
  .bank-week{margin-bottom:14px}
  .bank-week-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#a0a0a8;font-weight:700;margin-bottom:3px}
  .bank-row{display:flex;align-items:flex-start;gap:9px;padding:6px 0;border-bottom:1px solid var(--line)}
  .bank-row:last-child{border-bottom:none}
  .bank-row-icon{font-size:13px;width:18px;flex-shrink:0;text-align:center;padding-top:1px}
  .bank-row-desc{flex:1;min-width:0}
  .bank-row-lbl{font-size:12px;color:var(--ink);line-height:1.3}
  .bank-row-note{font-size:10.5px;color:var(--muted);margin-top:1px}
  .bank-row-amt{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0;white-space:nowrap}
  .bank-amt-neg{color:#dc2626}
  .bank-amt-pos{color:#16a34a}
  .bank-balance{display:flex;justify-content:space-between;align-items:center;padding-top:7px;margin-top:1px}
  .bank-bal-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .bank-bal-val{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
  .bank-empty{color:var(--faint);font-size:13px;text-align:center;padding:24px 10px;line-height:1.6}

  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#d3d3da;border-radius:9px;border:2px solid var(--panel)}

  /* ── Focus / war-room (e.g. the equity sit-down) ─────────────────────────── */
  /* On-hold contacts dim out while a focus arc runs — the world recedes, the
     argument with the co-founders plays out 1:1 in their own threads. */
  .conv.onhold{opacity:.3;filter:grayscale(.65);pointer-events:none;transition:opacity .45s ease,filter .45s ease}
  .hand-lbl{transition:color .3s ease}

  /* ── FOCUS mode panel ───────────────────────────────────────────────────── */
  .hand-panel{transition:background .35s ease,border-color .35s ease,box-shadow .35s ease}
  .hand-panel.focus-active{
    background:linear-gradient(175deg,#1b0a30 0%,#0d0520 100%);
    border:1px solid rgba(160,90,255,.4);
    box-shadow:0 0 0 1px rgba(160,90,255,.1),0 8px 32px rgba(90,30,180,.3);
  }
  #focusSplash{
    display:none;flex-direction:row;align-items:center;justify-content:center;
    gap:20px;padding:6px 0 2px;
  }
  .hand-panel.focus-active #focusSplash{display:flex}
  .focus-brain-wrap{
    position:relative;width:60px;height:60px;
    display:flex;align-items:center;justify-content:center;
  }
  .focus-brain{
    font-size:38px;line-height:1;
    filter:drop-shadow(0 0 10px rgba(160,90,255,.9));
    animation:fBrainPulse 2.2s ease-in-out infinite;
  }
  .focus-bolt{
    position:absolute;font-size:18px;
    animation:fBoltZap 1.7s ease-in-out infinite;
    filter:drop-shadow(0 0 5px rgba(255,230,50,1));
  }
  .fb1{top:-4px;left:-12px;animation-delay:0s}
  .fb2{top:-4px;right:-12px;animation-delay:.55s}
  .fb3{bottom:-4px;left:-10px;animation-delay:1.1s}
  .fb4{bottom:-4px;right:-10px;animation-delay:.3s}
  .focus-word{
    font-size:64px;font-weight:900;letter-spacing:10px;color:#fff;line-height:1;
    text-shadow:0 0 16px rgba(170,100,255,1),0 0 48px rgba(150,80,255,.7),0 0 90px rgba(130,60,255,.4);
    animation:fWordGlow 2.2s ease-in-out infinite;
  }
  @keyframes fBrainPulse{
    0%,100%{filter:drop-shadow(0 0 10px rgba(160,90,255,.9));transform:scale(1)}
    50%{filter:drop-shadow(0 0 18px rgba(180,110,255,1));transform:scale(1.07)}
  }
  @keyframes fBoltZap{
    0%,100%{opacity:.4;transform:scale(.9)}
    45%{opacity:1;transform:scale(1.4)}
  }
  @keyframes fWordGlow{
    0%,100%{text-shadow:0 0 16px rgba(170,100,255,1),0 0 48px rgba(150,80,255,.7),0 0 90px rgba(130,60,255,.4)}
    50%{text-shadow:0 0 22px rgba(210,150,255,1),0 0 64px rgba(175,105,255,.9),0 0 110px rgba(150,80,255,.5)}
  }
  .hand-panel.focus-active .hand-empty{color:rgba(160,90,255,.65)}
  .hand-panel.focus-active .hcard{
    box-shadow:0 4px 18px rgba(0,0,0,.45),0 0 0 1px rgba(160,90,255,.25);
  }
  /* ── signing mode (inside FOCUS panel) ─────────────────── */
  .focus-sign{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 24px 4px;width:100%}
  .focus-sign-icon{font-size:36px;line-height:1;filter:drop-shadow(0 0 10px rgba(160,90,255,.8))}
  .focus-sign-body{
    font-size:13.5px;color:rgba(255,255,255,.72);line-height:1.55;
    text-align:center;max-width:520px;
  }
  .focus-sign-opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .focus-chip{
