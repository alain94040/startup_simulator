<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Kindred — founder chat</title>
<style>
  :root{
    --bg:#ecebf1; --panel:#ffffff; --rail:#f7f7fa; --line:#e3e3e8;
    --ink:#1c1c1e; --muted:#8a8a8e; --faint:#aeaeb2;
    --in:#e9e9eb; --out1:#0b84ff; --out2:#0a6fe0;
    --accent:#0b84ff; --green:#34c759; --gold:#ffb340;
    --shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.06);
    --r:18px;
    /* hand card dimensions (ported from the old card build) */
    --card-w:154px; --card-h:212px;
    /* handwritten stack for the journal — degrades to generic cursive, no web fonts */
    --hand:"Segoe Print","Bradley Hand","Noteworthy","Marker Felt","Comic Sans MS",cursive;
    --paper:#faf4e6; --jink:#4a4233; --jink-blue:#2a5db0; --rule:#e6d9bb; --margin:#e6b0a6;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{height:100vh;display:flex;flex-direction:column;max-width:1340px;margin:0 auto;padding:16px;gap:12px}

  /* ── top bar ─────────────────────────────────────────── */
  .topbar{
    display:flex;align-items:center;gap:18px;
    background:var(--panel);border-radius:16px;padding:12px 18px;box-shadow:var(--shadow);
  }
  .brand{display:flex;flex-direction:column;line-height:1.1}
  .brand b{font-size:17px;letter-spacing:.2px}
  .brand span{font-size:12px;color:var(--muted)}
  .runway{display:flex;flex-direction:column;gap:5px;min-width:210px;max-width:300px;flex:1}
  .runway-top{display:flex;align-items:baseline;gap:6px}
  .runway-num{font-size:23px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;transition:color .5s}
  .runway-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .runway-cash{margin-left:auto;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
  .runway-bar{height:9px;border-radius:999px;background:var(--rail);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
  .runway-fill{height:100%;border-radius:999px;width:100%;background:#34c759}
  .runway.low .runway-num{color:#ff3b30}
  .runway.low .runway-fill{animation:pulseRed 1.1s ease-in-out infinite}
  @keyframes pulseRed{0%,100%{opacity:1}50%{opacity:.45}}
  .stats{display:flex;gap:8px;margin-left:auto;align-items:center}
  .stat{
    display:flex;flex-direction:column;align-items:center;min-width:64px;
    background:var(--rail);border:1px solid var(--line);border-radius:12px;padding:6px 10px;
  }
  .stat .v{font-weight:700;font-size:14px}
  .stat .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .stat.warn .v{color:#ff3b30}
  .actions-budget{display:flex;align-items:center;gap:8px;padding-left:6px}
  .actions-budget .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);transition:.2s}
  .dot.full{background:var(--accent)}

  /* ── main split ──────────────────────────────────────── */
  .main{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
  .top-row{flex:1;display:flex;gap:12px;min-height:0}
  .rail{
    width:236px;flex:none;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);
    overflow:hidden;display:flex;flex-direction:column;
  }
  .rail h2{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);margin:0;padding:16px 18px 8px}
  .convs{overflow-y:auto;padding:0 8px 10px}
  .conv{
    display:flex;gap:11px;align-items:center;padding:10px 10px;border-radius:13px;cursor:pointer;
    transition:background .12s;position:relative;
  }
  .conv:hover{background:var(--rail)}
  .conv.active{background:#eaf3ff}
  .avatar{
    width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;
    color:#fff;font-weight:600;font-size:15px;
  }
  .conv-body{min-width:0;flex:1}
  .conv-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .conv-name{font-weight:600;font-size:14.5px}
  .conv-prev{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{
    width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;
    box-shadow:0 0 0 3px #eaf3ff;
  }
  .conv:not(.active) .badge{box-shadow:0 0 0 3px var(--panel)}

  /* ── chat panel ──────────────────────────────────────── */
  .chat{
    flex:1;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;min-width:0;overflow:hidden;position:relative;
  }
  .chat-head{
    display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);
  }
  .chat-head .avatar{width:34px;height:34px;font-size:13px}
  .chat-head .nm{font-weight:600}
  .chat-head .rl{font-size:12px;color:var(--muted)}
  .thread{flex:1;overflow-y:auto;padding:20px 22px 16px;display:flex;flex-direction:column;gap:3px}

  .divider{align-self:center;margin:14px 0 6px;font-size:11px;color:var(--faint);
    text-transform:uppercase;letter-spacing:.8px;font-weight:600}

  .row{display:flex;margin-top:4px;animation:rise .32s cubic-bezier(.2,.8,.2,1)}
  .row.in{justify-content:flex-start}
  .row.out{justify-content:flex-end}
  .bubble{
    max-width:74%;padding:9px 14px;border-radius:20px;font-size:14.5px;
    white-space:pre-wrap;word-wrap:break-word;
  }
  .in .bubble{background:var(--in);color:var(--ink);border-bottom-left-radius:6px}
  .out .bubble{background:linear-gradient(180deg,var(--out1),var(--out2));color:#fff;border-bottom-right-radius:6px}
  .subtext{align-self:flex-start;max-width:74%;color:var(--faint);font-size:12px;
    font-style:italic;margin:1px 0 4px 6px}
  .dbg-card{font-size:10px;color:#aaa;font-family:monospace;margin:1px 0 2px 6px;user-select:all}
  .chat-empty{margin:auto;color:var(--faint);font-size:13px;text-align:center;padding:20px}
  .chat-blocked{align-self:center;margin:20px 0 8px;font-size:12px;color:var(--faint);
    text-align:center;font-style:italic}
  /* "respond" pill at the end of a thread — bridges the chat to its hand card */
  .chat-cta{align-self:center;margin:16px 0 6px}
  .cta-btn{
    border:0;background:linear-gradient(180deg,var(--out1),var(--out2));color:#fff;font-weight:600;
    font-size:13px;padding:9px 18px;border-radius:14px;cursor:pointer;
    box-shadow:0 4px 14px rgba(11,132,255,.3);transition:.15s;animation:rise .3s ease both;
  }
  .cta-btn:hover{transform:translateY(-1px)}
  .cta-btn:disabled{opacity:.5;cursor:default;background:var(--faint);box-shadow:none}
  /* inline response card — the expanded options, in-flow at the end of the thread
     (reserves space, never overlays the latest message). Mirrors the hand card. */
  .thread-card{
    align-self:stretch;flex:none;margin:14px 0 6px;background:#fff;border-radius:14px;overflow:hidden;
    box-shadow:0 6px 22px rgba(11,132,255,.16),0 0 0 1.5px rgba(11,132,255,.4);
    animation:rise .25s cubic-bezier(.2,.8,.2,1) both;
  }
  .tc-stripe{height:5px}
  .tc-head{display:flex;align-items:center;gap:9px;padding:10px 12px 4px}
  .tc-id{flex:1;min-width:0}
  .tc-from{font-size:12.5px;font-weight:700;color:#0f0f1e}
  .tc-role{font-size:10.5px;color:#999}
  .tc-close{border:0;background:none;font-size:18px;color:var(--faint);cursor:pointer;line-height:1}
  .tc-opts{display:flex;flex-direction:column;gap:8px;padding:4px 12px 12px}

  /* typing indicator */
  .typing{display:inline-flex;gap:4px;padding:12px 15px;background:var(--in);border-radius:20px;border-bottom-left-radius:6px}
  .typing i{width:7px;height:7px;border-radius:50%;background:#b6b6bb;animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}

  /* ── journal column (right, full height) ─────────────── */
  .journal-col{
    width:330px;flex:none;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;overflow:hidden;
  }
  .journal-head{
    display:flex;align-items:center;gap:10px;padding:12px 18px;
    border-bottom:1px solid var(--line);flex:none;
  }
  .journal-head .jh-icon{font-size:18px}
  .journal-head .jh-title{font-weight:600;font-size:14px}
  .journal-head .jh-sub{font-size:11px;color:var(--muted);margin-left:auto}
  .journal-scroll{
    flex:1;overflow-y:auto;
    background-color:var(--paper);
    background-image:
      repeating-linear-gradient(var(--paper), var(--paper) 33px, var(--rule) 33px, var(--rule) 34px),
      linear-gradient(90deg, transparent 0 50px, var(--margin) 50px 52px, transparent 52px);
    background-attachment:local;
    padding:16px 26px 20px 70px;
    display:flex;flex-direction:column;
  }
  .journal-entry{
    font-family:var(--hand);color:var(--jink);
    font-size:17px;line-height:34px;margin:0 0 6px;white-space:pre-wrap;
    animation:inkin .5s ease both;
  }
  .journal-entry.is-outcome{color:#5a513f}
  .journal-choice{
    font-family:var(--hand);color:var(--jink-blue);
    font-size:17px;line-height:34px;margin:0 0 6px;animation:inkin .45s ease both;
  }
  .journal-source{
    display:block;font-family:-apple-system,sans-serif;font-size:10px;line-height:1;
    letter-spacing:.6px;text-transform:uppercase;color:#bca978;margin:-2px 0 8px;
  }
  .journal-date{position:relative;align-self:stretch;min-height:26px;margin:22px 0 0}
  .journal-date:first-child{margin-top:4px}
  .journal-date .num{
    position:absolute;left:-66px;top:2px;width:44px;text-align:right;
    font-family:var(--hand);color:#b5654a;line-height:1;
  }
  .journal-date .num b{display:block;font-size:19px;font-weight:700}
  .journal-date .num i{
    display:block;font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;
    font-style:normal;color:#c9a98f;margin-top:3px;
  }
  .journal-stamp{
    align-self:flex-start;margin:12px 0 16px;padding:5px 15px;
    border:3px double currentColor;border-radius:6px;
    font-family:"Arial Black",Impact,sans-serif;font-weight:800;font-size:14px;
    letter-spacing:2px;text-transform:uppercase;opacity:.78;
    transform:rotate(-7deg);animation:stampin .4s cubic-bezier(.2,1.5,.4,1) both;
  }
  .journal-stamp.green{color:#2e8b57}
  .journal-stamp.blue{color:#2a5db0}
  .journal-stamp.red{color:#c0392b}
  .journal-empty{font-family:var(--hand);color:#b6a585;font-size:16px;line-height:30px}

  /* ── action hand (bottom) ────────────────────────────── */
  .hand-panel{
    flex:none;position:relative;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);
    padding:10px 16px 16px;display:flex;flex-direction:column;gap:8px;
  }
  .hand-top{display:flex;align-items:center;gap:12px}
  .hand-lbl{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
  .hand-hint{font-size:12px;color:var(--accent)}
  .hand-plays{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .hand-plays .dot{width:12px;height:12px}
  .hand-end{
    border:0;background:var(--ink);color:#fff;font-weight:600;font-size:12px;
    padding:7px 14px;border-radius:11px;cursor:pointer;transition:.15s;
  }
  .hand-end:hover{transform:translateY(-1px);opacity:.92}
  .hand-end:disabled{opacity:.4;cursor:default;transform:none}
  .hand-cards{
    display:flex;gap:12px;align-items:flex-end;justify-content:center;
    min-height:var(--card-h);overflow-x:auto;padding-top:6px;
  }
  .hand-empty{margin:auto;color:var(--faint);font-size:13px}

  .hcard{
    width:var(--card-w);height:var(--card-h);background:#fff;border-radius:13px;cursor:pointer;
    position:relative;overflow:hidden;flex:none;display:flex;flex-direction:column;
    box-shadow:0 3px 14px rgba(0,0,0,.14);border:1px solid var(--line);
    transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease,opacity .3s ease;
    transform-origin:bottom center;animation:dealIn .4s cubic-bezier(.34,1.56,.64,1) backwards;
  }
  .hcard:hover{transform:translateY(-16px);box-shadow:0 16px 40px rgba(0,0,0,.22);z-index:5}
  /* the card tied to the conversation you're reading — the chat→hand link */
  .hcard.linked{transform:translateY(-10px);box-shadow:0 10px 30px rgba(11,132,255,.2),0 0 0 2px rgba(11,132,255,.55)}
  .hcard.selected{transform:translateY(-20px);box-shadow:0 18px 46px rgba(11,132,255,.34),0 0 0 2px var(--accent);z-index:10}
  .hcard.played{opacity:.32;pointer-events:none;filter:grayscale(.5)}
  @keyframes dealIn{from{opacity:0;transform:translateY(40px) scale(.86)}to{opacity:1}}
  .hcard-stripe{height:5px;flex:none}
  .hcard-inner{padding:10px 11px 6px;flex:1;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .hcard-av-row{display:flex;align-items:center;gap:7px}
  .hcard-av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
  .hcard-sender{flex:1;overflow:hidden}
  .hcard-from{font-size:12px;font-weight:700;color:#0f0f1e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hcard-role{font-size:10px;color:#999;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hcard-preview{font-size:12.5px;color:#444;line-height:1.4;flex:1;overflow:hidden}
  .hcard-foot{padding:0 11px 9px;display:flex;align-items:center;justify-content:space-between;flex:none}
  .hcard-cat-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.4px}
  .hcard-urg{width:7px;height:7px;border-radius:50%}
  .urg-3{background:#ef4444;box-shadow:0 0 5px #ef4444}
  .urg-2{background:#f59e0b}
  .urg-1{background:#22c55e}

  /* selected-card option tray (floats above the hand) */
  .hand-detail{
    position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
    width:min(640px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);
    border-radius:16px;box-shadow:0 14px 50px rgba(0,0,0,.22);padding:16px 18px;z-index:30;
    animation:rise .22s cubic-bezier(.2,.8,.2,1);
  }
  .hand-detail .hd-from{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .hand-detail .hd-body{font-size:14px;color:var(--ink);line-height:1.5;margin-bottom:14px}
  .hand-detail .hd-prompt{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:11px}
  .hand-detail .hd-opts{display:flex;flex-direction:column;gap:9px}
  .chip{
    text-align:left;border:1px solid var(--line);background:#f8f9fb;color:var(--ink);
    padding:11px 15px;border-radius:13px;cursor:pointer;font-size:14px;transition:.13s;line-height:1.35;
  }
  .chip:hover{border-color:var(--accent);background:#eef5ff;transform:translateY(-1px)}
  .hd-close{position:absolute;top:10px;right:14px;border:0;background:none;font-size:18px;color:var(--faint);cursor:pointer;line-height:1}

  /* ── overlay ─────────────────────────────────────────── */
  .overlay{
    position:fixed;inset:0;background:rgba(20,20,30,.55);backdrop-filter:blur(6px);
    display:none;place-items:center;z-index:50;
  }
  .overlay.show{display:grid;animation:fade .3s ease}
  .card-modal{
    background:var(--panel);border-radius:22px;max-width:440px;padding:34px 32px;text-align:center;
    box-shadow:var(--shadow);animation:rise .4s cubic-bezier(.2,.8,.2,1)
  }
  .card-modal .em{font-size:42px}
  .card-modal h3{margin:14px 0 6px;font-size:22px}
  .card-modal p{color:var(--muted);font-size:14px;margin:0 0 22px}
  .card-modal .split{font-weight:700;color:var(--accent);font-size:16px}
  .card-modal button{border:0;background:var(--ink);color:#fff;font-weight:600;padding:11px 22px;
    border-radius:13px;cursor:pointer;font-size:14px}

  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes inkin{from{opacity:0;filter:blur(1.5px)}to{opacity:1;filter:blur(0)}}
  @keyframes stampin{0%{opacity:0;transform:rotate(-7deg) scale(2.2)}60%{opacity:.92}100%{opacity:.78;transform:rotate(-7deg) scale(1)}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes blink{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  /* turn-end diff highlights (calm, in stable surfaces — no tab switching) */
  /* a soft luminous halo around each new entry — a glow (blurred box-shadow), not a fill */
  @keyframes jHighlight{
    0%  {box-shadow:0 0 16px 5px rgba(255,176,46,.6)}
    55% {box-shadow:0 0 9px 2px rgba(255,176,46,.28)}
    100%{box-shadow:0 0 0 0 rgba(255,176,46,0)}
  }
  .journal-entry.arrive,.journal-choice.arrive{
    animation:inkin .5s ease both, jHighlight 1.9s ease .15s both;
    border-radius:6px;
  }
  /* while the journal inks in this week's outcomes, the whole column glows to pull the
     eye to the right BEFORE any chat notification buzzes */
  .journal-col{transition:box-shadow .45s ease}
  .journal-col.updating{box-shadow:0 0 0 1.5px rgba(255,179,64,.5),0 0 26px rgba(255,179,64,.4),var(--shadow)}
  @keyframes jHeadFlash{0%,100%{box-shadow:inset 0 0 0 0 transparent}45%{box-shadow:inset 0 0 20px rgba(255,179,64,.3)}}
  .journal-head.flash{animation:jHeadFlash 1.1s ease}
  @keyframes statPulse{0%{transform:scale(1)}40%{transform:scale(1.13);box-shadow:0 0 0 3px rgba(52,199,89,.3)}100%{transform:scale(1);box-shadow:none}}
  .stat.changed{animation:statPulse .85s ease}

  /* ── iPhone-style notification bubbles (week-turn consequences) ── */
  .notes{
    position:fixed;top:84px;right:22px;z-index:45;width:330px;
    display:flex;flex-direction:column;gap:10px;pointer-events:none;
  }
  .note{
    pointer-events:auto;display:flex;gap:11px;align-items:flex-start;cursor:pointer;
    background:rgba(255,255,255,.93);backdrop-filter:blur(12px);
    border:1px solid var(--line);border-radius:16px;padding:11px 13px;
    box-shadow:0 10px 34px rgba(0,0,0,.2);transition:transform .12s;
    animation:noteIn .34s cubic-bezier(.2,.9,.3,1) both;
  }
  .note:hover{transform:translateY(-1px)}
  .note.leaving{animation:noteOut .12s ease forwards}
  .note-av{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
  .note-body{min-width:0;flex:1}
  .note-from{font-weight:700;font-size:13px;margin-bottom:1px}
  .note-text{font-size:12.5px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  @keyframes noteIn{from{opacity:0;transform:translateX(34px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes noteOut{to{opacity:0;transform:translateX(34px)}}
  /* bell + notification center (reopen this week's notifications) */
  .bell{
    position:relative;border:1px solid var(--line);background:var(--rail);
    width:38px;height:38px;border-radius:11px;cursor:pointer;font-size:16px;
    display:grid;place-items:center;transition:.13s;
  }
  .bell:hover{background:#eef0f4;transform:translateY(-1px)}
  .bell-badge{
    position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;
    border-radius:9px;background:#ff3b30;color:#fff;font-size:11px;font-weight:700;
    display:grid;place-items:center;box-shadow:0 0 0 2px var(--panel);
  }
  .note-center{
    position:fixed;top:84px;right:22px;z-index:46;width:330px;max-height:64vh;overflow-y:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:18px;
    box-shadow:0 18px 50px rgba(0,0,0,.24);padding:8px;display:none;
  }
  .note-center.show{display:block;animation:noteIn .24s ease both}
  .note-center h4{margin:6px 9px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint)}
  .nc-item{display:flex;gap:10px;align-items:flex-start;padding:9px 9px;border-radius:12px;cursor:pointer;transition:background .12s}
  .nc-item:hover{background:var(--rail)}
  .nc-empty{padding:16px 10px;color:var(--faint);font-size:13px;text-align:center}

  /* topbar icon button (roadmap), matches .bell */
  .hdr-btn{
    border:1px solid var(--line);background:var(--rail);
    width:38px;height:38px;border-radius:11px;cursor:pointer;font-size:16px;
    display:grid;place-items:center;transition:.13s;
  }
  .hdr-btn:hover{background:#eef0f4;transform:translateY(-1px)}
  .hdr-btn[disabled]{opacity:.4;cursor:default;transform:none}

  /* shared top-right dropdown panel (roadmap / bank) */
  .pop{
    position:fixed;top:84px;right:22px;z-index:46;width:330px;max-height:72vh;overflow-y:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:18px;
    box-shadow:0 18px 50px rgba(0,0,0,.24);padding:14px 16px;display:none;
  }
  .pop.show{display:block;animation:noteIn .22s ease both}

  /* dev-map stepper (roadmap) — light theme port of game_cards .dm-* */
  .dm-hdr{
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);

  .dm-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.4px}
  .dm-badge-lean{background:#e6f7ec;color:#1a8a44;border:1px solid #bce8cd}
  .dm-badge-full{background:#e7f0ff;color:#2563eb;border:1px solid #c2d8ff}
  .dm-badge-sprint{background:#f0f0f3;color:#888;border:1px solid #e0e0e6}
  .dm-badge-pivot{background:#fff1e6;color:#d2691e;border:1px solid #f6d3b3}
  .dm-grp{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#a0a0a8;font-weight:700;padding:8px 0 3px}
  .dm-grp:first-of-type{padding-top:0}
  .dm-step{display:flex;gap:9px}
  .dm-step-track{display:flex;flex-direction:column;align-items:center;width:12px;flex-shrink:0}
  .dm-step-dot{
    width:11px;height:11px;border-radius:50%;flex-shrink:0;margin-top:3px;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;line-height:1;
  }
  .dm-step-dot.st-done{border-color:#22c55e;color:#16a34a}
  .dm-step-dot.st-active{border:2px solid #cfe0ff;border-top-color:#2563eb;animation:dm-spin .8s linear infinite}
  .dm-step-dot.st-todo{border-color:#d6d6dd}
  .dm-step-dot.st-obsolete{border-color:#e3b3bd}
  @keyframes dm-spin{to{transform:rotate(360deg)}}
  .dm-step-line{width:2px;background:var(--line);flex:1;min-height:7px;margin-top:3px}
  .dm-step-body{flex:1;display:flex;align-items:center;gap:6px;padding-bottom:8px}
  .dm-step-lbl{flex:1;font-size:12.5px}
  .dm-step-lbl.st-done{color:#15803d}
  .dm-step-lbl.st-active{color:#1d4ed8;font-weight:600}
  .dm-step-lbl.st-todo{color:#9a9aa3}
  .dm-step-lbl.st-defer{color:#b0b0b8;font-style:italic;text-decoration:line-through}
  .dm-step-lbl.st-obsolete{color:#c06a78;font-style:italic;text-decoration:line-through}
  .dm-step-who{font-size:8px;font-weight:800;padding:2px 5px;border-radius:4px;flex-shrink:0}
  .dm-empty{color:var(--faint);font-size:13px;padding:6px 2px;line-height:1.5}

  /* bank statement — light theme port of game_cards .bank-* */
  .runway{cursor:pointer;border-radius:10px;transition:background .13s}
  .runway:hover{background:var(--rail)}
  .runway-cash{text-decoration:underline dotted var(--faint);text-underline-offset:3px}
  .bank-week{margin-bottom:14px}
  .bank-week-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#a0a0a8;font-weight:700;margin-bottom:3px}
  .bank-row{display:flex;align-items:flex-start;gap:9px;padding:6px 0;border-bottom:1px solid var(--line)}
  .bank-row:last-child{border-bottom:none}
  .bank-row-icon{font-size:13px;width:18px;flex-shrink:0;text-align:center;padding-top:1px}
  .bank-row-desc{flex:1;min-width:0}
  .bank-row-lbl{font-size:12px;color:var(--ink);line-height:1.3}
  .bank-row-note{font-size:10.5px;color:var(--muted);margin-top:1px}
  .bank-row-amt{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0;white-space:nowrap}
  .bank-amt-neg{color:#dc2626}
  .bank-amt-pos{color:#16a34a}
  .bank-balance{display:flex;justify-content:space-between;align-items:center;padding-top:7px;margin-top:1px}
  .bank-bal-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .bank-bal-val{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
  .bank-empty{color:var(--faint);font-size:13px;text-align:center;padding:24px 10px;line-height:1.6}

  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#d3d3da;border-radius:9px;border:2px solid var(--panel)}
</style>

  <!-- content + engine -->
  <script>window.ROLES = {};</script>

  <script>
  (function(){
    const engine = new Engine();
    // Avatar styling is pure presentation and lives in the UI; names/roles come
    // from the role defs via engine.conversations().
    const STYLE = {
      alex:        { color:"#0b84ff", initials:"A"  },
      jordan:      { color:"#34c759", initials:"J"  },
      priya:       { color:"#af52de", initials:"P"  },
      marcus:      { color:"#ff9500", initials:"M"  },
      fatima:      { color:"#ff6482", initials:"F"  },
      ryan:        { color:"#5ac8fa", initials:"R"  },
      sarah:       { color:"#ff2d55", initials:"S"  },
      brett:       { color:"#8e8e93", initials:"B"  },
      kevin:       { color:"#8e8e93", initials:"K"  },
      mom:         { color:"#ffcc02", initials:"👩" },
      jamie:       { color:"#64d2ff", initials:"Ja" },
      david:       { color:"#30b0c7", initials:"D"  },
      hacker_news: { color:"#ff6600", initials:"📰" },
      yc:          { color:"#f26522", initials:"Y"  },
      lena:        { color:"#bf5af2", initials:"L"  },
      techcrunch:  { color:"#00c853", initials:"📊" },
      users:       { color:"#007aff", initials:"👥" },
      analytics:   { color:"#5856d6", initials:"📈" },
      twitter:     { color:"#1da1f2", initials:"𝕏"  },
      tom:         { color:"#34c759", initials:"T"  },
      founder:     { color:"#8e8e93", initials:"Me" },
    };
    // Category presentation for the hand cards (p/t/e/c/f).
    const CAT = {
      p: { label:"Product", color:"#0b84ff", bg:"#eaf3ff", tc:"#0b6ad6" },
      t: { label:"Team",    color:"#34c759", bg:"#e7f9ed", tc:"#1f9e46" },
      e: { label:"Event",   color:"#ff9500", bg:"#fff1df", tc:"#c4710b" },
      c: { label:"Market",  color:"#af52de", bg:"#f6ecfc", tc:"#8b35bb" },
      f: { label:"Funding", color:"#ff2d55", bg:"#ffe9ee", tc:"#d61f43" },
    };
    const catFor = c => CAT[c] || CAT.e;
    const styleFor = id => STYLE[id] || { color:"#8e8e93", initials:"?" };
    const convFor  = id => engine.conversations().find(c => c.id === id);
    // impersonal sources (communities/market/users/twitter/analytics/yc): no chat —
    // their cards live under You and resolve via the popup, like the founder's moves.
    const NOCHAT = new Set(engine.noChatChars || []);
    let active = "alex";
    const shown = {};
    for (const id of engine.order) shown[id] = 0;
    // entries already turned into notifications (independent of whether they've been
    // *read*) — so an unread message buzzes once, the week it arrives, never again.
    // Seed at the current length so week-1 messages aren't notified retroactively.
    const notified = {};
    for (const id of engine.order) notified[id] = engine.threads[id].length;
    let revealing = false;
    let journalRevealing = false;
    let jShown = 0;       // entries already rendered in the journal panel
    let jLastWeek = null;
    let runwayAnim = false;
    let selectedCard = null;   // cardId of the hand card whose options are open
    let pendingStatPulse = []; // stat keys (signal/fit) that changed this turn, to pulse
    let noteQueue = [];        // pending notification toasts to reveal one at a time
    let noteTimer = null;      // paces the notification reveal
    let weekNotes = [];        // this week's notifications, reopenable via the bell
    let notesSeen = true;      // false once new notifications arrive, until the bell is opened

    const $ = id => document.getElementById(id);
    const fmtCash = c => "$" + c.toLocaleString();
    const busy = () => revealing || journalRevealing || runwayAnim;

    // ── runway burn-down ─────────────────────────────────
    const RUNWAY_FULL = 20;
    const runwayColor = w => w <= 4 ? "#ff3b30" : w <= 8 ? "#ff9500" : "#34c759";
    function setRunway(cash){
      const weeks = Math.floor(cash / 500);
      $("runwayNum").textContent = weeks;
      $("runwayCash").textContent = fmtCash(Math.max(0, cash));
      const fill = $("runwayFill");
      fill.style.width = Math.max(0, Math.min(100, (cash / (RUNWAY_FULL * 500)) * 100)) + "%";
      fill.style.background = runwayColor(weeks);
      $("runway").classList.toggle("low", weeks <= 4);
    }
    function animateRunway(from, to, done){
      runwayAnim = true;
      const start = performance.now(), dur = 1200, ease = t => 1 - Math.pow(1 - t, 3);
      const step = now => {
        const t = Math.min(1, (now - start) / dur);
        setRunway(Math.round((from + (to - from) * ease(t)) / 10) * 10);
        if (t < 1) requestAnimationFrame(step);
        else { setRunway(to); runwayAnim = false; done && done(); }
      };
      requestAnimationFrame(step);
    }

    // ── status bar ───────────────────────────────────────
    function renderStats(){
      const s = engine.stats();
      $("weekSub").textContent = "Week " + s.week + " · idea → seed";
      if (!runwayAnim) setRunway(s.cash);
      // Phase-aware traction readout: "Beta" (waitlist signups) pre-launch becomes
      // "Users" post-launch, with a "Paying" chip once there are paying customers.
      const st = engine.s;
      const traction = st.launched
        ? `<div class="stat" data-stat="users"><div class="v">${st.users}</div><div class="k">Users</div></div>`
          + (st.customers > 0
            ? `<div class="stat" data-stat="paying"><div class="v">${st.customers}</div><div class="k">Paying</div></div>`
            : "")
        : `<div class="stat" data-stat="beta"><div class="v">${st.waitlist}</div><div class="k">Beta</div></div>`;
      $("stats").innerHTML = `
        <div class="stat" data-stat="signal"><div class="v">${s.signal}</div><div class="k">Signal</div></div>
        <div class="stat" data-stat="fit"><div class="v">${s.marketFit}</div><div class="k">Fit</div></div>`
        + traction;
      $("dot0").className = "dot" + (s.actionsLeft>=1?" full":"");
      $("dot1").className = "dot" + (s.actionsLeft>=2?" full":"");
      // Roadmap button appears once Alex/Jordan have a build plan in motion.
      const hasPlan = !!engine.s.items;
      const rb = $("roadmapBtn");
      rb.style.display = hasPlan ? "" : "none";
      rb.disabled = !hasPlan;
      refreshPops();
    }

    // ── sidebar (chat characters, not the journal) ───────
    function renderRail(){
      const convs = engine.conversations().filter(c => !c.isJournal);
      $("convs").innerHTML = convs.map(c=>{
        // Blue dot = an unrevealed *incoming* message waits (your own replies don't count).
        const unread = engine.threads[c.id].slice(shown[c.id]).some(e => e.type === "incoming");
        const dot = unread ? '<span class="badge"></span>' : '';
        const st = styleFor(c.id);
        return `<div class="conv ${c.id===active?'active':''}" data-id="${c.id}">
          <div class="avatar" style="background:${st.color}">${st.initials}</div>
          <div class="conv-body">
            <div class="conv-top"><span class="conv-name">${c.name}</span>${dot}</div>
            <div class="conv-prev">${c.empty?'<i>no messages yet</i>':escapeHtml(c.preview)}</div>
          </div>
        </div>`;
      }).join("");
      [...document.querySelectorAll(".conv")].forEach(el=>{
        el.onclick = ()=>{ if(revealing) return; active = el.dataset.id; openConversation(); };
      });
    }

    // ── chat header ──────────────────────────────────────
    function renderHead(){
      const c = convFor(active);
      if (!c) return;
      const st = styleFor(active);
      $("chatHead").innerHTML =
        `<div class="avatar" style="background:${st.color}">${st.initials}</div>
         <div><div class="nm">${c.name}</div><div class="rl">${c.role}</div></div>`;
    }

    // ── journal entries (record only — no action buttons) ─
    // A founder card's *prompt* (an incoming entry with a cardId) lives on the
    // hand, not the journal. The journal shows only what happened: the player's
    // choices (✓), first-person outcomes, milestone stamps, and the rare system
    // note (an incoming entry with no cardId).
    function buildJournalEntry(e){
      if (e.type === "incoming" && e.cardId) return null; // prompt → shown as a card
      if (e.type === "stamp"){
        const d = document.createElement("div");
        d.className = "journal-stamp " + (e.stampClass || "red");
        d.textContent = e.label; return d;
      }
      if (e.type === "reply"){
        const d = document.createElement("div");
        d.className = "journal-choice"; d.textContent = "✓ " + e.body; return d;
      }
      const wrap = document.createElement("div");
      if (e.type === "outcome" && e.sourceChar){
        const src = document.createElement("div");
        src.className = "journal-source"; src.textContent = "after talking with " + (e.from || e.sourceChar);
        wrap.appendChild(src);
      }
      const d = document.createElement("div");
      d.className = "journal-entry" + (e.type === "outcome" ? " is-outcome" : "");
      d.textContent = e.body;
      wrap.appendChild(d);
      if (e.cardId){ const tag = document.createElement("div"); tag.className="dbg-card"; tag.textContent=e.cardId; wrap.appendChild(tag); }
      return wrap;
    }

    function buildChatEntry(e){
      if (e.type === "incoming"){
        const wrap = document.createElement("div");
        const row = document.createElement("div");
        row.className = "row in";
        row.innerHTML = `<div class="bubble">${escapeHtml(e.body)}</div>`;
        wrap.appendChild(row);
        if (e.subtext){
          const st = document.createElement("div");
          st.className="subtext"; st.textContent = e.subtext; wrap.appendChild(st);
        }
        if (e.cardId){ const tag = document.createElement("div"); tag.className="dbg-card"; tag.textContent=e.cardId; wrap.appendChild(tag); }
        return wrap;
      }
      // reply (player's blue bubble); outcomes are not shown in chat
      const d = document.createElement("div");
      d.className = "row out";
      d.innerHTML = `<div class="bubble">${escapeHtml(e.body)}</div>`;
      return d;
    }

    // ── journal panel ────────────────────────────────────
    function journalDivider(box, e){
      if (e.week && e.week !== jLastWeek){
        const d = document.createElement("div");
        d.className = "journal-date";
        d.innerHTML = `<span class="num"><b>${e.week}</b><i>week</i></span>`;
        box.appendChild(d);
        jLastWeek = e.week;
      }
    }
    function renderJournalCatchup(){
      const box = $("journalScroll");
      const thread = engine.threads.founder;
      while (jShown < thread.length){
        const e = thread[jShown];
        const el = buildJournalEntry(e);
        if (el){ journalDivider(box, e); el.style.animation = "none"; box.appendChild(el); }
        jShown++;
      }
      if (!box.children.length){
        box.innerHTML = `<div class="journal-empty">the story starts here…</div>`;
      }
    }
    function revealJournalFrom(from, done){
      const thread = engine.threads.founder;
      if (from >= thread.length){ jShown = thread.length; finishJournalReveal(done); return; }
      journalRevealing = true; renderStats();
      const box = $("journalScroll");
      const ghost = box.querySelector(".journal-empty"); if (ghost) ghost.remove();
      // pull the eye to the right column: glow the journal + flash its header before
      // the first outcome inks in (the journal beat leads, notifications follow).
      $("journalCol").classList.add("updating");
      const head = $("journalHead");
      head.classList.remove("flash"); void head.offsetWidth; head.classList.add("flash");
      let i = from;
      const step = ()=>{
        if (i >= thread.length){ jShown = thread.length; finishJournalReveal(done); return; }
        const e = thread[i];
        const el = buildJournalEntry(e);
        if (!el){ i++; jShown = i; step(); return; }
        const delay = e.type === "stamp" ? 480 : 340;
        setTimeout(()=>{
          journalDivider(box, e);
          // glow each new outcome/choice as it inks in (stamps keep their own animation).
          // Outcomes return a wrapper, so target the inner .journal-entry/.journal-choice.
          if (e.type !== "stamp"){
            const glow = (el.classList.contains("journal-entry") || el.classList.contains("journal-choice"))
              ? el : el.querySelector(".journal-entry,.journal-choice");
            if (glow) glow.classList.add("arrive");
          }
          box.appendChild(el);
          box.scrollTop = box.scrollHeight;
          i++; jShown = i; step();
        }, delay);
      };
      step();
    }
    function finishJournalReveal(done){
      journalRevealing = false;
      $("journalCol").classList.remove("updating");
      renderStats(); renderHand();
      const s = engine.stats();
      if (s.act1Complete && !window.__act1shown){ window.__act1shown = true; setTimeout(showAct1, 500); }
      if (done) done();
    }

    // ── chat thread rendering ────────────────────────────
    function openConversation(){
      selectedCard = null; hideDetail();
      renderHead();
      const thread = engine.threads[active];
      const box = $("thread");
      box.innerHTML = "";
      box.className = "thread";
      if (!thread.length){
        box.innerHTML = `<div class="chat-empty">no messages yet</div>`;
        renderRail(); renderStats(); renderHand(); return;
      }
      let lastWeek = null;
      const upto = Math.max(shown[active], 0);
      thread.slice(0, upto).forEach(e=>{
        lastWeek = chatDivider(box, e, lastWeek);
        const el = buildChatEntry(e); el.style.animation = "none"; box.appendChild(el);
      });
      revealFrom(active, upto, lastWeek);
      renderRail(); renderStats(); renderHand();
      scrollDown();
    }
    function chatDivider(box, e, lastWeek){
      if (e.week && e.week !== lastWeek){
        const d = document.createElement("div");
        d.className = "divider"; d.textContent = "Week " + e.week;
        d.style.animation = "none"; box.appendChild(d);
        return e.week;
      }
      return lastWeek;
    }
    function revealFrom(charId, from, lastWeek){
      const thread = engine.threads[charId];
      if (from >= thread.length){ shown[charId]=thread.length; finishReveal(); return; }
      revealing = true; renderStats();
      const box = $("thread");
      let i = from; let lw = lastWeek;
      const step = ()=>{
        if (charId !== active){ shown[charId]=thread.length; finishReveal(); return; }
        if (i >= thread.length){ shown[charId]=thread.length; finishReveal(); return; }
        const e = thread[i];
        lw = chatDivider(box, e, lw);
        const useTyping = e.type === "incoming";
        const delay = useTyping ? 600 : 90;
        if (useTyping){
          const t = document.createElement("div");
          t.className="row in"; t.innerHTML = `<div class="typing"><i></i><i></i><i></i></div>`;
          box.appendChild(t); scrollDown();
          setTimeout(()=>{ t.remove(); box.appendChild(buildChatEntry(e)); scrollDown(); i++; shown[charId]=i; step(); }, delay);
        } else {
          setTimeout(()=>{ box.appendChild(buildChatEntry(e)); scrollDown(); i++; shown[charId]=i; step(); }, delay);
        }
      };
      step();
    }
    function finishReveal(){
      revealing = false;
      renderRail(); renderStats(); renderHand(); renderThreadResponse();
    }

    function clearThreadResponse(){
      const box = $("thread");
      [...box.querySelectorAll(".chat-cta, .thread-card, .chat-blocked")].forEach(el => el.remove());
    }
    // The response surface for a chat character lives *inside* the thread, in-flow,
    // so it reserves space and never covers the latest message. Default state is a
    // "Respond ↓" pill (the trigger); when its card is the one being engaged
    // (selectedCard), it expands into the full option card, styled like the hand card.
    function renderThreadResponse(){
      clearThreadResponse();
      if (active === "founder" || NOCHAT.has(active)) return;
      if (active === "jordan" && engine.s.jordan_resolved) {
        const box = $("thread");
        const b = document.createElement("div");
        b.className = "chat-blocked";
        b.textContent = "This user blocked you.";
        box.appendChild(b);
        scrollDown();
        return;
      }
      const cardId = engine.openCardId(active);
      if (!cardId || !cardReadable(active)) return;
      const opts = engine.options(cardId);
      if (!opts.length) return;
      const box = $("thread");
      const spent = engine.stats().actionsLeft <= 0;

      if (selectedCard === cardId && !spent){
        const a = engine.openActions().find(x => x.cardId === cardId);
        const st = styleFor(active);
        const cat = catFor(a ? a.cat : "e");
        const card = document.createElement("div");
        card.className = "thread-card";
        card.innerHTML =
          `<div class="tc-stripe" style="background:${cat.color}"></div>
           <div class="tc-head">
             <div class="hcard-av" style="background:${st.color}">${st.initials}</div>
             <div class="tc-id"><div class="tc-from">${escapeHtml(a ? a.name : active)}</div><div class="tc-role">Your response</div></div>
             <button class="tc-close" id="tcClose">×</button>
           </div>
           <div class="tc-opts">${opts.map(o=>
              `<button class="chip" data-card="${cardId}" data-key="${o.key}">${escapeHtml(o.label)}</button>`
            ).join("")}</div>`;
        box.appendChild(card);
        $("tcClose").onclick = ()=>{ if (busy()) return; selectedCard = null; renderThreadResponse(); renderHand(); };
        [...card.querySelectorAll(".chip")].forEach(btn=>{ btn.onclick = ()=> commitCard(btn.dataset.card, btn.dataset.key); });
        // scroll the freshly-appended card fully into view, after layout settles
        scrollDown();
        requestAnimationFrame(()=>{ box.scrollTop = box.scrollHeight; });
        return;
      }

      const cta = document.createElement("div");
      cta.className = "chat-cta";
      cta.innerHTML = `<button class="cta-btn"${spent?' disabled':''}>${spent?'No actions left this week':'Respond ↓'}</button>`;
      box.appendChild(cta);
      const b = cta.querySelector("button");
      if (b && !spent) b.onclick = ()=>{ if (busy()) return; selectedCard = cardId; renderThreadResponse(); renderHand(); };
      scrollDown();
    }

    // ── the hand (bottom action cards) ───────────────────
    // A card can only be played once its source message has been read. A chat
    // character's card unlocks when its thread has no unread messages; the
    // founder's own "moves" have no thread to read, so they're always playable.
    function cardReadable(charId){
      if (charId === "founder" || NOCHAT.has(charId)) return true;   // no thread to read
      return shown[charId] >= engine.threads[charId].length;
    }
    function renderHand(){
      const actions = engine.openActions();
      // Only show a card once its source message has been read — unread asks stay
      // hidden, so the player has to discover them by reading threads (the bell /
      // blue dots / notifications point the way). Founder "moves" are always shown.
      const visible = actions.filter(a => cardReadable(a.charId));
      const s = engine.stats();
      const spent = s.actionsLeft <= 0;

      // plays-left dots
      $("handPlays").innerHTML =
        `<div class="dot${s.actionsLeft>=1?' full':''}"></div>` +
        `<div class="dot${s.actionsLeft>=2?' full':''}"></div>` +
        `<span style="margin-left:4px">${s.actionsLeft} of 2 left</span>`;

      // hint: actionable messages still waiting to be read (their cards stay hidden)
      const unread = actions.length - visible.length;
      $("handHint").textContent = unread > 0
        ? `· ${unread} unread message${unread===1?'':'s'} — open a chat to reveal more`
        : (spent ? "· no actions left this week" : "");

      // Fallback advance: the week normally ends implicitly after 2 actions, but on a
      // thin week (no playable card left) surface an explicit "End week" so you're
      // never stuck. Hidden whenever a card is available or the turn is mid-reveal.
      const endBtn = $("handEnd");
      endBtn.style.display = (!spent && visible.length === 0 && !busy()) ? "" : "none";

      const box = $("handCards");
      if (!visible.length){
        box.innerHTML = unread > 0
          ? `<div class="hand-empty">📨 ${unread} unread message${unread===1?'':'s'} — read them to see your options</div>`
          : `<div class="hand-empty">nothing needs you right now — end the week →</div>`;
        if (selectedCard && !actions.some(a => a.cardId === selectedCard)){ selectedCard = null; hideDetail(); }
        return;
      }
      box.innerHTML = visible.map((a, idx)=>{
        const cat = catFor(a.cat);
        const st = styleFor(a.charId);
        const u = a.urgency;
        const urgCls = u >= 3 ? "urg-3" : u >= 2 ? "urg-2" : "urg-1";
        const cls = ["hcard"];
        if (spent) cls.push("played");
        // ring the card tied to the conversation currently on screen
        if (!spent && a.charId === active && a.cardId !== selectedCard) cls.push("linked");
        if (a.cardId === selectedCard) cls.push("selected");
        const preview = (a.body || "").slice(0, 110) + ((a.body||"").length > 110 ? "…" : "");
        return `<div class="${cls.join(' ')}" data-card="${a.cardId}" data-char="${a.charId}" style="animation-delay:${idx*0.05}s">
          <div class="hcard-stripe" style="background:${cat.color}"></div>
          <div class="hcard-inner">
            <div class="hcard-av-row">
              <div class="hcard-av" style="background:${st.color}">${st.initials}</div>
              <div class="hcard-sender">
                <div class="hcard-from">${escapeHtml(a.name)}</div>
                <div class="hcard-role">${escapeHtml(a.role)}</div>
              </div>
            </div>
            <div class="hcard-preview">${escapeHtml(preview)}</div>
          </div>
          <div class="hcard-foot">
            <span class="hcard-cat-badge" style="background:${cat.bg};color:${cat.tc}">${cat.label}</span>
            <span class="hcard-urg ${urgCls}"></span>
          </div>
        </div>`;
      }).join("");

      [...box.querySelectorAll(".hcard")].forEach(el=>{
        el.onclick = ()=>{
          if (busy() || engine.stats().actionsLeft <= 0) return;
          selectCard(el.dataset.card);
        };
      });

      // keep the founder / no-chat popup in sync; chat cards use the inline thread response
      const sel = selectedCard ? actions.find(a => a.cardId === selectedCard) : null;
      if (selectedCard && !sel){
        selectedCard = null; hideDetail();
      } else if (sel && (sel.charId === "founder" || sel.noChat)){
        showDetail(selectedCard);
      } else {
        hideDetail();
      }
    }

    function selectCard(cardId){
      if (selectedCard === cardId){ selectedCard = null; hideDetail(); renderThreadResponse(); renderHand(); return; }
      const a = engine.openActions().find(x => x.cardId === cardId);
      // Founder "moves" and no-chat sources have no thread — use the floating popup.
      if (a && (a.charId === "founder" || a.noChat)){
        selectedCard = cardId; renderHand(); showDetail(cardId); return;
      }
      // Chat character — focus its conversation (its message shows in context) and
      // expand the options inline in the thread. (Readable cards are fully revealed,
      // so openConversation won't kick off a reveal.)
      hideDetail();
      if (a && a.charId !== active){ active = a.charId; openConversation(); } // resets selectedCard
      selectedCard = cardId;
      renderHand();
      renderThreadResponse();
    }
    function hideDetail(){ $("handDetail").style.display = "none"; }
    function showDetail(cardId){
      const a = engine.openActions().find(x => x.cardId === cardId);
      if (!a){ hideDetail(); return; }
      const d = $("handDetail");
      d.style.display = "block";
      // The popup is a *response* surface. A chat character's message already
      // lives in the thread (now in view), so we don't repeat it — we go straight
      // to the choices. A founder "move" or a no-chat event has no message anywhere
      // else, so its body is the brief and belongs here.
      const showBrief = a.charId === "founder" || a.noChat;
      const context = showBrief
        ? `<div class="hd-body">${escapeHtml(a.body)}</div>`
        : `<div class="hd-prompt">Your response:</div>`;
      d.innerHTML =
        `<button class="hd-close" id="hdClose">×</button>
         <div class="hd-from">${escapeHtml(a.name)}${a.role?' · '+escapeHtml(a.role):''}</div>
         ${context}
         <div class="hd-opts">${a.options.map(o=>
            `<button class="chip" data-card="${a.cardId}" data-key="${o.key}">${escapeHtml(o.label)}</button>`
          ).join("")}</div>`;
      $("hdClose").onclick = ()=>{ selectedCard = null; hideDetail(); renderHand(); };
      [...d.querySelectorAll(".chip")].forEach(btn=>{
        btn.onclick = ()=> commitCard(btn.dataset.card, btn.dataset.key);
      });
    }

    // ── commit an action from the hand ───────────────────
    // Results are *withheld*: committing spends an action and consumes the card, but
    // reveals nothing. Every consequence (the reply bubble, the journal outcome, the
    // delayed text back) surfaces at turn end as notifications + journal ink.
    function commitCard(cardId, key){
      if (busy() || engine.stats().actionsLeft <= 0) return;
      selectedCard = null; hideDetail(); clearThreadResponse();

      engine.act(cardId, key);   // state + entries change, but we reveal nothing now

      renderRail(); renderStats(); renderHand(); renderThreadResponse();

      // out of actions → the week ends, which plays the turn-end reveal
      if (engine.stats().actionsLeft <= 0) setTimeout(advanceWeek, 600);
    }

    // ── advance to next week ─────────────────────────────
    function advanceWeek(){
      if (busy()) return;
      selectedCard = null; hideDetail(); clearThreadResponse();

      const before = engine.stats();
      const cashBefore = before.cash;
      const sigBefore = before.signal, fitBefore = before.marketFit;
      // traction counts aren't on stats() — read them straight off engine.s
      const betaBefore = engine.s.waitlist, usersBefore = engine.s.users, payingBefore = engine.s.customers;
      engine.nextWeek();
      const after = engine.stats();
      const cashAfter = after.cash;

      // which headline stats changed → pulse them once at the end of the reveal
      pendingStatPulse = [];
      if (after.signal !== sigBefore) pendingStatPulse.push("signal");
      if (after.marketFit !== fitBefore) pendingStatPulse.push("fit");
      if (engine.s.waitlist !== betaBefore) pendingStatPulse.push("beta");
      if (engine.s.users !== usersBefore) pendingStatPulse.push("users");
      if (engine.s.customers !== payingBefore) pendingStatPulse.push("paying");

      const jBefore = jShown;

      revealing = true; runwayAnim = true;
      setRunway(cashBefore);
      renderStats();

      // opening beat (a week passed) → then the calm, non-moving turn-end reveal
      animateRunway(cashBefore, cashAfter, () => { revealing = false; revealTurnEnd(jBefore); });
    }

    // ── debug skip: auto-play a decent strategy, land caught-up ──────────
    // Mirrors the old debug skip-ahead button. Plays the engine directly (no
    // animation) with a sensible default strategy until the target week (or the
    // game ends), then statically syncs the UI so you land fully caught up.
    const DBG_PREFS = {
      dev_planning_session: "lean",     // pick the lean roadmap
      alex_commitment:      "accept",   // bring Alex on full-time
      start_prototype:      "build",    // start building
      incorporate_week1:    "atlas",    // incorporate
      jordan_equity:        "fair",     // sign a fair split
    };
    function debugStep(opts){
      // resolve up to the weekly action budget with the preferred (or first) option
      let safety = 0;
      while (engine.stats().actionsLeft > 0 && safety++ < 12){
        const actions = engine.openActions();
        if (!actions.length) break;
        const a = actions[0];                       // openActions is urgency-sorted
        const pref = opts[a.cardId];
        const key = (pref && a.options.some(o => o.key === pref))
          ? pref : (a.options[0] && a.options[0].key);
        if (!key) break;
        engine.act(a.cardId, key);
      }
      engine.nextWeek();
    }
    function debugSkip(targetWeek){
      if (busy()) return;
      const bar = $("debug-bar"); bar.classList.add("skipping");
      // dismiss any open overlays / dropdowns
      $("overlay").classList.remove("show");
      closePops();
      [...$("notes").children].forEach(el => el.remove());

      let guard = 0;
      while (engine.stats().week < targetWeek && !engine.s.game_over && !engine.s.game_won && guard++ < 400){
        debugStep(DBG_PREFS);
      }

      // sync UI counters so everything reads as already-seen, then render statically
      for (const id of engine.order){
        shown[id]    = engine.threads[id].length;
        notified[id] = engine.threads[id].length;
      }
      weekNotes = []; notesSeen = true;
      if (engine.stats().act1Complete) window.__act1shown = true;  // don't pop the Act-1 modal retroactively

      renderJournalCatchup();   // append new journal entries (no animation)
      updateBell();
      openConversation();       // re-render the active chat + rail + stats + hand

      bar.classList.remove("skipping");
      if (engine.s.game_over) setTimeout(showGameOver, 400);
    }

    // ── turn-end reveal: calm journal ink + iPhone-style notifications ───
    // The chat viewport NEVER moves on its own. Your actions' outcomes ink into
    // the always-visible journal; incoming messages buzz in as notification
    // bubbles you read at your own pace.
    function revealTurnEnd(jBefore){
      // The journal beat LEADS (glow + inked outcomes in the right column); the chat
      // notifications follow only once it finishes — see the dispatch at the bottom.

      // 1) gather *incoming* chat messages we haven't notified yet (NOT keyed on
      //    read-state — an unread message must buzz once, the week it arrives, then
      //    advance the counter so it never repeats).
      const notes = [];
      for (const charId of engine.order){
        if (charId === "founder") continue;
        const thread = engine.threads[charId];
        for (let i = notified[charId] || 0; i < thread.length; i++){
          const e = thread[i];
          if (e.type === "incoming") notes.push({ charId, from: e.from, body: e.body });
        }
        notified[charId] = thread.length;
      }

      // remember this week's notifications so the bell can reopen them after they fade
      weekNotes = notes.slice();
      notesSeen = notes.length === 0;
      updateBell();

      // 3) refresh rail dots + hand; pulse changed stats; then pace the toasts
      renderRail(); renderHand();
      pendingStatPulse.forEach(k=>{
        const el = document.querySelector('.stat[data-stat="' + k + '"]');
        if (el) el.classList.add("changed");
      });
      pendingStatPulse = [];

      // The chat notifications + active-thread refresh — held until the journal beat
      // has played, so the player sees the journal update first, then the phone buzzes.
      const startNotifications = ()=>{
        queueNotifications(notes);
        // The chat you're *currently viewing* refreshes itself — but only after its
        // notification has shown (notification first, then the chat updates). Other
        // threads stay put until you tap their notification / rail row.
        if (active !== "founder" && shown[active] < engine.threads[active].length){
          const idx = notes.findIndex(n => n.charId === active);
          const delay = idx >= 0 ? idx * 750 + 650 : 450;   // 750ms = notification pace
          setTimeout(()=>{
            if (active !== "founder" && shown[active] < engine.threads[active].length) openConversation();
          }, delay);
        }
        if (engine.stats().gameOver) setTimeout(showGameOver, 800);
      };

      // Journal first (with glow); a short beat after it finishes, the notifications buzz.
      if (engine.threads.founder.length > jBefore){
        revealJournalFrom(jBefore, ()=> setTimeout(startNotifications, 450));
      } else {
        startNotifications();
      }

      if (engine.stats().act1Complete && !window.__act1shown){ window.__act1shown = true; setTimeout(showAct1, 800); }
    }

    // ── iPhone-style notification bubbles ────────────────
    function queueNotifications(list){
      noteQueue = noteQueue.concat(list);
      if (!noteTimer) pumpNotifications();
    }
    function pumpNotifications(){
      if (!noteQueue.length){ noteTimer = null; return; }
      showNote(noteQueue.shift());
      noteTimer = setTimeout(pumpNotifications, 750);   // one toast at a time
    }
    function showNote(n){
      const wrap = $("notes");
      const st = styleFor(n.charId);
      const name = n.from || (convFor(n.charId) || {}).name || n.charId;
      const el = document.createElement("div");
      el.className = "note";
      el.innerHTML =
        `<div class="note-av" style="background:${st.color}">${st.initials}</div>
         <div class="note-body">
           <div class="note-from">${escapeHtml(name)}</div>
           <div class="note-text">${escapeHtml(n.body || "")}</div>
         </div>`;
      el.onclick = ()=>{
        dismissNote(el);
        if (busy()) return;
        openFromNote(n);   // user-initiated → no blink
      };
      wrap.appendChild(el);
      setTimeout(()=> dismissNote(el), 6500);   // auto-dismiss; the rail dot persists
    }
    function dismissNote(el){
      if (!el || el.__gone) return;
      el.__gone = true;
      el.classList.add("leaving");
      setTimeout(()=> el.remove(), 130);
    }
    // Opening a notification: a chat character opens its conversation; a no-chat
    // source (which has no thread) opens its card's popup instead.
    function openFromNote(n){
      if (!n) return;
      if (NOCHAT.has(n.charId)){
        const cid = engine.openCardId(n.charId);
        if (cid) selectCard(cid);
        return;
      }
      active = n.charId; openConversation();
    }

    // ── notification center (the bell): reopen this week's notifications ──
    function updateBell(){
      const badge = $("bellBadge");
      if (weekNotes.length && !notesSeen){
        badge.textContent = weekNotes.length;
        badge.style.display = "grid";
      } else {
        badge.style.display = "none";
      }
    }
    function toggleNoteCenter(){
      const c = $("noteCenter");
      if (c.classList.contains("show")){ c.classList.remove("show"); return; }
      closePops("noteCenter");
      renderNoteCenter();
      c.classList.add("show");
      notesSeen = true; updateBell();
    }
    function renderNoteCenter(){
      const c = $("noteCenter");
      if (!weekNotes.length){
        c.innerHTML = `<h4>This week</h4><div class="nc-empty">No notifications this week.</div>`;
        return;
      }
      c.innerHTML = `<h4>This week · ${weekNotes.length} notification${weekNotes.length===1?'':'s'}</h4>` +
        weekNotes.map((n,idx)=>{
          const st = styleFor(n.charId);
          const name = n.from || (convFor(n.charId) || {}).name || n.charId;
          return `<div class="nc-item" data-idx="${idx}">
            <div class="note-av" style="background:${st.color}">${st.initials}</div>
            <div class="note-body">
              <div class="note-from">${escapeHtml(name)}</div>
              <div class="note-text">${escapeHtml(n.body || "")}</div>
            </div>
          </div>`;
        }).join("");
      [...c.querySelectorAll(".nc-item")].forEach(el=>{
        el.onclick = ()=>{
          const n = weekNotes[+el.dataset.idx];
          $("noteCenter").classList.remove("show");
          if (busy() || !n) return;
          openFromNote(n);
        };
      });
    }

    // ── build roadmap (🗺️): the dev-map stepper, ported from the card build ──
    const RM_ITEM_META = {
      _hdr_backend:      { header:true, lbl:"Backend" },
      matching_algo:     { lbl:"Matching algorithm",  av:"AL" },
      api_design:        { lbl:"API design",           av:"AL" },
      arch_refactor:     { lbl:"Arch refactor",        av:"AL" },
      sprint_social:     { lbl:"Social + push",        av:"—" },
      sprint_algo:       { lbl:"Profile verification", av:"—" },
      plans_matching:    { lbl:"Plans matching",       av:"AL" },
      _hdr_ios:          { header:true, lbl:"iOS app" },
      ios_ui:            { lbl:"UI design",            av:"JO" },
      ios_server:        { lbl:"Backend integration",  av:"JO" },
      sprint_mono:       { lbl:"Premium subscription", av:"—" },
      sprint_adv_social: { lbl:"Social graph",         av:"—" },
      sprint_adv_video:  { lbl:"Video dates",          av:"—" },
      plans_ui:          { lbl:"Plans UI",             av:"JO" },
      beta:              { lbl:"Beta",                 av:"AL" },
    };
    const RM_AV_STYLE = {
      AL:"background:#e7f0ff;color:#2563eb",
      JO:"background:#efe7ff;color:#7c3aed",
      "—":"background:#f0f0f3;color:#999",
    };
    const RM_ORDER_PRE  = ["_hdr_backend","_hdr_ios"];
    const RM_ORDER_LEAN = ["_hdr_backend","matching_algo","api_design","arch_refactor","plans_matching","_hdr_ios","ios_ui","ios_server","plans_ui","beta"];
    const RM_ORDER_FULL = ["_hdr_backend","matching_algo","api_design","arch_refactor","sprint_social","sprint_algo","plans_matching","_hdr_ios","ios_ui","ios_server","sprint_mono","sprint_adv_social","sprint_adv_video","plans_ui","beta"];

    function renderRoadmap(){
      const s = engine.s;
      const pop = $("roadmapPop");
      if (!s.items){
        pop.innerHTML = `<div class="dm-empty">No build plan yet. Once the team aligns on a roadmap, it shows up here.</div>`;
        return;
      }
      const expanded = !!s.items.beta;
      const plan = s.dev_plan;
      const order = !expanded ? RM_ORDER_PRE : (plan === "full" ? RM_ORDER_FULL : RM_ORDER_LEAN);
      const badgeCls = { lean:"dm-badge-lean", full:"dm-badge-full", sprint:"dm-badge-sprint" };
      const showLine = new Set();
      for (let i=0;i<order.length-1;i++){
        if (!RM_ITEM_META[order[i]]?.header && !RM_ITEM_META[order[i+1]]?.header) showLine.add(order[i]);
      }
      const pivotBadge = s.activities_pivot ? `<span class="dm-badge dm-badge-pivot">pivoted</span>` : "";
      let html = `<div class="dm-hdr">${expanded ? "Roadmap" : "Build plan"}<span class="dm-badge ${badgeCls[plan] || "dm-badge-sprint"}">${plan || "—"}</span>${pivotBadge}</div>`;
      for (const key of order){
        const meta = RM_ITEM_META[key];
        if (!meta) continue;
        if (meta.header){ html += `<div class="dm-grp">${meta.lbl}</div>`; continue; }
        const item = s.items[key];
        if (!item) continue;
        const st = item.status;
        const stCls = st==="done"?"done":st==="active"?"active":st==="deferred"?"defer":st==="obsolete"?"obsolete":"todo";
        const dot = st==="done" ? "✓" : "";
        const line = showLine.has(key) ? `<div class="dm-step-line"></div>` : "";
        const who = st==="active" && meta.av!=="—" ? `<span class="dm-step-who" style="${RM_AV_STYLE[meta.av]}">${meta.av}</span>` : "";
        html += `<div class="dm-step">
          <div class="dm-step-track"><div class="dm-step-dot st-${stCls}">${dot}</div>${line}</div>
          <div class="dm-step-body"><span class="dm-step-lbl st-${stCls}">${escapeHtml(meta.lbl)}</span>${who}</div>
        </div>`;
      }
      pop.innerHTML = html;
    }

    // ── bank statement (cash readout): week-by-week ledger from engine.ledger ──
    function renderBank(){
      const pop = $("bankPop");
      const led = engine.ledger;
      if (!led.length){
        pop.innerHTML = `<div class="dm-hdr">Bank statement</div><div class="bank-empty">No transactions yet.<br>Finish a week to see your finances.</div>`;
        return;
      }
      const icon = t => t.type==="burn" ? "🔥" : t.type==="income" ? "💰" : "💸";
      const clip = (str,n) => (str && str.length>n) ? str.slice(0,n-1)+"…" : (str||"");
      let html = `<div class="dm-hdr">Bank statement<span style="font-weight:800;color:var(--ink);font-size:12px">${fmtCash(Math.max(0,engine.s.cash))}</span></div>`;
      for (let i=led.length-1;i>=0;i--){
        const L = led[i];
        const rows = L.transactions.map(t=>{
          const neg = t.delta < 0;
          const amt = (neg?"−":"+") + fmtCash(Math.abs(t.delta));
          return `<div class="bank-row">
            <div class="bank-row-icon">${icon(t)}</div>
            <div class="bank-row-desc">
              <div class="bank-row-lbl">${escapeHtml(clip(t.label,90))}</div>
              ${t.note?`<div class="bank-row-note">${escapeHtml(t.note)}</div>`:""}
            </div>
            <div class="bank-row-amt ${neg?"bank-amt-neg":"bank-amt-pos"}">${amt}</div>
          </div>`;
        }).join("");
        html += `<div class="bank-week">
          <div class="bank-week-lbl">Week ${L.week}</div>
          ${rows}
          <div class="bank-balance"><span class="bank-bal-lbl">Balance</span><span class="bank-bal-val">${fmtCash(Math.max(0,L.balanceAfter))}</span></div>
        </div>`;
      }
      pop.innerHTML = html;
    }

    // Only one top-right dropdown is open at a time.
    function closePops(except){
      for (const id of ["noteCenter","roadmapPop","bankPop"]) if (id !== except) $(id).classList.remove("show");
    }
    function toggleRoadmap(){
      const p = $("roadmapPop");
      if (p.classList.contains("show")){ p.classList.remove("show"); return; }
      closePops("roadmapPop"); renderRoadmap(); p.classList.add("show");
    }
    function toggleBank(){
      const p = $("bankPop");
      if (p.classList.contains("show")){ p.classList.remove("show"); return; }
      closePops("bankPop"); renderBank(); p.classList.add("show");
    }
    // Keep an open dropdown current as state changes (e.g. items advance at turn end).
    function refreshPops(){
      if ($("roadmapPop").classList.contains("show")) renderRoadmap();
      if ($("bankPop").classList.contains("show")) renderBank();
    }

    // ── modals ───────────────────────────────────────────
    function showAct1(){
      const s = engine.stats();
      const split = s.equity || "your split";
      $("modal").innerHTML =
        `<div class="em">🤝</div><h3>Equity, signed.</h3>
         <p>The founder agreement is locked in at <span class="split">${split}</span>.
            The hard conversations are behind you — for now. The real building starts here.</p>
         <p style="font-size:12.5px">This is the end of the current slice. More of the story is coming.</p>
         <button id="closeModal">Keep going</button>`;
      $("overlay").classList.add("show");
      $("closeModal").onclick = ()=> $("overlay").classList.remove("show");
    }
    function showGameOver(){
      $("modal").innerHTML =
        `<div class="em">💸</div><h3>Out of runway.</h3>
         <p>The cash hit zero on week ${engine.stats().week}. Every founder runs this race against the bank balance.</p>
         <button id="closeModal">Refresh to retry</button>`;
      $("overlay").classList.add("show");
      $("closeModal").onclick = ()=> location.reload();
    }

    // ── utils ────────────────────────────────────────────
    function scrollDown(){ const t=$("thread"); t.scrollTop = t.scrollHeight; }
    function escapeHtml(str){ return (str||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }

    $("bell").onclick = (ev)=>{ ev.stopPropagation(); toggleNoteCenter(); };
    $("roadmapBtn").onclick = (ev)=>{ ev.stopPropagation(); toggleRoadmap(); };
    $("runway").onclick = (ev)=>{ ev.stopPropagation(); toggleBank(); };
    $("handEnd").onclick = ()=>{ if (!busy()) advanceWeek(); };
    // click outside an open dropdown (and its trigger) closes it
    document.addEventListener("click", (ev)=>{
      for (const [pid, tid] of [["noteCenter","bell"],["roadmapPop","roadmapBtn"],["bankPop","runway"]]){
        const c = $(pid);
        if (!c.classList.contains("show")) continue;
        if (c.contains(ev.target) || $(tid).contains(ev.target)) continue;
        c.classList.remove("show");
      }
    });

    // debug skip bar (testing) — absolute targets + a relative +N step
    [...document.querySelectorAll("#debug-bar button")].forEach(btn=>{
      btn.onclick = ()=>{
        if (busy()) return;
        const target = btn.dataset.step
          ? engine.stats().week + (+btn.dataset.step)
          : +btn.dataset.week;
        debugSkip(target);
      };
    });

    // boot
    updateBell();
    renderJournalCatchup();
    openConversation();
  })();
  </script>
</body>
</html>
