<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Kindred — founder chat</title>
<style>
  :root{
    --bg:#ecebf1; --panel:#ffffff; --rail:#f7f7fa; --line:#e3e3e8;
    --ink:#1c1c1e; --muted:#8a8a8e; --faint:#aeaeb2;
    --in:#e9e9eb; --out1:#0b84ff; --out2:#0a6fe0;
    --accent:#0b84ff; --green:#34c759; --gold:#ffb340;
    --shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.06);
    --r:18px;
    /* handwritten stack for the journal — degrades to generic cursive, no web fonts */
    --hand:"Segoe Print","Bradley Hand","Noteworthy","Marker Felt","Comic Sans MS",cursive;
    --paper:#faf4e6; --jink:#4a4233; --jink-blue:#2a5db0; --rule:#e6d9bb; --margin:#e6b0a6;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{height:100vh;display:flex;flex-direction:column;max-width:1180px;margin:0 auto;padding:18px;gap:14px}

  /* ── top bar ─────────────────────────────────────────── */
  .topbar{
    display:flex;align-items:center;gap:18px;
    background:var(--panel);border-radius:16px;padding:12px 18px;box-shadow:var(--shadow);
  }
  .brand{display:flex;flex-direction:column;line-height:1.1}
  .brand b{font-size:17px;letter-spacing:.2px}
  .brand span{font-size:12px;color:var(--muted)}
  /* runway burn-down — time represented as draining cash/weeks-left */
  .runway{display:flex;flex-direction:column;gap:5px;min-width:210px;max-width:300px;flex:1}
  .runway-top{display:flex;align-items:baseline;gap:6px}
  .runway-num{font-size:23px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;transition:color .5s}
  .runway-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .runway-cash{margin-left:auto;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
  .runway-bar{height:9px;border-radius:999px;background:var(--rail);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
  .runway-fill{height:100%;border-radius:999px;width:100%;background:#34c759}
  .runway.low .runway-num{color:#ff3b30}
  .runway.low .runway-fill{animation:pulseRed 1.1s ease-in-out infinite}
  @keyframes pulseRed{0%,100%{opacity:1}50%{opacity:.45}}
  .stats{display:flex;gap:8px;margin-left:auto;align-items:center}
  .stat{
    display:flex;flex-direction:column;align-items:center;min-width:64px;
    background:var(--rail);border:1px solid var(--line);border-radius:12px;padding:6px 10px;
  }
  .stat .v{font-weight:700;font-size:14px}
  .stat .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .stat.warn .v{color:#ff3b30}
  .actions-budget{display:flex;align-items:center;gap:8px;padding-left:6px}
  .actions-budget .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);transition:.2s}
  .dot.full{background:var(--accent)}
  .endweek{
    border:0;background:var(--ink);color:#fff;font-weight:600;font-size:13px;
    padding:9px 16px;border-radius:12px;cursor:pointer;transition:.15s;
  }
  .endweek:hover{transform:translateY(-1px);opacity:.92}
  .endweek:disabled{opacity:.4;cursor:default;transform:none}

  /* ── main split ──────────────────────────────────────── */
  .main{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
  .top-row{flex:1;display:flex;gap:14px;min-height:0}
  .rail{
    width:268px;flex:none;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);
    overflow:hidden;display:flex;flex-direction:column;
  }
  .rail h2{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);margin:0;padding:16px 18px 8px}
  .convs{overflow-y:auto;padding:0 8px 10px}
  .conv{
    display:flex;gap:11px;align-items:center;padding:10px 10px;border-radius:13px;cursor:pointer;
    transition:background .12s;position:relative;
  }
  .conv:hover{background:var(--rail)}
  .conv.active{background:#eaf3ff}
  .avatar{
    width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;
    color:#fff;font-weight:600;font-size:15px;
  }
  .conv-body{min-width:0;flex:1}
  .conv-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .conv-name{font-weight:600;font-size:14.5px}
  .conv-prev{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{
    width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;
    box-shadow:0 0 0 3px #eaf3ff;
  }
  .conv:not(.active) .badge{box-shadow:0 0 0 3px var(--panel)}

  /* ── chat panel ──────────────────────────────────────── */
  .chat{
    flex:1;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;min-width:0;overflow:hidden;position:relative;
  }
  .chat-head{
    display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);
  }
  .chat-head .avatar{width:34px;height:34px;font-size:13px}
  .chat-head .nm{font-weight:600}
  .chat-head .rl{font-size:12px;color:var(--muted)}
  .thread{flex:1;overflow-y:auto;padding:20px 22px 8px;display:flex;flex-direction:column;gap:3px}

  .divider{align-self:center;margin:14px 0 6px;font-size:11px;color:var(--faint);
    text-transform:uppercase;letter-spacing:.8px;font-weight:600}

  .row{display:flex;margin-top:4px;animation:rise .32s cubic-bezier(.2,.8,.2,1)}
  .row.in{justify-content:flex-start}
  .row.out{justify-content:flex-end}
  .bubble{
    max-width:74%;padding:9px 14px;border-radius:20px;font-size:14.5px;
    white-space:pre-wrap;word-wrap:break-word;
  }
  .in .bubble{background:var(--in);color:var(--ink);border-bottom-left-radius:6px}
  .out .bubble{background:linear-gradient(180deg,var(--out1),var(--out2));color:#fff;border-bottom-right-radius:6px}
  .subtext{align-self:flex-start;max-width:74%;color:var(--faint);font-size:12px;
    font-style:italic;margin:1px 0 4px 6px}
  .dbg-card{font-size:10px;color:#aaa;font-family:monospace;margin:1px 0 2px 6px;user-select:all}
  .outcome{align-self:center;max-width:80%;text-align:center;color:var(--muted);
    font-size:12.5px;margin:8px 0;padding:0 8px}
  .outcome b{color:var(--ink)}

  /* typing indicator */
  .typing{display:inline-flex;gap:4px;padding:12px 15px;background:var(--in);border-radius:20px;border-bottom-left-radius:6px}
  .typing i{width:7px;height:7px;border-radius:50%;background:#b6b6bb;animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}

  /* ── journal panel: always visible at the bottom ──────────────────── */
  .journal-panel{
    flex:none; height:220px; min-height:120px;
    background:var(--panel); border-radius:16px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .journal-head{
    display:flex; align-items:center; gap:10px; padding:10px 18px;
    border-bottom:1px solid var(--line); flex:none;
  }
  .journal-head .jh-icon{ font-size:18px }
  .journal-head .jh-title{ font-weight:600; font-size:14px }
  .journal-head .jh-sub{ font-size:11px; color:var(--muted) }
  .journal-scroll{
    flex:1; overflow-y:auto; gap:0;
    background-color:var(--paper);
    background-image:
      repeating-linear-gradient(var(--paper), var(--paper) 33px, var(--rule) 33px, var(--rule) 34px),
      linear-gradient(90deg, transparent 0 50px, var(--margin) 50px 52px, transparent 52px);
    background-attachment:local;
    padding:16px 30px 16px 70px;
    display:flex; flex-direction:column;
  }

  /* keep the old .thread.journal-mode for if someone opens the tab directly */
  .thread.journal-mode{
    gap:0;
    background-color:var(--paper);
    background-image:
      repeating-linear-gradient(var(--paper), var(--paper) 33px, var(--rule) 33px, var(--rule) 34px),
      linear-gradient(90deg, transparent 0 50px, var(--margin) 50px 52px, transparent 52px);
    background-attachment:local;
    padding:26px 30px 16px 70px;
  }
  .journal-mode .journal-entry, .journal-scroll .journal-entry{
    font-family:var(--hand); color:var(--jink);
    font-size:17px; line-height:34px; margin:0 0 6px; white-space:pre-wrap;
    animation:inkin .5s ease both;
  }
  .journal-mode .journal-entry.is-outcome, .journal-scroll .journal-entry.is-outcome{ color:#5a513f; }
  .journal-mode .journal-choice, .journal-scroll .journal-choice{
    font-family:var(--hand); color:var(--jink-blue);
    font-size:17px; line-height:34px; margin:0 0 6px; animation:inkin .45s ease both;
  }
  .journal-mode .journal-source, .journal-scroll .journal-source{
    display:block; font-family:-apple-system,sans-serif; font-size:10px; line-height:1;
    letter-spacing:.6px; text-transform:uppercase; color:#bca978; margin:-2px 0 8px;
  }
  /* week number written into the red margin gutter, beside the entry */
  .journal-mode .journal-date, .journal-scroll .journal-date{ position:relative; align-self:stretch; min-height:26px; margin:22px 0 0; }
  .journal-mode .journal-date:first-child, .journal-scroll .journal-date:first-child{ margin-top:4px; }
  .journal-mode .journal-date .num, .journal-scroll .journal-date .num{
    position:absolute; left:-66px; top:2px; width:44px; text-align:right;
    font-family:var(--hand); color:#b5654a; line-height:1;
  }
  .journal-mode .journal-date .num b, .journal-scroll .journal-date .num b{ display:block; font-size:19px; font-weight:700; }
  .journal-mode .journal-date .num i, .journal-scroll .journal-date .num i{
    display:block; font-size:8.5px; letter-spacing:1.5px; text-transform:uppercase;
    font-style:normal; color:#c9a98f; margin-top:3px;
  }
  /* milestone rubber stamp */
  .journal-mode .journal-stamp, .journal-scroll .journal-stamp{
    align-self:flex-start; margin:12px 0 16px; padding:5px 15px;
    border:3px double currentColor; border-radius:6px;
    font-family:"Arial Black",Impact,sans-serif; font-weight:800; font-size:14px;
    letter-spacing:2px; text-transform:uppercase; opacity:.78;
    transform:rotate(-7deg); animation:stampin .4s cubic-bezier(.2,1.5,.4,1) both;
  }
  .journal-mode .journal-stamp.green, .journal-scroll .journal-stamp.green{ color:#2e8b57 }
  .journal-mode .journal-stamp.blue, .journal-scroll .journal-stamp.blue{ color:#2a5db0 }
  .journal-mode .journal-stamp.red, .journal-scroll .journal-stamp.red{ color:#c0392b }
  /* inline action buttons inside journal entries */
  .journal-actions{
    display:flex; flex-direction:column; gap:7px; margin:4px 0 14px;
    animation:inkin .4s ease both;
  }
  .journal-btn{
    text-align:left; border:1.5px solid #d8c39c; background:#fefcf2; color:#5b4a24;
    padding:8px 14px; border-radius:10px; cursor:pointer;
    font:14px var(--hand); line-height:1.35; transition:.13s;
  }
  .journal-btn:hover{ border-color:#b8943c; background:#fff7e0; transform:translateY(-1px); }
  .journal-btn.spent{ opacity:.4; pointer-events:none; }

  /* ── composer ────────────────────────────────────────── */
  .composer{border-top:1px solid var(--line);padding:14px 18px;background:var(--panel)}
  .prompt-label{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;margin-bottom:9px}
  .chips{display:flex;flex-direction:column;gap:9px}
  .chip{
    text-align:left;border:1px solid var(--line);background:#f8f9fb;color:var(--ink);
    padding:11px 15px;border-radius:14px;cursor:pointer;font-size:14px;transition:.13s;line-height:1.35;
  }
  .chip:hover{border-color:var(--accent);background:#eef5ff;transform:translateY(-1px)}
  .chip.journal{background:#fffdf5;border-color:#efe6c8}
  .chip.journal:hover{border-color:var(--gold);background:#fff7e6}
  .composer.spent .chip{opacity:.45;pointer-events:none}
  .empty-state{color:var(--faint);font-size:13.5px;text-align:center;padding:6px 0 2px}
  .empty-state .go{
    display:inline-block;margin-top:8px;color:var(--accent);font-weight:600;cursor:pointer;
  }

  /* ── overlay ─────────────────────────────────────────── */
  .overlay{
    position:fixed;inset:0;background:rgba(20,20,30,.55);backdrop-filter:blur(6px);
    display:none;place-items:center;z-index:20;
  }
  .overlay.show{display:grid;animation:fade .3s ease}
  .card-modal{
    background:var(--panel);border-radius:22px;max-width:440px;padding:34px 32px;text-align:center;
    box-shadow:var(--shadow);animation:rise .4s cubic-bezier(.2,.8,.2,1)
  }
  .card-modal .em{font-size:42px}
  .card-modal h3{margin:14px 0 6px;font-size:22px}
  .card-modal p{color:var(--muted);font-size:14px;margin:0 0 22px}
  .card-modal .split{font-weight:700;color:var(--accent);font-size:16px}
  .card-modal button{border:0;background:var(--ink);color:#fff;font-weight:600;padding:11px 22px;
    border-radius:13px;cursor:pointer;font-size:14px}

  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes inkin{from{opacity:0;filter:blur(1.5px)}to{opacity:1;filter:blur(0)}}
  @keyframes stampin{0%{opacity:0;transform:rotate(-7deg) scale(2.2)}60%{opacity:.92}100%{opacity:.78;transform:rotate(-7deg) scale(1)}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes blink{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  ::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:#d3d3da;border-radius:9px;border:2px solid var(--panel)}
</style>
</head>
<body>
  <div class="app">
    <!-- top bar -->
    <div class="topbar">
      <div class="avatar" style="background:linear-gradient(135deg,#ff6b9d,#c44bd6);width:38px;height:38px">K</div>
      <div class="brand"><b>Kindred</b><span id="weekSub">Week 1 · idea → seed</span></div>
      <div class="runway" id="runway">
        <div class="runway-top">
          <span class="runway-num" id="runwayNum">20</span>
          <span class="runway-lbl">weeks left</span>
          <span class="runway-cash" id="runwayCash">$10,000</span>
        </div>
        <div class="runway-bar"><div class="runway-fill" id="runwayFill"></div></div>
      </div>
      <div class="stats" id="stats"></div>
      <div class="actions-budget">
        <span class="lbl">Actions</span>
        <div class="dot full" id="dot0"></div>
        <div class="dot full" id="dot1"></div>
      </div>
      <button class="endweek" id="endweek">End week →</button>
    </div>

    <!-- main -->
    <div class="main">
      <div class="top-row">
        <div class="rail">
          <h2>Messages</h2>
          <div class="convs" id="convs"></div>
        </div>

        <div class="chat">
          <div class="chat-head" id="chatHead"></div>
          <div class="thread" id="thread"></div>
          <div class="composer" id="composer"></div>
        </div>
      </div>

      <div class="journal-panel">
        <div class="journal-head">
          <span class="jh-icon">📓</span>
          <span class="jh-title">Founder's Journal</span>
          <span class="jh-sub">your private record</span>
        </div>
        <div class="journal-scroll" id="journalScroll"></div>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="card-modal" id="modal"></div>
  </div>

  <!-- content + engine -->
  <script>window.ROLES = {};</script>
  <script src="roles/alex.js"></script>
  <script src="roles/jordan.js"></script>
  <script src="roles/priya.js"></script>
  <script src="roles/marcus.js"></script>
  <script src="roles/fatima.js"></script>
  <script src="roles/ryan.js"></script>
  <script src="roles/sarah.js"></script>
  <script src="roles/brett.js"></script>
  <script src="roles/kevin.js"></script>
  <script src="roles/mom.js"></script>
  <script src="roles/jamie.js"></script>
  <script src="roles/david.js"></script>
  <script src="roles/founder.js"></script>
  <script src="roles/hacker_news.js"></script>
  <script src="roles/yc.js"></script>
  <script src="roles/lena.js"></script>
  <script src="roles/techcrunch.js"></script>
  <script src="roles/users.js"></script>
  <script src="roles/analytics.js"></script>
  <script src="roles/twitter.js"></script>
  <script src="roles/tom.js"></script>
  <script src="engine.js"></script>
  <script>
  (function(){
    const engine = new Engine();
    // Avatar styling is pure presentation and lives in the UI; names/roles come
    // from the role defs via engine.conversations().
    const STYLE = {
      alex:        { color:"#0b84ff", initials:"A"  },
      jordan:      { color:"#34c759", initials:"J"  },
      priya:       { color:"#af52de", initials:"P"  },
      marcus:      { color:"#ff9500", initials:"M"  },
      fatima:      { color:"#ff6482", initials:"F"  },
      ryan:        { color:"#5ac8fa", initials:"R"  },
      sarah:       { color:"#ff2d55", initials:"S"  },
      brett:       { color:"#8e8e93", initials:"B"  },
      kevin:       { color:"#8e8e93", initials:"K"  },
      mom:         { color:"#ffcc02", initials:"👩" },
      jamie:       { color:"#64d2ff", initials:"Ja" },
      david:       { color:"#30b0c7", initials:"D"  },
      hacker_news: { color:"#ff6600", initials:"📰" },
      yc:          { color:"#f26522", initials:"Y"  },
      lena:        { color:"#bf5af2", initials:"L"  },
      techcrunch:  { color:"#00c853", initials:"📊" },
      users:       { color:"#007aff", initials:"👥" },
      analytics:   { color:"#5856d6", initials:"📈" },
      twitter:     { color:"#1da1f2", initials:"𝕏"  },
      tom:         { color:"#34c759", initials:"T"  },
      founder:     { color:"#8e8e93", initials:"Me" },
    };
    const styleFor = id => STYLE[id] || { color:"#8e8e93", initials:"?" };
    const convFor  = id => engine.conversations().find(c => c.id === id);
    let active = "alex";
    const shown = {};
    for (const id of engine.order) shown[id] = 0;
    let revealing = false;
    let journalRevealing = false;
    let jShown = 0;       // entries already rendered in the journal panel
    let jLastWeek = null;
    let runwayAnim = false;   // true while the burn-down beat is tweening the gauge

    const $ = id => document.getElementById(id);
    const fmtCash = c => "$" + c.toLocaleString();

    // ── runway burn-down: time felt as a draining lifeline ─
    // The bar represents this many weeks of cash at full width ($10k / $500).
    const RUNWAY_FULL = 20;
    const runwayColor = w => w <= 4 ? "#ff3b30" : w <= 8 ? "#ff9500" : "#34c759";
    function setRunway(cash){
      const weeks = Math.floor(cash / 500);
      $("runwayNum").textContent = weeks;
      $("runwayCash").textContent = fmtCash(Math.max(0, cash));
      const fill = $("runwayFill");
      fill.style.width = Math.max(0, Math.min(100, (cash / (RUNWAY_FULL * 500)) * 100)) + "%";
      fill.style.background = runwayColor(weeks);
      $("runway").classList.toggle("low", weeks <= 4);
    }
    // Animate cash from→to over ~1.2s: the felt beat when a week passes.
    function animateRunway(from, to, done){
      runwayAnim = true;
      const start = performance.now(), dur = 1200, ease = t => 1 - Math.pow(1 - t, 3);
      const step = now => {
        const t = Math.min(1, (now - start) / dur);
        setRunway(Math.round((from + (to - from) * ease(t)) / 10) * 10);
        if (t < 1) requestAnimationFrame(step);
        else { setRunway(to); runwayAnim = false; done && done(); }
      };
      requestAnimationFrame(step);
    }

    // ── status bar ────────────────────────────────────────
    function renderStats(){
      const s = engine.stats();
      $("weekSub").textContent = "Week " + s.week + " · idea → seed";
      if (!runwayAnim) setRunway(s.cash);
      $("stats").innerHTML = `
        <div class="stat"><div class="v">${s.signal}</div><div class="k">Signal</div></div>
        <div class="stat"><div class="v">${s.marketFit}</div><div class="k">Fit</div></div>
        ${s.equity?`<div class="stat"><div class="v" style="font-size:12px">${s.equity}</div><div class="k">Equity</div></div>`:''}`;
      $("dot0").className = "dot" + (s.actionsLeft>=1?" full":"");
      $("dot1").className = "dot" + (s.actionsLeft>=2?" full":"");
      $("endweek").disabled = revealing || journalRevealing;
      $("endweek").textContent = s.actionsLeft===0 ? "Next week →" : "End week →";
    }

    // ── sidebar (only chat characters, not founder) ───────
    function renderRail(){
      const convs = engine.conversations().filter(c => !c.isJournal);
      $("convs").innerHTML = convs.map(c=>{
        // Blue dot = unread only: thread has entries we haven't revealed/seen yet.
        // A chat you've read but not yet replied to (still hasAction) is not unread.
        const unread = shown[c.id] < engine.threads[c.id].length;
        const dot = unread ? '<span class="badge"></span>' : '';
        const st = styleFor(c.id);
        return `<div class="conv ${c.id===active?'active':''}" data-id="${c.id}">
          <div class="avatar" style="background:${st.color}">${st.initials}</div>
          <div class="conv-body">
            <div class="conv-top"><span class="conv-name">${c.name}</span>${dot}</div>
            <div class="conv-prev">${c.empty?'<i>no messages yet</i>':escapeHtml(c.preview)}</div>
          </div>
        </div>`;
      }).join("");
      [...document.querySelectorAll(".conv")].forEach(el=>{
        el.onclick = ()=>{ if(revealing) return; active = el.dataset.id; openConversation(); };
      });
    }

    // ── chat header ───────────────────────────────────────
    function renderHead(){
      const c = convFor(active);
      if (!c) return;
      const st = styleFor(active);
      $("chatHead").innerHTML =
        `<div class="avatar" style="background:${st.color}">${st.initials}</div>
         <div><div class="nm">${c.name}</div><div class="rl">${c.role}</div></div>`;
    }

    // ── build one message element ─────────────────────────
    function buildJournalEntry(e){
      if (e.type === "stamp"){
        const d = document.createElement("div");
        d.className = "journal-stamp " + (e.stampClass || "red");
        d.textContent = e.label; return d;
      }
      if (e.type === "reply"){
        const d = document.createElement("div");
        d.className = "journal-choice"; d.textContent = "✓ " + e.body; return d;
      }
      const wrap = document.createElement("div");
      if (e.type === "outcome" && e.sourceChar){
        const src = document.createElement("div");
        src.className = "journal-source"; src.textContent = "after talking with " + (e.from || e.sourceChar);
        wrap.appendChild(src);
      }
      const d = document.createElement("div");
      d.className = "journal-entry" + (e.type === "outcome" ? " is-outcome" : "");
      d.textContent = e.body;
      wrap.appendChild(d);
      if (e.cardId){ const tag = document.createElement("div"); tag.className="dbg-card"; tag.textContent=e.cardId; wrap.appendChild(tag); }
      // Inline action buttons for founder prompts that are still surfaced
      if (e.type === "incoming" && e.cardId && engine.isOpen(e.cardId)){
        const opts = engine.options(e.cardId);
        if (opts.length){
          const btns = document.createElement("div");
          btns.className = "journal-actions";
          btns.dataset.cardId = e.cardId;
          const spent = engine.actionsLeft <= 0;
          for (const o of opts){
            const b = document.createElement("button");
            b.className = "journal-btn" + (spent ? " spent" : "");
            b.textContent = o.label;
            b.dataset.card = e.cardId;
            b.dataset.key = o.key;
            b.onclick = ()=> doJournalAct(e.cardId, o.key, btns);
            btns.appendChild(b);
          }
          wrap.appendChild(btns);
        }
      }
      return wrap;
    }

    function doJournalAct(cardId, key, btnContainer){
      if (revealing || journalRevealing || engine.actionsLeft <= 0) return;
      const jBefore = engine.threads.founder.length;
      engine.act(cardId, key);
      // remove the buttons since the card was just answered
      if (btnContainer) btnContainer.remove();
      // reveal new journal entries (the reply + outcome)
      if (engine.threads.founder.length > jBefore){
        revealJournalFrom(jBefore);
      }
      renderStats(); renderComposer(); renderRail();
      // auto-advance if out of actions
      const checkAuto = setInterval(()=>{
        if (!journalRevealing){
          clearInterval(checkAuto);
          if (engine.actionsLeft <= 0 && !engine.stats().act1Complete){
            setTimeout(advanceWeek, 900);
          }
        }
      }, 120);
    }

    // After each action or week advance, update spent state on any remaining
    // inline journal buttons and remove buttons for cards no longer surfaced.
    function refreshJournalButtons(){
      const box = $("journalScroll");
      const groups = box.querySelectorAll(".journal-actions");
      for (const g of groups){
        const cid = g.dataset.cardId;
        if (!engine.isOpen(cid)){
          g.remove(); continue;
        }
        const spent = engine.actionsLeft <= 0;
        for (const b of g.querySelectorAll(".journal-btn")){
          b.className = "journal-btn" + (spent ? " spent" : "");
        }
      }
    }

    function buildChatEntry(e){
      if (e.type === "incoming"){
        const wrap = document.createElement("div");
        const row = document.createElement("div");
        row.className = "row in";
        row.innerHTML = `<div class="bubble">${escapeHtml(e.body)}</div>`;
        wrap.appendChild(row);
        if (e.subtext){
          const st = document.createElement("div");
          st.className="subtext"; st.textContent = e.subtext; wrap.appendChild(st);
        }
        if (e.cardId){ const tag = document.createElement("div"); tag.className="dbg-card"; tag.textContent=e.cardId; wrap.appendChild(tag); }
        return wrap;
      }
      if (e.type === "reply"){
        const d = document.createElement("div");
        d.className = "row out";
        d.innerHTML = `<div class="bubble">${escapeHtml(e.body)}</div>`;
        return d;
      }
      const d = document.createElement("div");
      d.className = "outcome";
      d.innerHTML = `<b>·</b> ${escapeHtml(e.body)}`;
      return d;
    }

    // ── journal panel (always visible, bottom) ────────────
    function journalDivider(box, e){
      if (e.week && e.week !== jLastWeek){
        const d = document.createElement("div");
        d.className = "journal-date";
        d.innerHTML = `<span class="num"><b>${e.week}</b><i>week</i></span>`;
        box.appendChild(d);
        jLastWeek = e.week;
      }
    }

    function renderJournalCatchup(){
      const box = $("journalScroll");
      const thread = engine.threads.founder;
      while (jShown < thread.length){
        const e = thread[jShown];
        journalDivider(box, e);
        const el = buildJournalEntry(e);
        el.style.animation = "none";
        box.appendChild(el);
        jShown++;
      }
    }

    function revealJournalFrom(from){
      const thread = engine.threads.founder;
      if (from >= thread.length){ jShown = thread.length; finishJournalReveal(); return; }
      journalRevealing = true; renderStats();
      const box = $("journalScroll");
      let i = from;
      const step = ()=>{
        if (i >= thread.length){ jShown = thread.length; finishJournalReveal(); return; }
        const e = thread[i];
        journalDivider(box, e);
        const delay = e.type === "stamp" ? 500 : 380;
        setTimeout(()=>{
          box.appendChild(buildJournalEntry(e));
          box.scrollTop = box.scrollHeight;
          i++; jShown = i; step();
        }, delay);
      };
      step();
    }

    function finishJournalReveal(){
      journalRevealing = false;
      renderStats(); renderComposer(); refreshJournalButtons();
      const s = engine.stats();
      if (s.act1Complete && !window.__act1shown){ window.__act1shown = true; setTimeout(showAct1, 500); }
    }

    // ── chat thread rendering ────────────────────────────
    function openConversation(){
      renderHead();
      const thread = engine.threads[active];
      const box = $("thread");
      box.innerHTML = "";
      box.className = "thread";
      let lastWeek = null;
      const upto = Math.max(shown[active], 0);
      thread.slice(0, upto).forEach(e=>{
        lastWeek = chatDivider(box, e, lastWeek);
        const el = buildChatEntry(e); el.style.animation = "none"; box.appendChild(el);
      });
      revealFrom(active, upto, lastWeek);
      renderRail(); renderStats(); renderComposer();
      scrollDown();
    }

    function chatDivider(box, e, lastWeek){
      if (e.week && e.week !== lastWeek){
        const d = document.createElement("div");
        d.className = "divider"; d.textContent = "Week " + e.week;
        d.style.animation = "none"; box.appendChild(d);
        return e.week;
      }
      return lastWeek;
    }

    function revealFrom(charId, from, lastWeek){
      const thread = engine.threads[charId];
      if (from >= thread.length){ shown[charId]=thread.length; finishReveal(); return; }
      revealing = true; renderStats();
      const box = $("thread");
      let i = from; let lw = lastWeek;
      const step = ()=>{
        if (charId !== active){ shown[charId]=thread.length; finishReveal(); return; }
        if (i >= thread.length){ shown[charId]=thread.length; finishReveal(); return; }
        const e = thread[i];
        lw = chatDivider(box, e, lw);
        const useTyping = e.type === "incoming";
        const delay = useTyping ? 620 : 90;
        if (useTyping){
          const t = document.createElement("div");
          t.className="row in"; t.innerHTML = `<div class="typing"><i></i><i></i><i></i></div>`;
          box.appendChild(t); scrollDown();
          setTimeout(()=>{ t.remove(); box.appendChild(buildChatEntry(e)); scrollDown(); i++; shown[charId]=i; step(); }, delay);
        } else {
          setTimeout(()=>{ box.appendChild(buildChatEntry(e)); scrollDown(); i++; shown[charId]=i; step(); }, delay);
        }
      };
      step();
    }

    function finishReveal(){
      revealing = false;
      renderRail(); renderStats(); renderComposer(); refreshJournalButtons();
    }

    // ── composer (only for chat characters now) ──────────
    function renderComposer(){
      const c = $("composer");
      const s = engine.stats();
      const cardId = engine.openCardId(active);

      if (revealing){ c.className="composer"; c.innerHTML = `<div class="empty-state">…</div>`; return; }

      if (!cardId){
        c.className="composer";
        const chatConvs = engine.conversations().filter(x => !x.isJournal);
        const anyOpen = chatConvs.some(x=>x.hasAction);
        c.innerHTML = `<div class="empty-state">${
          anyOpen ? 'Nothing to answer here right now.'
                  : "You're caught up." + (s.actionsLeft>0?' <span class="go" id="goNext">End the week →</span>':'')
        }</div>`;
        const g = $("goNext"); if (g) g.onclick = advanceWeek;
        return;
      }

      const opts = engine.options(cardId);
      const spent = s.actionsLeft <= 0;
      c.className = "composer" + (spent?" spent":"");
      c.innerHTML =
        `<div class="prompt-label">Suggested replies · ${s.actionsLeft} action${s.actionsLeft===1?'':'s'} left</div>
         <div class="chips">${opts.map(o=>
            `<button class="chip" data-card="${cardId}" data-key="${o.key}">${escapeHtml(o.label)}</button>`
          ).join("")}</div>`;
      [...c.querySelectorAll(".chip")].forEach(btn=>{
        btn.onclick = ()=> doAct(btn.dataset.card, btn.dataset.key);
      });
    }

    // ── actions ───────────────────────────────────────────
    function doAct(cardId, key){
      if (revealing || journalRevealing || engine.stats().actionsLeft<=0) return;
      const jBefore = engine.threads.founder.length;
      const chatBefore = engine.threads[active] ? engine.threads[active].length : 0;
      engine.act(cardId, key);

      // reveal new entries in the active chat thread (reply bubble)
      if (active !== "founder" && engine.threads[active].length > chatBefore){
        const lastWeek = engine.threads[active][chatBefore-1]?.week ?? engine.stats().week;
        revealFrom(active, chatBefore, lastWeek);
      }

      // reveal new entries in the journal panel
      if (engine.threads.founder.length > jBefore){
        revealJournalFrom(jBefore);
      }

      // after both reveals finish, auto-advance if out of actions
      const checkAuto = setInterval(()=>{
        if (!revealing && !journalRevealing){
          clearInterval(checkAuto);
          renderComposer();
          if (engine.stats().actionsLeft<=0 && !engine.stats().act1Complete){
            setTimeout(advanceWeek, 900);
          }
        }
      }, 120);
    }

    function advanceWeek(){
      if (revealing || journalRevealing || runwayAnim) return;

      const cashBefore = engine.stats().cash;
      engine.nextWeek();
      const cashAfter = engine.stats().cash;

      // The felt beat: a week passing = a notch of runway spent. Freeze the
      // gauge at last week's value, then watch the cash/weeks-left drain before
      // any new messages arrive.
      revealing = true;
      runwayAnim = true;
      setRunway(cashBefore);
      renderStats();   // week label, dots, stat chips (gauge frozen by runwayAnim)

      animateRunway(cashBefore, cashAfter, () => {
        revealing = false;
        const convs = engine.conversations().filter(c => !c.isJournal);
        const withAction = convs.find(c=>c.hasAction) || convs[0];
        active = withAction ? withAction.id : active;
        openConversation();
        const jBefore = jShown;
        if (engine.threads.founder.length > jBefore){
          revealJournalFrom(jBefore);
        }
        if (engine.stats().gameOver) setTimeout(showGameOver, 700);
      });
    }

    // ── modals ────────────────────────────────────────────
    function showAct1(){
      const s = engine.stats();
      const split = s.equity || "your split";
      $("modal").innerHTML =
        `<div class="em">🤝</div><h3>Equity, signed.</h3>
         <p>The founder agreement is locked in at <span class="split">${split}</span>.
            The hard conversations are behind you — for now. The real building starts here.</p>
         <p style="font-size:12.5px">This is the end of the current slice. More of the story is coming.</p>
         <button id="closeModal">Keep going</button>`;
      $("overlay").classList.add("show");
      $("closeModal").onclick = ()=> $("overlay").classList.remove("show");
    }
    function showGameOver(){
      $("modal").innerHTML =
        `<div class="em">💸</div><h3>Out of runway.</h3>
         <p>The cash hit zero on week ${engine.stats().week}. Every founder runs this race against the bank balance.</p>
         <button id="closeModal">Refresh to retry</button>`;
      $("overlay").classList.add("show");
      $("closeModal").onclick = ()=> location.reload();
    }

    // ── utils ─────────────────────────────────────────────
    function scrollDown(){ const t=$("thread"); t.scrollTop = t.scrollHeight; }
    function escapeHtml(str){ return (str||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }

    $("endweek").onclick = ()=> advanceWeek();

    // boot
    renderJournalCatchup();
    openConversation();
  })();
  </script>
</body>
</html>
