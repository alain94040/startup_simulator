<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlusOne</title>
<style>
  /* ── tokens ─────────────────────────────────────────────────────────────── */
  :root {
    --bg: #f2f2f5; --panel: #fff; --line: #e2e2e7; --soft: #f0f0f4; --gutter: #e5e5eb;
    --card-shadow: 0 1px 2px rgba(20,20,40,.05), 0 6px 20px rgba(20,20,40,.06);
    --ink: #17171a; --dim: #8b8b92; --blue: #2f6bff; --blue-soft: #eaf1ff;
    --amber: #f59e0b; --amber-ink: #9a4b00; --red: #d64545; --green: #34a853;
    --journal: #8a4b38; --journal-bg: #fdf9ee; --journal-line: #eee3c2;
    --hand: "Segoe Print", "Bradley Hand", "Chalkboard SE", "Comic Sans MS", cursive;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  button { font: inherit; cursor: pointer; }
  button:disabled { cursor: default; opacity: .55; }

  /* ── header ─────────────────────────────────────────────────────────────── */
  header {
    flex: none; display: flex; align-items: center; gap: 18px;
    background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 16px;
    position: relative; z-index: 20; box-shadow: 0 1px 4px rgba(20,20,40,.05);
  }
  .logo { font-weight: 700; font-size: 15px; }
  .logo small { color: var(--dim); font-weight: 500; margin-left: 6px; }
  nav.surfaces { display: flex; gap: 4px; }
  nav.surfaces button { border: 0; background: none; color: #6b6b74; border-radius: 8px; padding: 6px 12px; font-weight: 500; }
  nav.surfaces button.cur { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
  .n-badge { display: inline-block; min-width: 15px; text-align: center; background: #ff4d4d; color: #fff; border-radius: 8px; font-size: 10px; margin-left: 4px; padding: 0 3px; vertical-align: 1px; }
  .gauge { display: flex; flex-direction: column; gap: 2px; min-width: 118px; font-size: 12.5px; }
  .gauge .g-lbl { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
  .gauge .g-val { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .gauge .g-bar { height: 5px; background: var(--soft); border-radius: 3px; overflow: hidden; }
  .gauge .g-bar i { display: block; height: 100%; transition: width .6s ease; }
  .gauge.todo { cursor: pointer; border-radius: 8px; padding: 2px 6px; margin: -2px -6px; }
  .gauge.todo:hover { background: var(--blue-soft); }
  .gauge.clickable { cursor: pointer; border-radius: 8px; padding: 2px 6px; margin: -2px -6px; }
  .gauge.clickable:hover, .gauge.clickable.cur { background: var(--blue-soft); }
  .hdr-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .dots { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--dim); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--blue); transition: background .3s; }
  .dot.spent { background: #d7d7de; }
  .free-note { font-size: 11px; color: var(--amber-ink); font-weight: 600; }
  #endWeek { background: var(--blue); color: #fff; border: 0; border-radius: 8px; padding: 7px 15px; font-weight: 600; }

  /* ── layout ─────────────────────────────────────────────────────────────── */
  main { flex: 1; display: flex; min-height: 0; padding: 10px; gap: 10px; background: var(--gutter); }
  .surface { flex: 1; display: none; min-width: 0; }
  .surface.cur { display: flex; gap: 10px; }

  /* Messages: rail | thread — floating cards on the gutter */
  #rail { width: 250px; flex: none; background: var(--panel); overflow: hidden auto; border-radius: 14px; box-shadow: var(--card-shadow); }
  .conv { display: flex; gap: 8px; padding: 9px 12px 9px 8px; border-bottom: 1px solid var(--soft); align-items: center; cursor: pointer; }
  .conv:hover { background: #fafafc; }
  .conv.cur { background: var(--blue-soft); }
  /* iMessage-style unread dot: a blue dot on the left, blank gutter when read */
  .conv .unread-dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: transparent; }
  .conv.unread .unread-dot { background: var(--blue); }
  /* In a scene, an unread thread is the only cue that someone else texted back
     while you were mid-conversation — pulse it so it can't be missed. */
  @keyframes dotPulse { 0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(47,107,255,.5); } 50% { transform: scale(1.35); box-shadow: 0 0 0 4px rgba(47,107,255,0); } }
  #scRail .conv.unread .unread-dot { animation: dotPulse 1.1s ease-in-out infinite; }
  .av { width: 34px; height: 34px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; flex: none; }
  .conv .who { min-width: 0; flex: 1; }
  .conv .who b { font-size: 13px; font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv.unread .who b { font-weight: 700; }
  .conv .who span { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .conv.unread .who span { color: #55555c; }
  .tag { font-size: 8.5px; letter-spacing: .05em; border-radius: 4px; padding: 1px 5px; font-weight: 700; white-space: nowrap; }
  .tag.call { background: #ffe2c2; color: var(--amber-ink); }
  .tag.expiring { background: #ffd9d9; color: #a02020; }
  .tag.unread { background: var(--blue); color: #fff; border-radius: 8px; min-width: 15px; text-align: center; }

  #threadCol { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); border-radius: 14px; box-shadow: var(--card-shadow); overflow: hidden; }
  #chatHead { flex: none; padding: 9px 20px; background: var(--panel); border-bottom: 1px solid var(--line); font-size: 13px; }
  #chatHead b { font-size: 14px; }
  #chatHead span { color: var(--dim); margin-left: 8px; }
  #thread { flex: 1; overflow-y: auto; padding: 16px 22px; display: flex; flex-direction: column; gap: 7px; }
  /* bottom-align a short thread so bubbles hug the composer instead of leaving a void */
  #thread > :first-child { margin-top: auto; }
  .m-in, .m-out { position: relative; max-width: 64%; padding: 8px 13px; border-radius: 18px; font-size: 13.5px; line-height: 1.45; white-space: pre-wrap; }
  .m-in { background: #fff; box-shadow: 0 1px 1px rgba(20,20,40,.07); align-self: flex-start; }
  .m-out { background: var(--blue); color: #fff; align-self: flex-end; }
  /* iMessage tails — only on the last bubble of a group */
  .m-in.tail { border-bottom-left-radius: 6px; }
  .m-in.tail::after { content: ""; position: absolute; left: -6px; bottom: 0; width: 12px; height: 17px; background: #fff; border-bottom-right-radius: 14px 15px; }
  .m-in.tail::before { content: ""; position: absolute; left: -12px; bottom: 0; width: 12px; height: 17px; background: var(--bg); border-bottom-right-radius: 10px; z-index: 1; }
  .m-out.tail { border-bottom-right-radius: 6px; }
  .m-out.tail::after { content: ""; position: absolute; right: -6px; bottom: 0; width: 12px; height: 17px; background: var(--blue); border-bottom-left-radius: 14px 15px; }
  .m-out.tail::before { content: ""; position: absolute; right: -12px; bottom: 0; width: 12px; height: 17px; background: var(--bg); border-bottom-left-radius: 10px; z-index: 1; }
  .m-in.dropped { opacity: .7; }
  /* An aside, not a text: a short founder note pinned to the moment it
     belongs to. Distinct from m-in/m-out on purpose — parchment tint and
     handwritten font borrow the journal's voice so it never reads as a
     bubble somebody sent. Opt-in only (effects.note) and rare by design. */
  .m-note {
    align-self: center; max-width: 78%; background: var(--journal-bg); border: 1px solid var(--journal-line);
    border-radius: 10px; padding: 7px 12px; font: 13px var(--hand); color: #6b6045;
  }
  .msg-new { animation: msgpop .32s cubic-bezier(.2,.9,.35,1.15); }
  @keyframes msgpop { from { opacity: 0; transform: translateY(9px) scale(.96); } }
  @media (prefers-reduced-motion: reduce) { .msg-new, .notif, .lc-line, .j-entry.arrive, .stat.changed, #scRail .conv.unread .unread-dot { animation: none !important; transition: none !important; } }
  .m-wk { text-align: center; font-size: 10.5px; color: #9a9aa2; margin: 8px 0 2px; }
  .m-sub { font-size: 11px; color: var(--dim); margin: -3px 0 0 6px; align-self: flex-start; }
  #reply { flex: none; border-top: 1px solid var(--line); background: var(--panel); padding: 10px 22px 12px; }
  #reply .hint { font-size: 11px; color: var(--dim); margin-bottom: 4px; }
  .chip { display: block; width: 100%; text-align: left; border: 1.5px solid var(--blue); color: var(--blue); background: var(--panel); border-radius: 18px; padding: 8px 14px; font-size: 13px; margin-top: 6px; }
  .chip:hover:not(:disabled) { background: var(--blue-soft); }
  .chip.gated { border-style: dashed; border-color: #b8860b; color: #96700a; }

  /* right column: triage + journal mirror */
  #sideCol { width: 312px; flex: none; background: var(--panel); overflow: hidden auto; padding: 12px 14px; font-size: 12.5px; border-radius: 14px; box-shadow: var(--card-shadow); }
  .tier h5 { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--amber-ink); margin: 10px 0 6px; }
  .tier.later h5 { color: var(--dim); }
  .h-card { border: 1px solid #e6e6ea; border-left: 3px solid var(--amber); border-radius: 8px; padding: 7px 10px; margin-bottom: 6px; background: #fffdf8; }
  .h-card.link { cursor: pointer; }
  .h-card.link:hover { border-color: var(--blue); }
  .tier.later .h-card { border-left-color: #d7d7de; background: var(--panel); }
  .h-card.move { border-left-color: var(--journal); background: #fbf7f2; }
  .h-card b { font-size: 12px; display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
  .h-card b .go { color: var(--blue); font-weight: 500; font-size: 10.5px; white-space: nowrap; }
  .h-card b .left { color: #a02020; font-style: normal; font-size: 10px; font-weight: 600; white-space: nowrap; }
  .h-card > span { color: #6b6b74; font-size: 11.5px; display: block; }
  .h-card .mv-opts { display: flex; flex-direction: column; gap: 4px; margin-top: 7px; }
  .h-card .mv-opts button { text-align: left; border: 1.5px solid var(--blue); color: var(--blue); background: var(--panel); border-radius: 13px; padding: 5px 11px; font-size: 12px; }
  .h-card .mv-opts button.gated { border-style: dashed; border-color: #b8860b; color: #96700a; }
  .empty-tier { color: var(--dim); font-size: 11.5px; font-style: italic; }
  /* the founder's journal — a lined-paper artifact, not a plain text list */
  #journalSec {
    margin: 14px -14px -12px; padding: 12px 16px 20px 22px; position: relative;
    background: var(--journal-bg);
    box-shadow: inset 0 1px 0 #fff, inset 0 8px 10px -10px rgba(120,80,40,.14);
    border-top: 1px solid var(--journal-line);
  }
  #journalSec::before { /* notebook left margin rule */
    content: ""; position: absolute; left: 13px; top: 0; bottom: 0; width: 1px; background: rgba(190,86,60,.28);
  }
  #journalSec h5 { color: var(--journal); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; }
  .j-entry { font-family: var(--hand); font-size: 13.5px; color: #4a443c; line-height: 1.55; padding: 7px 0; margin: 0; border-bottom: 1px solid var(--journal-line); }
  .j-entry:last-child { border-bottom: 0; }
  .j-entry .j-wk { font-weight: 700; color: var(--journal); font-family: -apple-system, system-ui, sans-serif; font-size: 10.5px; }
  .j-entry.old { color: #94836f; }
  .stamp { display: inline-block; border: 2px solid; border-radius: 4px; padding: 0 7px; font: 700 9.5px -apple-system, sans-serif; letter-spacing: .08em; text-transform: uppercase; transform: rotate(-1.5deg); }
  .stamp.green { color: #1d8f3c; border-color: #1d8f3c; }
  .stamp.blue { color: #2456c4; border-color: #2456c4; }
  .stamp.red { color: #c0392b; border-color: #c0392b; }

  /* ── News Feed surface ──────────────────────────────────────────────────── */
  #feedSurface { flex-direction: column; align-items: center; overflow: hidden auto; padding: 16px 0 30px; gap: 12px; background: #ececf0; border-radius: 14px; box-shadow: var(--card-shadow); }
  .f-item { width: min(640px, 92%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: none; }
  .f-item.expired { opacity: .62; }
  .f-src { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 7px 14px; }
  .f-body { padding: 4px 14px 10px; font-size: 13.5px; line-height: 1.45; white-space: pre-wrap; }
  .f-act { display: flex; gap: 8px; padding: 0 14px 12px; flex-wrap: wrap; }
  .f-btn { border: 1.5px solid var(--blue); color: var(--blue); background: var(--panel); border-radius: 14px; padding: 5px 12px; font-size: 12px; }
  .f-done { padding: 0 14px 10px; font-size: 11.5px; color: var(--dim); font-style: italic; }
  .f-hn .f-src { background: #ff6600; color: #fff; }
  .f-tc .f-src { background: #0a9928; color: #fff; }
  .f-tw .f-src { color: #536471; border-bottom: 1px solid #eff3f4; }
  .f-expiry { margin-left: auto; font-size: 10px; color: #ffe9e9; font-weight: 600; }
  .f-tw .f-expiry { color: #a02020; }
  .f-wk { width: min(640px, 92%); font-size: 10.5px; color: #9a9aa2; text-align: center; flex: none; }

  /* ── Bank surface ───────────────────────────────────────────────────────── */
  #bankSurface { flex-direction: column; align-items: center; overflow: hidden auto; padding: 18px 0 30px; gap: 12px; background: var(--panel); border-radius: 14px; box-shadow: var(--card-shadow); }
  .stmt { width: min(560px, 92%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; flex: none; }
  .stmt h4 { font-size: 12px; color: var(--dim); display: flex; justify-content: space-between; margin-bottom: 6px; }
  .stmt h4 b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .tx { display: flex; justify-content: space-between; font-size: 12.5px; padding: 3px 0; border-bottom: 1px dashed var(--soft); }
  .tx .amt { font-variant-numeric: tabular-nums; font-weight: 600; }
  .tx .amt.pos { color: var(--green); }
  .tx .amt.neg { color: var(--red); }
  .tx .n { color: var(--dim); font-size: 11px; margin-left: 6px; }

  /* ── to-do popover ──────────────────────────────────────────────────────── */
  #todoPop {
    position: absolute; top: 52px; left: 50%; transform: translateX(-50%); z-index: 30;
    width: 470px; background: var(--panel); border: 1px solid #dcdce2; border-radius: 14px;
    box-shadow: 0 18px 50px rgba(20,20,40,.22); padding: 14px 16px; display: none;
  }
  #todoPop.on { display: block; }
  .td-stages { display: flex; gap: 4px; margin-bottom: 10px; font-size: 10.5px; flex-wrap: wrap; }
  .td-stages span { border-radius: 999px; padding: 3px 9px; background: var(--soft); color: var(--dim); white-space: nowrap; }
  .td-stages .done { color: #1d8f3c; background: #e9f6ec; }
  .td-stages .cur { background: var(--ink); color: #fff; font-weight: 600; }
  .td-goal { font-size: 12.5px; font-style: italic; color: var(--dim); padding: 2px 2px 8px; border-bottom: 1px solid var(--soft); }
  .td-row { display: flex; align-items: baseline; gap: 10px; padding: 6px 2px; border-bottom: 1px solid var(--soft); font-size: 13px; }
  .td-box { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #c9c9d0; flex: none; position: relative; top: 2px; }
  .td-row.done .td-box { background: #1d8f3c; border-color: #1d8f3c; }
  .td-row.done .td-box::after { content: "✓"; color: #fff; font-size: 10px; position: absolute; left: 3.5px; top: -2px; }
  .td-row.done .td-main { text-decoration: line-through; color: #9a9aa2; }
  .td-main { flex: 1; }
  .td-note { display: block; font-size: 10.5px; color: var(--dim); text-decoration: none !important; }
  .td-foot { font-size: 11px; color: var(--dim); margin-top: 8px; }

  /* ── focus arc: the room, as private iMessage threads ───────────────────────
     A scene is the regular chat UI with the rest of the app blocked out: a rail
     of just the people in the room, and one private thread per person. */
  #scene {
    position: fixed; inset: 0; background: var(--gutter); z-index: 50;
    display: none; flex-direction: column;
  }
  #scene.on { display: flex; animation: fadein .4s ease; }
  @keyframes fadein { from { opacity: 0; } }
  .sc-head { flex: none; text-align: center; padding: 11px 20px 9px; background: var(--panel); border-bottom: 1px solid var(--line); box-shadow: 0 1px 4px rgba(20,20,40,.05); position: relative; z-index: 2; }
  .sc-head .sc-title { font-size: 16px; font-weight: 700; }
  .sc-head .sc-sub { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .sc-head .sc-focusnote { font-size: 10.5px; color: var(--amber-ink); font-weight: 600; margin-top: 5px; letter-spacing: .02em; }
  .sc-body { flex: 1; display: flex; min-height: 0; padding: 10px; gap: 10px; background: var(--gutter); }
  #scRail { width: 250px; flex: none; background: var(--panel); overflow: hidden auto; border-radius: 14px; box-shadow: var(--card-shadow); }
  .sc-threadcol { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); border-radius: 14px; box-shadow: var(--card-shadow); overflow: hidden; }
  #scChatHead { flex: none; padding: 9px 20px; background: var(--panel); border-bottom: 1px solid var(--line); font-size: 13px; }
  #scChatHead b { font-size: 14px; }
  #scChatHead span { color: var(--dim); margin-left: 8px; }
  #scThread { flex: 1; overflow-y: auto; padding: 16px 22px; display: flex; flex-direction: column; gap: 7px; }
  #scThread > :first-child { margin-top: auto; }
  #scReply { flex: none; border-top: 1px solid var(--line); background: var(--panel); padding: 10px 22px 12px; }
  #scReply .who-asks { font-size: 11px; color: var(--dim); margin-bottom: 2px; }
  #scReply .who-asks .free { color: var(--amber-ink); font-weight: 600; }
  #scDone { display: block; width: 100%; background: var(--blue); color: #fff; border: 0; border-radius: 10px; padding: 9px 0; font-weight: 600; margin-top: 2px; }

  /* ── launch day: a cinematic dark stage where the day passes overhead ────────
     The whole scene goes dark and the sky walks the time of day; a giant clock
     ticks the hours forward and a timeline shows how much daylight is left. The
     chat becomes glowing glass panels floating on the stage — phones lit up in a
     long, stressful war-room day. */
  #scene.launch { color: #eaeaf0; }
  #scene.launch .sc-head { background: rgba(8,10,18,.34); border-bottom-color: rgba(255,255,255,.09); box-shadow: none; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); padding: 15px 20px 14px; }
  #scene.launch .sc-body { background: transparent; justify-content: center; }
  .launch-hero { display: flex; flex-direction: column; align-items: center; gap: 11px; }
  .launch-clock { font: 800 clamp(40px, 7vw, 66px) ui-monospace, Menlo, monospace; letter-spacing: .05em; line-height: 1; color: #ffd76a; text-shadow: 0 0 26px rgba(255,193,78,.55), 0 0 66px rgba(255,150,20,.28); font-variant-numeric: tabular-nums; transition: text-shadow .2s; min-width: 3.2em; text-align: center; }
  .launch-clock.counting { color: #ffe49a; text-shadow: 0 0 34px rgba(255,214,110,.9), 0 0 80px rgba(255,150,20,.5); }
  .launch-titleline { font-size: 12.5px; color: rgba(255,255,255,.62); letter-spacing: .01em; text-align: center; }
  /* glass chat on the dark stage */
  #scene.launch #scRail, #scene.launch .sc-threadcol { background: rgba(18,20,30,.5); box-shadow: 0 12px 48px rgba(0,0,0,.45); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  #scene.launch .sc-threadcol { flex: 0 1 640px; max-width: 640px; }
  #scene.launch #scChatHead { background: rgba(255,255,255,.05); border-bottom-color: rgba(255,255,255,.08); color: #eef; }
  #scene.launch #scChatHead span { color: rgba(255,255,255,.5); }
  #scene.launch #scRail .conv { border-bottom-color: rgba(255,255,255,.06); }
  #scene.launch #scRail .conv.cur { background: rgba(255,255,255,.09); }
  #scene.launch #scRail .conv:hover { background: rgba(255,255,255,.05); }
  #scene.launch #scRail .conv .who b { color: #eef; }
  #scene.launch #scRail .conv .who span { color: rgba(255,255,255,.45); }
  #scene.launch #scThread { background: transparent; }
  #scene.launch .m-in { background: rgba(46,48,60,.94); color: #e9e9f0; box-shadow: none; }
  #scene.launch .m-out { background: var(--blue); }
  #scene.launch .m-in.tail::after, #scene.launch .m-in.tail::before,
  #scene.launch .m-out.tail::after, #scene.launch .m-out.tail::before { display: none; }
  #scene.launch .typing { background: rgba(46,48,60,.94); box-shadow: none; }
  #scene.launch #scReply { background: rgba(8,10,18,.5); border-top-color: rgba(255,255,255,.08); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  #scene.launch #scReply .who-asks { color: rgba(255,255,255,.55); }
  #scene.launch #scReply .who-asks .free { color: #ffd76a; }
  #scene.launch .chip { background: rgba(20,22,32,.66); border-color: rgba(120,160,255,.6); color: #c3d4ff; }
  #scene.launch .chip:hover:not(:disabled) { background: rgba(47,107,255,.26); }
  #scene.launch .chip.gated { border-color: #d8a83a; color: #ffd98a; }
  #scene.launch .m-wk { color: rgba(255,255,255,.4); }

  /* ── recap / endgame / intro overlays ───────────────────────────────────── */
  .overlay { position: fixed; inset: 0; background: rgba(12,12,18,.5); z-index: 60; display: none; align-items: center; justify-content: center; }
  .overlay.on { display: flex; }
  .modal { background: var(--panel); border-radius: 16px; padding: 22px 26px; width: min(520px, 92%); max-height: 84vh; overflow-y: auto; box-shadow: 0 24px 70px rgba(10,10,20,.35); }
  .modal h2 { font-size: 18px; margin-bottom: 4px; }
  .modal .sub { color: var(--dim); font-size: 12.5px; margin-bottom: 14px; }
  .modal .ok { margin-top: 14px; width: 100%; background: var(--blue); color: #fff; border: 0; border-radius: 10px; padding: 9px 0; font-weight: 600; }
  /* the founder's own beats in a scene are a private decision, not a chat with
     yourself — surfaced as a centered card over the room instead of a "You" thread. */
  #scSelfOv { z-index: 62; }
  #scSelfModal { width: min(460px, 92%); }
  .ss-tag { display: inline-block; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--blue); background: var(--blue-soft); border-radius: 999px; padding: 3px 11px; margin-bottom: 11px; }
  .ss-body { font-size: 14px; line-height: 1.5; color: var(--ink); white-space: pre-wrap; }
  .ss-sub { font-size: 12px; color: var(--dim); margin-top: 7px; }
  .ss-choices { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  .ss-choices .chip { margin-top: 0; }
  #endOv { background: rgba(10,10,18,.66); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .eg-emoji { font-size: 38px; text-align: center; line-height: 1; margin-bottom: 6px; }
  .eg-title { text-align: center; }
  .eg-sub { text-align: center; }
  .eg-rollup { display: flex; gap: 13px; align-items: center; background: var(--soft); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .eg-biggrade { flex: none; width: 46px; height: 46px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 24px; color: #fff; top: 0; }
  .eg-roll-copy { font-size: 12px; color: #55555c; line-height: 1.45; }
  .grade-row { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--soft); font-size: 13px; }
  .grade { flex: none; width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; color: #fff; position: relative; top: 4px; }
  .grade-row .g-body { flex: 1; }
  .grade-row .g-verdict { color: #55555c; font-size: 12px; }
  .grade-row .g-ref { color: var(--dim); font-size: 10.5px; }
  /* cinematic report-card reveal */
  .eg-cardhead { text-align: center; margin-bottom: 14px; }
  .eg-eyebrow { font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); margin-bottom: 6px; }
  .eg-headline { font-size: 18px; font-weight: 800; color: var(--ink); }
  .eg-reveal { opacity: 0; transform: translateY(9px); transition: opacity .55s ease, transform .55s ease; }
  .eg-reveal.in { opacity: 1; transform: none; }
  .grade .gl { transition: opacity .2s ease; }
  .grade.pending { background: var(--line) !important; animation: gradePulse 1.1s ease-in-out infinite; }
  .grade.pending .gl { opacity: 0; }
  .grade.pop { animation: gradePop .44s cubic-bezier(.2,.9,.3,1.35); }
  @keyframes gradePulse { 0%,100% { opacity: .45; } 50% { opacity: .85; } }
  @keyframes gradePop { 0% { transform: scale(.35); } 55% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .eg-final { margin-top: 12px; margin-bottom: 0; }
  .eg-final .eg-roll-copy b { color: var(--ink); font-size: 13px; }
  .eg-outcome { text-align: center; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--soft); }
  .eg-batch { display: inline-block; margin-top: 10px; padding: 6px 14px; border-radius: 999px; background: linear-gradient(90deg, var(--blue), #8b5cf6); color: #fff; font-weight: 700; font-size: 12px; letter-spacing: .02em; }
  .eg-skiphint { text-align: center; font-size: 11px; color: var(--dim); margin-top: 12px; transition: opacity .3s; }
  /* ── leaderboard (endgame + intro) ──────────────────────────────────────── */
  .lb { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--soft); }
  .lb-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .lb-title { font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
  .lb-scope { font-size: 10px; color: var(--dim); }
  .lb-scope.offline { color: #c9922a; }
  .lb-list { display: flex; flex-direction: column; }
  .lb-row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; font-size: 13px; }
  .lb-row + .lb-row { border-top: 1px solid var(--soft); }
  .lb-row.me { background: var(--blue-soft); border-top-color: transparent; }
  .lb-rank { flex: none; width: 24px; text-align: right; font-weight: 800; color: var(--dim); font-variant-numeric: tabular-nums; }
  .lb-row.me .lb-rank { color: var(--blue); }
  .lb-name { flex: 1; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-medal { font-weight: 600; }
  .lb-tag { font-size: 10px; color: var(--dim); font-weight: 500; }
  .lb-score { flex: none; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
  .lb-empty { font-size: 12.5px; color: var(--dim); text-align: center; padding: 10px 0; }
  .lb-loading { font-size: 12px; color: var(--dim); text-align: center; padding: 12px 0; }
  /* name-entry card when the player cracks the top 50 */
  .lb-entry { margin-top: 18px; padding: 16px; border-radius: 12px; background: var(--blue-soft); text-align: center; }
  .lb-entry b { display: block; font-size: 15px; color: var(--ink); margin-bottom: 3px; }
  .lb-entry .lb-entry-sub { font-size: 12px; color: #55555c; margin-bottom: 12px; }
  .lb-entry-form { display: flex; gap: 8px; }
  .lb-entry input { flex: 1; border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px; font: inherit; font-size: 14px; background: #fff; color: var(--ink); }
  .lb-entry input:focus { outline: 2px solid var(--blue); outline-offset: -1px; }
  .lb-entry button { flex: none; background: var(--blue); color: #fff; border: 0; border-radius: 9px; padding: 0 18px; font-weight: 700; font-size: 13px; cursor: pointer; }
  .lb-entry button:disabled { opacity: .5; cursor: default; }
  /* intro leaderboard panel reuses the intro chrome */
  .intro-board { padding: 22px 28px 12px; }
  .intro-board .lb { margin-top: 12px; border-top: 0; padding-top: 0; }
  #introModal { padding: 0; overflow: hidden; }
  .intro-stripe { height: 5px; background: linear-gradient(90deg, var(--blue), #8b5cf6, #ff6482); }
  .intro-body { padding: 24px 28px 20px; }
  .intro-eyebrow { font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); margin-bottom: 9px; }
  .intro-step { font-size: 14px; line-height: 1.6; color: #55555c; }
  .intro-step b { display: block; font-size: 21px; font-weight: 800; line-height: 1.2; margin-bottom: 10px; color: var(--ink); }
  .intro-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 22px; }
  .intro-dots { display: flex; gap: 6px; align-items: center; }
  .intro-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); transition: .2s; }
  .intro-dots i.on { background: var(--blue); transform: scale(1.3); }
  .intro-actions { display: flex; align-items: center; gap: 14px; }
  .intro-skip { border: 0; background: none; color: var(--dim); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0; }
  .intro-skip:hover { color: #55555c; }
  .intro-next { border: 0; background: var(--ink); color: #fff; font-weight: 700; font-size: 13px; border-radius: 10px; padding: 10px 22px; cursor: pointer; transition: transform .1s; }
  .intro-next:hover { opacity: .9; }
  .intro-next:active { transform: scale(.97); }

  /* ── iPhone-style notifications, anchored under the bell ────────────────── */
  #notifs { position: fixed; top: 56px; right: 18px; z-index: 45; width: 330px; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  .notif {
    pointer-events: auto; display: flex; gap: 11px; align-items: flex-start; cursor: pointer;
    background: rgba(255,255,255,.93); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: 16px; padding: 11px 13px;
    box-shadow: 0 10px 34px rgba(0,0,0,.2); transition: transform .12s;
    animation: noteIn .34s cubic-bezier(.2,.9,.3,1) both;
  }
  .notif:hover { transform: translateY(-1px); }
  .notif.hide { animation: noteOut .13s ease forwards; }
  @keyframes noteIn { from { opacity: 0; transform: translateX(34px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes noteOut { to { opacity: 0; transform: translateX(34px); } }
  .notif .n-ico { width: 34px; height: 34px; border-radius: 9px; color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; flex: none; }
  .notif .n-b { flex: 1; min-width: 0; }
  .notif .n-title { font-size: 12.5px; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
  .notif .n-time { color: #8b8b92; font-weight: 400; font-size: 10.5px; white-space: nowrap; }
  .notif .n-text { font-size: 12px; color: #3a3a40; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .bell { position: relative; border: 1px solid var(--line); background: var(--soft); width: 34px; height: 34px; border-radius: 10px; cursor: pointer; font-size: 15px; display: grid; place-items: center; transition: .13s; }
  .bell:hover { background: #e8eaef; transform: translateY(-1px); }
  .hdr-btn { border: 1px solid var(--line); background: var(--soft); border-radius: 10px; height: 34px; padding: 0 12px; font-size: 12.5px; font-weight: 600; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; transition: .13s; white-space: nowrap; }
  .hdr-btn:hover { background: #e8eaef; transform: translateY(-1px); }
  .hdr-btn.icon { width: 34px; padding: 0; justify-content: center; font-size: 15px; }
  .bell-badge { position: absolute; top: -6px; right: -6px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: #ff3b30; color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--panel); }
  #noteCenter { position: fixed; top: 56px; right: 18px; z-index: 46; width: 330px; max-height: 64vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 18px 50px rgba(0,0,0,.24); padding: 8px; display: none; }
  #noteCenter.show { display: block; animation: noteIn .24s ease both; }
  #noteCenter h4 { margin: 6px 9px; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); }
  .nc-item { display: flex; gap: 10px; align-items: flex-start; padding: 9px; border-radius: 12px; cursor: pointer; }
  .nc-item:hover { background: var(--soft); }
  .nc-empty { padding: 16px 10px; color: var(--dim); font-size: 13px; text-align: center; }

  /* ── focus-arc cinematic: staged lines, per-arc accent ──────────────────── */
  #cine {
    position: fixed; inset: 0; z-index: 72; background: #000;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 1.2s ease;
  }
  #cine.show { opacity: 1; pointer-events: all; }
  .lc-inner { text-align: center; max-width: 480px; padding: 0 32px; }
  .lc-line { font-family: Georgia, serif; font-size: 26px; color: rgba(255,255,255,0); letter-spacing: .04em; line-height: 2.1; transition: color 1.1s ease; }
  .lc-line.vis { color: rgba(255,255,255,.88); }
  .lc-line.lc-title { font-weight: 700; letter-spacing: .06em; }
  .lc-line.lc-title.vis { color: var(--lc-accent, rgba(255,255,255,.95)); }
  .lc-skip { position: absolute; bottom: 36px; right: 40px; color: rgba(255,255,255,.28); font-size: 11px; cursor: pointer; letter-spacing: .08em; }
  @keyframes fade { from { opacity: 0; } }

  /* typing indicator — a light incoming bubble, matching the chat */
  .typing { display: inline-flex; gap: 4px; background: #fff; box-shadow: 0 1px 1px rgba(20,20,40,.07); border-radius: 16px; padding: 12px 15px; align-self: flex-start; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: #b8b8bf; animation: tblink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes tblink { 40% { opacity: .25; } }

  /* journal-leads glow + arriving entries + stat pulses */
  #sideCol { transition: box-shadow .45s ease; }
  #sideCol.updating { box-shadow: inset 3px 0 0 rgba(255,179,64,.65), -8px 0 26px rgba(255,179,64,.28); }
  @keyframes jHighlight {
    0% { text-shadow: 0 0 7px rgba(255,176,46,.95), 0 0 18px rgba(255,150,20,.7); color: #c96a12; }
    45% { text-shadow: 0 0 5px rgba(255,176,46,.55), 0 0 12px rgba(255,150,20,.35); }
    100% { text-shadow: 0 0 0 rgba(255,176,46,0); }
  }
  .j-entry.arrive { animation: msgpop .5s ease both, jHighlight 2.1s ease .15s both; }
  @keyframes statPulse { 0% { transform: scale(1); } 40% { transform: scale(1.13); box-shadow: 0 0 0 3px rgba(52,199,89,.3); } 100% { transform: scale(1); box-shadow: none; } }
  .stat.changed { animation: statPulse .85s ease; }
  .stats { display: flex; gap: 5px; font-size: 9.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
  .stats .stat { display: flex; flex-direction: column; align-items: center; border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 3px 9px; min-width: 46px; line-height: 1.2; }
  .stats .stat b { color: var(--ink); font-variant-numeric: tabular-nums; font-size: 13.5px; letter-spacing: 0; }
  .gauge.todo.call .g-lbl { color: var(--amber-ink); }
  .endpill { display: block; width: 100%; background: var(--blue); color: #fff; border: 0; border-radius: 10px; padding: 8px 0; font-weight: 600; margin-bottom: 8px; animation: msgpop .3s ease; }
  .cta-pill { display: block; margin: 4px auto 0; border: 0; background: var(--blue); color: #fff; border-radius: 999px; padding: 9px 28px; font-weight: 600; font-size: 13px; box-shadow: 0 4px 14px rgba(47,107,255,.30); cursor: pointer; transition: transform .1s, box-shadow .15s; }
  .cta-pill:hover:not(:disabled) { box-shadow: 0 6px 18px rgba(47,107,255,.38); transform: translateY(-1px); }
  .cta-pill:active:not(:disabled) { transform: scale(.97); }
  .cta-pill:disabled { background: var(--soft); color: var(--dim); box-shadow: none; }
  .tc-close { float: right; border: 0; background: none; font-size: 16px; color: var(--dim); cursor: pointer; line-height: 1; }
  .chat-blocked { align-self: center; color: var(--dim); font-size: 12px; padding: 8px 0 2px; font-style: italic; }
  .mk-row { display: flex; gap: 10px; align-self: flex-start; margin: 2px 0 4px; }

  /* ── prototype mockups + lightbox (ported verbatim from the old UI): a small
     thumbnail in chat and a larger image in the lightbox. Variants: rich / minimal
     / generic / calc. ──────── */
  .mk-phone{
    position:relative;width:13.5em;background:#fff;
    border-radius:2.1em;overflow:hidden;display:flex;flex-direction:column;
    border:1px solid rgba(20,8,30,.07);box-shadow:0 .3em 1.1em rgba(30,12,40,.18);

    padding:.55em 1.1em .1em;font-size:.6em;font-weight:800;color:#1c1c22;flex:none}
  .mk-statusbar .mk-sysicons{display:flex;gap:.32em;align-items:center}
  .mk-statusbar .mk-sysicons i{width:.85em;height:.6em;border-radius:.12em;background:#1c1c22}
  .mk-statusbar .mk-sysicons i.bat{width:1.35em;opacity:.9}

  /* shared "photo": a warm gradient with an abstract silhouette, no image files */

    background:
      radial-gradient(58% 38% at 70% 14%, rgba(255,255,255,.22), transparent 60%),

  /* ===== B · MINIMAL — calm, confident, lots of air ===== */
  .v-minimal{padding-bottom:.3em}

  /* ===== D · CALC — a phone screenshot of foundrs.com's equity calculator (Alex's receipt) =====
     A hero donut is the whole image — the way the dating-app mockups lean on one
     big portrait — so it still reads at inline-thumbnail size (~108px), where the
     earlier text-heavy layout turned to mush. Slim browser chrome + a bold legend
     sell the "real screenshot," in the app's own orange→pink→purple palette. */
  .v-calc{padding-bottom:1.15em}

  .v-calc .mk-cdot{width:.85em;height:.85em;border-radius:.28em;flex:none}

  .mk-photos{display:flex;gap:9px;align-self:flex-start;max-width:88%;margin:8px 2px 2px;flex-wrap:wrap}
  .mk-thumb{

"use strict";
/* ═══ PlusOne UI ═══════════════════════════════════════════════════════════
   The interaction grammar:
   - someone texted you        → answer in their thread (Messages)
   - your own move             → act on the card in "This week" (founder/growth)
   - the press said something  → engage inline in the News Feed
   - progress                  → the ☑ to-do gauge (one checklist per stage)
   - results                   → journal note inline in-thread + mirror in column
   - big moments               → scene takeover; week ends → the recap reveal
═══════════════════════════════════════════════════════════════════════════════ */

const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const money = n => "$" + Math.round(n).toLocaleString();

// Who renders where.
const FEED = new Set(["hacker_news", "techcrunch", "twitter"]);
const SELF = new Set(["founder", "growth"]);   // "your own moves" — acted in-column
// iOS palette + initials, ported from the old UI's STYLE map.
const STYLE = {
  alex: { color: "#0b84ff", initials: "A" }, jordan: { color: "#34c759", initials: "J" },
  priya: { color: "#af52de", initials: "P" },
  sarah: { color: "#ff2d55", initials: "S" }, brett: { color: "#8e8e93", initials: "B" },
  kevin: { color: "#8e8e93", initials: "K" }, mom: { color: "#ffcc02", initials: "👩" },
  jamie: { color: "#64d2ff", initials: "Ja" }, david: { color: "#30b0c7", initials: "D" },
  hacker_news: { color: "#ff6600", initials: "📰" },
  lena: { color: "#bf5af2", initials: "L" }, techcrunch: { color: "#00c853", initials: "📊" },
  users: { color: "#007aff", initials: "👥" }, analytics: { color: "#5856d6", initials: "📈" },
  twitter: { color: "#1da1f2", initials: "𝕏" }, tom: { color: "#34c759", initials: "T" },
  growth: { color: "#30d158", initials: "🚀" }, founder: { color: "#8e8e93", initials: "Me" },
};
const styleFor = id => STYLE[id] || { color: "#8e8e93", initials: "?" };
const FEED_META = {
  hacker_news: { cls: "f-hn", src: "Y · HACKER NEWS" },
  techcrunch: { cls: "f-tc", src: "TC · TECHCRUNCH" },
  twitter: { cls: "f-tw", src: "𝕏 · TWITTER" },
};
// Each scene: a header (title/sub, shown in the room) + the bookend cinematics —
// staged lines that fade in on enter, and a matching exit. `accent` tints the
// title line. pivot's exit is a function of the decision made.
const SCENE_META = {
  equity: {
    title: "The equity talk", sub: "the three of you, one call — nobody leaves until it's settled",
    accent: "rgba(190,130,255,1)",
    enter: ["The equity conversation.", "This is the one you can't rush.", "The week stops here — take all the time you need."],
    exit: () => ["It's settled.", "The clock starts again."],
  },
  demo: {
    title: "Demo night", sub: "a total stranger is using the app. Alex is watching the session live.",
    accent: "rgba(255,190,120,1)",
    enter: ["Demo night.", "A stranger is about to use what you built.", "Forget the week. Just watch."],
    exit: () => ["She closed the laptop and left.", "Back to the grind — but something's different now."],
  },
  launch: {
    title: "Launch day", sub: "it's real. Alex works the machine, Jordan watches the humans.",
    accent: "rgba(120,180,255,1)",
    enter: ["Launch Day.", "The code is live.", "Now you find out if anyone cares."],
    exit: () => ["Day one is over.", "You're a different founder now."],
  },
  pivot: {
    title: "Pivot day", sub: "whiteboard, two columns: NOT ENOUGH USERS / WRONG PRODUCT.",
    accent: "rgba(255,140,140,1)",
    enter: ["Pivot Day.", "Two columns on the whiteboard.", "Nobody leaves until it's decided."],
    exit: (s) => s.pivot_choice === "pivot" ? ["The decision is made.", "Monday morning, the rebuild begins."]
      : s.pivot_choice === "growth" ? ["The decision is made.", "The next fifty matches will tell you if it was right."]
        : ["Half a pivot.", "Priya hopes she's wrong. She usually isn't."],
  },
  firing: {
    title: "The conversation", sub: "just you and Jordan. everything else can wait until morning.",
    accent: "rgba(150,165,190,1)",
    enter: ["Nearly midnight.", "Jordan is still up, still working.", "Nobody can help you with this one."],
    exit: (s) => s.jordan_quit ? ["She resigned before you finished.", "The call was never yours to make."]
      : s.jordan_resolved ? ["It's done.", "Alex has iOS from Monday."]

};

// each and the hero clock ticks forward. `s.launch_time` names the current hour.
const LAUNCH_BG = {
  "8AM": "radial-gradient(120% 80% at 50% -10%, #1a3a5c 0%, #0a1628 55%, #050b16 100%)",
  "9AM": "radial-gradient(120% 80% at 50% -10%, #21507a 0%, #0c1c30 55%, #060e1e 100%)",
  "10AM": "radial-gradient(120% 80% at 50% -12%, #2a6394 0%, #0d2136 55%, #071122 100%)",
  "11AM": "radial-gradient(120% 80% at 50% -12%, #2f6ea6 0%, #0e2438 55%, #08132a 100%)",
  "12PM": "radial-gradient(120% 80% at 50% -14%, #3a7ab0 0%, #103055 55%, #0a1830 100%)",
  "1PM": "radial-gradient(120% 80% at 50% -12%, #356a9e 0%, #0f2740 55%, #091426 100%)",
  "4PM": "radial-gradient(120% 80% at 50% -8%, #4a4f6b 0%, #1a1830 55%, #0d0b1a 100%)",
  "6PM": "radial-gradient(125% 85% at 50% -6%, #b5623a 0%, #3a1c30 45%, #140a1c 100%)",
  "9PM": "radial-gradient(120% 80% at 50% -10%, #16305a 0%, #060f22 55%, #01050f 100%)",
  "11PM": "radial-gradient(120% 80% at 50% -12%, #0d1e3e 0%, #030914 55%, #000208 100%)",
};
// ── the founder's to-do list: one checklist per stage of the company ─────────
const STAGES = [
  { id: "demo", label: "Ch 1 · Build the prototype",
    goal: "Become a real company — paperwork, the split, and something a stranger can touch.",
    active: (s, g) => !s.has_demo, items: [
    { t: "Incorporate", done: s => !!s.incorporated, note: () => null },
    { t: "Pick the dev plan", done: (s, g) => g.done("dev_plan"), note: s => s.dev_plan === "lean" ? "lean — five items" : s.dev_plan === "full" ? "the works — 20+ items" : null },
    { t: "Matching engine", done: (s, g) => g.done("matching_choice"), note: s => s.matching_owned ? "ours — the IP" : s.matching_licensed ? "licensed · $100/wk" : null },
    { t: "Put it in front of a stranger", done: s => !!s.has_demo },
  ]},
  { id: "launch", label: "Ch 2 · Launch the product",
    goal: "Launch before the waitlist — and the runway — go cold.",
    active: (s, g) => s.has_demo && !s.launched, items: [
    { t: "Instrument the funnel", done: (s, g) => g.done("analytics_choice"), note: s => s.analytics_live ? "SDK · $30/wk — you can see" : null },
    { t: "Pick the launch market", done: s => s.beachhead != null, note: s => s.seed_strategy === "austin" ? "Austin — where the waitlist lives" : s.beachhead === "narrow" ? "one dense market" : s.beachhead === "broad" ? "everywhere at once" : null },
    { t: "Answer Apple on safety", done: (s, g) => g.done("trust_safety") },
    { t: "iOS wired end-to-end", done: s => !!s.ios_unblocked },
    { t: "The hardening week", done: s => s.productPhase === "product" },
    { t: "Plan the launch splash", done: (s, g) => g.done("launch_surface"), note: s => s.launch_splash === "quiet" ? "soft — the waitlist first" : s.launch_splash === "press" ? "the reporter's exclusive" : s.launch_splash === "tiktok" ? "TikTok creators · $1,200" : s.launch_splash === "show_hn" ? "Show HN — go big" : null },
    { t: "Flip the switch", done: s => !!s.launched },
  ]},
  { id: "slide", label: (s, g, done) => done ? "Ch 3 · The trough of sorrow" : "Ch 3 · Grow the business",
    goal: "Retention is sliding. Figure out why — and get the team looking at the same evidence.",
    active: (s, g) => s.launched && !s.pivot_summit_done && !s.pivot_deferred && !s.activities_pivot, items: [
    { t: "Watch retention, not signups", done: (s, g) => g.done("slide_hangover") },
    { t: "Call Maya", done: (s, g) => g.done("slide_maya_call"), note: s => s.maya_quote ? "her words, kept" : null },
    { t: "Read the Friday cohort", done: (s, g) => g.done("slide_cohort") || !s.analytics_live, note: s => !s.analytics_live ? "no analytics — flying on gut" : null },
    { t: "Hear Alex's thesis out", done: (s, g) => g.done("slide_alex_thesis") },
    { t: "Get both sides in a room", done: s => !!s.pivot_summit_done },
  ]},
  { id: "v2", label: (s, g, done) => done ? "Ch 4 · Rebuild as v2" : "Ch 4 · Scale the team",
    goal: "Ship the pivot — and keep the team aligned behind it.",
    active: (s, g) => s.activities_pivot && !s.pivot_shipped, items: [
    { t: "Call the pivot", done: s => !!s.activities_pivot, note: () => "plans, not profiles" },
    { t: "Make the scope call", done: (s, g) => g.done("pivot_scope_call"), note: s => s.pivot_kept_legacy ? "kept classic mode — slower" : null },
    { t: "Repoint the matching engine", done: s => !!(s.items && s.items.plans_matching && s.items.plans_matching.status === "done") },

    { t: "Go all-in on the one with legs", done: s => !!s.primary_channel, note: s => s.primary_channel ? "all chips on " + s.primary_channel : null },

// ── game + UI state ───────────────────────────────────────────────────────────
const urlSeed = new URLSearchParams(location.search).get("seed");
let seed = urlSeed != null ? parseInt(urlSeed, 10) : Date.now() % 100000;
let game = new Engine({ seed });
const gameEnded = () => game.s.game_over || game.s.game_won;   // run is over — browsing only, no more calls
let selected = "alex";
let surface = "msgs";
let feedSeenLen = {};           // feed charId -> entries seen
let threadRendered = {};        // charId -> entries fully revealed (the read cursor)
let sceneStartSeq = null;
let inScene = false;
let scSelected = null;          // focus-arc: the participant thread on screen
let scRendered = {};            // focus-arc: per-thread read cursor
let scHeadSig = null;           // focus-arc: last-rendered header signature (scene|clock)
let scClockShown = null;        // launch: the time string currently on the clock face
let scClockTimer = null;        // launch: the count-up ticker interval
let pendingStatPulse = [];      // stat keys that changed this turn, to pulse once
let uiBusy = false;             // input lock while a reveal sequence plays
let revealTimer = null;         // in-thread typing-reveal pacing
let jShown = 0;                 // journal-mirror entries already inked in
let jArrive = false;            // glow the newest journal entry while revealing
let replyExpanded = false;      // the in-thread "Respond ↓" pill state
let weekNotes = [];             // this week's notifications (the bell reopens them)
let notesSeen = true;
let noteQueue = [], noteTimer = null;

// The journal mirror source: outcomes + stamps + orphan drops (founder thread).
function journalMirror() {
  return game.threads.founder.filter(m => m.type === "stamp" || m.type === "outcome" || (m.type === "incoming" && !m.nodeId));
}
function resetUiState() {
  feedSeenLen = {}; sceneStartSeq = null; inScene = false;
  scSelected = null; scRendered = {}; scHeadSig = null; scClockShown = null;
  if (scClockTimer) { clearInterval(scClockTimer); scClockTimer = null; }
  selected = "alex"; surface = "msgs"; threadRendered = {};
  uiBusy = false; replyExpanded = false; weekNotes = []; notesSeen = true;
  noteQueue = []; clearTimeout(noteTimer); noteTimer = null; clearTimeout(revealTimer);
  jShown = journalMirror().length; jArrive = false;
  for (const id of game.order) {
    // feed posts start unseen so the News Feed badge flags news until you open
    // the feed. Messages are iMessage-style: the conversation you land on is
    // read; every other thread starts unread and clears when you open it.
    feedSeenLen[id] = FEED.has(id) ? 0 : game.threads[id].length;
    threadRendered[id] = (id === selected) ? game.threads[id].length : 0;
  }
}
resetUiState();

// ── helpers over the engine ───────────────────────────────────────────────────
function railChars() {
  // iMessage-style: most recently active conversation on top. The thread you
  // currently have open isn't pinned there — it slides down like any other
  // once someone else texts more recently (that's what keeps an old thread,
  // like mom's, from parking itself at the top forever).
  const chars = game.order.filter(id => {
    const c = game.cast.get(id);
    return c && c.active && id !== "founder" && !FEED.has(id) && !SELF.has(id);
  });
  return chars.slice().sort((a, b) => lastActivity(b) - lastActivity(a));
}
// Last message's sequence number (global, monotonic across all threads), or
// -1 for a thread with nothing in it yet — sort is stable, so untouched
// threads keep their declaration order at the bottom.
function lastActivity(id) {
  const t = game.threads[id];
  return t.length ? t[t.length - 1].seq : -1;
}
function currentStage() {
  for (const st of STAGES) if (st.active(game.s, game)) return st;
  return STAGES[STAGES.length - 1];
}
function stageLabel(st, full) {
  return typeof st.label === "function" ? st.label(game.s, game, full) : st.label;
}
function stageCounts(st) {
  const done = st.items.filter(it => it.done(game.s, game)).length;
  return { done, total: st.items.length };
}
function todoSnapshot() {
  const out = new Set();
  for (const st of STAGES) for (const it of st.items) if (it.done(game.s, game)) out.add(st.id + "|" + it.t);
  return out;
}
function gatedKeys(nodeId) {
  // which currently-offered options exist only because of banked evidence
  const node = game.nodes.get(nodeId);
  if (!node) return new Set();
  return new Set((node.choices || []).filter(c => c.if).map(c => c.key));
}

// ── header ────────────────────────────────────────────────────────────────────
function renderHeader() {
  const st = game.stats();
  $("hWeek").textContent = "Week " + st.week;
  $("gRunV").textContent = st.runway + " wks · " + money(st.cash);
  $("gRunB").style.width = Math.min(100, (st.runway / 20) * 100) + "%";
  $("gRunB").style.background = st.runway <= 4 ? "var(--red)" : st.runway <= 8 ? "var(--amber)" : "var(--green)";
  const dIn = game.s.deadline_week - st.week;
  $("gYcL").textContent = "YC deadline";
  if (dIn > 0) { $("gYcV").textContent = dIn + " wks left"; $("gYcB").style.width = Math.max(4, 100 - (dIn / game.s.deadline_week) * 100) + "%"; }
  else { $("gYcV").textContent = "now"; $("gYcB").style.width = "100%"; }
  const stg = currentStage(), c = stageCounts(stg);
  $("gTdL").textContent = "☑ " + stageLabel(stg, c.done === c.total) + " ▾";
  $("gTdV").textContent = c.done + " of " + c.total;
  $("gTdB").style.width = (c.done / c.total) * 100 + "%";
  // pulse the ☑ label while a needs-your-call item is open
  $("gTodo").classList.toggle("call", game.openActions().some(a => !a.onHold && a.kind === "story"));
  // compact traction stats, pulsing when they change
  const sVals = { signal: st.signal, fit: st.marketFit, users: game.s.users, paying: game.s.customers };
  $("stats").innerHTML = Object.entries({ signal: "signal", fit: "fit", users: "users", paying: "paying" })
    .map(([k, lbl]) => '<div class="stat" data-stat="' + k + '"><b>' + sVals[k] + "</b>" + lbl + "</div>").join("");
  for (const k of pendingStatPulse) {
    const el = document.querySelector('.stat[data-stat="' + k + '"]');
    if (el) { el.classList.add("changed"); }
  }
  pendingStatPulse = [];
  const dots = [];
  for (let i = 0; i < 2; i++) dots.push('<div class="dot ' + (i < st.actionsLeft ? "" : "spent") + '"></div>');
  $("dots").innerHTML = (game.scene ? '<span class="free-note">time paused · moves free</span>' : "") + dots.join("");
  // surface badges — the same count on every tab (no zeroing of the tab you're
  // viewing), so switching tabs never changes the numbers.
  // Messages: unread conversations, iMessage-style. Opening a thread reveals it
  // (threadRendered catches up to its length) and clears it — reading, not
  // answering, is what counts. A pending reply still shows as "needs a call" in
  // the rail and the side triage.
  // the thread you're actively viewing counts as read, so it never shows a dot
  // in the rail nor a tick on the tab badge (keeps the two in lockstep).
  const unreadConvos = railChars().filter(id => hasUnread(id) && !(surface === "msgs" && id === selected)).length;
  setBadge("bMsgs", unreadConvos);
  // News Feed: posts you haven't seen yet. Opening the feed marks them seen (in
  // render()), so it clears and stays cleared — a post you've glanced at but not
  // acted on still lives in the feed and the side rail, just not here.
  const feedNew = [...FEED].reduce((n, id) => n + Math.max(0, game.threads[id].length - (feedSeenLen[id] || 0)), 0);
  setBadge("bFeed", feedNew);
  updateBell();
  $("hScore").style.display = gameEnded() ? "" : "none";
}
function setBadge(id, n) {
  const el = $(id);
  el.style.display = n > 0 ? "" : "none";
  el.textContent = n;
}

// ── rail + thread ─────────────────────────────────────────────────────────────
// A conversation is unread when an incoming message waits past the read cursor.
// Your own replies never count, and the thread you're viewing is always caught up.
function hasUnread(id) {
  return game.threads[id].slice(threadRendered[id] || 0).some(m => m.type === "incoming");
}
function renderRail() {
  $("rail").innerHTML = railChars().map(id => {
    const c = game.cast.get(id).def;
    const t = game.threads[id];
    const last = t.length ? t[t.length - 1] : null;
    const unread = hasUnread(id) && id !== selected;   // blue dot, iMessage-style
    const prev = last ? (last.type === "reply" ? "You: " : "") + String(last.body || "").replace(/\s+/g, " ") : c.role;
    const stl = styleFor(id);
    return '<div class="conv ' + (id === selected ? "cur" : "") + (unread ? " unread" : "") + '" data-id="' + id + '">' +
      '<span class="unread-dot"></span>' +
      '<div class="av" style="background:' + stl.color + '">' + esc(stl.initials) + "</div>" +
      '<div class="who"><b>' + esc(c.name) + "</b><span>" + esc(prev.slice(0, 52)) + "</span></div></div>";
  }).join("");
  for (const el of document.querySelectorAll(".conv")) {
    el.onclick = () => { if (uiBusy) return; selected = el.dataset.id; replyExpanded = false; openThread(); };
  }
}
// Open a thread → reveal any unread messages with typing dots, like the old UI:
// reading is an experience, not an instant dump.
function openThread() {
  const t = game.threads[selected];
  const from = threadRendered[selected] || 0;
  // Nothing new to reveal (an already-read thread): still refresh the rail so the
  // clicked conversation gets the selected highlight and the old one lets go.
  if (from >= t.length) { render(); return; }
  // The rail moves with the click, not with the reveal: the row you just opened
  // takes the highlight and drops its blue dot now, while its messages type in.
  uiBusy = true; renderHeader(); renderRail();
  clearTimeout(revealTimer);
  const step = () => {
    const cur = threadRendered[selected] || 0;
    if (surface !== "msgs" || cur >= t.length) { uiBusy = false; renderThread(); render(); return; }
    const e = t[cur];
    const typing = e.type === "incoming";
    renderThread({ typing });                 // draw a typing bubble before an incoming line
    revealTimer = setTimeout(() => {
      threadRendered[selected] = cur + 1;
      renderThread();
      revealTimer = setTimeout(step, typing ? 120 : 60);
    }, typing ? 600 : 90);
  };
  step();
}

// A chat thread holds messages and nothing else: bubbles somebody actually
// sent. Recaps of what a choice did belong to the journal mirror (the engine
// already files them there) — never inline in the conversation, where a
// third-person aside reads as a text the character never typed. The one
// deliberate exception is `type: "note"` (engine.js's `effects.note`): a
// rare, explicitly-authored aside, styled unlike a bubble on purpose so it
// never reads as one, reserved for a detail (usually a verbatim quote) the
// thread doesn't already carry as a real message.
function threadEntryHtml(m, isNew, tail) {
  const anim = isNew ? " msg-new" : "";
  let out = "";
  if (m.type === "reply") out = '<div class="m-out' + (tail ? " tail" : "") + anim + '">' + esc(m.body) + "</div>";
  else if (m.type === "incoming") {
    out = '<div class="m-in' + (tail ? " tail" : "") + (m.dropped ? " dropped" : "") + anim + '">' + esc(m.body) + "</div>" +
      (m.subtext ? '<div class="m-sub">' + esc(m.subtext) + "</div>" : "");
    // the dev-plan message carries three CSS phone mockups → thumbnails + lightbox
    if (m.mockups) out += mockupRowHtml(m.mockups);
  } else if (m.type === "note") {
    out = '<div class="m-note' + anim + '">' + esc(m.body) + "</div>";
  }
  return out;
}
// opts.typing → append a typing bubble at the reveal frontier.
function renderThread(opts) {
  opts = opts || {};
  const c = game.cast.get(selected);
  if (!c) return;
  $("chatHead").innerHTML = "<b>" + esc(c.def.name) + "</b><span>" + esc(c.def.role || "") + (c.active ? "" : " · gone") + "</span>";
  const t = game.threads[selected];
  const shown = threadRendered[selected] || 0;   // how far the read cursor has revealed
  let lastWk = null, html = "";
  t.slice(0, shown).forEach((m, i) => {
    if (m.week !== lastWk) { html += '<div class="m-wk">week ' + m.week + "</div>"; lastWk = m.week; }
    const next = t[i + 1] && i + 1 < shown ? t[i + 1] : null;
    const tail = !next || next.type !== m.type || next.week !== m.week;
    html += threadEntryHtml(m, false, tail);
  });
  if (opts.typing) html += '<div class="row in"><div class="typing"><i></i><i></i><i></i></div></div>';
  const el = $("thread");
  el.innerHTML = html || '<div class="m-wk">no messages yet</div>';
  el.scrollTop = el.scrollHeight;
  // wire mockup thumbnails → lightbox, one .mk-row per message: a thread can
  // carry more than one mockup-bearing message (e.g. the equity calc receipt
  // and the dev-plan A/B/C), so each row has to bind to its own message's
  // mockups rather than whichever one comes first in the thread.
  const mkMsgs = t.slice(0, shown).filter(m => m.mockups);
  el.querySelectorAll(".mk-row").forEach((row, i) => {
    const mk = mkMsgs[i] && mkMsgs[i].mockups;
    if (!mk) return;
    for (const th of row.querySelectorAll(".mk-thumb")) th.onclick = () => openMockupLightbox(mk, th.dataset.mk);
  });

  // ── the response surface, in-flow at the bottom of the thread ──
  const rbox = $("reply");
  // Jordan blocks you once fired.
  if (selected === "jordan" && game.s.jordan_resolved && !game.scene) {
    rbox.innerHTML = '<div class="chat-blocked">This user blocked you.</div>';
    return;
  }
  const a = gameEnded() ? null : game.openActions().find(x => x.charId === selected && !x.onHold);
  const caughtUp = shown >= t.length;
  if (!a || !caughtUp) {
    rbox.innerHTML = a && !caughtUp ? '<div class="hint">…</div>'
      : '<div class="hint">' + (a && a.onHold ? "on hold — something bigger is happening" : "nothing needs an answer here right now") + "</div>";
    return;
  }
  const gk = gatedKeys(a.nodeId);
  const can = game.actionsLeft > 0;
  if (!replyExpanded) {
    rbox.innerHTML =
      '<button class="cta-pill"' + (can ? "" : " disabled") + ">" + (can ? "Respond ↓" : "No actions left this week") + "</button>";
    const btn = rbox.querySelector(".cta-pill");
    if (btn && can) btn.onclick = () => { if (uiBusy) return; replyExpanded = true; renderThread(); };
    return;
  }
  rbox.innerHTML = '<div class="hint"><button class="tc-close">×</button>pick a reply · ⚑ = unlocked by what you\'ve learned</div>' +
    a.options.map(o => '<button class="chip' + (gk.has(o.key) ? " gated" : "") + '" data-k="' + esc(o.key) + '"' + (can ? "" : " disabled") + ">" +
      (gk.has(o.key) ? "⚑ " : "") + esc(o.label) + "</button>").join("");
  rbox.querySelector(".tc-close").onclick = () => { replyExpanded = false; renderThread(); };
  for (const el2 of rbox.querySelectorAll(".chip")) el2.onclick = () => { replyExpanded = false; doAct(a.nodeId, el2.dataset.k, selected); };
}
