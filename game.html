<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Kindred — founder chat</title>
<style>
  :root{
    --bg:#ecebf1; --panel:#ffffff; --rail:#f7f7fa; --line:#e3e3e8;
    --ink:#1c1c1e; --muted:#8a8a8e; --faint:#aeaeb2;
    --in:#e9e9eb; --out1:#0b84ff; --out2:#0a6fe0;
    --accent:#0b84ff; --green:#34c759; --gold:#ffb340;
    --shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.06);
    --r:18px;
    /* hand card dimensions (ported from the old card build) */
    --card-w:154px; --card-h:212px;
    /* handwritten stack for the journal — degrades to generic cursive, no web fonts */
    --hand:"Segoe Print","Bradley Hand","Noteworthy","Marker Felt","Comic Sans MS",cursive;
    --paper:#faf4e6; --jink:#4a4233; --jink-blue:#2a5db0; --rule:#e6d9bb; --margin:#e6b0a6;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{height:100vh;display:flex;flex-direction:column;max-width:1340px;margin:0 auto;padding:16px;gap:12px}

  /* ── top bar ─────────────────────────────────────────── */
  .topbar{
    display:flex;align-items:center;gap:18px;
    background:var(--panel);border-radius:16px;padding:12px 18px;box-shadow:var(--shadow);
  }
  .brand{display:flex;flex-direction:column;line-height:1.1}
  .brand b{font-size:17px;letter-spacing:.2px}
  .brand span{font-size:12px;color:var(--muted)}
  .runway{display:flex;flex-direction:column;gap:5px;min-width:210px;max-width:300px;flex:1}
  .runway-top{display:flex;align-items:baseline;gap:6px}
  .runway-num{font-size:23px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;transition:color .5s}
  .runway-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .runway-cash{margin-left:auto;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
  .runway-bar{height:9px;border-radius:999px;background:var(--rail);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
  .runway-fill{height:100%;border-radius:999px;width:100%;background:#34c759}
  .runway.low .runway-num{color:#ff3b30}
  .runway.low .runway-fill{animation:pulseRed 1.1s ease-in-out infinite}
  @keyframes pulseRed{0%,100%{opacity:1}50%{opacity:.45}}
  .stats{display:flex;gap:8px;margin-left:auto;align-items:center}
  .stat{
    display:flex;flex-direction:column;align-items:center;min-width:64px;
    background:var(--rail);border:1px solid var(--line);border-radius:12px;padding:6px 10px;
  }
  .stat .v{font-weight:700;font-size:14px}
  .stat .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .stat.warn .v{color:#ff3b30}
  .actions-budget{display:flex;align-items:center;gap:8px;padding-left:6px}
  .actions-budget .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);transition:.2s}
  .dot.full{background:var(--accent)}
  .endweek{
    border:0;background:var(--ink);color:#fff;font-weight:600;font-size:13px;
    padding:9px 16px;border-radius:12px;cursor:pointer;transition:.15s;
  }
  .endweek:hover{transform:translateY(-1px);opacity:.92}
  .endweek:disabled{opacity:.4;cursor:default;transform:none}

  /* ── main split ──────────────────────────────────────── */
  .main{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
  .top-row{flex:1;display:flex;gap:12px;min-height:0}
  .rail{
    width:236px;flex:none;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);
    overflow:hidden;display:flex;flex-direction:column;
  }
  .rail h2{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);margin:0;padding:16px 18px 8px}
  .convs{overflow-y:auto;padding:0 8px 10px}
  .conv{
    display:flex;gap:11px;align-items:center;padding:10px 10px;border-radius:13px;cursor:pointer;
    transition:background .12s;position:relative;
  }
  .conv:hover{background:var(--rail)}
  .conv.active{background:#eaf3ff}
  .avatar{
    width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;
    color:#fff;font-weight:600;font-size:15px;
  }
  .conv-body{min-width:0;flex:1}
  .conv-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .conv-name{font-weight:600;font-size:14.5px}
  .conv-prev{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{
    width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;
    box-shadow:0 0 0 3px #eaf3ff;
  }
  .conv:not(.active) .badge{box-shadow:0 0 0 3px var(--panel)}

  /* ── chat panel ──────────────────────────────────────── */
  .chat{
    flex:1;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;min-width:0;overflow:hidden;position:relative;
  }
  .chat-head{
    display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);
  }
  .chat-head .avatar{width:34px;height:34px;font-size:13px}
  .chat-head .nm{font-weight:600}
  .chat-head .rl{font-size:12px;color:var(--muted)}
  .thread{flex:1;overflow-y:auto;padding:20px 22px 16px;display:flex;flex-direction:column;gap:3px}

  .divider{align-self:center;margin:14px 0 6px;font-size:11px;color:var(--faint);
    text-transform:uppercase;letter-spacing:.8px;font-weight:600}

  .row{display:flex;margin-top:4px;animation:rise .32s cubic-bezier(.2,.8,.2,1)}
  .row.in{justify-content:flex-start}
  .row.out{justify-content:flex-end}
  .bubble{
    max-width:74%;padding:9px 14px;border-radius:20px;font-size:14.5px;
    white-space:pre-wrap;word-wrap:break-word;
  }
  .in .bubble{background:var(--in);color:var(--ink);border-bottom-left-radius:6px}
  .out .bubble{background:linear-gradient(180deg,var(--out1),var(--out2));color:#fff;border-bottom-right-radius:6px}
  .subtext{align-self:flex-start;max-width:74%;color:var(--faint);font-size:12px;
    font-style:italic;margin:1px 0 4px 6px}
  .dbg-card{font-size:10px;color:#aaa;font-family:monospace;margin:1px 0 2px 6px;user-select:all}
  .chat-empty{margin:auto;color:var(--faint);font-size:13px;text-align:center;padding:20px}
  /* "respond" pill at the end of a thread — bridges the chat to its hand card */
  .chat-cta{align-self:center;margin:16px 0 6px}
  .cta-btn{
    border:0;background:linear-gradient(180deg,var(--out1),var(--out2));color:#fff;font-weight:600;
    font-size:13px;padding:9px 18px;border-radius:14px;cursor:pointer;
    box-shadow:0 4px 14px rgba(11,132,255,.3);transition:.15s;animation:rise .3s ease both;
  }
  .cta-btn:hover{transform:translateY(-1px)}
  .cta-btn:disabled{opacity:.5;cursor:default;background:var(--faint);box-shadow:none}

  /* typing indicator */
  .typing{display:inline-flex;gap:4px;padding:12px 15px;background:var(--in);border-radius:20px;border-bottom-left-radius:6px}
  .typing i{width:7px;height:7px;border-radius:50%;background:#b6b6bb;animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}

  /* ── journal column (right, full height) ─────────────── */
  .journal-col{
    width:330px;flex:none;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;overflow:hidden;
  }
  .journal-head{
    display:flex;align-items:center;gap:10px;padding:12px 18px;
    border-bottom:1px solid var(--line);flex:none;
  }
  .journal-head .jh-icon{font-size:18px}
  .journal-head .jh-title{font-weight:600;font-size:14px}
  .journal-head .jh-sub{font-size:11px;color:var(--muted);margin-left:auto}
  .journal-scroll{
    flex:1;overflow-y:auto;
    background-color:var(--paper);
    background-image:
      repeating-linear-gradient(var(--paper), var(--paper) 33px, var(--rule) 33px, var(--rule) 34px),
      linear-gradient(90deg, transparent 0 50px, var(--margin) 50px 52px, transparent 52px);
    background-attachment:local;
    padding:16px 26px 20px 70px;
    display:flex;flex-direction:column;
  }
  .journal-entry{
    font-family:var(--hand);color:var(--jink);
    font-size:17px;line-height:34px;margin:0 0 6px;white-space:pre-wrap;
    animation:inkin .5s ease both;
  }
  .journal-entry.is-outcome{color:#5a513f}
  .journal-choice{
    font-family:var(--hand);color:var(--jink-blue);
    font-size:17px;line-height:34px;margin:0 0 6px;animation:inkin .45s ease both;
  }
  .journal-source{
    display:block;font-family:-apple-system,sans-serif;font-size:10px;line-height:1;
    letter-spacing:.6px;text-transform:uppercase;color:#bca978;margin:-2px 0 8px;
  }
  .journal-date{position:relative;align-self:stretch;min-height:26px;margin:22px 0 0}
  .journal-date:first-child{margin-top:4px}
  .journal-date .num{
    position:absolute;left:-66px;top:2px;width:44px;text-align:right;
    font-family:var(--hand);color:#b5654a;line-height:1;
  }
  .journal-date .num b{display:block;font-size:19px;font-weight:700}
  .journal-date .num i{
    display:block;font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;
    font-style:normal;color:#c9a98f;margin-top:3px;
  }
  .journal-stamp{
    align-self:flex-start;margin:12px 0 16px;padding:5px 15px;
    border:3px double currentColor;border-radius:6px;
    font-family:"Arial Black",Impact,sans-serif;font-weight:800;font-size:14px;
    letter-spacing:2px;text-transform:uppercase;opacity:.78;
    transform:rotate(-7deg);animation:stampin .4s cubic-bezier(.2,1.5,.4,1) both;
  }
  .journal-stamp.green{color:#2e8b57}
  .journal-stamp.blue{color:#2a5db0}
  .journal-stamp.red{color:#c0392b}
  .journal-empty{font-family:var(--hand);color:#b6a585;font-size:16px;line-height:30px}

  /* ── action hand (bottom) ────────────────────────────── */
  .hand-panel{
    flex:none;position:relative;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);
    padding:10px 16px 16px;display:flex;flex-direction:column;gap:8px;
  }
  .hand-top{display:flex;align-items:center;gap:12px}
  .hand-lbl{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
  .hand-hint{font-size:12px;color:var(--accent)}
  .hand-plays{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .hand-plays .dot{width:12px;height:12px}
  .hand-cards{
    display:flex;gap:12px;align-items:flex-end;justify-content:center;
    min-height:var(--card-h);overflow-x:auto;padding-top:6px;
  }
  .hand-empty{margin:auto;color:var(--faint);font-size:13px}

  .hcard{
    width:var(--card-w);height:var(--card-h);background:#fff;border-radius:13px;cursor:pointer;
    position:relative;overflow:hidden;flex:none;display:flex;flex-direction:column;
    box-shadow:0 3px 14px rgba(0,0,0,.14);border:1px solid var(--line);
    transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease,opacity .3s ease;
    transform-origin:bottom center;animation:dealIn .4s cubic-bezier(.34,1.56,.64,1) backwards;
  }
  .hcard:hover{transform:translateY(-16px);box-shadow:0 16px 40px rgba(0,0,0,.22);z-index:5}
  /* the card tied to the conversation you're reading — the chat→hand link */
  .hcard.linked{transform:translateY(-10px);box-shadow:0 10px 30px rgba(11,132,255,.2),0 0 0 2px rgba(11,132,255,.55)}
  .hcard.selected{transform:translateY(-20px);box-shadow:0 18px 46px rgba(11,132,255,.34),0 0 0 2px var(--accent);z-index:10}
  .hcard.played{opacity:.32;pointer-events:none;filter:grayscale(.5)}
  .hcard.locked{cursor:pointer;opacity:.62}
  .hcard.locked:hover{transform:translateY(-6px)}
  @keyframes dealIn{from{opacity:0;transform:translateY(40px) scale(.86)}to{opacity:1}}
  .hcard-stripe{height:5px;flex:none}
  .hcard-inner{padding:10px 11px 6px;flex:1;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .hcard-av-row{display:flex;align-items:center;gap:7px}
  .hcard-av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
  .hcard-sender{flex:1;overflow:hidden}
  .hcard-from{font-size:12px;font-weight:700;color:#0f0f1e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hcard-role{font-size:10px;color:#999;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hcard-preview{font-size:12.5px;color:#444;line-height:1.4;flex:1;overflow:hidden}
  .hcard-foot{padding:0 11px 9px;display:flex;align-items:center;justify-content:space-between;flex:none}
  .hcard-cat-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.4px}
  .hcard-urg{width:7px;height:7px;border-radius:50%}
  .urg-3{background:#ef4444;box-shadow:0 0 5px #ef4444}
  .urg-2{background:#f59e0b}
  .urg-1{background:#22c55e}
  .hcard-lockmsg{
    position:absolute;inset:0;background:rgba(255,255,255,.62);display:grid;place-items:center;
    text-align:center;font-size:10px;font-weight:700;letter-spacing:.5px;color:#7a7a82;padding:10px;
    text-transform:uppercase;
  }

  /* selected-card option tray (floats above the hand) */
  .hand-detail{
    position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
    width:min(640px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);
    border-radius:16px;box-shadow:0 14px 50px rgba(0,0,0,.22);padding:16px 18px;z-index:30;
    animation:rise .22s cubic-bezier(.2,.8,.2,1);
  }
  .hand-detail .hd-from{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .hand-detail .hd-body{font-size:14px;color:var(--ink);line-height:1.5;margin-bottom:14px}
  .hand-detail .hd-prompt{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:11px}
  .hand-detail .hd-opts{display:flex;flex-direction:column;gap:9px}
  .chip{
    text-align:left;border:1px solid var(--line);background:#f8f9fb;color:var(--ink);
    padding:11px 15px;border-radius:13px;cursor:pointer;font-size:14px;transition:.13s;line-height:1.35;
  }
  .chip:hover{border-color:var(--accent);background:#eef5ff;transform:translateY(-1px)}
  .hd-close{position:absolute;top:10px;right:14px;border:0;background:none;font-size:18px;color:var(--faint);cursor:pointer;line-height:1}

  /* ── overlay ─────────────────────────────────────────── */
  .overlay{
    position:fixed;inset:0;background:rgba(20,20,30,.55);backdrop-filter:blur(6px);
    display:none;place-items:center;z-index:50;
  }
  .overlay.show{display:grid;animation:fade .3s ease}
  .card-modal{
    background:var(--panel);border-radius:22px;max-width:440px;padding:34px 32px;text-align:center;
    box-shadow:var(--shadow);animation:rise .4s cubic-bezier(.2,.8,.2,1)
  }
  .card-modal .em{font-size:42px}
  .card-modal h3{margin:14px 0 6px;font-size:22px}
  .card-modal p{color:var(--muted);font-size:14px;margin:0 0 22px}
  .card-modal .split{font-weight:700;color:var(--accent);font-size:16px}
  .card-modal button{border:0;background:var(--ink);color:#fff;font-weight:600;padding:11px 22px;
    border-radius:13px;cursor:pointer;font-size:14px}

  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes inkin{from{opacity:0;filter:blur(1.5px)}to{opacity:1;filter:blur(0)}}
  @keyframes stampin{0%{opacity:0;transform:rotate(-7deg) scale(2.2)}60%{opacity:.92}100%{opacity:.78;transform:rotate(-7deg) scale(1)}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes blink{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#d3d3da;border-radius:9px;border:2px solid var(--panel)}
</style>
</head>
<body>
  <div class="app">
    <!-- top bar -->
    <div class="topbar">
      <div class="avatar" style="background:linear-gradient(135deg,#ff6b9d,#c44bd6);width:38px;height:38px">K</div>
      <div class="brand"><b>Kindred</b><span id="weekSub">Week 1 · idea → seed</span></div>
      <div class="runway" id="runway">
        <div class="runway-top">
          <span class="runway-num" id="runwayNum">20</span>
          <span class="runway-lbl">weeks left</span>
          <span class="runway-cash" id="runwayCash">$10,000</span>
        </div>
        <div class="runway-bar"><div class="runway-fill" id="runwayFill"></div></div>
      </div>
      <div class="stats" id="stats"></div>
      <div class="actions-budget">
        <span class="lbl">Actions</span>
        <div class="dot full" id="dot0"></div>
        <div class="dot full" id="dot1"></div>
      </div>
      <button class="endweek" id="endweek">End week →</button>
    </div>

    <!-- main -->
    <div class="main">
      <div class="top-row">
        <div class="rail">
          <h2>Messages</h2>
          <div class="convs" id="convs"></div>
        </div>

        <div class="chat">
          <div class="chat-head" id="chatHead"></div>
          <div class="thread" id="thread"></div>
        </div>

        <div class="journal-col">
          <div class="journal-head">
            <span class="jh-icon">📓</span>
            <span class="jh-title">Founder's Journal</span>
            <span class="jh-sub">your private record</span>
          </div>
          <div class="journal-scroll" id="journalScroll"></div>
        </div>
      </div>

      <div class="hand-panel" id="handPanel">
        <div class="hand-detail" id="handDetail" style="display:none"></div>
        <div class="hand-top">
          <span class="hand-lbl">This week · pick 2</span>
          <span class="hand-hint" id="handHint"></span>
          <span class="hand-plays" id="handPlays"></span>
        </div>
        <div class="hand-cards" id="handCards"></div>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="card-modal" id="modal"></div>
  </div>

  <!-- content + engine -->
  <script>window.ROLES = {};</script>

  <script src="roles/david.js"></script>
  <script src="roles/founder.js"></script>

  <script src="roles/yc.js"></script>

  <script>
  (function(){
    const engine = new Engine();
    // Avatar styling is pure presentation and lives in the UI; names/roles come
    // from the role defs via engine.conversations().
    const STYLE = {
      alex:        { color:"#0b84ff", initials:"A"  },
      jordan:      { color:"#34c759", initials:"J"  },
      priya:       { color:"#af52de", initials:"P"  },
      marcus:      { color:"#ff9500", initials:"M"  },
      fatima:      { color:"#ff6482", initials:"F"  },
      ryan:        { color:"#5ac8fa", initials:"R"  },
      sarah:       { color:"#ff2d55", initials:"S"  },
      brett:       { color:"#8e8e93", initials:"B"  },
      kevin:       { color:"#8e8e93", initials:"K"  },
      mom:         { color:"#ffcc02", initials:"👩" },
      jamie:       { color:"#64d2ff", initials:"Ja" },
      david:       { color:"#30b0c7", initials:"D"  },
      hacker_news: { color:"#ff6600", initials:"📰" },
      yc:          { color:"#f26522", initials:"Y"  },
      lena:        { color:"#bf5af2", initials:"L"  },
      techcrunch:  { color:"#00c853", initials:"📊" },
      users:       { color:"#007aff", initials:"👥" },
      analytics:   { color:"#5856d6", initials:"📈" },
      twitter:     { color:"#1da1f2", initials:"𝕏"  },
      tom:         { color:"#34c759", initials:"T"  },
      founder:     { color:"#8e8e93", initials:"Me" },
    };
    // Category presentation for the hand cards (p/t/e/c/f).
    const CAT = {
      p: { label:"Product", color:"#0b84ff", bg:"#eaf3ff", tc:"#0b6ad6" },
      t: { label:"Team",    color:"#34c759", bg:"#e7f9ed", tc:"#1f9e46" },
      e: { label:"Event",   color:"#ff9500", bg:"#fff1df", tc:"#c4710b" },
      c: { label:"Market",  color:"#af52de", bg:"#f6ecfc", tc:"#8b35bb" },
      f: { label:"Funding", color:"#ff2d55", bg:"#ffe9ee", tc:"#d61f43" },
    };
    const catFor = c => CAT[c] || CAT.e;
    const styleFor = id => STYLE[id] || { color:"#8e8e93", initials:"?" };
    const convFor  = id => engine.conversations().find(c => c.id === id);
    let active = "alex";
    const shown = {};
    for (const id of engine.order) shown[id] = 0;
    let revealing = false;
    let journalRevealing = false;
    let jShown = 0;       // entries already rendered in the journal panel
    let jLastWeek = null;
    let runwayAnim = false;
    let selectedCard = null;   // cardId of the hand card whose options are open

    const $ = id => document.getElementById(id);
    const fmtCash = c => "$" + c.toLocaleString();
    const busy = () => revealing || journalRevealing || runwayAnim;

    // ── runway burn-down ─────────────────────────────────
    const RUNWAY_FULL = 20;
    const runwayColor = w => w <= 4 ? "#ff3b30" : w <= 8 ? "#ff9500" : "#34c759";
    function setRunway(cash){
      const weeks = Math.floor(cash / 500);
      $("runwayNum").textContent = weeks;
      $("runwayCash").textContent = fmtCash(Math.max(0, cash));
      const fill = $("runwayFill");
      fill.style.width = Math.max(0, Math.min(100, (cash / (RUNWAY_FULL * 500)) * 100)) + "%";
      fill.style.background = runwayColor(weeks);
      $("runway").classList.toggle("low", weeks <= 4);
    }
    function animateRunway(from, to, done){
      runwayAnim = true;
      const start = performance.now(), dur = 1200, ease = t => 1 - Math.pow(1 - t, 3);
      const step = now => {
        const t = Math.min(1, (now - start) / dur);
        setRunway(Math.round((from + (to - from) * ease(t)) / 10) * 10);
        if (t < 1) requestAnimationFrame(step);
        else { setRunway(to); runwayAnim = false; done && done(); }
      };
      requestAnimationFrame(step);
    }

    // ── status bar ───────────────────────────────────────
    function renderStats(){
      const s = engine.stats();
      $("weekSub").textContent = "Week " + s.week + " · idea → seed";
      if (!runwayAnim) setRunway(s.cash);
      $("stats").innerHTML = `
        <div class="stat"><div class="v">${s.signal}</div><div class="k">Signal</div></div>
        <div class="stat"><div class="v">${s.marketFit}</div><div class="k">Fit</div></div>
        ${s.equity?`<div class="stat"><div class="v" style="font-size:12px">${s.equity}</div><div class="k">Equity</div></div>`:''}`;
      $("dot0").className = "dot" + (s.actionsLeft>=1?" full":"");
      $("dot1").className = "dot" + (s.actionsLeft>=2?" full":"");
      $("endweek").disabled = busy();
      $("endweek").textContent = s.actionsLeft===0 ? "Next week →" : "End week →";
    }

    // ── sidebar (chat characters, not the journal) ───────
    function renderRail(){
      const convs = engine.conversations().filter(c => !c.isJournal);
      $("convs").innerHTML = convs.map(c=>{
        // Blue dot = unread: thread has entries we haven't revealed yet.
        const unread = shown[c.id] < engine.threads[c.id].length;
        const dot = unread ? '<span class="badge"></span>' : '';
        const st = styleFor(c.id);
        return `<div class="conv ${c.id===active?'active':''}" data-id="${c.id}">
          <div class="avatar" style="background:${st.color}">${st.initials}</div>
          <div class="conv-body">
            <div class="conv-top"><span class="conv-name">${c.name}</span>${dot}</div>
            <div class="conv-prev">${c.empty?'<i>no messages yet</i>':escapeHtml(c.preview)}</div>
          </div>
        </div>`;
      }).join("");
      [...document.querySelectorAll(".conv")].forEach(el=>{
        el.onclick = ()=>{ if(revealing) return; active = el.dataset.id; openConversation(); };
      });
    }

    // ── chat header ──────────────────────────────────────
    function renderHead(){
      const c = convFor(active);
      if (!c) return;
      const st = styleFor(active);
      $("chatHead").innerHTML =
        `<div class="avatar" style="background:${st.color}">${st.initials}</div>
         <div><div class="nm">${c.name}</div><div class="rl">${c.role}</div></div>`;
    }

    // ── journal entries (record only — no action buttons) ─
    // A founder card's *prompt* (an incoming entry with a cardId) lives on the
    // hand, not the journal. The journal shows only what happened: the player's
    // choices (✓), first-person outcomes, milestone stamps, and the rare system
    // note (an incoming entry with no cardId).
    function buildJournalEntry(e){
      if (e.type === "incoming" && e.cardId) return null; // prompt → shown as a card
      if (e.type === "stamp"){
        const d = document.createElement("div");
        d.className = "journal-stamp " + (e.stampClass || "red");
        d.textContent = e.label; return d;
      }
      if (e.type === "reply"){
        const d = document.createElement("div");
        d.className = "journal-choice"; d.textContent = "✓ " + e.body; return d;
      }
      const wrap = document.createElement("div");
      if (e.type === "outcome" && e.sourceChar){
        const src = document.createElement("div");
        src.className = "journal-source"; src.textContent = "after talking with " + (e.from || e.sourceChar);
        wrap.appendChild(src);
      }
      const d = document.createElement("div");
      d.className = "journal-entry" + (e.type === "outcome" ? " is-outcome" : "");
      d.textContent = e.body;
      wrap.appendChild(d);
      if (e.cardId){ const tag = document.createElement("div"); tag.className="dbg-card"; tag.textContent=e.cardId; wrap.appendChild(tag); }
      return wrap;
    }

    function buildChatEntry(e){
      if (e.type === "incoming"){
        const wrap = document.createElement("div");
        const row = document.createElement("div");
        row.className = "row in";
        row.innerHTML = `<div class="bubble">${escapeHtml(e.body)}</div>`;
        wrap.appendChild(row);
        if (e.subtext){
          const st = document.createElement("div");
          st.className="subtext"; st.textContent = e.subtext; wrap.appendChild(st);
        }
        if (e.cardId){ const tag = document.createElement("div"); tag.className="dbg-card"; tag.textContent=e.cardId; wrap.appendChild(tag); }
        return wrap;
      }
      // reply (player's blue bubble); outcomes are not shown in chat
      const d = document.createElement("div");
      d.className = "row out";
      d.innerHTML = `<div class="bubble">${escapeHtml(e.body)}</div>`;
      return d;
    }

    // ── journal panel ────────────────────────────────────
    function journalDivider(box, e){
      if (e.week && e.week !== jLastWeek){
        const d = document.createElement("div");
        d.className = "journal-date";
        d.innerHTML = `<span class="num"><b>${e.week}</b><i>week</i></span>`;
        box.appendChild(d);
        jLastWeek = e.week;
      }
    }
    function renderJournalCatchup(){
      const box = $("journalScroll");
      const thread = engine.threads.founder;
      while (jShown < thread.length){
        const e = thread[jShown];
        const el = buildJournalEntry(e);
        if (el){ journalDivider(box, e); el.style.animation = "none"; box.appendChild(el); }
        jShown++;
      }
      if (!box.children.length){
        box.innerHTML = `<div class="journal-empty">the story starts here…</div>`;
      }
    }
    function revealJournalFrom(from){
      const thread = engine.threads.founder;
      if (from >= thread.length){ jShown = thread.length; finishJournalReveal(); return; }
      journalRevealing = true; renderStats();
      const box = $("journalScroll");
      const ghost = box.querySelector(".journal-empty"); if (ghost) ghost.remove();
      let i = from;
      const step = ()=>{
        if (i >= thread.length){ jShown = thread.length; finishJournalReveal(); return; }
        const e = thread[i];
        const el = buildJournalEntry(e);
        if (!el){ i++; jShown = i; step(); return; }
        const delay = e.type === "stamp" ? 480 : 340;
        setTimeout(()=>{
          journalDivider(box, e);
          box.appendChild(el);
          box.scrollTop = box.scrollHeight;
          i++; jShown = i; step();
        }, delay);
      };
      step();
    }
    function finishJournalReveal(){
      journalRevealing = false;
      renderStats(); renderHand();
      const s = engine.stats();
      if (s.act1Complete && !window.__act1shown){ window.__act1shown = true; setTimeout(showAct1, 500); }
    }

    // ── chat thread rendering ────────────────────────────
    function openConversation(){
      selectedCard = null; hideDetail();
      renderHead();
      const thread = engine.threads[active];
      const box = $("thread");
      box.innerHTML = "";
      box.className = "thread";
      if (!thread.length){
        box.innerHTML = `<div class="chat-empty">no messages yet</div>`;
        renderRail(); renderStats(); renderHand(); return;
      }
      let lastWeek = null;
      const upto = Math.max(shown[active], 0);
      thread.slice(0, upto).forEach(e=>{
        lastWeek = chatDivider(box, e, lastWeek);
        const el = buildChatEntry(e); el.style.animation = "none"; box.appendChild(el);
      });
      revealFrom(active, upto, lastWeek);
      renderRail(); renderStats(); renderHand();
      scrollDown();
    }
    function chatDivider(box, e, lastWeek){
      if (e.week && e.week !== lastWeek){
        const d = document.createElement("div");
        d.className = "divider"; d.textContent = "Week " + e.week;
        d.style.animation = "none"; box.appendChild(d);
        return e.week;
      }
      return lastWeek;
    }
    function revealFrom(charId, from, lastWeek){
      const thread = engine.threads[charId];
      if (from >= thread.length){ shown[charId]=thread.length; finishReveal(); return; }
      revealing = true; renderStats();
      const box = $("thread");
      let i = from; let lw = lastWeek;
      const step = ()=>{
        if (charId !== active){ shown[charId]=thread.length; finishReveal(); return; }
        if (i >= thread.length){ shown[charId]=thread.length; finishReveal(); return; }
        const e = thread[i];
        lw = chatDivider(box, e, lw);
        const useTyping = e.type === "incoming";
        const delay = useTyping ? 600 : 90;
        if (useTyping){
          const t = document.createElement("div");
          t.className="row in"; t.innerHTML = `<div class="typing"><i></i><i></i><i></i></div>`;
          box.appendChild(t); scrollDown();
          setTimeout(()=>{ t.remove(); box.appendChild(buildChatEntry(e)); scrollDown(); i++; shown[charId]=i; step(); }, delay);
        } else {
          setTimeout(()=>{ box.appendChild(buildChatEntry(e)); scrollDown(); i++; shown[charId]=i; step(); }, delay);
        }
      };
      step();
    }
    function finishReveal(){
      revealing = false;
      renderRail(); renderStats(); renderHand(); updateChatCta();
    }

    // A "Respond ↓" pill at the end of the active thread, so reading a chat leads
    // clearly to its action (the matching hand card). Reading is the gate; the
    // pill only appears once the message is revealed and there's an open card.
    function updateChatCta(){
      const box = $("thread");
      const old = box.querySelector(".chat-cta"); if (old) old.remove();
      if (active === "founder") return;
      const cardId = engine.openCardId(active);
      if (!cardId || !cardReadable(active)) return;
      if (!engine.options(cardId).length) return;
      const spent = engine.stats().actionsLeft <= 0;
      const cta = document.createElement("div");
      cta.className = "chat-cta";
      cta.innerHTML = `<button class="cta-btn"${spent?' disabled':''}>${spent?'No actions left this week':'Respond ↓'}</button>`;
      box.appendChild(cta);
      const b = cta.querySelector("button");
      if (b && !spent) b.onclick = ()=>{ if (busy()) return; selectCard(cardId); };
      scrollDown();
    }

    // ── the hand (bottom action cards) ───────────────────
    // A card can only be played once its source message has been read. A chat
    // character's card unlocks when its thread has no unread messages; the
    // founder's own "moves" have no thread to read, so they're always playable.
    function cardReadable(charId){
      if (charId === "founder") return true;
      return shown[charId] >= engine.threads[charId].length;
    }
    function renderHand(){
      const actions = engine.openActions();
      const s = engine.stats();
      const spent = s.actionsLeft <= 0;

      // plays-left dots
      $("handPlays").innerHTML =
        `<div class="dot${s.actionsLeft>=1?' full':''}"></div>` +
        `<div class="dot${s.actionsLeft>=2?' full':''}"></div>` +
        `<span style="margin-left:4px">${s.actionsLeft} of 2 left</span>`;

      // hint: how many actionable threads are still unread
      const unread = actions.filter(a => !cardReadable(a.charId)).length;
      $("handHint").textContent = unread > 0
        ? `· ${unread} unread — open a chat to unlock`
        : (spent ? "· no actions left this week" : "");

      const box = $("handCards");
      if (!actions.length){
        box.innerHTML = `<div class="hand-empty">nothing needs you right now — end the week →</div>`;
        if (selectedCard){ selectedCard = null; hideDetail(); }
        return;
      }
      box.innerHTML = actions.map((a, idx)=>{
        const cat = catFor(a.cat);
        const st = styleFor(a.charId);
        const readable = cardReadable(a.charId);
        const u = a.urgency;
        const urgCls = u >= 3 ? "urg-3" : u >= 2 ? "urg-2" : "urg-1";
        const cls = ["hcard"];
        if (!readable) cls.push("locked");
        else if (spent) cls.push("played");
        // ring the card tied to the conversation currently on screen
        if (readable && !spent && a.charId === active && a.cardId !== selectedCard) cls.push("linked");
        if (a.cardId === selectedCard) cls.push("selected");
        const preview = (a.body || "").slice(0, 110) + ((a.body||"").length > 110 ? "…" : "");
        return `<div class="${cls.join(' ')}" data-card="${a.cardId}" data-char="${a.charId}" style="animation-delay:${idx*0.05}s">
          <div class="hcard-stripe" style="background:${cat.color}"></div>
          <div class="hcard-inner">
            <div class="hcard-av-row">
              <div class="hcard-av" style="background:${st.color}">${st.initials}</div>
              <div class="hcard-sender">
                <div class="hcard-from">${escapeHtml(a.name)}</div>
                <div class="hcard-role">${escapeHtml(a.role)}</div>
              </div>
            </div>
            <div class="hcard-preview">${escapeHtml(preview)}</div>
          </div>
          <div class="hcard-foot">
            <span class="hcard-cat-badge" style="background:${cat.bg};color:${cat.tc}">${cat.label}</span>
            <span class="hcard-urg ${urgCls}"></span>
          </div>
          ${!readable ? `<div class="hcard-lockmsg">tap to read<br>the message</div>` : ""}
        </div>`;
      }).join("");

      [...box.querySelectorAll(".hcard")].forEach(el=>{
        el.onclick = ()=>{
          if (busy()) return;
          const cardId = el.dataset.card, charId = el.dataset.char;
          if (!cardReadable(charId)){ active = charId; openConversation(); return; } // jump to read it
          if (engine.stats().actionsLeft <= 0) return;
          selectCard(cardId);
        };
      });

      // keep an open detail tray in sync, or close it if its card vanished
      if (selectedCard && !actions.some(a => a.cardId === selectedCard)){
        selectedCard = null; hideDetail();
      } else if (selectedCard){
        showDetail(selectedCard);
      }
    }

    function selectCard(cardId){
      if (selectedCard === cardId){ selectedCard = null; hideDetail(); renderHand(); return; }
      const a = engine.openActions().find(x => x.cardId === cardId);
      // Focus the card's conversation so its message shows in context. (Readable
      // cards have their thread fully revealed, so this won't kick off a reveal.)
      if (a && a.charId !== "founder" && a.charId !== active){
        active = a.charId; openConversation();   // resets selectedCard
      }
      selectedCard = cardId;
      renderHand();
      showDetail(cardId);
    }
    function hideDetail(){ $("handDetail").style.display = "none"; }
    function showDetail(cardId){
      const a = engine.openActions().find(x => x.cardId === cardId);
      if (!a){ hideDetail(); return; }
      const d = $("handDetail");
      d.style.display = "block";
      // The popup is a *response* surface. A chat character's message already
      // lives in the thread (now in view), so we don't repeat it — we go straight
      // to the choices. A founder "move" has no message anywhere else, so its body
      // is the brief and belongs here.
      const showBrief = a.charId === "founder";
      const context = showBrief
        ? `<div class="hd-body">${escapeHtml(a.body)}</div>`
        : `<div class="hd-prompt">Your response:</div>`;
      d.innerHTML =
        `<button class="hd-close" id="hdClose">×</button>
         <div class="hd-from">${escapeHtml(a.name)}${a.role?' · '+escapeHtml(a.role):''}</div>
         ${context}
         <div class="hd-opts">${a.options.map(o=>
            `<button class="chip" data-card="${a.cardId}" data-key="${o.key}">${escapeHtml(o.label)}</button>`
          ).join("")}</div>`;
      $("hdClose").onclick = ()=>{ selectedCard = null; hideDetail(); renderHand(); };
      [...d.querySelectorAll(".chip")].forEach(btn=>{
        btn.onclick = ()=> commitCard(btn.dataset.card, btn.dataset.key);
      });
    }

    // ── commit an action from the hand ───────────────────
    function commitCard(cardId, key){
      if (busy() || engine.stats().actionsLeft <= 0) return;
      const a = engine.openActions().find(x => x.cardId === cardId);
      const charId = a ? a.charId : null;
      const dialogue = a ? a.chat : false;

      selectedCard = null; hideDetail();

      const jBefore = engine.threads.founder.length;
      // For a dialogue action, switch to that thread so the reply lands in view.
      if (dialogue && charId && charId !== "founder" && charId !== active){
        active = charId; openConversation();
      }
      const chatBefore = (charId && engine.threads[charId]) ? engine.threads[charId].length : 0;

      engine.act(cardId, key);

      // reveal the player's reply bubble in the (now active) chat thread
      if (dialogue && charId === active && engine.threads[active].length > chatBefore){
        const lw = engine.threads[active][chatBefore-1]?.week ?? engine.stats().week;
        revealFrom(active, chatBefore, lw);
      }
      // reveal new journal entries (outcome + any stamps)
      if (engine.threads.founder.length > jBefore){
        revealJournalFrom(jBefore);
      }

      // after reveals settle: refresh and maybe advance
      const checkAuto = setInterval(()=>{
        if (!revealing && !journalRevealing){
          clearInterval(checkAuto);
          renderRail(); renderStats(); renderHand(); updateChatCta();
          if (engine.stats().actionsLeft <= 0 && !engine.stats().act1Complete){
            setTimeout(advanceWeek, 950);
          }
        }
      }, 120);
    }

    // ── advance to next week ─────────────────────────────
    function advanceWeek(){
      if (busy()) return;
      selectedCard = null; hideDetail();

      const cashBefore = engine.stats().cash;
      engine.nextWeek();
      const cashAfter = engine.stats().cash;

      revealing = true; runwayAnim = true;
      setRunway(cashBefore);
      renderStats();

      animateRunway(cashBefore, cashAfter, () => {
        revealing = false;
        // Messages arrive first: reveal the active thread (the week-opening beat).
        openConversation();
        const jBefore = jShown;
        if (engine.threads.founder.length > jBefore) revealJournalFrom(jBefore);
        if (engine.stats().gameOver) setTimeout(showGameOver, 700);
      });
    }

    // ── modals ───────────────────────────────────────────
    function showAct1(){
      const s = engine.stats();
      const split = s.equity || "your split";
      $("modal").innerHTML =
        `<div class="em">🤝</div><h3>Equity, signed.</h3>
         <p>The founder agreement is locked in at <span class="split">${split}</span>.
            The hard conversations are behind you — for now. The real building starts here.</p>
         <p style="font-size:12.5px">This is the end of the current slice. More of the story is coming.</p>
         <button id="closeModal">Keep going</button>`;
      $("overlay").classList.add("show");
      $("closeModal").onclick = ()=> $("overlay").classList.remove("show");
    }
    function showGameOver(){
      $("modal").innerHTML =
        `<div class="em">💸</div><h3>Out of runway.</h3>
         <p>The cash hit zero on week ${engine.stats().week}. Every founder runs this race against the bank balance.</p>
         <button id="closeModal">Refresh to retry</button>`;
      $("overlay").classList.add("show");
      $("closeModal").onclick = ()=> location.reload();
    }

    // ── utils ────────────────────────────────────────────
    function scrollDown(){ const t=$("thread"); t.scrollTop = t.scrollHeight; }
    function escapeHtml(str){ return (str||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }

    $("endweek").onclick = ()=> advanceWeek();

    // boot
    renderJournalCatchup();
    openConversation();
  })();
  </script>
</body>
</html>
