  <script>
  (function(){
    const engine = new Engine();
    // Avatar styling is pure presentation and lives in the UI; names/roles come
    // from the role defs via engine.conversations().
    const STYLE = {
      alex:        { color:"#0b84ff", initials:"A"  },
      jordan:      { color:"#34c759", initials:"J"  },
      priya:       { color:"#af52de", initials:"P"  },
      marcus:      { color:"#ff9500", initials:"M"  },
      fatima:      { color:"#ff6482", initials:"F"  },
      ryan:        { color:"#5ac8fa", initials:"R"  },
      sarah:       { color:"#ff2d55", initials:"S"  },
      brett:       { color:"#8e8e93", initials:"B"  },
      kevin:       { color:"#8e8e93", initials:"K"  },
      mom:         { color:"#ffcc02", initials:"👩" },
      jamie:       { color:"#64d2ff", initials:"Ja" },
      david:       { color:"#30b0c7", initials:"D"  },
      hacker_news: { color:"#ff6600", initials:"📰" },
      yc:          { color:"#f26522", initials:"Y"  },
      lena:        { color:"#bf5af2", initials:"L"  },
      techcrunch:  { color:"#00c853", initials:"📊" },
      users:       { color:"#007aff", initials:"👥" },
      analytics:   { color:"#5856d6", initials:"📈" },
      twitter:     { color:"#1da1f2", initials:"𝕏"  },
      tom:         { color:"#34c759", initials:"T"  },
      growth:      { color:"#30d158", initials:"🚀" },
      founder:     { color:"#8e8e93", initials:"Me" },
    };
    // Category presentation for the hand cards (p/t/e/c/f).
    const CAT = {
      p: { label:"Product", color:"#0b84ff", bg:"#eaf3ff", tc:"#0b6ad6" },
      t: { label:"Team",    color:"#34c759", bg:"#e7f9ed", tc:"#1f9e46" },
      e: { label:"Event",   color:"#ff9500", bg:"#fff1df", tc:"#c4710b" },
      c: { label:"Market",  color:"#af52de", bg:"#f6ecfc", tc:"#8b35bb" },
      f: { label:"Funding", color:"#ff2d55", bg:"#ffe9ee", tc:"#d61f43" },
    };
    const catFor = c => CAT[c] || CAT.e;
    const styleFor = id => STYLE[id] || { color:"#8e8e93", initials:"?" };
    const convFor  = id => engine.conversations().find(c => c.id === id);
    // impersonal sources (communities/market/users/twitter/analytics/yc): no chat —
    // their cards live under You and resolve via the popup, like the founder's moves.
    const NOCHAT = new Set(engine.noChatChars || []);
    let active = "alex";
    const shown = {};
    for (const id of engine.order) shown[id] = 0;
    // entries already turned into notifications (independent of whether they've been
    // *read*) — so an unread message buzzes once, the week it arrives, never again.
    // Seed at the current length so week-1 messages aren't notified retroactively.
    const notified = {};
    for (const id of engine.order) notified[id] = engine.threads[id].length;
    let revealing = false;
    let journalRevealing = false;
    let jShown = 0;       // entries already rendered in the journal panel
    let jLastWeek = null;
    let runwayAnim = false;
    let selectedCard = null;   // cardId of the hand card whose options are open
    let pendingStatPulse = []; // stat keys (signal/fit) that changed this turn, to pulse
    let noteQueue = [];        // pending notification toasts to reveal one at a time
    let noteTimer = null;      // paces the notification reveal
    let weekNotes = [];        // this week's notifications, reopenable via the bell
    let notesSeen = true;      // false once new notifications arrive, until the bell is opened

    const $ = id => document.getElementById(id);
    const fmtCash = c => "$" + c.toLocaleString();
    const busy = () => revealing || journalRevealing || runwayAnim;

    // ── runway burn-down ─────────────────────────────────
    const RUNWAY_FULL = 20;
    const runwayColor = w => w <= 4 ? "#ff3b30" : w <= 8 ? "#ff9500" : "#34c759";
    function setRunway(cash){
      const weeks = Math.floor(cash / 500);
      $("runwayNum").textContent = weeks;
      $("runwayCash").textContent = fmtCash(Math.max(0, cash));
      const fill = $("runwayFill");
      fill.style.width = Math.max(0, Math.min(100, (cash / (RUNWAY_FULL * 500)) * 100)) + "%";
      fill.style.background = runwayColor(weeks);
      $("runway").classList.toggle("low", weeks <= 4);
    }
    function animateRunway(from, to, done){
      runwayAnim = true;
      const start = performance.now(), dur = 1200, ease = t => 1 - Math.pow(1 - t, 3);
      const step = now => {
        const t = Math.min(1, (now - start) / dur);
        setRunway(Math.round((from + (to - from) * ease(t)) / 10) * 10);
        if (t < 1) requestAnimationFrame(step);
        else { setRunway(to); runwayAnim = false; done && done(); }
      };
      requestAnimationFrame(step);
    }

    // ── status bar ───────────────────────────────────────
    function renderStats(){
      const s = engine.stats();
      $("weekSub").textContent = "Week " + s.week + " · idea → seed";
      if (!runwayAnim) setRunway(s.cash);
      const st = engine.s;
      const traction = st.launched
        ? `<div class="stat clickable" data-stat="users"><div class="v">${st.users}</div><div class="k">Users</div></div>`
          + (st.customers > 0
            ? `<div class="stat clickable" data-stat="paying"><div class="v">${st.customers}</div><div class="k">Paying</div></div>`
            : "")
        : `<div class="stat" data-stat="waitlist"><div class="v">${st.waitlist}</div><div class="k">Waitlist</div></div>`;
      $("stats").innerHTML = `
        <div class="stat" data-stat="signal"><div class="v">${s.signal}</div><div class="k">Signal</div></div>
        <div class="stat" data-stat="fit"><div class="v">${s.marketFit}</div><div class="k">Fit</div></div>`
        + traction;
      for (const el of document.querySelectorAll(".stat.clickable"))
        el.onclick = (ev) => { ev.stopPropagation(); toggleGrowth(); };
      $("dot0").className = "dot" + (s.actionsLeft>=1?" full":"");
      $("dot1").className = "dot" + (s.actionsLeft>=2?" full":"");
      // Roadmap button appears once Alex/Jordan have a build plan in motion.
      const hasPlan = !!engine.s.items;
      const rb = $("roadmapBtn");
      rb.style.display = hasPlan ? "" : "none";
      rb.disabled = !hasPlan;
      refreshPops();
    }

    // ── sidebar (chat characters, not the journal) ───────
    function renderRail(){
      const inFocus = !!engine.stats().focus;
      const convs = engine.conversations().filter(c => !c.isJournal);
      $("convs").innerHTML = convs.map(c=>{
        // Blue dot = an unrevealed *incoming* message waits (your own replies don't count).
        const unread = engine.threads[c.id].slice(shown[c.id]).some(e => e.type === "incoming");
        const dot = unread ? '<span class="badge"></span>' : '';
        const st = styleFor(c.id);
        // During a focus arc, non-participant contacts dim out (held).
        const onhold = c.onHold ? ' onhold' : '';
        return `<div class="conv ${c.id===active?'active':''}${onhold}" data-id="${c.id}">
          <div class="avatar" style="background:${st.color}">${st.initials}</div>
          <div class="conv-body">
            <div class="conv-top"><span class="conv-name">${c.name}</span>${dot}</div>
            <div class="conv-prev">${c.empty?'<i>no messages yet</i>':escapeHtml(c.preview)}</div>
          </div>
        </div>`;
      }).join("");
      [...document.querySelectorAll(".conv")].forEach(el=>{
        // During a focus arc you can still move between the participants' 1:1 threads
        // (Alex / Jordan / founder); only the on-hold (non-participant) contacts are locked.
        el.onclick = ()=>{
          if (revealing) return;
          if (inFocus && el.classList.contains("onhold")) return;
          active = el.dataset.id; openConversation();
        };
      });
    }

    // ── chat header ──────────────────────────────────────
    function renderHead(){
      const c = convFor(active);
      if (!c) return;
      const st = styleFor(active);
      $("chatHead").innerHTML =
        `<div class="avatar" style="background:${st.color}">${st.initials}</div>
         <div><div class="nm">${c.name}</div><div class="rl">${c.role}</div></div>`;
    }

    // ── journal entries (record only — no action buttons) ─
    // A founder card's *prompt* (an incoming entry with a cardId) lives on the
    // hand, not the journal. The journal shows only what happened: the player's
    // choices (✓), first-person outcomes, milestone stamps, and the rare system
    // note (an incoming entry with no cardId).
    function buildJournalEntry(e){
      if (e.type === "incoming" && e.cardId) return null; // prompt → shown as a card
      if (e.type === "stamp"){
        const d = document.createElement("div");
        d.className = "journal-stamp " + (e.stampClass || "red");
        d.textContent = e.label; return d;
      }
      if (e.type === "reply"){
        const d = document.createElement("div");
        d.className = "journal-choice"; d.textContent = "✓ " + e.body; return d;
      }
      const wrap = document.createElement("div");
      if (e.type === "outcome" && e.sourceChar){
        const src = document.createElement("div");
        src.className = "journal-source"; src.textContent = "after talking with " + (e.from || e.sourceChar);
        wrap.appendChild(src);
      }
      const d = document.createElement("div");
      d.className = "journal-entry" + (e.type === "outcome" ? " is-outcome" : "");
      d.textContent = e.body;
      wrap.appendChild(d);
      if (e.mockup) {
        const thumb = document.createElement("button");
        thumb.className = "mk-thumb jnl-mockup";
        thumb.innerHTML = mockupPhoneHtml(e.mockup) + `<span class="mk-badge">${escapeHtml(e.mockup.tag||"")}</span>`;
        thumb.onclick = () => openMockupLightbox({ chosen: e.mockup }, "chosen");
        wrap.appendChild(thumb);
      }
      if (e.cardId){ const tag = document.createElement("div"); tag.className="dbg-card"; tag.textContent=e.cardId; wrap.appendChild(tag); }
      return wrap;
    }

    function buildChatEntry(e){
      if (e.type === "incoming"){
        const wrap = document.createElement("div");
        const row = document.createElement("div");
        row.className = "row in";
        row.innerHTML = `<div class="bubble">${escapeHtml(e.body)}</div>`;
        wrap.appendChild(row);
        if (e.subtext){
          const st = document.createElement("div");
          st.className="subtext"; st.textContent = e.subtext; wrap.appendChild(st);
        }
        if (e.mockups){
          const tray = document.createElement("div");
          tray.className = "mk-photos";
          Object.keys(e.mockups).forEach(key=>{
            const m = e.mockups[key];
            const thumb = document.createElement("button");
            thumb.className = "mk-thumb";
            thumb.innerHTML = mockupPhoneHtml(m) + `<span class="mk-badge">${escapeHtml(m.tag||"")}</span>`;
            thumb.onclick = ()=> openMockupLightbox(e.mockups, key);
            tray.appendChild(thumb);
          });
          wrap.appendChild(tray);
        }
        if (e.cardId){ const tag = document.createElement("div"); tag.className="dbg-card"; tag.textContent=e.cardId; wrap.appendChild(tag); }
        return wrap;
      }
      // reply (player's blue bubble); outcomes are not shown in chat
      const d = document.createElement("div");
      d.className = "row out";
      d.innerHTML = `<div class="bubble">${escapeHtml(e.body)}</div>`;
      return d;
    }

    // ── journal panel ────────────────────────────────────
    function journalDivider(box, e){
      if (e.week && e.week !== jLastWeek){
        const d = document.createElement("div");
        d.className = "journal-date";
        d.innerHTML = `<span class="num"><b>${e.week}</b><i>week</i></span>`;
        box.appendChild(d);
        jLastWeek = e.week;
      }
    }
    function renderJournalCatchup(){
      const box = $("journalScroll");
      const thread = engine.threads.founder;
      while (jShown < thread.length){
        const e = thread[jShown];
        const el = buildJournalEntry(e);
        if (el){ journalDivider(box, e); el.style.animation = "none"; box.appendChild(el); }
        jShown++;
      }
      if (!box.children.length){
        box.innerHTML = `<div class="journal-empty">the story starts here…</div>`;
      }
    }
    function revealJournalFrom(from, done){
      const thread = engine.threads.founder;
      if (from >= thread.length){ jShown = thread.length; finishJournalReveal(done); return; }
      journalRevealing = true; renderStats();
      const box = $("journalScroll");
      const ghost = box.querySelector(".journal-empty"); if (ghost) ghost.remove();
      // pull the eye to the right column: glow the journal + flash its header before
      // the first outcome inks in (the journal beat leads, notifications follow).
      $("journalCol").classList.add("updating");
      const head = $("journalHead");
      head.classList.remove("flash"); void head.offsetWidth; head.classList.add("flash");
      let i = from;
      const step = ()=>{
        if (i >= thread.length){ jShown = thread.length; finishJournalReveal(done); return; }
        const e = thread[i];
        const el = buildJournalEntry(e);
        if (!el){ i++; jShown = i; step(); return; }
        const delay = e.type === "stamp" ? 480 : 340;
        setTimeout(()=>{
          journalDivider(box, e);
          // glow each new outcome/choice as it inks in (stamps keep their own animation).
          // Outcomes return a wrapper, so target the inner .journal-entry/.journal-choice.
          if (e.type !== "stamp"){
            const glow = (el.classList.contains("journal-entry") || el.classList.contains("journal-choice"))
              ? el : el.querySelector(".journal-entry,.journal-choice");
            if (glow) glow.classList.add("arrive");
          }
          box.appendChild(el);
          box.scrollTop = box.scrollHeight;
          i++; jShown = i; step();
        }, delay);
      };
      step();
    }
    function finishJournalReveal(done){
      journalRevealing = false;
      $("journalCol").classList.remove("updating");
      renderStats(); renderHand();
      const s = engine.stats();
      if (s.act1Complete && !window.__act1shown){ window.__act1shown = true; setTimeout(showAct1, 500); }
      if (done) done();
    }

    // ── chat thread rendering ────────────────────────────
    function openConversation(){
      selectedCard = null; hideDetail();
      renderHead();
      const thread = engine.threads[active];
      const box = $("thread");
      box.innerHTML = "";
      box.className = "thread";
      if (!thread.length){
        box.innerHTML = `<div class="chat-empty">no messages yet</div>`;
        renderRail(); renderStats(); renderHand(); return;
      }
      let lastWeek = null;
      const upto = Math.max(shown[active], 0);
      thread.slice(0, upto).forEach(e=>{
        lastWeek = chatDivider(box, e, lastWeek);
        const el = buildChatEntry(e); el.style.animation = "none"; box.appendChild(el);
      });
      revealFrom(active, upto, lastWeek);
      renderRail(); renderStats(); renderHand();
      scrollDown();
    }
    function chatDivider(box, e, lastWeek){
      if (e.week && e.week !== lastWeek){
        const d = document.createElement("div");
        d.className = "divider"; d.textContent = "Week " + e.week;
        d.style.animation = "none"; box.appendChild(d);
        return e.week;
      }
      return lastWeek;
    }
    function revealFrom(charId, from, lastWeek){
      const thread = engine.threads[charId];
      if (from >= thread.length){ shown[charId]=thread.length; finishReveal(); return; }
      revealing = true; renderStats();
      const box = $("thread");
      let i = from; let lw = lastWeek;
      const step = ()=>{
        if (charId !== active){ shown[charId]=thread.length; finishReveal(); return; }
        if (i >= thread.length){ shown[charId]=thread.length; finishReveal(); return; }
        const e = thread[i];
        lw = chatDivider(box, e, lw);
        const useTyping = e.type === "incoming";
        const delay = useTyping ? 600 : 90;
        if (useTyping){
          const t = document.createElement("div");
          t.className="row in"; t.innerHTML = `<div class="typing"><i></i><i></i><i></i></div>`;
          box.appendChild(t); scrollDown();
          setTimeout(()=>{ t.remove(); box.appendChild(buildChatEntry(e)); scrollDown(); i++; shown[charId]=i; step(); }, delay);
        } else {
          setTimeout(()=>{ box.appendChild(buildChatEntry(e)); scrollDown(); i++; shown[charId]=i; step(); }, delay);
        }
      };
      step();
    }
    function finishReveal(){
      revealing = false;
      renderRail(); renderStats(); renderHand(); renderThreadResponse();
    }

    // ── focus / war-room (equity sit-down) ───────────────
    // The arc plays out in the co-founders' own 1:1 threads — a direct, visceral
    // argument. Focus mode only (a) dims the rest of the world (rail on-hold),
    // (b) makes the beats free (no action cost), and (c) chains them mid-week:
    // after each answer the engine surfaces the next beat and the UI jumps to
    // whoever just spoke up, so the fight flows in one sitting, not one card a week.
    function liveFocusAction(){
      const f = engine.stats().focus;
      if (!f) return null;
      const acts = engine.openActions().filter(x => x.focus === f.id && !x.onHold);
      // a co-founder's beat first; the founder's own signing move (no thread) last
      return acts.find(x => x.charId !== "founder") || acts[0] || null;
    }
    // After a focus-arc beat, reveal new messages in the current thread and fire
    // toast notifications for messages that arrived in non-active threads.
    // (Normal gameplay uses revealTurnEnd() for toasts; focus beats bypass turn-end,
    // so we notify here and advance notified[] to prevent double-firing at week-end.)
    function followFocusBeat(){
      renderRail(); renderStats(); renderHand();

      // Active thread: messages are revealed inline — advance notified without toasting.
      if (active && engine.threads[active]) notified[active] = engine.threads[active].length;

      const sideNotes = [];
      for (const charId of engine.order) {
        if (charId === active || charId === "founder") continue;
        const thread = engine.threads[charId] || [];
        for (let i = notified[charId] || 0; i < thread.length; i++) {
          const e = thread[i];
          if (e.type === "incoming") sideNotes.push({ charId, from: e.from, body: e.body });
        }
        notified[charId] = thread.length;
      }
      if (sideNotes.length) queueNotifications(sideNotes);

      const newMsgs = active && (shown[active] || 0) < (engine.threads[active] || []).length;
      if (newMsgs) openConversation();
      else renderThreadResponse();
    }

    function clearThreadResponse(){
      const box = $("thread");
      [...box.querySelectorAll(".chat-cta, .thread-card, .chat-blocked")].forEach(el => el.remove());
    }
    // The response surface for a chat character lives *inside* the thread, in-flow,
    // so it reserves space and never covers the latest message. Default state is a
    // "Respond ↓" pill (the trigger); when its card is the one being engaged
    // (selectedCard), it expands into the full option card, styled like the hand card.
    // Renders one phone "screenshot" — pure CSS/HTML, no image files. Sizing is
    // em-based so identical markup is a small thumbnail in-thread and a big image
    // in the lightbox. Deliberately no cost/time labels: the player judges scope
    // from the screen itself (rich = over-built, minimal = lean, generic = safe clone).
    const MK_STATUSBAR =
      `<div class="mk-statusbar"><span>9:41</span><span class="mk-sysicons"><i></i><i></i><i class="bat"></i></span></div>`;
    function mkRich(){
      return MK_STATUSBAR +
        `<div class="mk-rhead"><span class="mk-brand">kindred<b>♥</b></span>
           <span class="mk-rhead-ico"><i class="ic-sliders"></i><i class="ic-bell"><em>3</em></i></span></div>
         <div class="mk-stories"><span class="st st-you"></span><span class="st"></span><span class="st"></span><span class="st"></span><span class="st"></span></div>
         <div class="mk-prof">
           <div class="mk-portrait"></div>
           <span class="mk-match">92% match</span>
           <span class="mk-verif">✓</span>
           <div class="mk-prof-info">
             <div class="mk-name">Maya, 26 <span class="vdot"></span></div>
             <div class="mk-sub">Photographer · 2 miles away</div>
             <div class="mk-chips"><span>Coffee</span><span>Film</span><span>Hiking</span></div>
           </div>
         </div>
         <div class="mk-actions">
           <button class="act a-rewind">↺</button><button class="act a-no">✕</button>
           <button class="act a-super">★</button><button class="act a-like">♥</button>
           <button class="act a-boost">⚡</button>
         </div>
         <div class="mk-tabs5"><i class="tb on">♥</i><i class="tb">★<em>9</em></i><i class="tb">◷</i><i class="tb">✉</i><i class="tb">◍</i></div>`;
    }
    function mkMinimal(){
      return MK_STATUSBAR +
        `<div class="mk-mhead">KINDRED</div>
         <div class="mk-mphoto"><div class="mk-portrait"></div></div>
         <div class="mk-mmeta"><div class="mk-mname">Maya, 26</div><div class="mk-mbio">Photographer who'd rather be hiking.</div></div>
         <div class="mk-mactions"><button class="mact m-no">✕</button><button class="mact m-like">♥</button></div>`;
    }
    function mkGeneric(){
      return MK_STATUSBAR +
        `<div class="mk-ghead"><span class="mk-gbrand">Kindred</span><span class="mk-ggear"></span></div>
         <div class="mk-gcard">
           <div class="mk-portrait"></div>
           <div class="mk-ginfo"><div class="mk-gname">Maya, 26</div><div class="mk-gsub">2 miles away</div></div>
         </div>
         <div class="mk-gacts"><button class="gact g-no">✕</button><button class="gact g-star">★</button><button class="gact g-like">♥</button></div>
         <div class="mk-gtabs"><i class="gt on"></i><i class="gt"></i><i class="gt"></i></div>`;
    }
    function mockupPhoneHtml(m){
      const body = m.variant === "rich" ? mkRich()
                 : m.variant === "generic" ? mkGeneric()
                 : mkMinimal();
      return `<div class="mk-phone v-${escapeHtml(m.variant||"minimal")}"><span class="mk-notch"></span>${body}</div>`;
    }

    // iMessage-style: tapping a photo opens it full-size, with dots to flip between
    // the three. Backdrop or × closes.
    function openMockupLightbox(mockups, startKey){
      const keys = Object.keys(mockups);
      const lb = $("lightbox");
      function show(k){
        const m = mockups[k];
        $("lbStage").innerHTML =
          `<div class="mk-large">${mockupPhoneHtml(m)}<span class="mk-badge">${escapeHtml(m.tag||"")}</span></div>`;
        $("lbThumbs").innerHTML = keys.map(kk=>
          `<button class="lb-dot${kk===k?" on":""}" data-k="${escapeHtml(kk)}">${escapeHtml(mockups[kk].tag||"")}</button>`
        ).join("");
        [...$("lbThumbs").querySelectorAll(".lb-dot")].forEach(d=> d.onclick = ()=> show(d.dataset.k));
      }
      show(startKey);
      lb.classList.add("show");
      $("lbClose").onclick = ()=> lb.classList.remove("show");
      lb.onclick = (ev)=>{ if (ev.target === lb) lb.classList.remove("show"); };
    }

    function renderThreadResponse(){
      clearThreadResponse();
      if (active === "founder" || NOCHAT.has(active)) return;
      if (active === "jordan" && engine.s.jordan_resolved && !engine.stats().focus) {
        const box = $("thread");
        const b = document.createElement("div");
        b.className = "chat-blocked";
        b.textContent = "This user blocked you.";
        box.appendChild(b);
        scrollDown();
        return;
      }
      const cardId = engine.openCardId(active);
      if (!cardId || !cardReadable(active)) return;
      const opts = engine.options(cardId);
      if (!opts.length) return;
      const box = $("thread");
      // While focused, the active thread's open beat is part of the (free) arc.
      const spent = engine.stats().focus ? false : engine.stats().actionsLeft <= 0;

      if (selectedCard === cardId && !spent){
        const a = engine.openActions().find(x => x.cardId === cardId);
        const st = styleFor(active);
        const cat = catFor(a ? a.cat : "e");
        const card = document.createElement("div");
        card.className = "thread-card";
        card.innerHTML =
          `<div class="tc-stripe" style="background:${cat.color}"></div>
           <div class="tc-head">
             <div class="hcard-av" style="background:${st.color}">${st.initials}</div>
             <div class="tc-id"><div class="tc-from">${escapeHtml(a ? a.name : active)}</div><div class="tc-role">Your response</div></div>
             <button class="tc-close" id="tcClose">×</button>
           </div>
           <div class="tc-opts">${opts.map(o=>
              `<button class="chip" data-card="${cardId}" data-key="${o.key}">${escapeHtml(o.label)}</button>`
            ).join("")}</div>`;
        box.appendChild(card);
        $("tcClose").onclick = ()=>{ if (busy()) return; selectedCard = null; renderThreadResponse(); renderHand(); };
        [...card.querySelectorAll(".chip")].forEach(btn=>{ btn.onclick = ()=> commitCard(btn.dataset.card, btn.dataset.key); });
        // scroll the freshly-appended card fully into view, after layout settles
        scrollDown();
        requestAnimationFrame(()=>{ box.scrollTop = box.scrollHeight; });
        return;
      }

      const cta = document.createElement("div");
      cta.className = "chat-cta";
      cta.innerHTML = `<button class="cta-btn"${spent?' disabled':''}>${spent?'No actions left this week':'Respond ↓'}</button>`;
      box.appendChild(cta);
      const b = cta.querySelector("button");
      if (b && !spent) b.onclick = ()=>{ if (busy()) return; selectedCard = cardId; renderThreadResponse(); renderHand(); };
      scrollDown();
    }

    // ── the hand (bottom action cards) ───────────────────
    // A card can only be played once its source message has been read. A chat
    // character's card unlocks when its thread has no unread messages; the
    // founder's own "moves" have no thread to read, so they're always playable.
    function cardReadable(charId){
      if (charId === "founder" || NOCHAT.has(charId)) return true;   // no thread to read
      return shown[charId] >= engine.threads[charId].length;
    }
    // Time-of-day → panel background gradient for the launch focus arc
    const LAUNCH_PANEL = {
      '8AM':  { bg: 'linear-gradient(175deg,#0a1628 0%,#050e1a 100%)', tc: 'rgba(150,200,255,.9)' },
      '9AM':  { bg: 'linear-gradient(175deg,#0c1a2e 0%,#07101e 100%)', tc: 'rgba(165,210,255,.9)' },
      '10AM': { bg: 'linear-gradient(175deg,#0d1c30 0%,#081120 100%)', tc: 'rgba(180,215,255,.9)' },
      '11AM': { bg: 'linear-gradient(175deg,#0e1e32 0%,#091222 100%)', tc: 'rgba(200,225,255,.9)' },
      '12PM': { bg: 'linear-gradient(175deg,#0f1f34 0%,#091323 100%)', tc: 'rgba(220,235,255,.9)' },
      '1PM':  { bg: 'linear-gradient(175deg,#0f1e30 0%,#091220 100%)', tc: 'rgba(220,235,255,.9)' },
      '4PM':  { bg: 'linear-gradient(175deg,#131520 0%,#0a0f18 100%)', tc: 'rgba(255,245,220,.9)' },
      '6PM':  { bg: 'linear-gradient(175deg,#1c1005 0%,#100900 100%)', tc: 'rgba(255,200,100,.9)' },
      '9PM':  { bg: 'linear-gradient(175deg,#000a18 0%,#00050f 100%)', tc: 'rgba(120,170,255,.9)' },
      '11PM': { bg: 'linear-gradient(175deg,#000510 0%,#000208 100%)', tc: 'rgba(100,150,255,.85)' },
    };

    function renderHand(){
      const focus = engine.stats().focus;
      const isLaunch = focus && focus.id === 'launch';
      const isEquity = focus && focus.id !== 'launch';
      const panel = $("handPanel");
      const handTop = document.querySelector(".hand-top");

      // Panel class and background — launch-active and focus-active are mutually exclusive
      panel.classList.toggle("launch-active", !!isLaunch);
      panel.classList.toggle("focus-active",  !!isEquity);
      handTop.style.display = (isLaunch || isEquity) ? "none" : "";
      if (isLaunch) {
        const lc = LAUNCH_PANEL[engine.s.launch_time] || LAUNCH_PANEL['8AM'];
        panel.style.background = lc.bg;
      } else {
        panel.style.background = '';
      }

      // Focus splash content
      const $splash = $("focusSplash");
      if (isLaunch) {
        const lc = LAUNCH_PANEL[engine.s.launch_time] || LAUNCH_PANEL['8AM'];
        $splash.innerHTML =
          `<div class="focus-launch">` +
          `<div class="focus-launch-label">LAUNCH DAY</div>` +
          `<div class="focus-launch-time" style="color:${lc.tc}">${escapeHtml(engine.s.launch_time || '8AM')}</div>` +
          `</div>`;
      } else if (isEquity) {
        const live = liveFocusAction();
        if (live && (live.charId === "founder" || live.noChat)) {
          $splash.innerHTML =
            `<div class="focus-sign">` +
            `<div class="focus-sign-icon">✍️</div>` +
            `<div class="focus-sign-body">${escapeHtml(live.body)}</div>` +
            `<div class="focus-sign-opts">${live.options.map(o =>
              `<button class="focus-chip" data-card="${escapeHtml(live.cardId)}" data-key="${escapeHtml(o.key)}">${escapeHtml(o.label)}</button>`
            ).join("")}</div>` +
            `</div>`;
          [...$splash.querySelectorAll(".focus-chip")].forEach(btn => {
            btn.onclick = () => { if (!busy()) commitCard(btn.dataset.card, btn.dataset.key); };
          });
        } else {
          $splash.innerHTML =
            `<div class="focus-brain-wrap">` +
            `<span class="focus-bolt fb1">⚡</span><span class="focus-bolt fb2">⚡</span>` +
            `<span class="focus-bolt fb3">⚡</span><span class="focus-bolt fb4">⚡</span>` +
            `<span class="focus-brain">🧠</span></div>` +
            `<div class="focus-word">FOCUS</div>`;
        }
      } else {
        $splash.innerHTML = '';
      }
      const actions = engine.openActions();
      // Only show a card once its source message has been read — unread asks stay
      // hidden, so the player has to discover them by reading threads (the bell /
      // blue dots / notifications point the way). Founder "moves" are always shown.
      // During a focus arc the panel is replaced by the FOCUS visual; cards are played
      // inline from the chat threads instead.
      let visible = actions.filter(a => cardReadable(a.charId));
      if (focus) visible = [];   // hide all cards; interaction happens in-thread
      const s = engine.stats();
      const spent = focus ? false : s.actionsLeft <= 0;  // focus beats are free
      document.querySelector(".hand-lbl").textContent = "This week · pick 2";

      // plays-left dots
      $("handPlays").innerHTML =
        `<div class="dot${s.actionsLeft>=1?' full':''}"></div>` +
        `<div class="dot${s.actionsLeft>=2?' full':''}"></div>` +
        `<span style="margin-left:4px">${s.actionsLeft} of 2 left</span>`;

      // hint: actionable messages still waiting to be read (their cards stay hidden).
      const unread = focus ? 0 : actions.length - visible.length;
      $("handHint").textContent = !focus && unread > 0
        ? `· ${unread} unread message${unread===1?'':'s'} — open a chat to reveal more`
        : (!focus && spent ? "· no actions left this week" : "");

      // Fallback advance: surface an explicit "End week" when nothing is left to do.
      // In focus mode show it when there's no pending focus card (waiting for next week).
      const endBtn = $("handEnd");
      if (focus){
        endBtn.style.display = (!liveFocusAction() && !busy()) ? "" : "none";
      } else {
        endBtn.style.display = (!spent && visible.length === 0 && !busy()) ? "" : "none";
      }

      const box = $("handCards");
      box.style.display = focus ? "none" : "";
      if (!visible.length){
        box.innerHTML = unread > 0
          ? `<div class="hand-empty">📨 ${unread} unread message${unread===1?'':'s'} — read them to see your options</div>`
          : `<div class="hand-empty">nothing needs you right now — end the week →</div>`;
        if (selectedCard && !actions.some(a => a.cardId === selectedCard)){ selectedCard = null; hideDetail(); }
        return;
      }
      box.innerHTML = visible.map((a, idx)=>{
        const cat = catFor(a.cat);
        const st = styleFor(a.charId);
        const u = a.urgency;
        const urgCls = u >= 3 ? "urg-3" : u >= 2 ? "urg-2" : "urg-1";
        const cls = ["hcard"];
        if (spent) cls.push("played");
        // ring the card tied to the conversation currently on screen
        if (!spent && a.charId === active && a.cardId !== selectedCard) cls.push("linked");
        if (a.cardId === selectedCard) cls.push("selected");
        const preview = (a.body || "").slice(0, 110) + ((a.body||"").length > 110 ? "…" : "");
        return `<div class="${cls.join(' ')}" data-card="${a.cardId}" data-char="${a.charId}" style="animation-delay:${idx*0.05}s">
          <div class="hcard-stripe" style="background:${cat.color}"></div>
          <div class="hcard-inner">
            <div class="hcard-av-row">
              <div class="hcard-av" style="background:${st.color}">${st.initials}</div>
              <div class="hcard-sender">
                <div class="hcard-from">${escapeHtml(a.name)}</div>
                <div class="hcard-role">${escapeHtml(a.role)}</div>
              </div>
            </div>
            <div class="hcard-preview">${escapeHtml(preview)}</div>
          </div>
          <div class="hcard-foot">
            <span class="hcard-cat-badge" style="background:${cat.bg};color:${cat.tc}">${cat.label}</span>
            <span class="hcard-urg ${urgCls}"></span>
          </div>
        </div>`;
      }).join("");

      [...box.querySelectorAll(".hcard")].forEach(el=>{
        el.onclick = ()=>{
          // Focus-arc beats (equity) are free → clickable even with no actions left.
          if (busy() || (!engine.stats().focus && engine.stats().actionsLeft <= 0)) return;
          selectCard(el.dataset.card);
        };
      });

      // keep the founder / no-chat popup in sync; chat cards use the inline thread response
      const sel = selectedCard ? actions.find(a => a.cardId === selectedCard) : null;
      if (selectedCard && !sel){
        selectedCard = null; hideDetail();
      } else if (sel && (sel.charId === "founder" || sel.noChat)){
        showDetail(selectedCard);
      } else {
        hideDetail();
      }
    }

    function selectCard(cardId){
      if (selectedCard === cardId){ selectedCard = null; hideDetail(); renderThreadResponse(); renderHand(); return; }
      const a = engine.openActions().find(x => x.cardId === cardId);
      // Founder "moves" and no-chat sources have no thread — use the floating popup.
      if (a && (a.charId === "founder" || a.noChat)){
        selectedCard = cardId; renderHand(); showDetail(cardId); return;
      }
      // Chat character — focus its conversation (its message shows in context) and
      // expand the options inline in the thread. (Readable cards are fully revealed,
      // so openConversation won't kick off a reveal.)
      hideDetail();
      if (a && a.charId !== active){ active = a.charId; openConversation(); } // resets selectedCard
      selectedCard = cardId;
      renderHand();
      renderThreadResponse();
    }
    function hideDetail(){ $("handDetail").style.display = "none"; }
    function showDetail(cardId){
      const a = engine.openActions().find(x => x.cardId === cardId);
      if (!a){ hideDetail(); return; }
      const d = $("handDetail");
      d.style.display = "block";
      // The popup is a *response* surface. A chat character's message already
      // lives in the thread (now in view), so we don't repeat it — we go straight
      // to the choices. A founder "move" or a no-chat event has no message anywhere
      // else, so its body is the brief and belongs here.
      const showBrief = a.charId === "founder" || a.noChat;
      const context = showBrief
        ? `<div class="hd-body">${escapeHtml(a.body)}</div>`
        : `<div class="hd-prompt">Your response:</div>`;
      d.innerHTML =
        `<button class="hd-close" id="hdClose">×</button>
         <div class="hd-from">${escapeHtml(a.name)}${a.role?' · '+escapeHtml(a.role):''}</div>
         ${context}
         <div class="hd-opts">${a.options.map(o=>
            `<button class="chip" data-card="${a.cardId}" data-key="${o.key}">${escapeHtml(o.label)}</button>`
          ).join("")}</div>`;
      $("hdClose").onclick = ()=>{ selectedCard = null; hideDetail(); renderHand(); };
      [...d.querySelectorAll(".chip")].forEach(btn=>{
        btn.onclick = ()=> commitCard(btn.dataset.card, btn.dataset.key);
      });
    }

    // ── commit an action from the hand ───────────────────
    // Results are *withheld*: committing spends an action and consumes the card, but
    // reveals nothing. Every consequence (the reply bubble, the journal outcome, the
    // delayed text back) surfaces at turn end as notifications + journal ink.
    function commitCard(cardId, key){
      if (busy()) return;
      const a = engine.openActions().find(x => x.cardId === cardId);
      const isFocusCard = !!(a && a.focus);
      // Focus-arc beats are free, so they're playable even with no actions left.
      if (!isFocusCard && engine.stats().actionsLeft <= 0) return;
      selectedCard = null; hideDetail(); clearThreadResponse();

      const wasFocus = !!engine.stats().focus;
      engine.act(cardId, key);   // state + entries change
      const nowFocus = !!engine.stats().focus;

      // Still in the argument: jump to whoever just spoke and reveal their beat 1:1.
      if (nowFocus){ followFocusBeat(); return; }

      // Just signed (focus ended): restore the world and ink the negotiation's
      // outcomes into the journal.
      if (wasFocus){
        renderRail(); renderStats(); renderHand();
        openConversation();
        revealJournalFrom(jShown);   // fires the act-1 overlay when equity locks in
        return;
      }

      // normal (non-focus) path: reveal nothing now; consequences surface at week end
      renderRail(); renderStats(); renderHand(); renderThreadResponse();
      if (engine.stats().actionsLeft <= 0) setTimeout(advanceWeek, 600);
    }

    // ── advance to next week ─────────────────────────────
    function advanceWeek(){
      if (busy()) return;
      selectedCard = null; hideDetail(); clearThreadResponse();

      const before = engine.stats();
      const cashBefore = before.cash;
      const sigBefore = before.signal, fitBefore = before.marketFit;
      // traction counts aren't on stats() — read them straight off engine.s
      const waitlistBefore = engine.s.waitlist, usersBefore = engine.s.users, payingBefore = engine.s.customers;
      engine.nextWeek();
      const after = engine.stats();
      const cashAfter = after.cash;

      // which headline stats changed → pulse them once at the end of the reveal
      pendingStatPulse = [];
      if (after.signal !== sigBefore) pendingStatPulse.push("signal");
      if (after.marketFit !== fitBefore) pendingStatPulse.push("fit");
      if (engine.s.waitlist !== waitlistBefore) pendingStatPulse.push("waitlist");
      if (engine.s.users !== usersBefore) pendingStatPulse.push("users");
      if (engine.s.customers !== payingBefore) pendingStatPulse.push("paying");

      const jBefore = jShown;

      revealing = true; runwayAnim = true;
      setRunway(cashBefore);
      renderStats();

      // opening beat (a week passed) → then the calm, non-moving turn-end reveal
      animateRunway(cashBefore, cashAfter, () => { revealing = false; revealTurnEnd(jBefore); });
    }

    // ── debug skip: auto-play a decent strategy, land caught-up ──────────
    // Mirrors the old debug skip-ahead button. Plays the engine directly (no
    // animation) with a sensible default strategy until the target week (or the
    // game ends), then statically syncs the UI so you land fully caught up.
    const DBG_PREFS = {
      dev_planning_session:  "lean",     // pick the lean roadmap
      alex_commitment:       "accept",   // bring Alex on full-time
      start_prototype:       "build",    // start building
      incorporate_week1:     "atlas",    // incorporate
      jordan_equity:         "fair",     // sign a fair split
      auth_build_buy:        "buy",      // buy commodity auth
      auth_buy_forced:       "buy",      // (if Alex built it) buy in the end
      matching_engine_choice:"build",    // build the core ourselves
      analytics_choice:      "buy",      // buy analytics → see the pivot
    };
    // breakIf: optional fn — if it returns true after an act(), stop immediately
    // without advancing the week. Returns true when the break condition fired.
    function debugStep(opts, breakIf){
      let safety = 0;
      while (engine.stats().actionsLeft > 0 && safety++ < 12){
        if (breakIf && breakIf()) return true;
        const actions = engine.openActions();
        if (!actions.length) break;
        const a = actions[0];
        const pref = opts[a.cardId];
        const key = (pref && a.options.some(o => o.key === pref))
          ? pref : (a.options[0] && a.options[0].key);
        if (!key) break;
        engine.act(a.cardId, key);
        if (breakIf && breakIf()) return true;
      }
      engine.nextWeek();
      return false;
    }
    function debugSkip(targetWeek){
      if (busy()) return;
      const bar = $("debug-bar"); bar.classList.add("skipping");
      // dismiss any open overlays / dropdowns
      $("overlay").classList.remove("show");
      closePops();
      [...$("notes").children].forEach(el => el.remove());

      let guard = 0;
      while (engine.stats().week < targetWeek && !engine.s.game_over && !engine.s.game_won && guard++ < 400){
        debugStep(DBG_PREFS);
      }

      // sync UI counters so everything reads as already-seen, then render statically
      for (const id of engine.order){
        shown[id]    = engine.threads[id].length;
        notified[id] = engine.threads[id].length;
      }
      weekNotes = []; notesSeen = true;
      if (engine.stats().act1Complete) window.__act1shown = true;  // don't pop the Act-1 modal retroactively

      renderJournalCatchup();   // append new journal entries (no animation)
      updateBell();
      openConversation();       // re-render the active chat + rail + stats + hand

      bar.classList.remove("skipping");
      if (engine.s.game_over) setTimeout(showGameOver, 400);
    }

    function debugSkipToLaunch(){
      if (busy()) return;
      const bar = $("debug-bar"); bar.classList.add("skipping");
      $("overlay").classList.remove("show");
      closePops();
      [...$("notes").children].forEach(el => el.remove());

      // Play up to good_enough_launch, then stop so the player can choose ship/wait
      const prefs = { ...DBG_PREFS };
      const hasLaunchCard = () => engine.openActions().some(a => a.cardId === 'good_enough_launch');
      let guard = 0;
      while (!hasLaunchCard() && !engine.s.game_over && !engine.s.game_won && guard++ < 400){
        if (debugStep(prefs, hasLaunchCard)) break;
      }

      for (const id of engine.order){
        shown[id]    = engine.threads[id].length;
        notified[id] = engine.threads[id].length;
      }
      weekNotes = []; notesSeen = true;
      if (engine.stats().act1Complete) window.__act1shown = true;

      renderJournalCatchup();
      updateBell();
      // Open Alex's thread — that's where good_enough_launch lands
      active = "alex";
      openConversation();

      bar.classList.remove("skipping");
    }

    // ── turn-end reveal: calm journal ink + iPhone-style notifications ───
    // The chat viewport NEVER moves on its own. Your actions' outcomes ink into
    // the always-visible journal; incoming messages buzz in as notification
    // bubbles you read at your own pace.
    function revealTurnEnd(jBefore){
      // The journal beat LEADS (glow + inked outcomes in the right column); the chat
      // notifications follow only once it finishes — see the dispatch at the bottom.

      // 1) gather *incoming* chat messages we haven't notified yet (NOT keyed on
      //    read-state — an unread message must buzz once, the week it arrives, then
      //    advance the counter so it never repeats).
      const notes = [];
      for (const charId of engine.order){
        if (charId === "founder") continue;
        const thread = engine.threads[charId];
        for (let i = notified[charId] || 0; i < thread.length; i++){
          const e = thread[i];
          if (e.type === "incoming") notes.push({ charId, from: e.from, body: e.body });
        }
        notified[charId] = thread.length;
      }

      // remember this week's notifications so the bell can reopen them after they fade
      weekNotes = notes.slice();
      notesSeen = notes.length === 0;
      updateBell();

      // 3) refresh rail dots + hand; pulse changed stats; then pace the toasts
      renderRail(); renderHand();
      pendingStatPulse.forEach(k=>{
        const el = document.querySelector('.stat[data-stat="' + k + '"]');
        if (el) el.classList.add("changed");
      });
      pendingStatPulse = [];

      // The chat notifications + active-thread refresh — held until the journal beat
      // has played, so the player sees the journal update first, then the phone buzzes.
      const startNotifications = ()=>{
        queueNotifications(notes);
        // The chat you're *currently viewing* refreshes itself — but only after its
        // notification has shown (notification first, then the chat updates). Other
        // threads stay put until you tap their notification / rail row.
        if (active !== "founder" && shown[active] < engine.threads[active].length){
          const idx = notes.findIndex(n => n.charId === active);
          const delay = idx >= 0 ? idx * 750 + 650 : 450;   // 750ms = notification pace
          setTimeout(()=>{
            if (active !== "founder" && shown[active] < engine.threads[active].length) openConversation();
          }, delay);
        }
        if (engine.stats().gameOver) setTimeout(showGameOver, 800);
      };

      // Journal first (with glow); a short beat after it finishes, the notifications buzz.
      if (engine.threads.founder.length > jBefore){
        revealJournalFrom(jBefore, ()=> setTimeout(startNotifications, 450));
      } else {
        startNotifications();
      }

      if (engine.stats().act1Complete && !window.__act1shown){ window.__act1shown = true; setTimeout(showAct1, 800); }
    }

    // ── iPhone-style notification bubbles ────────────────
    function queueNotifications(list){
      noteQueue = noteQueue.concat(list);
      if (!noteTimer) pumpNotifications();
    }
    function pumpNotifications(){
      if (!noteQueue.length){ noteTimer = null; return; }
      showNote(noteQueue.shift());
      noteTimer = setTimeout(pumpNotifications, 750);   // one toast at a time
    }
    function showNote(n){
      const wrap = $("notes");
      const st = styleFor(n.charId);
      const name = n.from || (convFor(n.charId) || {}).name || n.charId;
      const el = document.createElement("div");
      el.className = "note";
      el.innerHTML =
        `<div class="note-av" style="background:${st.color}">${st.initials}</div>
         <div class="note-body">
           <div class="note-from">${escapeHtml(name)}</div>
           <div class="note-text">${escapeHtml(n.body || "")}</div>
         </div>`;
      el.onclick = ()=>{
        dismissNote(el);
        if (busy()) return;
        openFromNote(n);   // user-initiated → no blink
      };
      wrap.appendChild(el);
      setTimeout(()=> dismissNote(el), 6500);   // auto-dismiss; the rail dot persists
    }
    function dismissNote(el){
      if (!el || el.__gone) return;
      el.__gone = true;
      el.classList.add("leaving");
      setTimeout(()=> el.remove(), 130);
    }
    // Opening a notification: a chat character opens its conversation; a no-chat
    // source (which has no thread) opens its card's popup instead.
    function openFromNote(n){
      if (!n) return;
      if (NOCHAT.has(n.charId)){
        const cid = engine.openCardId(n.charId);
        if (cid) selectCard(cid);
        return;
      }
      active = n.charId; openConversation();
    }

    // ── notification center (the bell): reopen this week's notifications ──
    function updateBell(){
      const badge = $("bellBadge");
      if (weekNotes.length && !notesSeen){
        badge.textContent = weekNotes.length;
        badge.style.display = "grid";
      } else {
        badge.style.display = "none";
      }
    }
    function toggleNoteCenter(){
      const c = $("noteCenter");
      if (c.classList.contains("show")){ c.classList.remove("show"); return; }
      closePops("noteCenter");
      renderNoteCenter();
      c.classList.add("show");
      notesSeen = true; updateBell();
    }
    function renderNoteCenter(){
      const c = $("noteCenter");
      if (!weekNotes.length){
        c.innerHTML = `<h4>This week</h4><div class="nc-empty">No notifications this week.</div>`;
        return;
      }
      c.innerHTML = `<h4>This week · ${weekNotes.length} notification${weekNotes.length===1?'':'s'}</h4>` +
        weekNotes.map((n,idx)=>{
          const st = styleFor(n.charId);
          const name = n.from || (convFor(n.charId) || {}).name || n.charId;
          return `<div class="nc-item" data-idx="${idx}">
            <div class="note-av" style="background:${st.color}">${st.initials}</div>
            <div class="note-body">
              <div class="note-from">${escapeHtml(name)}</div>
              <div class="note-text">${escapeHtml(n.body || "")}</div>
            </div>
          </div>`;
        }).join("");
      [...c.querySelectorAll(".nc-item")].forEach(el=>{
        el.onclick = ()=>{
          const n = weekNotes[+el.dataset.idx];
          $("noteCenter").classList.remove("show");
          if (busy() || !n) return;
          openFromNote(n);
        };
      });
    }

    // ── build roadmap (🗺️): the dev-map stepper, ported from the card build ──
    const RM_ITEM_META = {
      _hdr_backend:      { header:true, lbl:"Backend" },
      matching_algo:     { lbl:"Matching engine · core", av:"AL" },
      api_design:        { lbl:"API design",           av:"AL" },
      auth:              { lbl:"Authentication",        av:"AL" },
      analytics:         { lbl:"Analytics",             av:"AL" },
      arch_refactor:     { lbl:"Arch refactor",        av:"AL" },
      scope_social:      { lbl:"Social + push",        av:"—" },
      scope_verification:{ lbl:"Profile verification", av:"—" },
      video_dates:       { lbl:"Video dates",           av:"AL" },
      plans_matching:    { lbl:"Plans matching",       av:"AL" },
      _hdr_ios:          { header:true, lbl:"iOS app" },
      ios_ui:            { lbl:"UI design",            av:"JO" },
      ios_server:        { lbl:"Backend integration",  av:"JO" },
      scope_premium:     { lbl:"Premium subscription", av:"—" },
      scope_socialgraph: { lbl:"Social graph",         av:"—" },
      scope_video:       { lbl:"Video dates",          av:"—" },
      plans_ui:          { lbl:"Plans UI",             av:"JO" },
    };
    const RM_AV_STYLE = {
      AL:"background:#e7f0ff;color:#2563eb",
      JO:"background:#efe7ff;color:#7c3aed",
      "—":"background:#f0f0f3;color:#999",
    };
    const RM_ORDER_PRE  = ["_hdr_backend","_hdr_ios"];
    const RM_ORDER_LEAN = ["_hdr_backend","matching_algo","api_design","auth","analytics","arch_refactor","video_dates","plans_matching","_hdr_ios","ios_ui","ios_server","plans_ui"];
    const RM_ORDER_FULL = ["_hdr_backend","matching_algo","api_design","auth","analytics","arch_refactor","scope_social","scope_verification","video_dates","plans_matching","_hdr_ios","ios_ui","ios_server","scope_premium","scope_socialgraph","scope_video","plans_ui"];

    function renderRoadmap(){
      const s = engine.s;
      const pop = $("roadmapPop");
      if (!s.items){
        pop.innerHTML = `<div class="dm-empty">No build plan yet. Once the team aligns on a roadmap, it shows up here.</div>`;
        return;
      }
      const expanded = !!s.dev_plan;
      const plan = s.dev_plan;
      const order = !expanded ? RM_ORDER_PRE : (plan === "full" ? RM_ORDER_FULL : RM_ORDER_LEAN);
      const badgeCls = { lean:"dm-badge-lean", full:"dm-badge-full", sprint:"dm-badge-sprint" };
      const showLine = new Set();
      for (let i=0;i<order.length-1;i++){
        if (!RM_ITEM_META[order[i]]?.header && !RM_ITEM_META[order[i+1]]?.header) showLine.add(order[i]);
      }
      const pivotBadge = s.activities_pivot ? `<span class="dm-badge dm-badge-pivot">pivoted</span>` : "";
      const shippedBadge = s.launched ? `<span class="dm-badge dm-badge-shipped">${s.pivot_shipped ? "shipped v2" : "shipped"}</span>` : "";
      let html = `<div class="dm-hdr">${expanded ? "Roadmap" : "Build plan"}<span class="dm-badge ${badgeCls[plan] || "dm-badge-sprint"}">${plan || "—"}</span>${pivotBadge}${shippedBadge}</div>`;
      for (const key of order){
        const meta = RM_ITEM_META[key];
        if (!meta) continue;
        if (meta.header){ html += `<div class="dm-grp">${meta.lbl}</div>`; continue; }
        const item = s.items[key];
        if (!item) continue;
        const st = item.status;
        const stCls = st==="done"?"done":st==="active"?"active":st==="deferred"?"defer":st==="obsolete"?"obsolete":"todo";
        const dot = st==="done" ? "✓" : "";
        const line = showLine.has(key) ? `<div class="dm-step-line"></div>` : "";
        // Bought commodity (auth/analytics) → "SaaS"; licensed core matching → "licensed".
        const tag = item.quality==="bought" ? `<span class="dm-step-tag">SaaS</span>`
                  : item.quality==="generic" ? `<span class="dm-step-tag tag-licensed">licensed</span>` : "";
        const who = !tag && st==="active" && meta.av!=="—" ? `<span class="dm-step-who" style="${RM_AV_STYLE[meta.av]}">${meta.av}</span>` : "";
        html += `<div class="dm-step">
          <div class="dm-step-track"><div class="dm-step-dot st-${stCls}">${dot}</div>${line}</div>
          <div class="dm-step-body"><span class="dm-step-lbl st-${stCls}">${escapeHtml(meta.lbl)}</span>${tag}${who}</div>
        </div>`;
      }
      pop.innerHTML = html;
    }

    // ── bank statement (cash readout): week-by-week ledger from engine.ledger ──
    function renderBank(){
      const pop = $("bankPop");
      const led = engine.ledger;
      if (!led.length){
        pop.innerHTML = `<div class="dm-hdr">Bank statement</div><div class="bank-empty">No transactions yet.<br>Finish a week to see your finances.</div>`;
        return;
      }
      const icon = t => t.type==="burn" ? "🔥" : t.type==="saas" ? "☁️" : t.type==="income" ? "💰" : "💸";
      const clip = (str,n) => (str && str.length>n) ? str.slice(0,n-1)+"…" : (str||"");
      let html = `<div class="dm-hdr">Bank statement<span style="font-weight:800;color:var(--ink);font-size:12px">${fmtCash(Math.max(0,engine.s.cash))}</span></div>`;
      for (let i=led.length-1;i>=0;i--){
        const L = led[i];
        const rows = L.transactions.map(t=>{
          const neg = t.delta < 0;
          const amt = (neg?"−":"+") + fmtCash(Math.abs(t.delta));
          return `<div class="bank-row">
            <div class="bank-row-icon">${icon(t)}</div>
            <div class="bank-row-desc">
              <div class="bank-row-lbl">${escapeHtml(clip(t.label,90))}</div>
              ${t.note?`<div class="bank-row-note">${escapeHtml(t.note)}</div>`:""}
            </div>
            <div class="bank-row-amt ${neg?"bank-amt-neg":"bank-amt-pos"}">${amt}</div>
          </div>`;
        }).join("");
        html += `<div class="bank-week">
          <div class="bank-week-lbl">Week ${L.week}</div>
          ${rows}
          <div class="bank-balance"><span class="bank-bal-lbl">Balance</span><span class="bank-bal-val">${fmtCash(Math.max(0,L.balanceAfter))}</span></div>
        </div>`;
      }
      pop.innerHTML = html;
    }

    // ── growth chart (users over time) ─────────────────
    function renderGrowth(){
      const pop = $("growthPop");
      const hist = engine.userHistory.filter(h => h.users > 0 || h.customers > 0);
      if (hist.length < 2){
        pop.innerHTML = `<div class="dm-hdr">Growth</div><div class="bank-empty">Not enough data yet.<br>Check back after a few weeks post-launch.</div>`;
        return;
      }
      const latest = hist[hist.length - 1];
      const hasAnalytics = !!engine.s.analytics_live;
      const s = engine.s;
      const mrr = (s.customers || 0) * 50;
      const CH_LABELS = {
        referrals: "Referral loop", creators: "TikTok creators",
        community: "Communities", paid: "Paid ads", mixed: "Unfocused (all channels)",
      };
      const chId = s.primary_channel;
      const ch = chId ? (s.channels[chId] || {}) : null;
      // Revenue + the channel you're betting on — the resource-management readout.
      const metaRows =
        `<div class="growth-meta">`
        + `<div class="growth-row"><span>MRR</span><b>$${mrr.toLocaleString()}/mo</b></div>`
        + (chId
            ? `<div class="growth-row"><span>Channel</span><b>${CH_LABELS[chId] || chId}${ch.cac ? ` · ~$${ch.cac} CAC` : ""}</b></div>`
            : `<div class="growth-row"><span>Channel</span><b style="color:#8a8a8e">not yet found</b></div>`)
        + `</div>`;
      pop.innerHTML = `<div class="dm-hdr">Growth<span style="font-weight:800;color:var(--ink);font-size:12px">${latest.users} signups</span></div>`
        + metaRows
        + `<canvas class="growth-chart" id="growthCanvas"></canvas>
        <div class="growth-legend">
          <span><span class="growth-swatch" style="background:#0b84ff"></span>Signups</span>`
        + (hasAnalytics
          ? `<span><span class="growth-swatch" style="background:#ff9500"></span>Active</span>`
          : "")
        + `<span><span class="growth-swatch" style="background:#34c759"></span>Paying</span>
        </div>`;
      drawGrowthChart(hist, hasAnalytics);
    }
    function drawGrowthChart(hist, showActive){
      const canvas = $("growthCanvas");
      if (!canvas) return;
      const dpr = window.devicePixelRatio || 1;
      const W = 298, H = 200;
      canvas.width = W * dpr; canvas.height = H * dpr;
      canvas.style.width = W + "px"; canvas.style.height = H + "px";
      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);

      const ml = 36, mr = 10, mt = 10, mb = 22;
      const pw = W - ml - mr, ph = H - mt - mb;

      const weeks = hist.map(h => h.week);
      const maxU = Math.max(...hist.map(h => h.users), 1);
      const yMax = niceMax(maxU);
      const xMin = weeks[0], xMax = weeks[weeks.length - 1];
      const xRange = Math.max(xMax - xMin, 1);

      const xPos = w => ml + ((w - xMin) / xRange) * pw;
      const yPos = v => mt + (1 - v / yMax) * ph;

      ctx.strokeStyle = "#e3e3e8"; ctx.lineWidth = 1;
      const gridN = 4;
      ctx.font = "10px -apple-system,system-ui,sans-serif";
      for (let i = 0; i <= gridN; i++){
        const val = (yMax / gridN) * i;
        const yy = yPos(val);
        ctx.beginPath(); ctx.moveTo(ml, yy); ctx.lineTo(W - mr, yy); ctx.stroke();
        ctx.fillStyle = "#8a8a8e"; ctx.textAlign = "right";
        ctx.fillText(Math.round(val), ml - 5, yy + 3);
      }

      ctx.textAlign = "center"; ctx.fillStyle = "#8a8a8e";
      const step = Math.max(1, Math.ceil(weeks.length / 8));
      for (let i = 0; i < weeks.length; i += step)
        ctx.fillText("W" + weeks[i], xPos(weeks[i]), H - 4);

      function drawLine(data, color, fill){
        if (data.length < 2) return;
        ctx.beginPath();
        ctx.moveTo(xPos(data[0].w), yPos(0));
        data.forEach(d => ctx.lineTo(xPos(d.w), yPos(d.v)));
        ctx.lineTo(xPos(data[data.length - 1].w), yPos(0));
        ctx.closePath();
        ctx.fillStyle = fill; ctx.fill();
        ctx.beginPath();
        data.forEach((d, i) => i === 0 ? ctx.moveTo(xPos(d.w), yPos(d.v)) : ctx.lineTo(xPos(d.w), yPos(d.v)));
        ctx.strokeStyle = color; ctx.lineWidth = 2;
        ctx.lineJoin = "round"; ctx.lineCap = "round"; ctx.stroke();
        data.forEach(d => {
          ctx.beginPath(); ctx.arc(xPos(d.w), yPos(d.v), 3, 0, Math.PI * 2);
          ctx.fillStyle = color; ctx.fill();
        });
      }

      const totalData = hist.map(h => ({ w: h.week, v: h.users }));
      const payingData = hist.map(h => ({ w: h.week, v: h.customers }));
      drawLine(totalData, "#0b84ff", "rgba(11,132,255,0.08)");
      if (showActive) {
        const activeData = hist.map(h => ({ w: h.week, v: h.active }));
        drawLine(activeData, "#ff9500", "rgba(255,149,0,0.08)");
      }
      drawLine(payingData, "#34c759", "rgba(52,199,89,0.08)");
    }
    function niceMax(v){
      if (v <= 10) return 10;
      const mag = Math.pow(10, Math.floor(Math.log10(v)));
      const norm = v / mag;
      const nice = norm <= 1.5 ? 2 : norm <= 3 ? 4 : norm <= 7 ? 8 : 10;
      return nice * mag;
    }

    // Only one top-right dropdown is open at a time.
    function closePops(except){
      for (const id of ["noteCenter","roadmapPop","bankPop","growthPop"]) if (id !== except) $(id).classList.remove("show");
    }
    function toggleRoadmap(){
      const p = $("roadmapPop");
      if (p.classList.contains("show")){ p.classList.remove("show"); return; }
      closePops("roadmapPop"); renderRoadmap(); p.classList.add("show");
    }
    function toggleBank(){
      const p = $("bankPop");
      if (p.classList.contains("show")){ p.classList.remove("show"); return; }
      closePops("bankPop"); renderBank(); p.classList.add("show");
    }
    function toggleGrowth(){
      const p = $("growthPop");
      if (p.classList.contains("show")){ p.classList.remove("show"); return; }
      closePops("growthPop"); renderGrowth(); p.classList.add("show");
    }
    // Keep an open dropdown current as state changes (e.g. items advance at turn end).
    function refreshPops(){
      if ($("roadmapPop").classList.contains("show")) renderRoadmap();
      if ($("bankPop").classList.contains("show")) renderBank();
      if ($("growthPop").classList.contains("show")) renderGrowth();
    }

    // ── modals ───────────────────────────────────────────
    function showAct1(){
      const s = engine.stats();
      const split = s.equity || "your split";
      $("modal").innerHTML =
        `<div class="em">🤝</div><h3>Equity, signed.</h3>
         <p>The founder agreement is locked in at <span class="split">${split}</span>.
            The hard conversations are behind you — for now. The real building starts here.</p>
         <p style="font-size:12.5px">This is the end of the current slice. More of the story is coming.</p>
         <button id="closeModal">Keep going</button>`;
      $("overlay").classList.add("show");
      $("closeModal").onclick = ()=> $("overlay").classList.remove("show");
    }
    function showGameOver(){
      $("modal").innerHTML =
        `<div class="em">💸</div><h3>Out of runway.</h3>
         <p>The cash hit zero on week ${engine.stats().week}. Every founder runs this race against the bank balance.</p>
         <button id="closeModal">Refresh to retry</button>`;
      $("overlay").classList.add("show");
      $("closeModal").onclick = ()=> location.reload();
    }

    // ── utils ────────────────────────────────────────────
    function scrollDown(){ const t=$("thread"); t.scrollTop = t.scrollHeight; }
    function escapeHtml(str){ return (str||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }

    $("bell").onclick = (ev)=>{ ev.stopPropagation(); toggleNoteCenter(); };
    $("roadmapBtn").onclick = (ev)=>{ ev.stopPropagation(); toggleRoadmap(); };
    $("runway").onclick = (ev)=>{ ev.stopPropagation(); toggleBank(); };
    $("handEnd").onclick = ()=>{ if (!busy()) advanceWeek(); };
    // click outside an open dropdown (and its trigger) closes it
    document.addEventListener("click", (ev)=>{
      for (const [pid, tid] of [["noteCenter","bell"],["roadmapPop","roadmapBtn"],["bankPop","runway"],["growthPop","stats"]]){
        const c = $(pid);
        if (!c.classList.contains("show")) continue;
        if (c.contains(ev.target) || $(tid).contains(ev.target)) continue;
        c.classList.remove("show");
      }
    });

    // debug skip bar (testing) — absolute targets + a relative +N step
    [...document.querySelectorAll("#debug-bar button")].forEach(btn=>{
      if (btn.id === "dbg-launch-day") { btn.onclick = debugSkipToLaunch; return; }
      btn.onclick = ()=>{
        if (busy()) return;
        const target = btn.dataset.step
          ? engine.stats().week + (+btn.dataset.step)
          : +btn.dataset.week;
        debugSkip(target);
      };
    });

    // boot
    updateBell();
    renderJournalCatchup();
    openConversation();
  })();
  </script>
