// ── the right column: triage + journal mirror ─────────────────────────────────
function renderSide() {
  const acts = gameEnded() ? [] : game.openActions().filter(a => !a.onHold);
  const move = acts.filter(a => SELF.has(a.charId));
  const story = acts.filter(a => !SELF.has(a.charId) && a.kind === "story");
  const later = acts.filter(a => !SELF.has(a.charId) && a.kind !== "story");
  const can = game.actionsLeft > 0;

  const linkCard = (a) => {
    const goFeed = FEED.has(a.charId);
    return '<div class="h-card link" data-char="' + a.charId + '" data-feed="' + (goFeed ? 1 : 0) + '">' +
      "<b>" + esc(a.name) +
      ' <span class="go">↗ ' + (goFeed ? "News Feed" : "open chat") + "</span></b>" +
      "<span>" + esc(String(a.body).slice(0, 90)) + "…</span></div>";
  };
  const moveCard = (a) => {
    const gk = gatedKeys(a.nodeId);
    return '<div class="h-card move"><b>Your move</b>' +
      "<span>" + esc(a.body) + "</span>" +
      '<div class="mv-opts">' + a.options.map(o =>
        '<button data-n="' + esc(a.nodeId) + '" data-k="' + esc(o.key) + '"' + (can ? "" : " disabled") + ' class="' + (gk.has(o.key) ? "gated" : "") + '">' + (gk.has(o.key) ? "⚑ " : "") + esc(o.label) + "</button>").join("") + "</div></div>";
  };

  // End-week fallback pill: actions remain, but the only cards left are ambient
  // — a week you can choose to skip. A week with NOTHING open doesn't get the
  // pill: scheduleTurn() is already carrying the player through it.
  const canSkip = !game.scene && !uiBusy && game.actionsLeft > 0
    && move.length === 0 && story.length === 0 && later.length > 0
    && !game.s.game_over && !game.s.game_won;
  let html = canSkip ? '<button class="endpill" id="endPill">End week →</button>' : "";
  html += '<div class="tier"><h5>◉ Needs a call</h5>' +
    (move.map(moveCard).join("") + story.map(linkCard).join("")
      || '<div class="empty-tier">' + (gameEnded() ? "the run's over — this is the record now." : "nothing urgent — rare. enjoy it.") + "</div>") + "</div>";
  html += '<div class="tier later"><h5>When you have a minute</h5>' +
    (later.map(linkCard).join("") || '<div class="empty-tier">' + (gameEnded() ? "&nbsp;" : "quiet out there.") + "</div>") + "</div>";

  // journal mirror — only up to jShown (the turn-end reveal inks new entries one
  // at a time); the newest inking entry glows via jArrive.
  const jt = journalMirror().slice(0, jShown);
  const recent = jt.slice().reverse();
  const jent = (m, i, arrive) => {
    const cls = "j-entry" + (i > 2 ? " old" : "") + (arrive ? " arrive" : "");
    if (m.type === "stamp") return '<div class="' + cls + '"><span class="j-wk">wk ' + m.week + ' ·</span> <span class="stamp ' + esc(m.stampClass || "green") + '">' + esc(m.label) + "</span></div>";
    const from = m.type === "incoming" ? (esc(m.from) + ": ") : "";
    return '<div class="' + cls + '"><span class="j-wk">wk ' + m.week + " ·</span> " + from + esc(m.body) + "</div>";
  };
  html += '<div id="journalSec"><h5>✎ Journal</h5>' +
    recent.map((m, i) => jent(m, i, jArrive && i === 0)).join("") + "</div>";

  $("sideCol").innerHTML = html;
  $("sideCol").classList.toggle("updating", jArrive);
  const ep = $("endPill"); if (ep) ep.onclick = () => { if (!uiBusy) { uiBusy = true; renderHeader(); setTimeout(advanceWeek, 200); } };
  for (const el of $("sideCol").querySelectorAll(".h-card.link")) {
    el.onclick = () => {
      if (uiBusy) return;
      if (el.dataset.feed === "1") setSurface("feed");
      else { selected = el.dataset.char; replyExpanded = false; surface = "msgs"; syncSurfaceTabs(); openThread(); render(); }
    };
  }
  for (const el of $("sideCol").querySelectorAll(".mv-opts button")) {
    el.onclick = () => { if (!uiBusy) doAct(el.dataset.n, el.dataset.k, "founder"); };
  }
}

// ── News Feed ─────────────────────────────────────────────────────────────────
function renderFeed() {
  // merge feed chars' incoming entries by seq/week
  const items = [];
  for (const id of FEED) {
    game.threads[id].forEach(m => { if (m.type === "incoming") items.push({ ...m, charId: id }); });
    feedSeenLen[id] = game.threads[id].length;
  }
  items.sort((a, b) => (a.seq || 0) - (b.seq || 0));
  const acts = gameEnded() ? [] : game.openActions();
  let lastWk = null, html = "";
  for (const m of items.slice(-24)) {
    if (m.week !== lastWk) { html += '<div class="f-wk">week ' + m.week + "</div>"; lastWk = m.week; }
    const meta = FEED_META[m.charId];
    const a = m.nodeId ? acts.find(x => x.nodeId === m.nodeId && !x.onHold) : null;
    const resolved = m.nodeId ? game.outcome(m.nodeId) : null;
    let foot = "";
    if (a) {
      const can = game.actionsLeft > 0;
      foot = '<div class="f-act">' + a.options.map(o =>
        '<button class="f-btn" data-n="' + esc(a.nodeId) + '" data-k="' + esc(o.key) + '"' + (can ? "" : " disabled") + ">" + esc(o.label) + "</button>").join("") + "</div>";
    } else if (resolved === "@ignored") foot = '<div class="f-done">the moment passed — you never weighed in.</div>';
    else if (resolved) foot = '<div class="f-done">✓ you engaged.</div>';
    html += '<div class="f-item ' + meta.cls + (resolved === "@ignored" ? " expired" : "") + '">' +
      '<div class="f-src">' + meta.src + "</div>" +
      '<div class="f-body">' + esc(m.body) + "</div>" + foot + "</div>";
  }
  $("feedSurface").innerHTML = html || '<div class="f-wk" style="margin-top:30px">nothing in the news yet — the world hasn\'t noticed you.</div>';
  $("feedSurface").scrollTop = $("feedSurface").scrollHeight;
  for (const el of $("feedSurface").querySelectorAll(".f-btn")) {
    el.onclick = () => doAct(el.dataset.n, el.dataset.k, null);
  }
}

// ── Bank ──────────────────────────────────────────────────────────────────────
function renderBank() {
  const rows = game.ledger.slice().reverse();
  $("bankSurface").innerHTML = rows.map(w =>
    '<div class="stmt"><h4>week ' + w.week + " <b>" + money(w.balanceAfter) + "</b></h4>" +
    w.transactions.map(tx =>
      '<div class="tx"><span>' + esc(tx.label) + (tx.note ? '<span class="n">' + esc(tx.note) + "</span>" : "") + "</span>" +
      '<span class="amt ' + (tx.delta > 0 ? "pos" : "neg") + '">' + (tx.delta > 0 ? "+" : "") + money(tx.delta).replace("$-", "-$") + "</span></div>").join("") +
    "</div>").join("") || '<div class="f-wk" style="margin-top:30px">the first statement arrives when the first week ends.</div>';
}

// ── to-do popover ─────────────────────────────────────────────────────────────
function renderTodo() {
  const cur = currentStage();
  const pills = STAGES.map(st => {
    const c = stageCounts(st);
    const full = c.done === c.total;
    const cls = st === cur ? "cur" : (full ? "done" : "");
    return '<span class="' + cls + '">' + (full && st !== cur ? "✓ " : "") + esc(stageLabel(st, full)) + "</span>";
  }).join("");
  const rows = cur.items.map(it => {
    const done = it.done(game.s, game);
    const note = it.note ? it.note(game.s, game) : null;
    return '<div class="td-row' + (done ? " done" : "") + '"><div class="td-box"></div><div class="td-main">' + esc(it.t) +
      (note ? '<span class="td-note">' + esc(note) + "</span>" : "") + "</div></div>";
  }).join("");
  const goal = typeof cur.goal === "function" ? cur.goal(game.s, game) : cur.goal;
  $("todoPop").innerHTML = '<div class="td-stages">' + pills + "</div>" +
    (goal ? '<div class="td-goal">' + esc(goal) + "</div>" : "") + rows;
}
$("gTodo").onclick = (e) => { e.stopPropagation(); renderTodo(); $("todoPop").classList.toggle("on"); };
document.addEventListener("click", (e) => {
  if (!e.target.closest("#todoPop") && !e.target.closest("#gTodo")) $("todoPop").classList.remove("on");
});

// ── acting ────────────────────────────────────────────────────────────────────
function doAct(nodeId, key, charId) {
  if (uiBusy || gameEnded()) return;
  // A room blocks out the rest of the world — and that has to include clicks.
  // The HUD behind a scene keeps whatever it rendered before the room opened
  // (renderSide doesn't run while the overlay is up), so its buttons are live,
  // stale, and worth a real action: answering one spent a move the room never
  // offered, and the week could end up with nothing left to spend. The engine
  // already flags those cards `onHold`; honour it here.
  const held = game.openActions().find(a => a.nodeId === nodeId);
  if (held && held.onHold) return;
  const preScene = game.scene;
  const preSeq = game._seq;
  game.act(nodeId, key);
  if (charId) threadRendered[charId] = game.threads[charId].length;
  // your own mid-week choices ink into the journal mirror at once (ungLowed);
  // only week-turn consequences get the reveal glow (advanceWeek captures jBefore here).
  jShown = journalMirror().length;

  // entering a scene → the world freezes; play its entry cinematic then the beats
  if (!preScene && game.scene) { enterScene(preSeq); return; }
  if (inScene) { focusFlow(); return; }

  render();
  if (game.s.game_over || game.s.game_won) { checkEndgame(); return; }
  scheduleTurn(620);
}

// ── focus-arc cinematic: staged lines, per-arc accent, click-to-skip ──────────
function showCine(lines, accent, done) {
  const el = $("cine"), box = $("lcInner"), skip = $("lcSkip");
  el.style.setProperty("--lc-accent", accent || "rgba(255,255,255,.95)");
  box.innerHTML = lines.map((t, i) => '<p class="lc-line' + (i === 0 ? " lc-title" : "") + '">' + esc(t) + "</p>").join("");
  el.classList.add("show");
  const nodes = box.querySelectorAll(".lc-line");
  nodes.forEach((n, i) => setTimeout(() => n.classList.add("vis"), 500 + i * 1250));
  let done2 = false, timer = null;
  const finish = () => {
    if (done2) return; done2 = true;
    if (timer) clearTimeout(timer); el.classList.remove("show"); skip.onclick = null; el.onclick = null;
    setTimeout(done, 700);
  };
  const total = 500 + (nodes.length - 1) * 1250 + 1500;
  timer = setTimeout(finish, total);
  skip.onclick = finish; el.onclick = finish;
}

// ── focus arcs: the same iMessage chat, restricted to the people in the room ──
// A scene is NOT a single merged transcript — each participant has their own
// private thread (that's how the story is written: "Jordan pipes up in her own
// thread while Alex confronts you in his"). We reuse the regular rail + thread,
// blocking out the rest of the app.
let lastSceneId = null, scTimer = null;

// The boundary between "before the room" and the room itself: the first message
// tagged with this scene's arc (its opening beat). Everything from there on in a
// participant's thread belongs to the sitting.
function computeSceneStart(arcId) {
  const arc = game.arcs.get(arcId);
  const ids = (arc ? arc.scene.cast : []).concat("founder");
  let min = Infinity;
  for (const id of ids) for (const m of (game.threads[id] || []))
    if (m.scene === arcId && (m.seq || 0) < min) min = m.seq || 0;
  return min;
}
// One participant's private thread, scoped to this sitting. Incoming lines must
// carry this scene's tag (so an unrelated open message — e.g. a founder journal
// prompt that happens to be waiting — never leaks in); the player's replies are
// scene answers by construction (non-cast characters are held during a scene).
function sceneThread(charId) {
  return (game.threads[charId] || []).filter(m => (m.seq || 0) >= sceneStartSeq &&
    (m.type === "reply" || (m.type === "incoming" && m.scene === lastSceneId)));
}
function sceneOpenBeats() {
  return game.scene ? game.openActions().filter(a => a.scene === game.scene.id && !a.onHold) : [];
}
function sceneOpenBeat(charId) { return sceneOpenBeats().find(a => a.charId === charId) || null; }
// The founder's own beats in a scene are private decisions (their thread is the
// journal), not a chat with yourself — they surface as a centered card, never as
// a rail thread. Everything else about the scene stays the same.
function sceneSelfBeat() { return sceneOpenBeats().find(a => SELF.has(a.charId)) || null; }
// Who shows in the room's rail: cast members who've said something or owe a
// reply — excluding the founder, whose decisions are the card, not a thread.
// Ordered by the game's rail order (cast declaration order) so a scene's roster
// matches the main chat list, regardless of how the arc lists its cast.
function sceneCast() {
  const arc = game.arcs.get(lastSceneId);
  return (arc ? arc.scene.cast : [])
    .filter(id => !SELF.has(id) && (sceneThread(id).length > 0 || sceneOpenBeat(id)))
    .sort((a, b) => game.order.indexOf(a) - game.order.indexOf(b));
}
function sceneUnread(charId) {
  return sceneThread(charId).slice(scRendered[charId] || 0).some(m => m.type === "incoming");
}

function enterScene(startSeq) {
  inScene = true;
  lastSceneId = game.scene.id;
  scRendered = {}; scHeadSig = null; scClockShown = null;
  if (scClockTimer) { clearInterval(scClockTimer); scClockTimer = null; }
  const start = computeSceneStart(lastSceneId);
  sceneStartSeq = isFinite(start) ? start : (startSeq != null ? startSeq : 0);
  const meta = SCENE_META[lastSceneId] || {};
  showCine(meta.enter || [meta.title || ""], meta.accent, () => {
    $("scene").classList.add("on");
    const beats = sceneOpenBeats().filter(a => !SELF.has(a.charId));
    scSelected = (beats[0] && beats[0].charId) || sceneCast()[0]
      || (game.scene && game.scene.scene.cast.find(id => !SELF.has(id)));
    openSceneThread(scSelected);
  });
}

// After an answer: the engine has already re-polled, so new beats may be
// waiting. We never switch threads for the player — a reply that continues the
// current conversation reveals here; anything said in another thread just lights
// its blue unread dot in the rail, iMessage-style, for the player to open.
function focusFlow() {
  openSceneThread(scSelected);
}

// Reveal a thread's unread bubbles with typing dots, then hand off to render.
function openSceneThread(charId) {
  scSelected = charId;
  const entries = sceneThread(charId);
  const from = scRendered[charId] || 0;
  if (from >= entries.length) { renderFocus(); return; }
  uiBusy = true;
  clearTimeout(scTimer);
  const step = () => {
    const cur = scRendered[charId] || 0;
    if (!inScene || charId !== scSelected || cur >= entries.length) { uiBusy = false; renderFocus(); return; }
    const typing = entries[cur].type === "incoming";
    renderFocus({ typing });
    scTimer = setTimeout(() => {
      scRendered[charId] = cur + 1;
      renderFocus();
      scTimer = setTimeout(step, typing ? 140 : 60);
    }, typing ? 550 : 90);
  };
  step();
}

// The scene header. For most arcs it's a plain title/sub/focus-note. Launch day
// gets the cinematic treatment: the sky walks the time of day, a giant clock
// ticks the hours, and a timeline shows the daylight burning down.
function renderSceneHead() {
  const meta = SCENE_META[lastSceneId] || {};
  const isLaunch = lastSceneId === "launch";
  $("scene").classList.toggle("launch", isLaunch);
  $("scene").style.background = isLaunch ? (LAUNCH_BG[game.s.launch_time] || LAUNCH_BG["8AM"]) : "";

  const sig = lastSceneId + "|" + (isLaunch ? (game.s.launch_time || "") : "");
  if (sig === scHeadSig) return;                       // no change → don't disturb a running clock tick
  const tick = isLaunch && scHeadSig && scHeadSig.indexOf("launch|") === 0;  // an hour advanced
  scHeadSig = sig;

  if (!isLaunch) {
    $("scHead").innerHTML = '<div class="sc-title">' + esc(meta.title || "") + "</div>" +
      '<div class="sc-sub">' + esc(meta.sub || "") + "</div>" +
      '<div class="sc-focusnote">everything else is on hold · these conversations are private · your moves here are free</div>';
    return;
  }
  const now = game.s.launch_time || "8AM";
  $("scHead").innerHTML = '<div class="launch-hero">' +
    '<div class="launch-clock">' + esc(scClockShown || now) + "</div>" +
    '<div class="launch-titleline">' + esc(meta.sub || "") + "</div></div>";
  // count the clock up to the new hour — a fast-forward through the minutes
  if (tick && scClockShown && scClockShown !== now) tickLaunchClock(scClockShown, now);
  else { const el = $("scHead").querySelector(".launch-clock"); if (el) el.textContent = now; scClockShown = now; }
}

// Launch clock ticker (ported from the original UI): spin the minutes forward
// from the last shown hour up to the new one, so the time visibly races ahead.
function launchMins(t) {
  const m = (t || "").match(/^(\d+)(AM|PM)$/i);
  if (!m) return 0;
  let h = parseInt(m[1], 10);
  if (m[2].toUpperCase() === "PM" && h !== 12) h += 12;
  if (m[2].toUpperCase() === "AM" && h === 12) h = 0;
  return h * 60;
}
function fmtLaunchMins(mins) {
  const h24 = Math.floor(mins / 60) % 24, mm = mins % 60, h12 = h24 % 12 || 12;
  return mm === 0 ? h12 + (h24 >= 12 ? "PM" : "AM") : h12 + ":" + String(mm).padStart(2, "0");
}
function tickLaunchClock(fromStr, toStr) {
  if (scClockTimer) { clearInterval(scClockTimer); scClockTimer = null; }
  const el = $("scHead").querySelector(".launch-clock");
  if (!el) { scClockShown = toStr; return; }
  const fromM = launchMins(fromStr), toM = launchMins(toStr);
  if (toM <= fromM) { el.textContent = toStr; scClockShown = toStr; return; }
  const step = Math.max(1, Math.round((toM - fromM) / 24));
  let cur = fromM;
  el.classList.add("counting");
  scClockTimer = setInterval(() => {
    cur = Math.min(cur + step, toM);
    if (cur >= toM) {
      clearInterval(scClockTimer); scClockTimer = null;
      if (el.isConnected) { el.textContent = toStr; el.classList.remove("counting"); }
      scClockShown = toStr;
    } else if (el.isConnected) {
      el.textContent = fmtLaunchMins(cur);
    }
  }, 55);
}

function renderFocus(opts) {
  opts = opts || {};
  renderSceneHead();

  // rail: one row per person in the room (reuses the regular conversation rail)
  const cast = sceneCast();
  $("scRail").innerHTML = cast.map(id => {
    const def = game.cast.get(id).def, stl = styleFor(id), t = sceneThread(id);
    const last = t.length ? t[t.length - 1] : null;
    const unread = sceneUnread(id) && id !== scSelected;
    const prev = last ? (last.type === "reply" ? "You: " : "") + String(last.body || "").replace(/\s+/g, " ") : (def.role || "");
    return '<div class="conv ' + (id === scSelected ? "cur" : "") + (unread ? " unread" : "") + '" data-id="' + id + '">' +
      '<span class="unread-dot"></span>' +
      '<div class="av" style="background:' + stl.color + '">' + esc(stl.initials) + "</div>" +
      '<div class="who"><b>' + esc(def.name) + '</b><span>' + esc(prev.slice(0, 52)) + "</span></div></div>";
  }).join("");
  for (const el of $("scRail").querySelectorAll(".conv")) {
    el.onclick = () => { if (!uiBusy && el.dataset.id !== scSelected) openSceneThread(el.dataset.id); };
  }

  renderFocusThread(opts);
  renderSceneSelfDecision(opts);
}

// The founder's own open beat in a scene — the impasse call, the signing — is a
// private decision, so it's a centered card over the room instead of a "You"
// chat. Shows while such a beat is open and the room isn't mid-typing; answering
// runs the same doAct path (which re-polls and continues the sitting).
function renderSceneSelfDecision(opts) {
  opts = opts || {};
  const ov = $("scSelfOv");
  const beat = (inScene && game.scene && !uiBusy && !opts.typing) ? sceneSelfBeat() : null;
  if (!beat) { ov.classList.remove("on"); return; }
  const gk = gatedKeys(beat.nodeId);
  $("scSelfModal").innerHTML =
    '<div class="ss-tag">Your call</div>' +
    '<div class="ss-body">' + esc(beat.body) + "</div>" +
    (beat.subtext ? '<div class="ss-sub">' + esc(beat.subtext) + "</div>" : "") +
    '<div class="ss-choices">' +
    beat.options.map(o => '<button class="chip' + (gk.has(o.key) ? " gated" : "") + '" data-n="' + esc(beat.nodeId) + '" data-k="' + esc(o.key) + '">' +
      (gk.has(o.key) ? "⚑ " : "") + esc(o.label) + "</button>").join("") +
    "</div>";
  for (const b of $("scSelfModal").querySelectorAll(".chip")) {
    b.onclick = () => { if (!uiBusy) doAct(b.dataset.n, b.dataset.k, "founder"); };
  }
  ov.classList.add("on");
}

function renderFocusThread(opts) {
  opts = opts || {};
  const c = scSelected && game.cast.get(scSelected);
  if (!c) { $("scChatHead").innerHTML = ""; $("scThread").innerHTML = ""; $("scReply").innerHTML = ""; return; }
  $("scChatHead").innerHTML = "<b>" + esc(c.def.name) + "</b><span>" + esc(c.def.role || "") + "</span>";

  const t = sceneThread(scSelected);
  const shown = scRendered[scSelected] || 0;
  let html = "";
  t.slice(0, shown).forEach((m, i) => {
    const next = i + 1 < shown ? t[i + 1] : null;
    const tail = !next || next.type !== m.type;
    const anim = i === shown - 1 ? " msg-new" : "";
    if (m.type === "reply") html += '<div class="m-out' + (tail ? " tail" : "") + anim + '">' + esc(m.body) + "</div>";
    else {
      html += '<div class="m-in' + (tail ? " tail" : "") + anim + '">' + esc(m.body) + "</div>";
      if (m.subtext) html += '<div class="m-sub">' + esc(m.subtext) + "</div>";
      if (m.mockups) html += mockupRowHtml(m.mockups);
    }
  });
  if (opts.typing) html += '<div class="typing"><i></i><i></i><i></i></div>';
  const el = $("scThread");
  el.innerHTML = html || '<div class="m-wk">…</div>';
  el.scrollTop = el.scrollHeight;
  // wire mockup thumbnails → lightbox (same pattern as the main thread renderer)
  const mkMsgs = t.slice(0, shown).filter(m => m.mockups);
  el.querySelectorAll(".mk-row").forEach((row, i) => {
    const mk = mkMsgs[i] && mkMsgs[i].mockups;
    if (!mk) return;
    for (const th of row.querySelectorAll(".mk-thumb")) th.onclick = () => openMockupLightbox(mk, th.dataset.mk);
  });

  // composer: this thread's open beat, or a nudge toward whoever's waiting
  const rbox = $("scReply");
  if (uiBusy || opts.typing) { rbox.innerHTML = '<div class="who-asks">…</div>'; return; }
  if (!game.scene) {
    rbox.innerHTML = '<button id="scDone">Back to the week →</button>';
    $("scDone").onclick = exitScene;
    return;
  }
  const beat = sceneOpenBeat(scSelected);
  if (beat) {
    const gk = gatedKeys(beat.nodeId);
    rbox.innerHTML = '<div class="who-asks">reply to ' + esc(c.def.name) + ' <span class="free">· moves in the room are free</span></div>' +
      beat.options.map(o => '<button class="chip' + (gk.has(o.key) ? " gated" : "") + '" data-n="' + esc(beat.nodeId) + '" data-k="' + esc(o.key) + '">' +
        (gk.has(o.key) ? "⚑ " : "") + esc(o.label) + "</button>").join("");
    for (const b of rbox.querySelectorAll(".chip")) b.onclick = () => { if (!uiBusy) doAct(b.dataset.n, b.dataset.k, scSelected); };
    return;
  }
  const waiting = sceneOpenBeats().filter(a => !SELF.has(a.charId));
  if (waiting.length) {
    // Nudge toward whoever texted back in another thread — and make it a live
    // button, so the reply you provoked elsewhere is one click away (the scene
    // still never auto-switches for you).
    rbox.innerHTML = '<div class="who-asks">nothing to add here — ' + esc(waiting[0].name) + " texted back →</div>" +
      '<button class="chip" data-goto="' + esc(waiting[0].charId) + '">Open ' + esc(waiting[0].name) + "'s thread →</button>";
    const b = rbox.querySelector(".chip");
    if (b) b.onclick = () => { if (!uiBusy) openSceneThread(b.dataset.goto); };
    return;
  }
  rbox.innerHTML = '<div class="who-asks">the room is quiet…</div>';
}

function exitScene() {
  clearTimeout(scTimer);
  if (scClockTimer) { clearInterval(scClockTimer); scClockTimer = null; }
  $("scSelfOv").classList.remove("on");
  $("scene").classList.remove("on", "launch");
  $("scene").style.background = "";
  for (const id of game.order) threadRendered[id] = game.threads[id].length;
  const meta = SCENE_META[lastSceneId] || {};
  const lines = meta.exit ? meta.exit(game.s) : null;
  const back = () => {
    inScene = false; scSelected = null; jShown = journalMirror().length;
    render(); checkEndgame();
    // The beats in a room are free, but the week around it is not: the answer
    // that OPENS a room can be a paid one (Jordan's confrontation, the summit
    // call, the ship call), and doAct returns into enterScene() before it can
    // schedule the turn. Without this the player comes back to a spent week
    // with nothing to answer and no End-week pill — stuck on the same week.
    scheduleTurn(620);
  };
  if (lines) showCine(lines, meta.accent, back); else back();
}

// ── when the week turns by itself ─────────────────────────────────────────────
// Two cases: both moves are spent, or there is nothing left to answer at all.
// The second is a safety net behind the "every live week offers at least one
// action" invariant (Layer C of tests/test_narrative.js) — if the content ever
// leaves a hole, the player rolls through it instead of staring at an empty
// triage. The End-week pill still covers the ordinary ambient-only week, where
// the cards are real and skipping them IS the choice.
function scheduleTurn(delay) {
  if (uiBusy || game.scene || game.s.game_over || game.s.game_won) return false;
  const nothingToAnswer = game.openActions().every(a => a.onHold);
  if (game.actionsLeft > 0 && !nothingToAnswer) return false;
  uiBusy = true; renderHeader(); setTimeout(advanceWeek, delay);
  return true;
}

// ── the week turn: the reveal, in the old order ──────────────────────────────
// runway counts down → the journal beat LEADS (column glows, entries ink in) →
// a beat later the phone buzzes, one notification every 750ms → the active
// thread refreshes only after its own notification → changed stats pulse.
function advanceWeek() {
  clearTimeout(noteTimer); noteTimer = null; noteQueue = [];
  const beforeTodo = todoSnapshot();
  const beforeLens = {};
  for (const id of game.order) beforeLens[id] = game.threads[id].length;
  const jBefore = journalMirror().length;
  const cashBefore = game.stats().cash;
  const sig = game.stats().signal, fit = game.stats().marketFit, us = game.s.users, pay = game.s.customers;

  game.nextWeek();

  pendingStatPulse = [];
  if (game.stats().signal !== sig) pendingStatPulse.push("signal");
  if (game.stats().marketFit !== fit) pendingStatPulse.push("fit");
  if (game.s.users !== us) pendingStatPulse.push("users");
  if (game.s.customers !== pay) pendingStatPulse.push("paying");

  // gather this week's notifications (todo check-offs first, then arrivals)
  weekNotes = [];
  const afterTodo = todoSnapshot();
  for (const key of afterTodo) if (!beforeTodo.has(key)) {
    weekNotes.push({ ico: "✓", color: "#1d8f3c", title: "Reminders", text: "Checked off: " + key.split("|")[1],
      go: () => { renderTodo(); $("todoPop").classList.add("on"); } });
  }
  for (const id of game.order) {
    const fresh = game.threads[id].slice(beforeLens[id]).filter(m => m.type === "incoming");
    if (!fresh.length) continue;
    const feed = FEED.has(id), def = game.cast.get(id).def, stl = styleFor(id);
    const name = feed ? FEED_META[id].src.split("·").pop().trim() : def.name;
    const dropped = fresh.some(m => m.dropped);
    weekNotes.push({
      ico: stl.initials, color: feed ? "#3a3a40" : stl.color, charId: id, feed,
      title: name + (dropped ? " · you left them on read" : fresh.length > 1 ? " (" + fresh.length + ")" : ""),
      text: String(fresh[fresh.length - 1].body || ""),
      go: feed ? () => setSurface("feed")
        : () => { selected = id; replyExpanded = false; threadRendered[id] = game.threads[id].length; surface = "msgs"; syncSurfaceTabs(); openThread(); render(); },
    });
  }
  notesSeen = weekNotes.length === 0;

  // 1) runway counts down, header refreshes to "week N"
  animateRunway(cashBefore, game.stats().cash, () => {
    // 2) the journal beat leads: ink the mirror entries in one at a time, glowing
    revealJournal(jBefore, () => {
      // 3) a beat later, the notifications buzz
      setTimeout(startNotifications, 420);
    });
  });

  function startNotifications() {
    updateBell();
    queueNotifications(weekNotes);
    // the active thread refreshes only after its own notification shows
    if (surface === "msgs" && threadRendered[selected] < game.threads[selected].length) {
      const idx = weekNotes.findIndex(n => n.charId === selected);
      const delay = idx >= 0 ? idx * 750 + 650 : 380;
      setTimeout(() => { if (surface === "msgs") openThread(); }, delay);
    }
    // the run may have ended this week
    if (game.s.game_won || game.s.game_over) {
      setTimeout(checkEndgame, weekNotes.length ? 1700 : 700);
    }
    uiBusy = false;
    // The reveal above only redraws the header, the journal and the triage —
    // the rail's unread dots and previews used to ride on openThread()'s
    // closing render(), which fires only when the thread you're STANDING IN
    // got something. On any other week the rail kept showing last week: no
    // blue dot for the person who just texted you, and a stale preview line.
    // Refresh with the buzz instead, so the dots land with the notification.
    render();
    // A week that opened with nothing to answer turns straight through.
    scheduleTurn(900);
  }
}
// runway digit + bar count from → to (fast, ~500ms)
function animateRunway(fromCash, toCash, done) {
  const steps = 16; let i = 0;
  const tick = () => {
    i++;
    const cash = Math.round(fromCash + (toCash - fromCash) * (i / steps));
    const runway = Math.floor(cash / game.burnPerWeek);
    $("hWeek").textContent = "Week " + game.s.week;
    $("gRunV").textContent = runway + " wks · " + money(cash);
    $("gRunB").style.width = Math.min(100, (runway / 20) * 100) + "%";
    $("gRunB").style.background = runway <= 4 ? "var(--red)" : runway <= 8 ? "var(--amber)" : "var(--green)";
    if (i < steps) revealTimer = setTimeout(tick, 30); else done();
  };
  tick();
}
// ink the journal-mirror entries in one at a time (340ms; stamps 480ms), glowing
function revealJournal(from, done) {
  const total = journalMirror().length;
  if (from >= total) { jShown = total; renderSide(); done(); return; }
  let i = from;
  const step = () => {
    if (i >= total) { jShown = total; jArrive = false; renderSide(); renderHeader(); done(); return; }
    const m = journalMirror()[i];
    jShown = i + 1; jArrive = true;
    renderSide();
    revealTimer = setTimeout(() => { i++; step(); }, m.type === "stamp" ? 480 : 340);
  };
  step();
}

// ── iPhone notifications, anchored under the bell ─────────────────────────────
function queueNotifications(list) { noteQueue = noteQueue.concat(list); if (!noteTimer) pumpNotifications(); }
function pumpNotifications() {
  if (!noteQueue.length) { noteTimer = null; return; }
  showNotif(noteQueue.shift());
  noteTimer = setTimeout(pumpNotifications, 750);
}
function showNotif(n) {
  const el = document.createElement("div");
  el.className = "notif";
  el.innerHTML = '<div class="n-ico" style="background:' + (n.color || "#8a8a92") + '">' + esc(n.ico) + "</div>" +
    '<div class="n-b"><div class="n-title"><span>' + esc(n.title) + '</span><span class="n-time">now</span></div>' +
    '<div class="n-text">' + esc(n.text) + "</div></div>";
  let gone = false;
  const dismiss = () => { if (gone) return; gone = true; el.classList.add("hide"); setTimeout(() => el.remove(), 300); };
  el.onclick = () => { dismiss(); if (!uiBusy && n.go) n.go(); };
  $("notifs").appendChild(el);
  setTimeout(dismiss, 6500);
}
// the bell reopens this week's notifications (the notification center)
function updateBell() {
  const b = $("bellBadge");
  if (weekNotes.length && !notesSeen) { b.textContent = weekNotes.length; b.style.display = "grid"; }
  else b.style.display = "none";
}
function toggleNoteCenter() {
  const c = $("noteCenter");
  if (c.classList.contains("show")) { c.classList.remove("show"); return; }
  if (!weekNotes.length) { c.innerHTML = '<h4>This week</h4><div class="nc-empty">No notifications this week.</div>'; }
  else c.innerHTML = '<h4>This week · ' + weekNotes.length + " notification" + (weekNotes.length === 1 ? "" : "s") + "</h4>" +
    weekNotes.map((n, i) => '<div class="nc-item" data-i="' + i + '"><div class="n-ico" style="width:34px;height:34px;border-radius:9px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;background:' + (n.color || "#8a8a92") + '">' + esc(n.ico) + "</div>" +
      '<div class="n-b"><div class="n-title">' + esc(n.title) + '</div><div class="n-text" style="font-size:12px;color:#3a3a40">' + esc(n.text) + "</div></div></div>").join("");
  c.classList.add("show");
  notesSeen = true; updateBell();
  for (const el of c.querySelectorAll(".nc-item")) el.onclick = () => {
    const n = weekNotes[+el.dataset.i]; c.classList.remove("show");
    if (!uiBusy && n && n.go) n.go();
  };
}
$("bell").onclick = (e) => { e.stopPropagation(); toggleNoteCenter(); };
document.addEventListener("click", (e) => {
  if (!e.target.closest("#noteCenter") && !e.target.closest("#bell")) $("noteCenter").classList.remove("show");
});

// ── leaderboard ─────────────────────────────────────────────────────────────
// One endpoint, two verbs: GET the top-50 board, POST a finished run. When the
// server (leaderboard.php) is unreachable — playing from file://, or no backend
// deployed — everything falls back to a per-browser localStorage board so the
// game still has a ladder to climb. Same code path either way.
const LB = (function () {
  const ENDPOINT = "leaderboard.php";
  const LKEY = "plusone_leaderboard";
  const MAX = 50;

  const readLocal = () => { try { return JSON.parse(localStorage.getItem(LKEY)) || []; } catch { return []; } };
  const writeLocal = b => { try { localStorage.setItem(LKEY, JSON.stringify(b)); } catch {} };
  const sortBoard = b => b.slice().sort((a, c) => c.score - a.score || a.ts - c.ts);
  function insertLocal(entry) {
    const board = sortBoard(readLocal().concat([entry]));
    const rank = board.findIndex(e => e === entry) + 1;   // place before truncation
    const top = board.slice(0, MAX);
    writeLocal(top);
    return { board: top, rank, online: false };
  }
  // Would this score make the board? (Full board → must strictly beat the last seat.)
  function qualifies(board, score) {
    if (score == null) return false;
    return board.length < MAX || score > board[board.length - 1].score;
  }
  async function fetchBoard() {
    try {
      const r = await fetch(ENDPOINT, { cache: "no-store" });
      if (!r.ok) throw 0;
      const data = await r.json();
      if (!Array.isArray(data)) throw 0;
      return { board: data, online: true };
    } catch { return { board: sortBoard(readLocal()), online: false }; }
  }
  async function submit(entry) {
    entry.ts = entry.ts || Date.now();
    try { localStorage.setItem("plusone_name", entry.name); } catch {}
    try {
      const r = await fetch(ENDPOINT, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(entry),
      });
      if (!r.ok) throw 0;
      const data = await r.json();
      if (!Array.isArray(data.board)) throw 0;
      // Mirror the accepted run locally too, so an offline replay still sees it.
      writeLocal(sortBoard(readLocal().concat([entry])).slice(0, MAX));
      return { board: data.board, rank: data.rank, online: true };
    } catch { return insertLocal(entry); }
  }
  const lastName = () => { try { return localStorage.getItem("plusone_name") || ""; } catch { return ""; } };
  return { MAX, qualifies, fetchBoard, submit, lastName };
})();

const MEDAL = ["🥇", "🥈", "🥉"];
function lbRowsHtml(board, meIndex) {
  if (!board.length) return '<div class="lb-empty">No runs yet — be the first name on the board.</div>';
  return '<div class="lb-list">' + board.map((e, i) => {
    const medal = i < 3 ? '<span class="lb-medal">' + MEDAL[i] + "</span>" : "";
    const tag = e.won ? '<span class="lb-tag"> · YC</span>' : "";
    return '<div class="lb-row' + (i === meIndex ? " me" : "") + '">'
      + '<div class="lb-rank">' + (i + 1) + "</div>"
      + '<div class="lb-name">' + medal + esc(e.name || "Anonymous") + tag + "</div>"
      + '<div class="lb-score">' + e.score + "</div></div>";
  }).join("") + "</div>";
}
function lbHeadHtml(online, title) {
  return '<div class="lb-head"><span class="lb-title">' + esc(title) + "</span>"
    + '<span class="lb-scope' + (online ? "" : " offline") + '">'
    + (online ? "All time · top " + LB.MAX : "This device") + "</span></div>";
}

// ── endgame ───────────────────────────────────────────────────────────────────
const GRADE = s => s == null ? ["—", "#c9c9d0"] : s >= 85 ? ["A", "#1d8f3c"] : s >= 70 ? ["B", "#4a9a4a"] : s >= 55 ? ["C", "#c9922a"] : s >= 40 ? ["D", "#c96a2a"] : ["F", "#c0392b"];

// The report card plays as a slow reveal: line items ink in one at a time, each
// grade badge "grading…" then popping to its letter, then the final grade, and
// only at the very end whether the run made the batch. egTimers holds the
// pending steps so a tap can fast-forward to the full card (egFinish).
let egTimers = [];
let egDone = true;
let egScore = null, egWon = false, egWeek = 0, egLbMounted = false, egCardHtml = "";
let egSubmitted = false, egSubmittedRank = null;   // this run's leaderboard entry, once posted — sticky across report-card reopens
function egClearTimers() { egTimers.forEach(clearTimeout); egTimers = []; }
function egRevealBadge(el) {
  if (!el) return;
  el.classList.remove("pending");
  if (el.dataset.col) el.style.background = el.dataset.col;
  el.classList.add("pop");
}
function egFinish() {
  egClearTimers();
  document.querySelectorAll("#endModal .eg-reveal").forEach(e => e.classList.add("in"));
  document.querySelectorAll("#endModal .grade.pending").forEach(egRevealBadge);
  const hint = $("egSkipHint"); if (hint) hint.style.opacity = "0";
  egDone = true;
  mountEndgameLeaderboard();
}
function egRunReveal() {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) { egFinish(); return; }
  egClearTimers();
  egDone = false;
  const rows = [...document.querySelectorAll("#egRows .grade-row")];
  const STEP = 640, BADGE = 360;
  let t = 350;
  for (const row of rows) {
    egTimers.push(setTimeout(() => { row.classList.add("in"); row.scrollIntoView({ behavior: "smooth", block: "nearest" }); }, t));
    egTimers.push(setTimeout(() => egRevealBadge(row.querySelector(".grade")), t + BADGE));
    t += STEP;
  }
  t += 300;
  egTimers.push(setTimeout(() => {
    const roll = $("egRollup");
    if (roll) { roll.classList.add("in"); roll.scrollIntoView({ behavior: "smooth", block: "nearest" });
      egTimers.push(setTimeout(() => egRevealBadge(roll.querySelector(".grade")), 360)); }
  }, t));
  t += 1050;
  egTimers.push(setTimeout(() => {
    const out = $("egOutcome");
    if (out) { out.classList.add("in"); out.scrollIntoView({ behavior: "smooth", block: "center" }); }
    const btn = $("egBtn"); if (btn) btn.classList.add("in");
    const hint = $("egSkipHint"); if (hint) hint.style.opacity = "0";
    egDone = true;
    mountEndgameLeaderboard();
  }, t));
}
// Fetch the board once the reveal lands, then either offer name-entry (top 50)
// or just show the ladder with where this run placed. Idempotent — the reveal
// and the tap-to-skip path both call it. Once this run has actually posted a
// score (egSubmitted), reopening the report card must never re-offer the
// entry form — that's how the same run got submitted over and over.
async function mountEndgameLeaderboard() {
  if (egLbMounted) return;
  egLbMounted = true;
  const slot = $("egLeaderboard");
  if (!slot) return;
  slot.innerHTML = '<div class="lb"><div class="lb-loading">Loading the leaderboard…</div></div>';
  const { board, online } = await LB.fetchBoard();
  if ($("egLeaderboard") !== slot) return;   // player restarted mid-fetch
  if (egSubmitted) { renderEndgameLadder(slot, board, online, egSubmittedRank); return; }
  if (LB.qualifies(board, egScore)) { renderEndgameEntry(slot, board, online); return; }
  renderEndgameLadder(slot, board, online, null);
}
function renderEndgameLadder(slot, board, online, myRank) {
  const meIndex = myRank && myRank <= board.length ? myRank - 1 : -1;
  const wouldRank = meIndex < 0 && egScore != null ? board.filter(e => e.score > egScore).length + 1 : null;
  slot.innerHTML = '<div class="lb">' + lbHeadHtml(online, "Leaderboard") + lbRowsHtml(board, meIndex)
    + (wouldRank ? '<div class="lb-empty">You placed #' + wouldRank + " — the top " + LB.MAX + " makes the board. Run it back to climb.</div>" : "")
    + "</div>";
}
function renderEndgameEntry(slot, board, online) {
  const rank = board.filter(e => e.score > egScore).length + 1;
  slot.innerHTML =
    '<div class="lb-entry"><b>🏆 You made the leaderboard!</b>'
    + '<div class="lb-entry-sub">Provisional #' + rank + " of " + LB.MAX + " · grade " + egScore + "</div>"
    + '<div class="lb-entry-form"><input id="lbName" maxlength="16" placeholder="Your name" value="'
      + esc(LB.lastName()) + '" autocomplete="off"><button id="lbSubmit">Add me</button></div></div>'
    + '<div class="lb">' + lbHeadHtml(online, "Leaderboard") + lbRowsHtml(board, -1) + "</div>";
  const input = $("lbName"), btn = $("lbSubmit");
  const go = async () => {
    if (btn.disabled) return;
    btn.disabled = true; input.disabled = true; btn.textContent = "…";
    const res = await LB.submit({ name: input.value, score: egScore, won: egWon, week: egWeek });
    egSubmitted = true; egSubmittedRank = res.rank || null;
    const meIndex = res.rank && res.rank <= res.board.length ? res.rank - 1 : -1;
    slot.innerHTML = '<div class="lb">' + lbHeadHtml(res.online, "Leaderboard") + lbRowsHtml(res.board, meIndex)
      + (meIndex < 0 && res.rank ? '<div class="lb-empty">You placed #' + res.rank + ".</div>" : "")
      + "</div>";
  };
  btn.onclick = go;
  input.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  input.focus();
}
function checkEndgame() {
  const s = game.s;
  if (!s.game_over && !s.game_won) return;
  if ($("endOv").classList.contains("on")) return;   // reveal already running/shown
  const cats = Scoring.scoreGame(game);
  const avg = game.gradeScore();
  const [og, ocol] = GRADE(avg);
  egScore = avg; egWon = !!s.ycAccepted; egWeek = s.week; egLbMounted = false;
  egSubmitted = false; egSubmittedRank = null;

  // Outcome copy — built now but held back until the very last reveal step.
  const madeYC = s.ycAccepted;
  const emoji = madeYC ? "🎉" : s.deadline_passed ? "⏳" : s.cofounder_left ? "🚪" : "🕰️";
  const title = madeYC ? "You're in."
    : s.deadline_passed ? "The deadline came and went."
      : s.cofounder_left ? "Alex took the other offer." : "Out of runway.";
  const sub = madeYC ? "Your grade cleared the bar — welcome to the batch. The company lives."
    : s.deadline_passed ? "Graded at the deadline — the bar wasn't cleared. Here's the company you built anyway."
      : s.cofounder_left ? "Week " + s.week + ", and the person who was building the product is gone. There's no version of the next "
        + Math.max(0, s.deadline_week - s.week) + " weeks where you ship, launch and sell this alone — so this is where the run ends."
        : "Cash hit zero at week " + s.week + ".";
  const batch = madeYC
    ? '<div class="eg-batch">YC Summer 2027 · $500k for 7%</div>'
    : s.deadline_passed ? '<div class="eg-batch" style="background:var(--soft);color:#55555c">Missed the bar · needs a B+</div>' : "";

  const rowsHtml = cats.map(c => {
    const [g, col] = GRADE(c.score);
    return '<div class="grade-row eg-reveal">'
      + '<div class="grade pending" data-col="' + col + '"><span class="gl">' + g + "</span></div>"
      + '<div class="g-body"><b>' + esc(c.label) + "</b>"
      + '<div class="g-verdict">' + esc(c.verdict) + (c.notes && c.notes[0] ? " — " + esc(c.notes[0]) : "") + "</div>"
      + '<div class="g-ref">' + esc(c.ref) + "</div></div></div>";
  }).join("");

  $("endModal").innerHTML =
    '<div class="eg-cardhead"><div class="eg-eyebrow">Founder Report Card</div>'
      + '<div class="eg-headline">Week ' + s.week + " — grading the calls you made.</div></div>"
    + '<div id="egRows">' + rowsHtml + "</div>"
    + '<div id="egRollup" class="eg-rollup eg-final eg-reveal">'
      + '<div class="grade eg-biggrade pending" data-col="' + ocol + '"><span class="gl">' + og + "</span></div>"
      + '<div class="eg-roll-copy"><b>Final grade</b><br>Averaged across the lessons you actually faced.</div></div>'
    + '<div id="egOutcome" class="eg-outcome eg-reveal"><div class="eg-emoji">' + emoji + "</div>"
      + '<h2 class="eg-title">' + esc(title) + "</h2>"
      + '<div class="sub eg-sub">' + esc(sub) + "</div>" + batch + "</div>"
    + '<div id="egLeaderboard"></div>'
    + '<button id="egBtn" class="ok eg-reveal" onclick="closeReportCard()">OK</button>'
    + '<div id="egSkipHint" class="eg-skiphint">tap anywhere to reveal faster</div>';

  egCardHtml = $("endModal").innerHTML;
  $("endOv").classList.add("on");
  egRunReveal();
}
// Tap the card (anywhere but the button) to fast-forward the reveal.
$("endModal").addEventListener("click", (e) => {
  if (e.target.closest(".ok")) return;
  if (!egDone) egFinish();
});
// Dismissing the report card doesn't end the session — it drops the player
// back into the chat history of the run they just played (read-only: doAct,
// renderSide and renderThread all gate on gameEnded()). The score itself
// stays one tap away via the header's Report card button.
function closeReportCard() {
  egClearTimers();
  $("endOv").classList.remove("on");
  render();
}
function openReportCard() {
  if (!gameEnded() || !egCardHtml) return;
  $("endModal").innerHTML = egCardHtml;
  $("endOv").classList.add("on");
  egLbMounted = false;   // re-fetch the leaderboard fresh on reopen
  egFinish();
}
$("hScore").onclick = openReportCard;
function restartGame() {
  if (!confirm("Start a new run? " + (gameEnded() ? "This run's chat history won't be reachable afterward." : "Your current progress will be lost."))) return;
  location.search = "?seed=" + ((Date.now() % 100000) | 0);
}
$("hRestart").onclick = restartGame;

// ── intro ─────────────────────────────────────────────────────────────────────
const INTRO = [
  ["The team", "You're the founder.", "PlusOne is a dating app for people sick of swiping — and it exists mostly in your co-founders' heads. You have $10,000, two moves a week, and 25 weeks until the YC deadline. Build something worth the batch before the clock — or the cash — runs out."],
  ["How it works", "Everything is a conversation.", "People text you — answer them in their thread. Your own moves show up under “This week”, and the outside world talks in the News Feed. Some messages won't wait forever."],
  ["The throttle", "Decisions move the build.", "Answering your co-founders' questions is what moves the ☑ list in the header. Ignore them and the build crawls, trust leaks, and the story goes on without you. End the week when your two moves are spent."],
];
let introStep = 0;
// A "Hall of Fame" board rides as the final intro step (index INTRO.length) —
// a new player sees the bar to beat before week 1.
function showIntro() {
  const boardStep = introStep >= INTRO.length;
  const dots = INTRO.concat([0]).map((_, i) => '<i class="' + (i === introStep ? "on" : "") + '"></i>').join("");
  const nextLabel = boardStep ? "Week 1 →" : "Continue →";
  if (boardStep) {
    $("introModal").innerHTML =
      '<div class="intro-stripe"></div><div class="intro-board">' +
      '<div class="intro-eyebrow">Hall of Fame</div>' +
      '<div class="intro-step"><b>Beat the board.</b>Every finished run is graded 0–100. Land in the top ' + LB.MAX +
        " and your name goes up here for good.</div>" +
      '<div id="introLb"><div class="lb"><div class="lb-loading">Loading the leaderboard…</div></div></div>' +
      '<div class="intro-foot"><div class="intro-dots">' + dots + "</div>" +
      '<div class="intro-actions"><button class="intro-next">' + nextLabel + "</button></div></div></div>";
  } else {
    const [eyebrow, h, b] = INTRO[introStep];
    $("introModal").innerHTML =
      '<div class="intro-stripe"></div><div class="intro-body">' +
      '<div class="intro-eyebrow">' + esc(eyebrow) + "</div>" +
      '<div class="intro-step"><b>' + esc(h) + "</b>" + esc(b) + "</div>" +
      '<div class="intro-foot"><div class="intro-dots">' + dots + "</div>" +
      '<div class="intro-actions"><button class="intro-skip">skip</button>' +
      '<button class="intro-next">' + nextLabel + "</button></div></div></div>";
  }
  const done = () => { $("introOv").classList.remove("on"); };
  $("introModal").querySelector(".intro-next").onclick = () => { introStep++; if (introStep > INTRO.length) done(); else showIntro(); };
  const sk = $("introModal").querySelector(".intro-skip"); if (sk) sk.onclick = done;
  $("introOv").classList.add("on");
  if (boardStep) fillIntroBoard();
}
async function fillIntroBoard() {
  const { board, online } = await LB.fetchBoard();
  const el = $("introLb");
  if (!el) return;   // intro already dismissed
  el.innerHTML = '<div class="lb">' + lbHeadHtml(online, "Top founders") + lbRowsHtml(board.slice(0, 8), -1) + "</div>";
}
showIntro();

// ── surfaces + orchestration ──────────────────────────────────────────────────
function syncSurfaceTabs() {
  for (const b of document.querySelectorAll("nav.surfaces button")) b.classList.toggle("cur", b.dataset.surface === surface);
  $("msgsSurface").classList.toggle("cur", surface === "msgs");
  $("feedSurface").classList.toggle("cur", surface === "feed");
  $("bankSurface").classList.toggle("cur", surface === "bank");
  // the runway gauge doubles as the Bank tab's entry point — light it when open
  $("gRunway").classList.toggle("cur", surface === "bank");
}
function setSurface(sf) {
  if (uiBusy) return;
  surface = sf; syncSurfaceTabs();
  if (sf === "msgs") openThread();   // reveal any unread on entry
  render();
}
for (const b of document.querySelectorAll("nav.surfaces button")) b.onclick = () => setSurface(b.dataset.surface);
$("gRunway").onclick = () => setSurface(surface === "bank" ? "msgs" : "bank");

function render() {
  // viewing the feed marks its posts seen before the badge is computed, so the
  // News Feed badge clears the moment you're looking at it.
  if (surface === "feed") for (const id of FEED) feedSeenLen[id] = game.threads[id].length;
  renderHeader();
  if (surface === "msgs") { renderRail(); renderThread(); }
  if (surface === "feed") renderFeed();
  if (surface === "bank") renderBank();
  renderSide();
  if ($("todoPop").classList.contains("on")) renderTodo();
}

// ── debug ─────────────────────────────────────────────────────────────────────
$("dbgSeed").value = seed;
const dbgSeed = () => { const v = parseInt($("dbgSeed").value, 10); return Number.isFinite(v) ? v : seed; };
function dbgReset() {
  clearTimeout(revealTimer); clearTimeout(noteTimer); noteTimer = null;
  egClearTimers(); egDone = true;
  $("scene").classList.remove("on"); $("cine").classList.remove("show");
  $("endOv").classList.remove("on"); $("noteCenter").classList.remove("show");
  [...$("notifs").children].forEach(e => e.remove());
}
for (const btn of document.querySelectorAll("#debug [data-jump]")) {
  btn.onclick = () => {
    seed = dbgSeed();
    game = Harness.jumpTo(btn.dataset.jump, { seed, subsidy: 600 });
    resetUiState(); dbgReset();
    // leave fresh arrivals unread so the state reads naturally, but the thread
    // you land on is read (like opening the app on your current chat)
    for (const id of game.order) threadRendered[id] = Math.max(0, game.threads[id].length - 2);
    threadRendered[selected] = game.threads[selected].length;
    render();
  };
}
$("dbgSkip").onclick = () => { if (uiBusy) return; for (let i = 0; i < 5 && !game.s.game_over && !game.s.game_won; i++) game.nextWeek(); resetUiState(); render(); checkEndgame(); };
// Auto-play decent runs from the seed box until one reaches the deadline
// having been accepted into YC (grade decided it), then jump to its reveal.
$("dbgYC").onclick = () => {
  const base = dbgSeed();
  let g = Harness.playGame(base, "decent"), used = base;
  for (let i = 1; i < 200 && !g.s.ycAccepted; i++) {
    used = base + i;
    g = Harness.playGame(used, "decent");
  }
  seed = used; $("dbgSeed").value = used;
  game = g;
  resetUiState(); dbgReset(); render(); checkEndgame();
};
$("dbgRestart").onclick = () => { seed = dbgSeed(); game = new Engine({ seed }); resetUiState(); dbgReset(); render(); };

render();
</script>
</body>
</html>
