<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Tests</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #1e1e1e;
      color: #d4d4d4;
    }
    .test-suite {
      margin-bottom: 30px;
    }
    .test-suite h2 {
      color: #4ec9b0;
      border-bottom: 2px solid #4ec9b0;
      padding-bottom: 5px;
    }
    .test {
      margin: 10px 0;
      padding: 10px;
      border-radius: 4px;
    }
    .test.pass {
      background: #1e3a1e;
      color: #4ec9b0;
    }
    .test.fail {
      background: #3a1e1e;
      color: #f48771;
    }
    .test-name {
      font-weight: bold;
    }
    .test-details {
      margin-top: 5px;
      font-size: 0.9em;
      opacity: 0.8;
    }
    .summary {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 15px;
      background: #2d2d2d;
      border-radius: 8px;
      border: 2px solid #4ec9b0;
    }
    .summary.has-failures {
      border-color: #f48771;
    }
  </style>
</head>
<body>
  <div class="summary" id="summary">
    <div id="summary-text">Running tests...</div>
  </div>

  <h1>🧪 Game Logic Tests</h1>
  <div id="test-results"></div>

  <script src="game.js"></script>
  <script src="tests.js"></script>
</body>
</html>
