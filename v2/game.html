<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kindred</title>
<style>
  /* ── tokens ─────────────────────────────────────────────────────────────── */
  :root {
    --bg: #f2f2f5; --panel: #fff; --line: #e2e2e7; --soft: #f0f0f4; --gutter: #e5e5eb;
    --card-shadow: 0 1px 2px rgba(20,20,40,.05), 0 6px 20px rgba(20,20,40,.06);
    --ink: #17171a; --dim: #8b8b92; --blue: #2f6bff; --blue-soft: #eaf1ff;
    --amber: #f59e0b; --amber-ink: #9a4b00; --red: #d64545; --green: #34a853;
    --journal: #8a4b38; --journal-bg: #fdf9ee; --journal-line: #eee3c2;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  button { font: inherit; cursor: pointer; }
  button:disabled { cursor: default; opacity: .55; }

  /* ── header ─────────────────────────────────────────────────────────────── */
  header {
    flex: none; display: flex; align-items: center; gap: 18px;
    background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 16px;
    position: relative; z-index: 20; box-shadow: 0 1px 4px rgba(20,20,40,.05);
  }
  .logo { font-weight: 700; font-size: 15px; }
  .logo small { color: var(--dim); font-weight: 500; margin-left: 6px; }
  nav.surfaces { display: flex; gap: 4px; }
  nav.surfaces button { border: 0; background: none; color: #6b6b74; border-radius: 8px; padding: 6px 12px; font-weight: 500; }
  nav.surfaces button.cur { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
  .n-badge { display: inline-block; min-width: 15px; text-align: center; background: #ff4d4d; color: #fff; border-radius: 8px; font-size: 10px; margin-left: 4px; padding: 0 3px; vertical-align: 1px; }
  .gauge { display: flex; flex-direction: column; gap: 2px; min-width: 118px; font-size: 12.5px; }
  .gauge .g-lbl { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
  .gauge .g-val { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .gauge .g-bar { height: 5px; background: var(--soft); border-radius: 3px; overflow: hidden; }
  .gauge .g-bar i { display: block; height: 100%; transition: width .6s ease; }
  .gauge.todo { cursor: pointer; border-radius: 8px; padding: 2px 6px; margin: -2px -6px; }
  .gauge.todo:hover { background: var(--blue-soft); }
  .hdr-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .dots { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--dim); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--blue); transition: background .3s; }
  .dot.spent { background: #d7d7de; }
  .free-note { font-size: 11px; color: var(--amber-ink); font-weight: 600; }
  #endWeek { background: var(--blue); color: #fff; border: 0; border-radius: 8px; padding: 7px 15px; font-weight: 600; }

  /* ── layout ─────────────────────────────────────────────────────────────── */
  main { flex: 1; display: flex; min-height: 0; padding: 10px; gap: 10px; background: var(--gutter); }
  .surface { flex: 1; display: none; min-width: 0; }
  .surface.cur { display: flex; gap: 10px; }

  /* Messages: rail | thread — floating cards on the gutter */
  #rail { width: 250px; flex: none; background: var(--panel); overflow: hidden auto; border-radius: 14px; box-shadow: var(--card-shadow); }
  .conv { display: flex; gap: 9px; padding: 9px 12px; border-bottom: 1px solid var(--soft); align-items: center; cursor: pointer; }
  .conv:hover { background: #fafafc; }
  .conv.cur { background: var(--blue-soft); }
  .av { width: 34px; height: 34px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; flex: none; }
  .conv .who { min-width: 0; flex: 1; }
  .conv .who b { font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .conv .who span { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .tag { font-size: 8.5px; letter-spacing: .05em; border-radius: 4px; padding: 1px 5px; font-weight: 700; white-space: nowrap; }
  .tag.call { background: #ffe2c2; color: var(--amber-ink); }
  .tag.expiring { background: #ffd9d9; color: #a02020; }
  .tag.unread { background: var(--blue); color: #fff; border-radius: 8px; min-width: 15px; text-align: center; }

  #threadCol { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); border-radius: 14px; box-shadow: var(--card-shadow); overflow: hidden; }
  #chatHead { flex: none; padding: 9px 20px; background: var(--panel); border-bottom: 1px solid var(--line); font-size: 13px; }
  #chatHead b { font-size: 14px; }
  #chatHead span { color: var(--dim); margin-left: 8px; }
  #thread { flex: 1; overflow-y: auto; padding: 16px 22px; display: flex; flex-direction: column; gap: 7px; }
  /* bottom-align a short thread so bubbles hug the composer instead of leaving a void */
  #thread > :first-child { margin-top: auto; }
  .m-in, .m-out { position: relative; max-width: 64%; padding: 8px 13px; border-radius: 18px; font-size: 13.5px; line-height: 1.45; white-space: pre-wrap; }
  .m-in { background: #fff; box-shadow: 0 1px 1px rgba(20,20,40,.07); align-self: flex-start; }
  .m-out { background: var(--blue); color: #fff; align-self: flex-end; }
  /* iMessage tails — only on the last bubble of a group */
  .m-in.tail { border-bottom-left-radius: 6px; }
  .m-in.tail::after { content: ""; position: absolute; left: -6px; bottom: 0; width: 12px; height: 17px; background: #fff; border-bottom-right-radius: 14px 15px; }
  .m-in.tail::before { content: ""; position: absolute; left: -12px; bottom: 0; width: 12px; height: 17px; background: var(--bg); border-bottom-right-radius: 10px; z-index: 1; }
  .m-out.tail { border-bottom-right-radius: 6px; }
  .m-out.tail::after { content: ""; position: absolute; right: -6px; bottom: 0; width: 12px; height: 17px; background: var(--blue); border-bottom-left-radius: 14px 15px; }
  .m-out.tail::before { content: ""; position: absolute; right: -12px; bottom: 0; width: 12px; height: 17px; background: var(--bg); border-bottom-left-radius: 10px; z-index: 1; }
  .m-in.dropped { opacity: .7; }
  .msg-new { animation: msgpop .32s cubic-bezier(.2,.9,.35,1.15); }
  @keyframes msgpop { from { opacity: 0; transform: translateY(9px) scale(.96); } }
  @media (prefers-reduced-motion: reduce) { .msg-new, .notif, .lc-line, .j-entry.arrive, .stat.changed { animation: none !important; transition: none !important; } }
  .m-wk { text-align: center; font-size: 10.5px; color: #9a9aa2; margin: 8px 0 2px; }
  .m-sub { font-size: 11px; color: var(--dim); margin: -3px 0 0 6px; align-self: flex-start; }
  .note {
    align-self: center; max-width: 78%; background: var(--journal-bg); border: 1px solid var(--journal-line);
    border-radius: 10px; padding: 7px 12px; font: italic 12px Georgia, serif; color: #6b6045;
  }
  #reply { flex: none; border-top: 1px solid var(--line); background: var(--panel); padding: 10px 22px 12px; }
  #reply .hint { font-size: 11px; color: var(--dim); margin-bottom: 4px; }
  .chip { display: block; width: 100%; text-align: left; border: 1.5px solid var(--blue); color: var(--blue); background: var(--panel); border-radius: 18px; padding: 8px 14px; font-size: 13px; margin-top: 6px; }
  .chip:hover:not(:disabled) { background: var(--blue-soft); }
  .chip.gated { border-style: dashed; border-color: #b8860b; color: #96700a; }

  /* right column: triage + journal mirror */
  #sideCol { width: 312px; flex: none; background: var(--panel); overflow: hidden auto; padding: 12px 14px; font-size: 12.5px; border-radius: 14px; box-shadow: var(--card-shadow); }
  .tier h5 { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--amber-ink); margin: 10px 0 6px; }
  .tier.later h5 { color: var(--dim); }
  .h-card { border: 1px solid #e6e6ea; border-left: 3px solid var(--amber); border-radius: 8px; padding: 7px 10px; margin-bottom: 6px; background: #fffdf8; }
  .h-card.link { cursor: pointer; }
  .h-card.link:hover { border-color: var(--blue); }
  .tier.later .h-card { border-left-color: #d7d7de; background: var(--panel); }
  .h-card.move { border-left-color: var(--journal); background: #fbf7f2; }
  .h-card b { font-size: 12px; display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
  .h-card b .go { color: var(--blue); font-weight: 500; font-size: 10.5px; white-space: nowrap; }
  .h-card b .left { color: #a02020; font-style: normal; font-size: 10px; font-weight: 600; white-space: nowrap; }
  .h-card > span { color: #6b6b74; font-size: 11.5px; display: block; }
  .h-card .mv-opts { display: flex; flex-direction: column; gap: 4px; margin-top: 7px; }
  .h-card .mv-opts button { text-align: left; border: 1.5px solid var(--blue); color: var(--blue); background: var(--panel); border-radius: 13px; padding: 5px 11px; font-size: 12px; }
  .h-card .mv-opts button.gated { border-style: dashed; border-color: #b8860b; color: #96700a; }
  .empty-tier { color: var(--dim); font-size: 11.5px; font-style: italic; }
  /* the founder's journal — a lined-paper artifact, not a plain text list */
  #journalSec {
    margin: 14px -14px -12px; padding: 12px 16px 20px 22px; position: relative;
    background: var(--journal-bg);
    box-shadow: inset 0 1px 0 #fff, inset 0 8px 10px -10px rgba(120,80,40,.14);
    border-top: 1px solid var(--journal-line);
  }
  #journalSec::before { /* notebook left margin rule */
    content: ""; position: absolute; left: 13px; top: 0; bottom: 0; width: 1px; background: rgba(190,86,60,.28);
  }
  #journalSec h5 { color: var(--journal); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; }
  .j-entry { font-family: Georgia, "Times New Roman", serif; font-size: 12.5px; color: #4a443c; line-height: 1.5; padding: 7px 0; margin: 0; border-bottom: 1px solid var(--journal-line); }
  .j-entry:last-child { border-bottom: 0; }
  .j-entry .j-wk { font-weight: 700; color: var(--journal); font-family: -apple-system, system-ui, sans-serif; font-size: 10.5px; }
  .j-entry.old { color: #94836f; }
  .stamp { display: inline-block; border: 2px solid; border-radius: 4px; padding: 0 7px; font: 700 9.5px -apple-system, sans-serif; letter-spacing: .08em; text-transform: uppercase; transform: rotate(-1.5deg); }
  .stamp.green { color: #1d8f3c; border-color: #1d8f3c; }
  .stamp.blue { color: #2456c4; border-color: #2456c4; }
  .stamp.red { color: #c0392b; border-color: #c0392b; }

  /* ── News Feed surface ──────────────────────────────────────────────────── */
  #feedSurface { flex-direction: column; align-items: center; overflow: hidden auto; padding: 16px 0 30px; gap: 12px; background: #ececf0; border-radius: 14px; box-shadow: var(--card-shadow); }
  .f-item { width: min(640px, 92%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: none; }
  .f-item.expired { opacity: .62; }
  .f-src { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 7px 14px; }
  .f-body { padding: 4px 14px 10px; font-size: 13.5px; line-height: 1.45; white-space: pre-wrap; }
  .f-act { display: flex; gap: 8px; padding: 0 14px 12px; flex-wrap: wrap; }
  .f-btn { border: 1.5px solid var(--blue); color: var(--blue); background: var(--panel); border-radius: 14px; padding: 5px 12px; font-size: 12px; }
  .f-done { padding: 0 14px 10px; font-size: 11.5px; color: var(--dim); font-style: italic; }
  .f-hn .f-src { background: #ff6600; color: #fff; }
  .f-tc .f-src { background: #0a9928; color: #fff; }
  .f-tw .f-src { color: #536471; border-bottom: 1px solid #eff3f4; }
  .f-expiry { margin-left: auto; font-size: 10px; color: #ffe9e9; font-weight: 600; }
  .f-tw .f-expiry { color: #a02020; }
  .f-wk { width: min(640px, 92%); font-size: 10.5px; color: #9a9aa2; text-align: center; flex: none; }

  /* ── Bank surface ───────────────────────────────────────────────────────── */
  #bankSurface { flex-direction: column; align-items: center; overflow: hidden auto; padding: 18px 0 30px; gap: 12px; background: var(--panel); border-radius: 14px; box-shadow: var(--card-shadow); }
  .stmt { width: min(560px, 92%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; flex: none; }
  .stmt h4 { font-size: 12px; color: var(--dim); display: flex; justify-content: space-between; margin-bottom: 6px; }
  .stmt h4 b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .tx { display: flex; justify-content: space-between; font-size: 12.5px; padding: 3px 0; border-bottom: 1px dashed var(--soft); }
  .tx .amt { font-variant-numeric: tabular-nums; font-weight: 600; }
  .tx .amt.pos { color: var(--green); }
  .tx .amt.neg { color: var(--red); }
  .tx .n { color: var(--dim); font-size: 11px; margin-left: 6px; }

  /* ── to-do popover ──────────────────────────────────────────────────────── */
  #todoPop {
    position: absolute; top: 52px; left: 50%; transform: translateX(-50%); z-index: 30;
    width: 470px; background: var(--panel); border: 1px solid #dcdce2; border-radius: 14px;
    box-shadow: 0 18px 50px rgba(20,20,40,.22); padding: 14px 16px; display: none;
  }
  #todoPop.on { display: block; }
  .td-stages { display: flex; gap: 4px; margin-bottom: 10px; font-size: 10.5px; flex-wrap: wrap; }
  .td-stages span { border-radius: 999px; padding: 3px 9px; background: var(--soft); color: var(--dim); white-space: nowrap; }
  .td-stages .done { color: #1d8f3c; background: #e9f6ec; }
  .td-stages .cur { background: var(--ink); color: #fff; font-weight: 600; }
  .td-row { display: flex; align-items: baseline; gap: 10px; padding: 6px 2px; border-bottom: 1px solid var(--soft); font-size: 13px; }
  .td-box { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #c9c9d0; flex: none; position: relative; top: 2px; }
  .td-row.done .td-box { background: #1d8f3c; border-color: #1d8f3c; }
  .td-row.done .td-box::after { content: "✓"; color: #fff; font-size: 10px; position: absolute; left: 3.5px; top: -2px; }
  .td-row.done .td-main { text-decoration: line-through; color: #9a9aa2; }
  .td-main { flex: 1; }
  .td-note { display: block; font-size: 10.5px; color: var(--dim); text-decoration: none !important; }
  .td-foot { font-size: 11px; color: var(--dim); margin-top: 8px; }

  /* ── scene takeover ─────────────────────────────────────────────────────── */
  #scene {
    position: fixed; inset: 0; background: #101014; color: #ececf0; z-index: 50;
    display: none; flex-direction: column;
  }
  #scene.on { display: flex; animation: fadein .4s ease; }
  @keyframes fadein { from { opacity: 0; } }
  .sc-head { flex: none; text-align: center; padding: 16px 20px 10px; border-bottom: 1px solid #26262a; }
  .sc-head .sc-title { font-size: 17px; font-weight: 700; }
  .sc-head .sc-sub { font-size: 12px; color: #9a9aa2; margin-top: 2px; }
  .sc-head .sc-clock { font: 800 22px ui-monospace, Menlo, monospace; color: #f2c14e; margin-top: 6px; letter-spacing: .12em; text-shadow: 0 0 18px rgba(242,193,78,.55); }
  #scThread { flex: 1; overflow-y: auto; padding: 18px 0; display: flex; flex-direction: column; gap: 7px; align-items: center; }
  #scThread > div { width: min(680px, 92%); display: flex; flex-direction: column; gap: 2px; }
  .sc-from { font-size: 10.5px; color: #8e8e93; margin-left: 8px; }
  .sc-in { background: #26262a; align-self: flex-start; max-width: 78%; padding: 8px 13px; border-radius: 16px; border-bottom-left-radius: 5px; font-size: 13.5px; line-height: 1.45; white-space: pre-wrap; }
  .sc-out { background: var(--blue); color: #fff; align-self: flex-end; max-width: 78%; padding: 8px 13px; border-radius: 16px; border-bottom-right-radius: 5px; font-size: 13.5px; line-height: 1.45; white-space: pre-wrap; }
  #scReply { flex: none; padding: 10px 0 18px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #scReply .who-asks { font-size: 11px; color: #9a9aa2; }
  #scReply .chip { width: min(680px, 92%); background: #1a1a1e; }
  #scReply .free { font-size: 10.5px; color: #f2c14e; }
  #scDone { display: none; margin-top: 8px; background: #fff; color: #101014; border: 0; border-radius: 10px; padding: 9px 26px; font-weight: 700; }

  /* ── recap / endgame / intro overlays ───────────────────────────────────── */
  .overlay { position: fixed; inset: 0; background: rgba(12,12,18,.5); z-index: 60; display: none; align-items: center; justify-content: center; }
  .overlay.on { display: flex; }
  .modal { background: var(--panel); border-radius: 16px; padding: 22px 26px; width: min(520px, 92%); max-height: 84vh; overflow-y: auto; box-shadow: 0 24px 70px rgba(10,10,20,.35); }
  .modal h2 { font-size: 18px; margin-bottom: 4px; }
  .modal .sub { color: var(--dim); font-size: 12.5px; margin-bottom: 14px; }
  .modal .ok { margin-top: 14px; width: 100%; background: var(--blue); color: #fff; border: 0; border-radius: 10px; padding: 9px 0; font-weight: 600; }
  #endOv { background: rgba(10,10,18,.66); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .eg-emoji { font-size: 38px; text-align: center; line-height: 1; margin-bottom: 6px; }
  .eg-title { text-align: center; }
  .eg-sub { text-align: center; }
  .eg-rollup { display: flex; gap: 13px; align-items: center; background: var(--soft); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .eg-biggrade { flex: none; width: 46px; height: 46px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 24px; color: #fff; top: 0; }
  .eg-roll-copy { font-size: 12px; color: #55555c; line-height: 1.45; }
  .grade-row { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--soft); font-size: 13px; }
  .grade { flex: none; width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; color: #fff; position: relative; top: 4px; }
  .grade-row .g-body { flex: 1; }
  .grade-row .g-verdict { color: #55555c; font-size: 12px; }
  .grade-row .g-ref { color: var(--dim); font-size: 10.5px; }
  #introModal { padding: 0; overflow: hidden; }
  .intro-stripe { height: 5px; background: linear-gradient(90deg, var(--blue), #8b5cf6, #ff6482); }
  .intro-body { padding: 24px 28px 20px; }
  .intro-eyebrow { font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); margin-bottom: 9px; }
  .intro-step { font-size: 14px; line-height: 1.6; color: #55555c; }
  .intro-step b { display: block; font-size: 21px; font-weight: 800; line-height: 1.2; margin-bottom: 10px; color: var(--ink); }
  .intro-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 22px; }
  .intro-dots { display: flex; gap: 6px; align-items: center; }
  .intro-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); transition: .2s; }
  .intro-dots i.on { background: var(--blue); transform: scale(1.3); }
  .intro-actions { display: flex; align-items: center; gap: 14px; }
  .intro-skip { border: 0; background: none; color: var(--dim); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0; }
  .intro-skip:hover { color: #55555c; }
  .intro-next { border: 0; background: var(--ink); color: #fff; font-weight: 700; font-size: 13px; border-radius: 10px; padding: 10px 22px; cursor: pointer; transition: transform .1s; }
  .intro-next:hover { opacity: .9; }
  .intro-next:active { transform: scale(.97); }

  /* ── iPhone-style notifications, anchored under the bell ────────────────── */
  #notifs { position: fixed; top: 56px; right: 18px; z-index: 45; width: 330px; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  .notif {
    pointer-events: auto; display: flex; gap: 11px; align-items: flex-start; cursor: pointer;
    background: rgba(255,255,255,.93); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: 16px; padding: 11px 13px;
    box-shadow: 0 10px 34px rgba(0,0,0,.2); transition: transform .12s;
    animation: noteIn .34s cubic-bezier(.2,.9,.3,1) both;
  }
  .notif:hover { transform: translateY(-1px); }
  .notif.hide { animation: noteOut .13s ease forwards; }
  @keyframes noteIn { from { opacity: 0; transform: translateX(34px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes noteOut { to { opacity: 0; transform: translateX(34px); } }
  .notif .n-ico { width: 34px; height: 34px; border-radius: 9px; color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; flex: none; }
  .notif .n-b { flex: 1; min-width: 0; }
  .notif .n-title { font-size: 12.5px; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
  .notif .n-time { color: #8b8b92; font-weight: 400; font-size: 10.5px; white-space: nowrap; }
  .notif .n-text { font-size: 12px; color: #3a3a40; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .bell { position: relative; border: 1px solid var(--line); background: var(--soft); width: 34px; height: 34px; border-radius: 10px; cursor: pointer; font-size: 15px; display: grid; place-items: center; transition: .13s; }
  .bell:hover { background: #e8eaef; transform: translateY(-1px); }
  .bell-badge { position: absolute; top: -6px; right: -6px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: #ff3b30; color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--panel); }
  #noteCenter { position: fixed; top: 56px; right: 18px; z-index: 46; width: 330px; max-height: 64vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 18px 50px rgba(0,0,0,.24); padding: 8px; display: none; }
  #noteCenter.show { display: block; animation: noteIn .24s ease both; }
  #noteCenter h4 { margin: 6px 9px; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); }
  .nc-item { display: flex; gap: 10px; align-items: flex-start; padding: 9px; border-radius: 12px; cursor: pointer; }
  .nc-item:hover { background: var(--soft); }
  .nc-empty { padding: 16px 10px; color: var(--dim); font-size: 13px; text-align: center; }

  /* ── focus-arc cinematic: staged lines, per-arc accent ──────────────────── */
  #cine {
    position: fixed; inset: 0; z-index: 72; background: #000;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 1.2s ease;
  }
  #cine.show { opacity: 1; pointer-events: all; }
  .lc-inner { text-align: center; max-width: 480px; padding: 0 32px; }
  .lc-line { font-family: Georgia, serif; font-size: 26px; color: rgba(255,255,255,0); letter-spacing: .04em; line-height: 2.1; transition: color 1.1s ease; }
  .lc-line.vis { color: rgba(255,255,255,.88); }
  .lc-line.lc-title { font-weight: 700; letter-spacing: .06em; }
  .lc-line.lc-title.vis { color: var(--lc-accent, rgba(255,255,255,.95)); }
  .lc-skip { position: absolute; bottom: 36px; right: 40px; color: rgba(255,255,255,.28); font-size: 11px; cursor: pointer; letter-spacing: .08em; }
  @keyframes fade { from { opacity: 0; } }

  /* typing indicator (scenes) */
  .typing { display: inline-flex; gap: 4px; background: #26262a; border-radius: 16px; padding: 12px 15px; align-self: flex-start; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: #8e8e93; animation: tblink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes tblink { 40% { opacity: .25; } }
  .sc-in.msg-new, .sc-out.msg-new { animation: msgpop .32s cubic-bezier(.2,.9,.35,1.15); }

  /* journal-leads glow + arriving entries + stat pulses */
  #sideCol { transition: box-shadow .45s ease; }
  #sideCol.updating { box-shadow: inset 3px 0 0 rgba(255,179,64,.65), -8px 0 26px rgba(255,179,64,.28); }
  @keyframes jHighlight {
    0% { text-shadow: 0 0 7px rgba(255,176,46,.95), 0 0 18px rgba(255,150,20,.7); color: #c96a12; }
    45% { text-shadow: 0 0 5px rgba(255,176,46,.55), 0 0 12px rgba(255,150,20,.35); }
    100% { text-shadow: 0 0 0 rgba(255,176,46,0); }
  }
  .j-entry.arrive { animation: msgpop .5s ease both, jHighlight 2.1s ease .15s both; }
  @keyframes statPulse { 0% { transform: scale(1); } 40% { transform: scale(1.13); box-shadow: 0 0 0 3px rgba(52,199,89,.3); } 100% { transform: scale(1); box-shadow: none; } }
  .stat.changed { animation: statPulse .85s ease; }
  .stats { display: flex; gap: 5px; font-size: 9.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
  .stats .stat { display: flex; flex-direction: column; align-items: center; border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 3px 9px; min-width: 46px; line-height: 1.2; }
  .stats .stat b { color: var(--ink); font-variant-numeric: tabular-nums; font-size: 13.5px; letter-spacing: 0; }
  .gauge.todo.call .g-lbl { color: var(--amber-ink); }
  .endpill { display: block; width: 100%; background: var(--blue); color: #fff; border: 0; border-radius: 10px; padding: 8px 0; font-weight: 600; margin-bottom: 8px; animation: msgpop .3s ease; }
  .cta-pill { display: block; margin: 4px auto 0; border: 0; background: var(--blue); color: #fff; border-radius: 999px; padding: 9px 28px; font-weight: 600; font-size: 13px; box-shadow: 0 4px 14px rgba(47,107,255,.30); cursor: pointer; transition: transform .1s, box-shadow .15s; }
  .cta-pill:hover:not(:disabled) { box-shadow: 0 6px 18px rgba(47,107,255,.38); transform: translateY(-1px); }
  .cta-pill:active:not(:disabled) { transform: scale(.97); }
  .cta-pill:disabled { background: var(--soft); color: var(--dim); box-shadow: none; }
  .tc-close { float: right; border: 0; background: none; font-size: 16px; color: var(--dim); cursor: pointer; line-height: 1; }
  .chat-blocked { align-self: center; color: var(--dim); font-size: 12px; padding: 8px 0 2px; font-style: italic; }

<script>
"use strict";
/* ═══ Kindred v2 UI ═══════════════════════════════════════════════════════════
   The interaction grammar:
   - someone texted you        → answer in their thread (Messages)
   - your own move             → act on the card in "This week" (founder/growth)

// The journal mirror source: outcomes + stamps + orphan drops (founder thread).
function journalMirror() {
  return game.threads.founder.filter(m => m.type === "stamp" || m.type === "outcome" || (m.type === "incoming" && !m.nodeId));
}
function resetUiState() {
  feedSeenLen = {}; uiNotes = {}; sceneStartSeq = null; inScene = false;
  selected = "alex"; surface = "msgs"; threadRendered = {};
  uiBusy = false; replyExpanded = false; weekNotes = []; notesSeen = true;
  noteQueue = []; clearTimeout(noteTimer); noteTimer = null; clearTimeout(revealTimer);
  jShown = journalMirror().length; jArrive = false;
  for (const id of game.order) {
    feedSeenLen[id] = game.threads[id].length;
    threadRendered[id] = game.threads[id].length;
  }
}
resetUiState();

// ── helpers over the engine ───────────────────────────────────────────────────
function weeksLeft(charId) {
  const o = game.open[charId];
  if (!o) return null;
  const node = game.nodes.get(o.nodeId);
  if (!node || !node.timeout || node.timeout.weeks == null) return null;
  return Math.max(0, node.timeout.weeks - (game.s.week - o.week));
}
function railChars() {
  return game.order.filter(id => {
    const c = game.cast.get(id);
    return c && c.active && id !== "founder" && !FEED.has(id) && !SELF.has(id);
  });
}
function currentStage() {
  for (const st of STAGES) if (st.active(game.s, game)) return st;
  return STAGES[STAGES.length - 1];
}
function stageCounts(st) {
  const done = st.items.filter(it => it.done(game.s, game)).length;
  return { done, total: st.items.length };
}
function todoSnapshot() {
  const out = new Set();
  for (const st of STAGES) for (const it of st.items) if (it.done(game.s, game)) out.add(st.id + "|" + it.t);
  return out;
}
function gatedKeys(nodeId) {
  // which currently-offered options exist only because of banked evidence
  const node = game.nodes.get(nodeId);
  if (!node) return new Set();
  return new Set((node.choices || []).filter(c => c.if).map(c => c.key));
}

  else if (ycIn > 0) { $("gYcL").textContent = "YC window"; $("gYcV").textContent = "in " + ycIn + " wks"; $("gYcB").style.width = Math.max(4, 100 - (ycIn / 25) * 100) + "%"; }
  else { $("gYcL").textContent = "YC window"; $("gYcV").textContent = "open now"; $("gYcB").style.width = "100%"; }
  const stg = currentStage(), c = stageCounts(stg);
  $("gTdL").textContent = "☑ " + stg.label + " ▾";
  $("gTdV").textContent = c.done + " of " + c.total;
  $("gTdB").style.width = (c.done / c.total) * 100 + "%";
  // pulse the ☑ label while a needs-your-call item is open
  $("gTodo").classList.toggle("call", game.openActions().some(a => !a.onHold && a.kind === "story"));
  // compact traction stats, pulsing when they change
  const sVals = { signal: st.signal, fit: st.marketFit, users: game.s.users, paying: game.s.customers };
  $("stats").innerHTML = Object.entries({ signal: "signal", fit: "fit", users: "users", paying: "paying" })
    .map(([k, lbl]) => '<div class="stat" data-stat="' + k + '"><b>' + sVals[k] + "</b>" + lbl + "</div>").join("");
  for (const k of pendingStatPulse) {
    const el = document.querySelector('.stat[data-stat="' + k + '"]');
    if (el) { el.classList.add("changed"); }
  }
  pendingStatPulse = [];
  const dots = [];
  for (let i = 0; i < 2; i++) dots.push('<div class="dot ' + (i < st.actionsLeft ? "" : "spent") + '"></div>');
  $("dots").innerHTML = (game.scene ? '<span class="free-note">time paused · moves free</span>' : "") + dots.join("");
  // surface badges
  const msgActs = game.openActions().filter(a => !a.onHold && !FEED.has(a.charId)).length;
  const unread = railChars().reduce((n, id) => n + (game.threads[id].length > (threadRendered[id] || 0) ? 1 : 0), 0);
  setBadge("bMsgs", surface === "msgs" ? 0 : unread + msgActs);
  const feedNew = [...FEED].reduce((n, id) => n + Math.max(0, game.threads[id].length - (feedSeenLen[id] || 0)), 0)
    + game.openActions().filter(a => !a.onHold && FEED.has(a.charId)).length;
  setBadge("bFeed", surface === "feed" ? 0 : feedNew);
  updateBell();
}
function setBadge(id, n) {
  const el = $(id);
  el.style.display = n > 0 ? "" : "none";
  el.textContent = n;
}

// ── rail + thread ─────────────────────────────────────────────────────────────
function renderRail() {
  const acts = game.openActions();
  $("rail").innerHTML = railChars().map(id => {
    const c = game.cast.get(id).def;
    const t = game.threads[id];
    const last = t.length ? t[t.length - 1] : null;
    const a = acts.find(x => x.charId === id && !x.onHold);
    const left = weeksLeft(id);
    const unread = t.length - (threadRendered[id] || 0);
    let tag = "";
    if (a && a.kind === "story") tag = '<span class="tag call">needs a call</span>';
    if (a && left != null && left <= 1) tag = '<span class="tag expiring">' + (left === 0 ? "last chance" : "1 wk") + "</span>";
    const ub = unread > 0 && id !== selected ? '<span class="tag unread">' + unread + "</span>" : "";
    const prev = last ? (last.type === "reply" ? "You: " : "") + String(last.body || "").replace(/\s+/g, " ") : c.role;
    const stl = styleFor(id);
    return '<div class="conv ' + (id === selected ? "cur" : "") + '" data-id="' + id + '">' +
      '<div class="av" style="background:' + stl.color + '">' + esc(stl.initials) + "</div>" +
      '<div class="who"><b>' + esc(c.name) + " " + tag + ub + "</b><span>" + esc(prev.slice(0, 52)) + "</span></div></div>";
  }).join("");
  for (const el of document.querySelectorAll(".conv")) {
    el.onclick = () => { if (uiBusy) return; selected = el.dataset.id; replyExpanded = false; openThread(); };
  }
}
// Open a thread → reveal any unread messages with typing dots, like the old UI:
// reading is an experience, not an instant dump.
function openThread() {
  const t = game.threads[selected];
  const from = threadRendered[selected] || 0;
  if (from >= t.length) { renderThread(); return; }
  uiBusy = true; renderHeader();
  clearTimeout(revealTimer);
  const step = () => {
    const cur = threadRendered[selected] || 0;
    if (surface !== "msgs" || cur >= t.length) { uiBusy = false; renderThread(); render(); return; }
    const e = t[cur];
    const typing = e.type === "incoming";
    renderThread({ typing });                 // draw a typing bubble before an incoming line
    revealTimer = setTimeout(() => {
      threadRendered[selected] = cur + 1;
      renderThread();
      revealTimer = setTimeout(step, typing ? 120 : 60);
    }, typing ? 600 : 90);
  };
  step();
}

function threadEntryHtml(m, notes, idx, isNew, tail) {
  const anim = isNew ? " msg-new" : "";
  let out = "";
  if (m.type === "reply") out = '<div class="m-out' + (tail ? " tail" : "") + anim + '">' + esc(m.body) + "</div>";
  else if (m.type === "incoming") {
    out = '<div class="m-in' + (tail ? " tail" : "") + (m.dropped ? " dropped" : "") + anim + '">' + esc(m.body) + "</div>" +
      (m.subtext ? '<div class="m-sub">' + esc(m.subtext) + "</div>" : "");
    // the dev-plan message carries three CSS phone mockups → thumbnails + lightbox
    if (m.mockups) out += mockupRowHtml(m.mockups);
  }
  for (const n of notes) if (n.idx === idx) out += '<div class="note' + anim + '">✎ ' + esc(n.text) + "</div>";
  return out;
}
// opts.typing → append a typing bubble at the reveal frontier.
function renderThread(opts) {
  opts = opts || {};
  const c = game.cast.get(selected);
  if (!c) return;
  $("chatHead").innerHTML = "<b>" + esc(c.def.name) + "</b><span>" + esc(c.def.role || "") + (c.active ? "" : " · gone") + "</span>";
  const t = game.threads[selected];
  const notes = uiNotes[selected] || [];
  const shown = threadRendered[selected] || 0;   // how far the read cursor has revealed
  let lastWk = null, html = "";
  t.slice(0, shown).forEach((m, i) => {
    if (m.week !== lastWk) { html += '<div class="m-wk">week ' + m.week + "</div>"; lastWk = m.week; }
    const next = t[i + 1] && i + 1 < shown ? t[i + 1] : null;
    const tail = !next || next.type !== m.type || next.week !== m.week;
    html += threadEntryHtml(m, notes, i, false, tail);
  });
  if (opts.typing) html += '<div class="row in"><div class="typing"><i></i><i></i><i></i></div></div>';
  const el = $("thread");
  el.innerHTML = html || '<div class="m-wk">no messages yet</div>';
  el.scrollTop = el.scrollHeight;
  // wire mockup thumbnails → lightbox
  for (const th of el.querySelectorAll(".mk-thumb")) {
    const mk = t.find(m => m.mockups) && t.find(m => m.mockups).mockups;
    if (mk) th.onclick = () => openMockupLightbox(mk, th.dataset.mk);
  }

  // ── the response surface, in-flow at the bottom of the thread ──
  const rbox = $("reply");
  // Jordan blocks you once fired.
  if (selected === "jordan" && game.s.jordan_resolved && !game.scene) {
    rbox.innerHTML = '<div class="chat-blocked">This user blocked you.</div>';
    return;
  }
  const a = game.openActions().find(x => x.charId === selected && !x.onHold);
  const caughtUp = shown >= t.length;
  if (!a || !caughtUp) {
    rbox.innerHTML = a && !caughtUp ? '<div class="hint">…</div>'
      : '<div class="hint">' + (a && a.onHold ? "on hold — something bigger is happening" : "nothing needs an answer here right now") + "</div>";
    return;
  }
  const left = weeksLeft(selected);
  const gk = gatedKeys(a.nodeId);
  const can = game.actionsLeft > 0;
  if (!replyExpanded) {
    rbox.innerHTML = (left != null ? '<div class="hint">won\'t wait past ' + left + " more wk" + (left === 1 ? "" : "s") + "</div>" : "") +
      '<button class="cta-pill"' + (can ? "" : " disabled") + ">" + (can ? "Respond ↓" : "No actions left this week") + "</button>";
    const btn = rbox.querySelector(".cta-pill");
    if (btn && can) btn.onclick = () => { if (uiBusy) return; replyExpanded = true; renderThread(); };
    return;
  }
  rbox.innerHTML = '<div class="hint"><button class="tc-close">×</button>pick a reply · ⚑ = unlocked by what you\'ve learned</div>' +
    a.options.map(o => '<button class="chip' + (gk.has(o.key) ? " gated" : "") + '" data-k="' + esc(o.key) + '"' + (can ? "" : " disabled") + ">" +
      (gk.has(o.key) ? "⚑ " : "") + esc(o.label) + "</button>").join("");
  rbox.querySelector(".tc-close").onclick = () => { replyExpanded = false; renderThread(); };
  for (const el2 of rbox.querySelectorAll(".chip")) el2.onclick = () => { replyExpanded = false; doAct(a.nodeId, el2.dataset.k, selected); };
}

// ── the right column: triage + journal mirror ─────────────────────────────────
function renderSide() {
  const acts = game.openActions().filter(a => !a.onHold);
  const move = acts.filter(a => SELF.has(a.charId));
  const story = acts.filter(a => !SELF.has(a.charId) && a.kind === "story");
  const later = acts.filter(a => !SELF.has(a.charId) && a.kind !== "story");
  const can = game.actionsLeft > 0;

  const linkCard = (a) => {
    const left = weeksLeft(a.charId);
    const goFeed = FEED.has(a.charId);
    return '<div class="h-card link" data-char="' + a.charId + '" data-feed="' + (goFeed ? 1 : 0) + '">' +
      "<b>" + esc(a.name) + (left != null && left <= 2 ? ' <i class="left">' + left + " wk" + (left === 1 ? "" : "s") + " left</i>" : "") +
      ' <span class="go">↗ ' + (goFeed ? "News Feed" : "open chat") + "</span></b>" +
      "<span>" + esc(String(a.body).slice(0, 90)) + "…</span></div>";
  };
  const moveCard = (a) => {
    const left = weeksLeft(a.charId);
    const gk = gatedKeys(a.nodeId);
    return '<div class="h-card move"><b>Your move' + (left != null && left <= 2 ? ' <i class="left">' + left + " wk" + (left === 1 ? "" : "s") + " left</i>" : "") + "</b>" +
      "<span>" + esc(a.body) + "</span>" +
      '<div class="mv-opts">' + a.options.map(o =>
        '<button data-n="' + esc(a.nodeId) + '" data-k="' + esc(o.key) + '"' + (can ? "" : " disabled") + ' class="' + (gk.has(o.key) ? "gated" : "") + '">' + (gk.has(o.key) ? "⚑ " : "") + esc(o.label) + "</button>").join("") + "</div></div>";
  };

  // End-week fallback pill: actions remain but nothing story-tier is pending —
  // an ambient-only week you can just skip (the turn otherwise auto-advances when
  // both moves are spent).
  const canSkip = !game.scene && !uiBusy && game.actionsLeft > 0 && move.length === 0 && story.length === 0
    && !game.s.game_over && !game.s.game_won;
  let html = canSkip ? '<button class="endpill" id="endPill">End week →</button>' : "";
  html += '<div class="tier"><h5>◉ Needs a call</h5>' +
    (move.map(moveCard).join("") + story.map(linkCard).join("") || '<div class="empty-tier">nothing urgent — rare. enjoy it.</div>') + "</div>";
  html += '<div class="tier later"><h5>When you have a minute</h5>' +
    (later.map(linkCard).join("") || '<div class="empty-tier">quiet out there.</div>') + "</div>";

  // journal mirror — only up to jShown (the turn-end reveal inks new entries one
  // at a time); the newest inking entry glows via jArrive.
  const jt = journalMirror().slice(0, jShown);
  const recent = jt.slice(-14).reverse();
  const jent = (m, i, arrive) => {
    const cls = "j-entry" + (i > 2 ? " old" : "") + (arrive ? " arrive" : "");
    if (m.type === "stamp") return '<div class="' + cls + '"><span class="j-wk">wk ' + m.week + ' ·</span> <span class="stamp ' + esc(m.stampClass || "green") + '">' + esc(m.label) + "</span></div>";
    const from = m.type === "incoming" ? (esc(m.from) + ": ") : "";
    return '<div class="' + cls + '"><span class="j-wk">wk ' + m.week + " ·</span> " + from + esc(m.body) + "</div>";
  };
  html += '<div id="journalSec"><h5>✎ Journal</h5>' +
    recent.map((m, i) => jent(m, i, jArrive && i === 0)).join("") + "</div>";

  $("sideCol").innerHTML = html;
  $("sideCol").classList.toggle("updating", jArrive);
  const ep = $("endPill"); if (ep) ep.onclick = () => { if (!uiBusy) { uiBusy = true; renderHeader(); setTimeout(advanceWeek, 200); } };
  for (const el of $("sideCol").querySelectorAll(".h-card.link")) {
    el.onclick = () => {
      if (uiBusy) return;
      if (el.dataset.feed === "1") setSurface("feed");
      else { selected = el.dataset.char; replyExpanded = false; surface = "msgs"; syncSurfaceTabs(); openThread(); render(); }
    };
  }
  for (const el of $("sideCol").querySelectorAll(".mv-opts button")) {
    el.onclick = () => { if (!uiBusy) doAct(el.dataset.n, el.dataset.k, "founder"); };
  }
}

// ── News Feed ─────────────────────────────────────────────────────────────────
function renderFeed() {
  // merge feed chars' incoming entries by seq/week
  const items = [];
  for (const id of FEED) {
    game.threads[id].forEach(m => { if (m.type === "incoming") items.push({ ...m, charId: id }); });
    feedSeenLen[id] = game.threads[id].length;
  }
  items.sort((a, b) => (a.seq || 0) - (b.seq || 0));
  const acts = game.openActions();
  let lastWk = null, html = "";
  for (const m of items.slice(-24)) {
    if (m.week !== lastWk) { html += '<div class="f-wk">week ' + m.week + "</div>"; lastWk = m.week; }
    const meta = FEED_META[m.charId];
    const a = m.nodeId ? acts.find(x => x.nodeId === m.nodeId && !x.onHold) : null;
    const resolved = m.nodeId ? game.outcome(m.nodeId) : null;
    const left = a ? weeksLeft(m.charId) : null;
    let foot = "";
    if (a) {
      const can = game.actionsLeft > 0;
      foot = '<div class="f-act">' + a.options.map(o =>
        '<button class="f-btn" data-n="' + esc(a.nodeId) + '" data-k="' + esc(o.key) + '"' + (can ? "" : " disabled") + ">" + esc(o.label) + "</button>").join("") + "</div>";
    } else if (resolved === "@ignored") foot = '<div class="f-done">the moment passed — you never weighed in.</div>';
    else if (resolved) foot = '<div class="f-done">✓ you engaged.</div>';
    html += '<div class="f-item ' + meta.cls + (resolved === "@ignored" ? " expired" : "") + '">' +
      '<div class="f-src">' + meta.src + (a && left != null ? '<span class="f-expiry">scrolls away in ' + left + " wk" + (left === 1 ? "" : "s") + "</span>" : "") + "</div>" +
      '<div class="f-body">' + esc(m.body) + "</div>" + foot + "</div>";
  }
  $("feedSurface").innerHTML = html || '<div class="f-wk" style="margin-top:30px">nothing in the news yet — the world hasn\'t noticed you.</div>';
  $("feedSurface").scrollTop = $("feedSurface").scrollHeight;
  for (const el of $("feedSurface").querySelectorAll(".f-btn")) {
    el.onclick = () => doAct(el.dataset.n, el.dataset.k, null);
  }
}

// ── acting ────────────────────────────────────────────────────────────────────
function doAct(nodeId, key, charId) {
  if (uiBusy) return;
  const before = game.threads[charId || "founder"] ? game.threads[charId || "founder"].length : 0;
  const preScene = game.scene;
  const preSeq = game._seq;
  const outcome = game.act(nodeId, key);
  if (outcome && charId && !SELF.has(charId)) {
    (uiNotes[charId] = uiNotes[charId] || []).push({ idx: findReplyIdx(charId, before), text: outcome, week: game.s.week });
  }
  if (charId) threadRendered[charId] = game.threads[charId].length;
  // your own mid-week choices ink into the journal mirror at once (ungLowed);
  // only week-turn consequences get the reveal glow (advanceWeek captures jBefore here).
  jShown = journalMirror().length;

  // entering a scene → the world freezes; play its entry cinematic then the beats
  if (!preScene && game.scene) { enterScene(preSeq); return; }
  if (inScene) { pumpScene(); return; }

  render();
  if (game.s.game_over || game.s.game_won) { checkEndgame(); return; }
  // both moves spent → the week turns automatically (no End-week button)
  if (game.actionsLeft <= 0) { uiBusy = true; renderHeader(); setTimeout(advanceWeek, 620); }
}
function findReplyIdx(charId, beforeLen) {
  return Math.max(beforeLen, game.threads[charId].length - 1);
}

// ── focus-arc cinematic: staged lines, per-arc accent, click-to-skip ──────────
function showCine(lines, accent, done) {
  const el = $("cine"), box = $("lcInner"), skip = $("lcSkip");
  el.style.setProperty("--lc-accent", accent || "rgba(255,255,255,.95)");
  box.innerHTML = lines.map((t, i) => '<p class="lc-line' + (i === 0 ? " lc-title" : "") + '">' + esc(t) + "</p>").join("");
  el.classList.add("show");
  const nodes = box.querySelectorAll(".lc-line");
  nodes.forEach((n, i) => setTimeout(() => n.classList.add("vis"), 500 + i * 1250));
  let done2 = false, timer = null;
  const finish = () => {
    if (done2) return; done2 = true;
    if (timer) clearTimeout(timer); el.classList.remove("show"); skip.onclick = null; el.onclick = null;
    setTimeout(done, 700);
  };
  const total = 500 + (nodes.length - 1) * 1250 + 1500;
  timer = setTimeout(finish, total);
  skip.onclick = finish; el.onclick = finish;
}

// ── scenes: cinematic in, beats typed out, cinematic out — all one sitting ────
let lastSceneId = null, scRevealed = 0, scTimer = null;

function enterScene(startSeq) {
  inScene = true;
  sceneStartSeq = startSeq != null ? startSeq : 0;
  scRevealed = 0;
  lastSceneId = game.scene.id;
  const meta = SCENE_META[lastSceneId] || {};
  showCine(meta.enter || [meta.title || ""], meta.accent, () => { $("scene").classList.add("on"); pumpScene(); });
}
function sceneEntries() {
  const arc = game.arcs.get(lastSceneId);
  const castIds = (arc ? arc.scene.cast : []).concat("founder");
  const entries = [];
  for (const id of castIds) {
    (game.threads[id] || []).forEach(m => {
      if ((m.seq || 0) >= sceneStartSeq && (m.type === "incoming" || m.type === "reply")) entries.push({ ...m, charId: id });
    });
  }
  entries.sort((a, b) => (a.seq || 0) - (b.seq || 0));
  return entries;
}
// The scene's heartbeat: reveal the transcript one bubble at a time (typing
// dots before each incoming line), then offer the current beat's choices.
function pumpScene() {
  clearTimeout(scTimer);
  const meta = SCENE_META[lastSceneId] || {};
  $("scTitle").textContent = meta.title || "";
  $("scSub").textContent = meta.sub || "";
  $("scClock").textContent = (lastSceneId === "launch" && game.s.launch_time) ? game.s.launch_time : "";
  // launch day: the room darkens/warms with the time of day
  $("scene").style.background = (lastSceneId === "launch" && LAUNCH_BG[game.s.launch_time]) || "#101014";
  const entries = sceneEntries();
  if (scRevealed > entries.length) scRevealed = entries.length;
  const revealing = scRevealed < entries.length;

  let html = entries.slice(0, scRevealed).map((m, i) => {
    const anim = i === scRevealed - 1 ? " msg-new" : "";
    return "<div>" + (m.type === "incoming"
      ? '<span class="sc-from">' + esc(m.from) + '</span><div class="sc-in' + anim + '">'
      : '<div class="sc-out' + anim + '">') + esc(m.body) + "</div></div>";
  }).join("");
  if (revealing && entries[scRevealed].type === "incoming") {
    html += '<div><span class="sc-from">' + esc(entries[scRevealed].from) + '</span><div class="typing"><i></i><i></i><i></i></div></div>';
  }
  $("scThread").innerHTML = html;
  $("scThread").scrollTop = $("scThread").scrollHeight;

  if (revealing) {
    $("scReply").innerHTML = "";
    scTimer = setTimeout(() => { scRevealed++; pumpScene(); },
      entries[scRevealed].type === "reply" ? 240 : 900);
    return;
  }
  if (game.scene) {
    const beats = game.openActions().filter(a => a.scene === game.scene.id && !a.onHold);
    if (beats.length) {
      const b = beats[0];
      const gk = gatedKeys(b.nodeId);
      $("scReply").innerHTML = '<div class="who-asks">' + esc(b.name) + ' is looking at you <span class="free">· moves in the room are free</span></div>' +
        b.options.map(o => '<button class="chip' + (gk.has(o.key) ? " gated" : "") + '" data-n="' + esc(b.nodeId) + '" data-k="' + esc(o.key) + '">' + (gk.has(o.key) ? "⚑ " : "") + esc(o.label) + "</button>").join("");
      for (const el of $("scReply").querySelectorAll(".chip")) el.onclick = () => doAct(el.dataset.n, el.dataset.k, beatChar(el.dataset.n));
    } else {
      $("scReply").innerHTML = '<div class="who-asks">…</div>';
    }
  } else {
    // scene resolved → its exit cinematic, then back to the week
    $("scReply").innerHTML = '<button id="scDone" style="display:block">Back to the week →</button>';
    $("scDone").onclick = exitScene;
  }
}
function beatChar(nodeId) {
  for (const cid of game.order) { const o = game.open[cid]; if (o && o.nodeId === nodeId) return cid; }
  return null;
}
function exitScene() {
  clearTimeout(scTimer);
  $("scene").classList.remove("on");
  for (const id of game.order) threadRendered[id] = game.threads[id].length;
  const meta = SCENE_META[lastSceneId] || {};
  const lines = meta.exit ? meta.exit(game.s) : null;
  const back = () => { inScene = false; jShown = journalMirror().length; render(); checkEndgame(); };
  if (lines) showCine(lines, meta.accent, back); else back();
}

// ── the week turn: the reveal, in the old order ──────────────────────────────
// runway counts down → the journal beat LEADS (column glows, entries ink in) →
// a beat later the phone buzzes, one notification every 750ms → the active
// thread refreshes only after its own notification → changed stats pulse.
function advanceWeek() {
  clearTimeout(noteTimer); noteTimer = null; noteQueue = [];
  const beforeTodo = todoSnapshot();
  const beforeLens = {};
  for (const id of game.order) beforeLens[id] = game.threads[id].length;
  const jBefore = journalMirror().length;
  const cashBefore = game.stats().cash;
  const sig = game.stats().signal, fit = game.stats().marketFit, us = game.s.users, pay = game.s.customers;

  game.nextWeek();

  pendingStatPulse = [];
  if (game.stats().signal !== sig) pendingStatPulse.push("signal");
  if (game.stats().marketFit !== fit) pendingStatPulse.push("fit");
  if (game.s.users !== us) pendingStatPulse.push("users");
  if (game.s.customers !== pay) pendingStatPulse.push("paying");

  // gather this week's notifications (todo check-offs first, then arrivals)
  weekNotes = [];
  const afterTodo = todoSnapshot();
  for (const key of afterTodo) if (!beforeTodo.has(key)) {
    weekNotes.push({ ico: "✓", color: "#1d8f3c", title: "Reminders", text: "Checked off: " + key.split("|")[1],
      go: () => { renderTodo(); $("todoPop").classList.add("on"); } });
  }
  for (const id of game.order) {
    const fresh = game.threads[id].slice(beforeLens[id]).filter(m => m.type === "incoming");
    if (!fresh.length) continue;
    const feed = FEED.has(id), def = game.cast.get(id).def, stl = styleFor(id);
    const name = feed ? FEED_META[id].src.split("·").pop().trim() : def.name;
    const dropped = fresh.some(m => m.dropped);
    weekNotes.push({
      ico: stl.initials, color: feed ? "#3a3a40" : stl.color, charId: id, feed,
      title: name + (dropped ? " · you left them on read" : fresh.length > 1 ? " (" + fresh.length + ")" : ""),
      text: String(fresh[fresh.length - 1].body || ""),
      go: feed ? () => setSurface("feed")
        : () => { selected = id; replyExpanded = false; threadRendered[id] = game.threads[id].length; surface = "msgs"; syncSurfaceTabs(); openThread(); render(); },
    });
  }
  notesSeen = weekNotes.length === 0;

  // 1) runway counts down, header refreshes to "week N"
  animateRunway(cashBefore, game.stats().cash, () => {
    // 2) the journal beat leads: ink the mirror entries in one at a time, glowing
    revealJournal(jBefore, () => {
      // 3) a beat later, the notifications buzz
      setTimeout(startNotifications, 420);
    });
  });

  function startNotifications() {
    updateBell();
    queueNotifications(weekNotes);
    // the active thread refreshes only after its own notification shows
    if (surface === "msgs" && threadRendered[selected] < game.threads[selected].length) {
      const idx = weekNotes.findIndex(n => n.charId === selected);
      const delay = idx >= 0 ? idx * 750 + 650 : 380;
      setTimeout(() => { if (surface === "msgs") openThread(); }, delay);
    }
    // the run may have ended this week
    if (game.s.game_won || game.s.game_over) {
      setTimeout(checkEndgame, weekNotes.length ? 1700 : 700);
    }
    uiBusy = false;
  }
}
// runway digit + bar count from → to (fast, ~500ms)
function animateRunway(fromCash, toCash, done) {
  const steps = 16; let i = 0;
  const tick = () => {
    i++;
    const cash = Math.round(fromCash + (toCash - fromCash) * (i / steps));
    const runway = Math.floor(cash / game.burnPerWeek);
    $("hWeek").textContent = "Week " + game.s.week;
    $("gRunV").textContent = runway + " wks · " + money(cash);
    $("gRunB").style.width = Math.min(100, (runway / 20) * 100) + "%";
    $("gRunB").style.background = runway <= 4 ? "var(--red)" : runway <= 8 ? "var(--amber)" : "var(--green)";
    if (i < steps) revealTimer = setTimeout(tick, 30); else done();
  };
  tick();
}
// ink the journal-mirror entries in one at a time (340ms; stamps 480ms), glowing
function revealJournal(from, done) {
  const total = journalMirror().length;
  if (from >= total) { jShown = total; renderSide(); done(); return; }
  let i = from;
  const step = () => {
    if (i >= total) { jShown = total; jArrive = false; renderSide(); renderHeader(); done(); return; }
    const m = journalMirror()[i];
    jShown = i + 1; jArrive = true;
    renderSide();
    revealTimer = setTimeout(() => { i++; step(); }, m.type === "stamp" ? 480 : 340);
  };
  step();
}

// ── iPhone notifications, anchored under the bell ─────────────────────────────
function queueNotifications(list) { noteQueue = noteQueue.concat(list); if (!noteTimer) pumpNotifications(); }
function pumpNotifications() {
  if (!noteQueue.length) { noteTimer = null; return; }
  showNotif(noteQueue.shift());
  noteTimer = setTimeout(pumpNotifications, 750);
}
function showNotif(n) {
  const el = document.createElement("div");
  el.className = "notif";
  el.innerHTML = '<div class="n-ico" style="background:' + (n.color || "#8a8a92") + '">' + esc(n.ico) + "</div>" +
    '<div class="n-b"><div class="n-title"><span>' + esc(n.title) + '</span><span class="n-time">now</span></div>' +
    '<div class="n-text">' + esc(n.text) + "</div></div>";
  let gone = false;
  const dismiss = () => { if (gone) return; gone = true; el.classList.add("hide"); setTimeout(() => el.remove(), 300); };
  el.onclick = () => { dismiss(); if (!uiBusy && n.go) n.go(); };
  $("notifs").appendChild(el);
  setTimeout(dismiss, 6500);
}
// the bell reopens this week's notifications (the notification center)
function updateBell() {
  const b = $("bellBadge");
  if (weekNotes.length && !notesSeen) { b.textContent = weekNotes.length; b.style.display = "grid"; }
  else b.style.display = "none";
}
function toggleNoteCenter() {
  const c = $("noteCenter");
  if (c.classList.contains("show")) { c.classList.remove("show"); return; }
  if (!weekNotes.length) { c.innerHTML = '<h4>This week</h4><div class="nc-empty">No notifications this week.</div>'; }
  else c.innerHTML = '<h4>This week · ' + weekNotes.length + " notification" + (weekNotes.length === 1 ? "" : "s") + "</h4>" +
    weekNotes.map((n, i) => '<div class="nc-item" data-i="' + i + '"><div class="n-ico" style="width:34px;height:34px;border-radius:9px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;background:' + (n.color || "#8a8a92") + '">' + esc(n.ico) + "</div>" +
      '<div class="n-b"><div class="n-title">' + esc(n.title) + '</div><div class="n-text" style="font-size:12px;color:#3a3a40">' + esc(n.text) + "</div></div></div>").join("");
  c.classList.add("show");
  notesSeen = true; updateBell();
  for (const el of c.querySelectorAll(".nc-item")) el.onclick = () => {
    const n = weekNotes[+el.dataset.i]; c.classList.remove("show");
    if (!uiBusy && n && n.go) n.go();
  };
}
$("bell").onclick = (e) => { e.stopPropagation(); toggleNoteCenter(); };
document.addEventListener("click", (e) => {
  if (!e.target.closest("#noteCenter") && !e.target.closest("#bell")) $("noteCenter").classList.remove("show");
});

// ── endgame ───────────────────────────────────────────────────────────────────
const GRADE = s => s == null ? ["—", "#c9c9d0"] : s >= 85 ? ["A", "#1d8f3c"] : s >= 70 ? ["B", "#4a9a4a"] : s >= 55 ? ["C", "#c9922a"] : s >= 40 ? ["D", "#c96a2a"] : ["F", "#c0392b"];
function checkEndgame() {
  const s = game.s;
  if (!s.game_over && !s.game_won) return;
  const cats = V2Scoring.scoreGame(game);
  const title = s.game_won ? (s.ycAccepted ? "You're in the batch." : "Round closed. $500k.") :
    s.ycRejected ? "YC passed. The run ends here." : "Out of runway.";
  const sub = s.game_won ? "Week " + s.week + " — the company lives. Here's what it taught you." :
    "Week " + s.week + " — here's what this run taught you.";
  const emoji = s.game_won ? (s.ycAccepted ? "🎉" : "🤝") : s.ycRejected ? "📮" : "🕰️";
  const scored = cats.filter(c => c.score != null);
  const avg = scored.length ? Math.round(scored.reduce((n, c) => n + c.score, 0) / scored.length) : null;
  const [og, ocol] = GRADE(avg);
  $("endModal").innerHTML =
    '<div class="eg-emoji">' + emoji + "</div>" +
    '<h2 class="eg-title">' + esc(title) + '</h2><div class="sub eg-sub">' + esc(sub) + "</div>" +
    '<div class="eg-rollup"><div class="grade eg-biggrade" style="background:' + ocol + '">' + og + "</div>" +
    '<div class="eg-roll-copy">Founder report card — graded on the calls you actually made, week by week. The reading under each line is where the lesson comes from.</div></div>' +
    cats.map(c => {
      const [g, col] = GRADE(c.score);
      return '<div class="grade-row"><div class="grade" style="background:' + col + '">' + g + "</div>" +
        '<div class="g-body"><b>' + esc(c.label) + "</b>" +
        '<div class="g-verdict">' + esc(c.verdict) + (c.notes && c.notes[0] ? " — " + esc(c.notes[0]) : "") + "</div>" +
        '<div class="g-ref">' + esc(c.ref) + "</div></div></div>";
    }).join("") +
    '<button class="ok" onclick="location.search=\'?seed=\'+((Date.now()%100000)|0)">Run it back →</button>';
  $("endOv").classList.add("on");
}

// ── intro ─────────────────────────────────────────────────────────────────────
const INTRO = [
  ["The team", "You're the founder.", "Kindred is a dating app for people sick of swiping — and it exists mostly in your co-founders' heads. You have $10,000, a burn rate, and two moves a week. Get to a seed round (or YC) before the money runs out."],
  ["How it works", "Everything is a conversation.", "People text you — answer them in their thread. Your own moves show up under “This week”, and the outside world talks in the News Feed. Some messages won't wait forever."],
  ["The throttle", "Decisions move the build.", "Answering your co-founders' questions is what moves the ☑ list in the header. Ignore them and the build crawls, trust leaks, and the story goes on without you. End the week when your two moves are spent."],
];
let introStep = 0;
function showIntro() {
  const [eyebrow, h, b] = INTRO[introStep];
  const last = introStep === INTRO.length - 1;
  const dots = INTRO.map((_, i) => '<i class="' + (i === introStep ? "on" : "") + '"></i>').join("");
  $("introModal").innerHTML =
    '<div class="intro-stripe"></div><div class="intro-body">' +
    '<div class="intro-eyebrow">' + esc(eyebrow) + "</div>" +
    '<div class="intro-step"><b>' + esc(h) + "</b>" + esc(b) + "</div>" +
    '<div class="intro-foot"><div class="intro-dots">' + dots + "</div>" +
    '<div class="intro-actions">' + (last ? "" : '<button class="intro-skip">skip</button>') +
    '<button class="intro-next">' + (last ? "Week 1 →" : "Continue →") + "</button></div></div></div>";
  const done = () => { $("introOv").classList.remove("on"); localStorage.setItem("kindred_intro", "1"); };
  $("introModal").querySelector(".intro-next").onclick = () => { introStep++; if (introStep >= INTRO.length) done(); else showIntro(); };
  const sk = $("introModal").querySelector(".intro-skip"); if (sk) sk.onclick = done;
  $("introOv").classList.add("on");
}
if (!localStorage.getItem("kindred_intro")) showIntro();

// ── surfaces + orchestration ──────────────────────────────────────────────────
function syncSurfaceTabs() {
  for (const b of document.querySelectorAll("nav.surfaces button")) b.classList.toggle("cur", b.dataset.surface === surface);
  $("msgsSurface").classList.toggle("cur", surface === "msgs");
  $("feedSurface").classList.toggle("cur", surface === "feed");
  $("bankSurface").classList.toggle("cur", surface === "bank");
}
function setSurface(sf) {
  if (uiBusy) return;
  surface = sf; syncSurfaceTabs();
  if (sf === "msgs") openThread();   // reveal any unread on entry
  render();
}
for (const b of document.querySelectorAll("nav.surfaces button")) b.onclick = () => setSurface(b.dataset.surface);

function render() {
  renderHeader();
  if (surface === "msgs") { renderRail(); renderThread(); }
  if (surface === "feed") renderFeed();
  if (surface === "bank") renderBank();
  renderSide();
  if ($("todoPop").classList.contains("on")) renderTodo();
}

// ── debug ─────────────────────────────────────────────────────────────────────
$("dbgSeed").value = seed;
const dbgSeed = () => { const v = parseInt($("dbgSeed").value, 10); return Number.isFinite(v) ? v : seed; };
function dbgReset() {
  clearTimeout(revealTimer); clearTimeout(noteTimer); noteTimer = null;
  $("scene").classList.remove("on"); $("cine").classList.remove("show");
  $("endOv").classList.remove("on"); $("noteCenter").classList.remove("show");
  [...$("notifs").children].forEach(e => e.remove());
}
for (const btn of document.querySelectorAll("#debug [data-jump]")) {
  btn.onclick = () => {
    seed = dbgSeed();
    game = V2Harness.jumpTo(btn.dataset.jump, { seed, subsidy: 600 });
    resetUiState(); dbgReset();
    // leave fresh arrivals unread so the state reads naturally
    for (const id of game.order) threadRendered[id] = Math.max(0, game.threads[id].length - 2);
    render();
  };
}
$("dbgSkip").onclick = () => { if (uiBusy) return; for (let i = 0; i < 5 && !game.s.game_over && !game.s.game_won; i++) game.nextWeek(); resetUiState(); render(); checkEndgame(); };
$("dbgRestart").onclick = () => { seed = dbgSeed(); game = new V2Engine({ seed }); resetUiState(); dbgReset(); render(); };

render();
</script>
</body>
</html>
