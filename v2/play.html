<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>plusone · v2 slice</title>
<style>
  :root {
    --bg: #f2f2f7; --panel: #fff; --line: #e3e3e8; --ink: #1c1c1e; --dim: #8e8e93;
    --blue: #0a84ff; --green: #30d158; --grey-bubble: #e9e9eb;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font: 15px/1.45 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--ink); height: 100vh; display: flex; flex-direction: column; }

  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
  header .wk { font-weight: 700; font-size: 17px; }
  header .stat { color: var(--dim); font-size: 13px; }
  header .stat b { color: var(--ink); }
  header .scene { color: #b25000; font-size: 13px; font-weight: 600; }
  header button { margin-left: auto; border: 0; background: var(--blue); color: #fff; border-radius: 8px; padding: 7px 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
  header button:disabled { background: #b9d9ff; cursor: default; }

  main { flex: 1; display: flex; min-height: 0; }
  #rail { width: 270px; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; }
  .conv { padding: 11px 14px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: 10px; align-items: center; }
  .conv:hover { background: #fafafa; }
  .conv.sel { background: #eef4ff; }
  .conv.hold { opacity: .45; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: #c7c7cc; color: #fff; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; flex: none; }
  .conv .meta { min-width: 0; flex: 1; }
  .conv .name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .conv .prev { color: var(--dim); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--blue); flex: none; }

  #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #thread { flex: 1; overflow-y: auto; padding: 18px 22px; }
  .row { display: flex; margin: 3px 0; }
  .row.reply { justify-content: flex-end; }
  .bubble { max-width: 68%; padding: 8px 13px; border-radius: 18px; white-space: pre-wrap; }
  .incoming .bubble { background: var(--grey-bubble); border-bottom-left-radius: 5px; }
  .reply .bubble { background: var(--blue); color: #fff; border-bottom-right-radius: 5px; }
  .from { font-size: 11px; color: var(--dim); margin: 10px 0 2px 6px; }
  .outcome { background: #fffbe8; border: 1px solid #f0e6b8; border-radius: 10px; padding: 9px 13px; margin: 8px 0; font-size: 14px; color: #5b5340; }
  .stamp { text-align: center; margin: 12px 0; }
  .stamp span { display: inline-block; border: 2px solid; border-radius: 8px; padding: 3px 14px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: 12px; transform: rotate(-2deg); }
  .stamp .green { color: #1d8f3c; border-color: #1d8f3c; }
  .stamp .blue  { color: #2456c4; border-color: #2456c4; }
  .stamp .red   { color: #c0392b; border-color: #c0392b; }
  .weekmark { text-align: center; color: var(--dim); font-size: 11.5px; margin: 14px 0 4px; }

  #chips { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 18px; }
  #chips .hint { color: var(--dim); font-size: 12.5px; margin-bottom: 8px; }
  .chip { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 9px 14px; border: 1.5px solid var(--blue); color: var(--blue); background: #fff; border-radius: 18px; font-size: 14px; cursor: pointer; }
  .chip:hover { background: #eef4ff; }
  .chip:disabled { border-color: var(--line); color: var(--dim); cursor: default; }

  #over { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; }
  #over .card { background: #fff; border-radius: 14px; padding: 28px 34px; max-width: 420px; text-align: center; }
  #over h2 { margin-bottom: 8px; }

  #debug { border-top: 1px solid var(--line); background: #1c1c1e; color: #ddd; font-size: 12px; }
  #debug summary { padding: 4px 14px; cursor: pointer; color: #8e8e93; user-select: none; }
  #debug .tools { padding: 6px 14px 10px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  #debug button { border: 1px solid #444; background: #2c2c2e; color: #ddd; border-radius: 6px; padding: 3px 9px; font-size: 12px; cursor: pointer; }
  #debug button:hover { background: #3a3a3c; }
  #debug input { width: 70px; background: #2c2c2e; border: 1px solid #444; color: #ddd; border-radius: 6px; padding: 3px 6px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <span class="wk" id="hWeek"></span>
  <span class="stat">cash <b id="hCash"></b></span>
  <span class="stat">runway <b id="hRunway"></b></span>
  <span class="stat">actions <b id="hActions"></b></span>
  <span class="stat">signal <b id="hSignal"></b></span>
  <span class="scene" id="hScene"></span>
  <button id="endWeek">End week →</button>
</header>
<main>
  <nav id="rail"></nav>
  <section id="chat">
    <div id="thread"></div>
    <div id="chips"></div>
  </section>
</main>
<div id="over"><div class="card"><h2 id="overTitle"></h2><p id="overBody"></p></div></div>

<details id="debug">
  <summary>debug</summary>
  <div class="tools">
    seed <input id="dbgSeed" type="number" value="">
    <button data-jump="equity_open">equity talk</button>
    <button data-jump="dev_plan">dev plan</button>
    <button data-jump="demo_ready">demo night</button>
    <button data-jump="good_enough_launch">launch day</button>
    <button data-jump="slide_hangover">the slide</button>
    <button data-jump="pivot_summit_call">pivot day</button>
    <button data-jump="pivot_relaunch">post-pivot</button>
    <button data-jump="seed_pitch">fundraising</button>
    <span style="margin-left:10px"></span>
    <button id="dbgSkip">+5 weeks</button>
    <button id="dbgRestart">restart</button>
  </div>
</details>

<script src="cast.js"></script>
<script src="story/opening.js"></script>
<script src="story/equity.js"></script>
<script src="story/dev_plan.js"></script>
<script src="story/team.js"></script>
<script src="story/dev_directions.js"></script>
<script src="story/demo_night.js"></script>
<script src="story/users.js"></script>
<script src="story/launch_day.js"></script>
<script src="story/slide.js"></script>
<script src="story/pivot_day.js"></script>
<script src="story/community.js"></script>
<script src="story/fundraising.js"></script>
<script src="story/growth.js"></script>
<script src="story/jordan_arc.js"></script>
<script src="story/firing.js"></script>
<script src="story/discovery.js"></script>
<script src="story/press.js"></script>
<script src="story/ambient.js"></script>
<script src="scoring.js"></script>
<script src="world.js"></script>
<script src="engine.js"></script>
<script src="tests/harness.js"></script>
<script>
  let seed = Date.now() % 100000;
  let game = new V2Engine({ seed });
  let selected = "alex";

  const $ = id => document.getElementById(id);
  const esc = t => String(t == null ? "" : t)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  function render() {
    const st = game.stats();
    $("hWeek").textContent = "Week " + st.week;
    $("hCash").textContent = "$" + st.cash.toLocaleString();
    $("hRunway").textContent = st.runway + "w";
    $("hActions").textContent = st.actionsLeft + "/2";
    $("hSignal").textContent = st.signal;
    $("hScene").textContent = st.scene ? "● " + st.scene + " — the room is waiting" : "";

    // rail
    const convs = game.conversations();
    if (!convs.some(c => c.id === selected)) selected = convs[0] && convs[0].id;
    $("rail").innerHTML = convs.map(c => `
      <div class="conv ${c.id === selected ? "sel" : ""} ${c.onHold ? "hold" : ""}" data-id="${c.id}">
        <div class="avatar">${esc(c.isJournal ? "✎" : c.name[0])}</div>
        <div class="meta">
          <div class="name">${esc(c.name)} ${c.hasAction ? '<span class="dot"></span>' : ""}</div>
          <div class="prev">${esc(c.role)}${c.preview ? " · " + esc(c.preview) : ""}</div>
        </div>
      </div>`).join("");
    for (const el of document.querySelectorAll(".conv"))
      el.onclick = () => { selected = el.dataset.id; render(); };

    // thread
    let lastWeek = null;
    $("thread").innerHTML = (game.threads[selected] || []).map(m => {
      let out = "";
      if (m.week !== lastWeek) { out += `<div class="weekmark">week ${m.week}</div>`; lastWeek = m.week; }
      if (m.type === "stamp") return out + `<div class="stamp"><span class="${m.stampClass}">${esc(m.label)}</span></div>`;
      if (m.type === "outcome") return out + `<div class="outcome"><b>${esc(m.from)}</b> — ${esc(m.body)}</div>`;
      if (m.type === "reply") return out + `<div class="row reply"><div class="bubble">${esc(m.body)}</div></div>`;
      return out + `<div class="from">${esc(m.from)}</div><div class="row incoming"><div class="bubble">${esc(m.body)}${m.subtext ? `<div style="color:var(--dim);font-size:12.5px;margin-top:4px">${esc(m.subtext)}</div>` : ""}</div></div>`;
    }).join("");
    $("thread").scrollTop = $("thread").scrollHeight;

    // chips for the selected conversation's open node
    const action = game.openActions().find(a => a.charId === selected);
    if (action && !action.onHold) {
      const free = !!action.scene;
      const canAct = free || game.actionsLeft > 0;
      $("chips").innerHTML =
        `<div class="hint">${free ? "in the room — no action cost" : canAct ? "pick a reply (1 action)" : "no actions left — end the week"}</div>`
        + action.options.map(o =>
          `<button class="chip" data-k="${esc(o.key)}" ${canAct ? "" : "disabled"}>${esc(o.label)}</button>`).join("");
      for (const el of document.querySelectorAll(".chip"))
        el.onclick = () => { game.act(action.nodeId, el.dataset.k); render(); };
    } else {
      $("chips").innerHTML = `<div class="hint">${action && action.onHold ? "on hold — a conversation elsewhere needs you" : "nothing needs an answer here"}</div>`;
    }

    const s = game.s;
    if (s.game_over || s.game_won) {
      $("over").style.display = "flex";
      $("overTitle").textContent = s.game_won ? "You made it" : "Out of runway";
      $("overBody").textContent = s.game_won ? "The round came together." : "Cash hit zero in week " + s.week + ".";
    }
  }

  $("endWeek").onclick = () => { game.nextWeek(); render(); };

  // ── debug bar ──────────────────────────────────────────────────────────────
  $("dbgSeed").value = seed;
  const dbgSeed = () => {
    const v = parseInt($("dbgSeed").value, 10);
    return Number.isFinite(v) ? v : seed;
  };
  for (const btn of document.querySelectorAll("#debug [data-jump]")) {
    btn.onclick = () => {
      seed = dbgSeed();
      // The subsidy keeps late jumps from dying of the (unbalanced) cash gap.
      game = V2Harness.jumpTo(btn.dataset.jump, { seed, subsidy: 600 });
      $("over").style.display = "none";
      render();
    };
  }
  $("dbgSkip").onclick = () => { for (let i = 0; i < 5 && !game.s.game_over; i++) game.nextWeek(); render(); };
  $("dbgRestart").onclick = () => { seed = dbgSeed(); game = new V2Engine({ seed }); $("over").style.display = "none"; render(); };

  render();
</script>
</body>
</html>
