<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Startup Simulator — Prototype v3</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #f0f0f5; color: #1a1a2e;
  height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}

/* ── Header ── */
#header {
  background: white; border-bottom: 1px solid #e0e0ea;
  padding: 10px 20px; display: flex; flex-direction: column; gap: 7px; flex-shrink: 0;
}
#row-status { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
#week-badge {
  font-weight: 700; font-size: 14px; background: #1a1a2e; color: white;
  padding: 3px 10px; border-radius: 12px; white-space: nowrap;
}
.st { font-size: 13px; color: #888; }
.st strong { color: #1a1a2e; font-size: 14px; }
.st.warn strong { color: #d97706; }
.st.danger strong { color: #dc2626; }
.st.good strong { color: #16a34a; }
.pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; }
.pill-live { background: #d1fae5; color: #065f46; }
.pill-deck { background: #ede9fe; color: #5b21b6; }
#alex-mood { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #888; margin-left: auto; }
#alex-dot { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; transition: background .4s; }

/* ── Gauge ── */
#row-gauge { display: flex; align-items: center; gap: 10px; }
#gauge-lbl { font-size: 12px; color: #aaa; min-width: 90px; }
#gauge-bar { display: flex; gap: 3px; width: 200px; }
.gs { flex: 1; height: 10px; border-radius: 5px; background: #e8e8f0; transition: background .4s; }
.gs.a0{background:#94a3b8} .gs.a1{background:#60a5fa} .gs.a2{background:#fbbf24}
.gs.a3{background:#f97316} .gs.a4{background:#22c55e}
#gauge-desc { font-size: 12px; color: #777; font-style: italic; }

/* ── Horizon ── */
#row-horizon { display: flex; gap: 12px; align-items: center; font-size: 12px; }
.hi { color: #aaa; }
.hi.soon { color: #d97706; font-weight: 600; }
.hi.now  { color: #16a34a; font-weight: 600; }
.hi.hot  { color: #dc2626; font-weight: 600; }

/* ── Main ── */
#main { display: flex; flex: 1; overflow: hidden; }

/* ── Controls panel (left) ── */
#pick-panel {
  width: 250px; flex-shrink: 0; border-right: 1px solid #e0e0ea;
  background: white; padding: 14px 16px;
  display: flex; flex-direction: column; gap: 14px;
}
#pick-panel h3 { font-size: 14px; font-weight: 600; }
#counter { font-size: 13px; color: #aaa; }

#flash {
  background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px;
  padding: 9px 12px; font-size: 12px; color: #166534; line-height: 1.5; display: none;
}
#flash.on { display: block; }
#btn {
  background: #1a1a2e; color: white; border: none; padding: 10px 16px;
  border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
  transition: background .15s; margin-top: auto;
}
#btn:disabled { background: #ccc; cursor: not-allowed; }
#btn:not(:disabled):hover { background: #2d2d52; }

/* ── Demand panel (right) ── */
#msg-panel {
  flex: 1; display: flex; flex-direction: column; background: #f5f5fb; overflow-y: auto;
}
#demands-section {
  padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 0; min-height: 100%;
}
#demands-lbl {
  font-size: 11px; color: #bbb; text-transform: uppercase; letter-spacing: .5px;
  margin-bottom: 12px; font-weight: 600;
}
#demands-list { display: flex; flex-direction: column; gap: 10px; }

/* Actionable demand bubbles */
.dmnd {
  background: white; border-radius: 12px; border: 1.5px solid #e8e8f0;
  border-left: 4px solid #ddd; padding: 14px 16px 12px;
  cursor: pointer; user-select: text; position: relative;
  transition: box-shadow .12s, border-color .12s, background .12s;
}
.dmnd:hover { box-shadow: 0 3px 12px rgba(0,0,0,.09); }
.dmnd.sel { border-left-width: 4px; border-color: currentColor; background: #fafcff; box-shadow: 0 3px 14px rgba(0,0,0,.11); }
.dmnd.expiring::after {
  content: '⚠ last chance'; position: absolute; bottom: 7px; right: 10px;
  font-size: 10px; color: #dc2626; font-weight: 600;
}
.dmnd.p { border-left-color: #0ea5e9; color: #0ea5e9; }
.dmnd.c { border-left-color: #22c55e; color: #22c55e; }
.dmnd.t { border-left-color: #a855f7; color: #a855f7; }
.dmnd.e { border-left-color: #f59e0b; color: #f59e0b; }

.dmnd-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
.dmnd-from { font-size: 12px; font-weight: 600; color: #1a1a2e; flex: 1; }
.dmnd-check { font-size: 13px; font-weight: 700; }
.dmnd-body { font-size: 13px; color: #444; line-height: 1.45; padding-right: 48px; }
.dmnd-foot { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
.dur { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 8px; background: #f3f4f6; color: #6b7280; }
.dur.two { background: #fef3c7; color: #92400e; }
.urg { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 8px; }
.u1{background:#f0fdf4;color:#16a34a} .u2{background:#fffbeb;color:#b45309} .u3{background:#fef2f2;color:#dc2626}

.dmnd-options { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.opt-btn {
  font-size: 12px; padding: 5px 11px; border-radius: 7px;
  border: 1.5px solid #e0e0ea; background: white;
  color: #555; cursor: pointer; transition: all .12s; font-weight: 500;
}
.opt-btn:hover { border-color: #a855f7; color: #7c3aed; background: #faf5ff; }
.opt-btn.chosen { background: #1a1a2e; color: white; border-color: #1a1a2e; }

/* ── Debug ── */
#debug { border-top: 1px dashed #e0e0ea; padding-top: 8px; font-size: 10px; color: #aaa; line-height: 1.6; }
#debug b { color: #888; }

/* ── Mini-calendar ── */
#calendar { border-top: 1px solid #e8e8f0; padding-top: 10px; }
#calendar h4 { font-size: 10px; color: #bbb; text-transform: uppercase; letter-spacing: .5px; font-weight: 600; margin-bottom: 6px; }
.cal-item { display: flex; gap: 7px; padding: 2px 0; font-size: 11px; color: #555; }
.cal-wk { font-weight: 700; color: #1a1a2e; min-width: 30px; }
.cal-item.hot .cal-wk { color: #dc2626; }
.cal-item.now .cal-wk { color: #16a34a; }

/* ── History log ── */
#history-section { padding: 0 20px 32px; display: flex; flex-direction: column; gap: 8px; }
.history-lbl {
  font-size: 11px; color: #bbb; text-transform: uppercase; letter-spacing: .5px;
  font-weight: 600; padding-top: 16px; border-top: 1px solid #e0e0ea; margin-bottom: 4px;
}
.hist-turn {
  background: white; border-radius: 10px; border: 1px solid #e8e8f0;
  padding: 10px 14px; display: flex; flex-direction: column; gap: 5px;
}
.hist-head { font-size: 11px; font-weight: 700; color: #999; letter-spacing: .2px; }
.hist-card {
  display: flex; gap: 6px; align-items: baseline; font-size: 12px; line-height: 1.4;
}
.hist-card.dropped { opacity: 0.38; }
.hc-mark { font-weight: 700; min-width: 12px; font-size: 11px; }
.hc-cat {
  font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 4px;
  white-space: nowrap; flex-shrink: 0;
}
.hc-cat-p { background: #e0f2fe; color: #0369a1; }
.hc-cat-c { background: #dcfce7; color: #15803d; }
.hc-cat-t { background: #f3e8ff; color: #7e22ce; }
.hc-cat-e { background: #fef9c3; color: #854d0e; }
.hc-from { font-weight: 600; color: #1a1a2e; white-space: nowrap; flex-shrink: 0; }
.hc-body { color: #777; }
.hc-opt  { color: #1a8754; font-style: italic; white-space: nowrap; flex-shrink: 0; }
.hist-outcomes {
  font-size: 11px; color: #1a8754; line-height: 1.5;
  border-top: 1px solid #f0f0f5; padding-top: 5px; margin-top: 2px;
}

/* ── Overlay ── */
#overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50; align-items: center; justify-content: center; }
#overlay.on { display: flex; }
#ov-card { background: white; border-radius: 16px; padding: 40px 48px; max-width: 400px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
#ov-title { font-size: 26px; font-weight: 700; margin-bottom: 12px; }
#ov-body  { font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 28px; }
#ov-btn { background: #1a1a2e; color: white; border: none; padding: 12px 36px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
#ov-btn:hover { background: #2d2d52; }
</style>
</head>
<body>

<div id="header">
  <div id="row-status">
    <span id="week-badge">Month 1 · Wk 1</span>
    <span class="st" id="s-cash">Cash <strong>$20,000</strong></span>
    <span class="st" id="s-runway"><strong>—</strong> runway</span>
    <span class="st" id="s-product">Product <strong>0%</strong></span>
    <span class="st" id="s-mf">Fit <strong>0%</strong></span>
    <span class="st" id="s-customers">Customers <strong>0</strong></span>
    <span class="pill pill-live" id="p-live" style="display:none">LIVE</span>
    <span class="pill pill-deck" id="p-deck" style="display:none">Deck ready</span>
    <span class="st" id="s-network">Network <strong>👥 12</strong></span>
    <span id="alex-mood">Alex <span id="alex-dot"></span> <span id="alex-focus-lbl" style="font-size:11px;color:#aaa;margin-left:3px">building</span></span>
  </div>
  <div id="row-gauge">
    <span id="gauge-lbl">Market signal</span>
    <div id="gauge-bar">
      <div class="gs" id="g0"></div><div class="gs" id="g1"></div>
      <div class="gs" id="g2"></div><div class="gs" id="g3"></div><div class="gs" id="g4"></div>
    </div>
    <span id="gauge-desc"></span>
  </div>
  <div id="row-horizon"></div>
</div>

<div id="main">
  <div id="pick-panel">
    <h3>This sprint</h3>
    <span id="counter">Pick 2 of 4</span>
    <div id="flash"></div>
    <div id="calendar"></div>
    <div id="debug"></div>
    <button id="btn" disabled>Pick 2 to continue</button>
  </div>
  <div id="msg-panel">
    <div id="demands-section">
      <div id="demands-lbl">Needs your attention — pick 2</div>
      <div id="demands-list"></div>
    </div>
    <div id="history-section"></div>
  </div>
</div>

<div id="overlay">
  <div id="ov-card">
    <div id="ov-title"></div>
    <div id="ov-body"></div>
    <button id="ov-btn" onclick="boot()">Play Again</button>
  </div>
</div>

<script>const ROLES = {};</script>
<script src="roles/alex.js"></script>
<script src="roles/priya.js"></script>
<script src="roles/marcus.js"></script>
<script src="roles/sarah.js"></script>
<script src="roles/brett.js"></script>
<script src="roles/kevin.js"></script>
<script src="roles/mom.js"></script>
<script src="roles/jamie.js"></script>
<script src="roles/david.js"></script>
<script src="roles/founder.js"></script>
<script src="roles/hacker_news.js"></script>
<script src="roles/yc.js"></script>
<script src="roles/lena.js"></script>
<script src="roles/techcrunch.js"></script>
<script src="roles/users.js"></script>
<script src="roles/analytics.js"></script>
<script src="roles/twitter.js"></script>
<script src="roles/tom.js"></script>
<script src="engine.js"></script>
<script>
// ─────────────────────────────────────────────
// UI
// ─────────────────────────────────────────────

let E, sel, selOpts, gameHistory, _mouseDownX, _mouseDownY;

document.addEventListener('mousedown', e => { _mouseDownX = e.clientX; _mouseDownY = e.clientY; });


function boot() {
  E = new Engine();
  sel = [];
  selOpts = {};
  gameHistory = [];
  document.getElementById('history-section').innerHTML = '';
  document.getElementById('overlay').classList.remove('on');
  E.generateDemands();
  render();
}

function render() {
  const s = E.s;
  const mo = Math.ceil(s.week / 4);
  document.getElementById('week-badge').textContent = `Month ${mo} · Wk ${s.week}`;
  document.getElementById('s-cash').innerHTML = `Cash <strong>${s.cash.toLocaleString()}</strong>`;
  const rw = E.runwayWeeks;
  const re = document.getElementById('s-runway');
  re.innerHTML  = `<strong>${rw}wk</strong> runway`;
  re.className  = 'st' + (rw <= 3 ? ' danger' : rw <= 6 ? ' warn' : '');
  document.getElementById('s-product').innerHTML   = `Product <strong>${Math.round(s.product)}%</strong>`;
  const mf = Math.round(s.market_fit);
  const mfEl = document.getElementById('s-mf');
  mfEl.innerHTML  = `Fit <strong>${mf}%</strong>`;
  mfEl.className  = 'st' + (s.launched && mf < 40 ? ' danger' : mf >= 60 ? ' good' : '');
  document.getElementById('s-customers').innerHTML = `Customers <strong>${s.customers}</strong>`;
  document.getElementById('p-live').style.display  = s.launched   ? 'inline-block' : 'none';
  document.getElementById('p-deck').style.display  = s.deck_ready ? 'inline-block' : 'none';

  // Network display
  const net = s.network;
  const netParts = [`👥 ${net.peers}`];
  if (net.advisors > 0) netParts.push(`🧭 ${net.advisors}`);
  if (net.angels > 0)   netParts.push(`💰 ${net.angels}`);
  if (net.press > 0)    netParts.push(`📰 ${net.press}`);
  document.getElementById('s-network').innerHTML = `Network <strong>${netParts.join(' · ')}</strong>`;

  // Alex status
  const alex = E.chars.get('alex');
  document.getElementById('alex-dot').style.background =
    !alex || !alex.active ? '#9ca3af' :
    alex.morale > 65 ? '#22c55e' : alex.morale > 40 ? '#f59e0b' : '#ef4444';
  document.getElementById('alex-focus-lbl').textContent =
    alex && alex.active
      ? ({ build: 'building', discover: 'discovery', pitch: 'pitching' })[alex.focus]
      : 'left';

  // Gauge
  const idx = E.sigIdx;
  for (let i = 0; i < 5; i++) document.getElementById(`g${i}`).className = `gs${i <= idx ? ` a${i}` : ''}`;
  document.getElementById('gauge-desc').textContent = E.sigDesc;

  // Horizon
  const items = [];
  if (!s.launched) items.push({ t: `🚀 Launch ~${Math.max(1, Math.ceil((60 - s.product) / 8))}wk`, cls: 'hi' });
  if (!s.ycApplied) {
    const w = E.ycWeek - s.week;
    items.push(w > 0 ? { t: `★ YC in ${w}wk`, cls: w <= 2 ? 'hi now' : 'hi' } : { t: '★ YC OPEN', cls: 'hi now' });
  }
  if (rw < 16) items.push({ t: `⚠ Runway ${rw}wk`, cls: rw <= 3 ? 'hi hot' : rw <= 6 ? 'hi soon' : 'hi' });
  if (s.investor_warmth > 0) items.push({ t: `📈 Investor ${s.investor_warmth}%`, cls: 'hi' });
  document.getElementById('row-horizon').innerHTML =
    items.map((it, i) => (i ? '<span style="color:#ddd;margin:0 4px">·</span>' : '') +
      `<span class="${it.cls}">${it.t}</span>`).join('');

  // Mini-calendar
  const calItems = [];
  if (!s.ycApplied && !s.ycDeciding) {
    const label = s.week < E.ycWeek ? 'YC window opens' : 'YC deadline';
    const wk    = s.week < E.ycWeek ? E.ycWeek : E.ycWeek + 2;
    calItems.push({ week: wk, label, cls: wk - s.week <= 2 ? 'now' : '' });
  }
  if (s.ycDeciding) {
    calItems.push({ week: E.ycWeek + 2, label: 'YC deadline', cls: 'now' });
  }
  if (s.ycDecisionWeek) {
    calItems.push({ week: s.ycDecisionWeek, label: 'YC decision', cls: '' });
  }
  const cashOutWeek = s.week + E.runwayWeeks;
  if (E.runwayWeeks < 16) {
    calItems.push({ week: cashOutWeek, label: '⚠ Cash runs out', cls: E.runwayWeeks <= 4 ? 'hot' : '' });
  }
  calItems.sort((a, b) => a.week - b.week);
  const calEl = document.getElementById('calendar');
  // Debug: Alex state
  const dbg = document.getElementById('debug');
  if (alex) {
    const flags = Object.entries(alex.flags).filter(([,v]) => v).map(([k]) => k).join(', ') || '—';
    const activeChars = [...E.chars.entries()].filter(([,c]) => c.active).map(([id]) => id).join(', ');
    dbg.innerHTML =
      `<b>Alex</b> morale ${alex.morale} · trust ${alex.trust}<br>` +
      `focus ${alex.focus} (${alex.focusSprints} sprints)<br>` +
      `flags: ${flags}<br>` +
      (E.alexDepartureRisk ? '<span style="color:#dc2626">⚠ departure risk</span><br>' : '') +
      `<b>active:</b> ${activeChars}`;
  }

  calEl.innerHTML = calItems.length
    ? '<h4>Upcoming</h4>' + calItems.slice(0, 4).map(it =>
        `<div class="cal-item ${it.cls}"><span class="cal-wk">Wk ${it.week}</span>${it.label}</div>`
      ).join('')
    : '';

  renderDemands();

  if (s.game_won) {
    document.getElementById('ov-title').textContent = 'Seed round closed!';
    document.getElementById('ov-body').textContent  = `You raised $1.2M at week ${s.week} with ${s.customers} customers.`;
    document.getElementById('overlay').classList.add('on');
  } else if (s.game_over) {
    document.getElementById('ov-title').textContent = 'Out of runway.';
    document.getElementById('ov-body').textContent  = `Made it to week ${s.week} with ${s.customers} customers. Cash hit zero.`;
    document.getElementById('overlay').classList.add('on');
  }
}

function renderDemands() {
  const ulbls = ['','Routine','Important','Urgent'];
  document.getElementById('demands-list').innerHTML = E.current.map(d => {
    const isSel     = sel.includes(d.id);
    const dc        = d.weeks === 2 ? 'dur two' : 'dur';
    const exp       = d._expiring ? ' expiring' : '';
    const chosenOpt = selOpts[d.id];
    const fromLabel = d.from || (d._charId ? CHARACTER_DEFS[d._charId].name : 'System');

    const optHtml = d.options ? `
      <div class="dmnd-options">
        ${d.options.map(o => `<button class="opt-btn${chosenOpt === o.key ? ' chosen' : ''}"
          onclick="event.stopPropagation();pickOpt('${d.id}','${o.key}')">${o.label}</button>`).join('')}
      </div>` : '';

    return `<div class="dmnd ${d.cat}${isSel ? ' sel' : ''}${exp}">
      <div class="dmnd-meta">
        <span class="dmnd-from">${fromLabel}</span>
        <span class="urg u${d.urgency}">${ulbls[d.urgency]}</span>
        ${isSel ? '<span class="dmnd-check" style="color:#16a34a">&#10003;</span>' : ''}
      </div>
      <div class="dmnd-body">${d.body}</div>
      ${optHtml}
      <div class="dmnd-foot"><span class="${dc}">${d.weeks}wk sprint</span></div>
    </div>`;
  }).join('');
  updateBtn();
}

function pick(id, event) {
  if (event && (Math.abs(event.clientX - _mouseDownX) > 4 || Math.abs(event.clientY - _mouseDownY) > 4)) return;
  if (E.s.game_over || E.s.game_won) return;
  if (sel.includes(id)) {
    sel = sel.filter(i => i !== id);
    delete selOpts[id];
  } else if (sel.length < 2) {
    sel = [...sel, id];
  }
  renderDemands();
}

function pickOpt(id, key) {
  if (E.s.game_over || E.s.game_won) return;
  if (sel.includes(id) && selOpts[id] === key) {
    sel = sel.filter(i => i !== id);
    delete selOpts[id];
  } else {
    if (!sel.includes(id)) {
      if (sel.length >= 2) return;
      sel = [...sel, id];
    }
    selOpts[id] = key;
  }
  renderDemands();
}

function updateBtn() {
  const btn = document.getElementById('btn');
  const ctr = document.getElementById('counter');
  const chosen = E.current.filter(d => sel.includes(d.id));
  const needsChoice = chosen.some(d => d.options && !selOpts[d.id]);
  if (sel.length === 2 && !needsChoice) {
    const wks = Math.max(...chosen.map(d => d.weeks));
    btn.disabled = false;
    btn.textContent = `Commit — ${wks}wk sprint →`;
    ctr.textContent = '✓ 2 of 4 selected';
  } else {
    btn.disabled = true;
    btn.textContent = needsChoice ? 'Choose an option above' : 'Pick 2 to continue';
    ctr.textContent = sel.length === 0 ? 'Pick 2 of 4' : needsChoice ? 'Choose how to handle it' : 'Pick 1 more';
  }
}

function advance() {
  if (sel.length !== 2 || E.s.game_over || E.s.game_won) return;

  const snapshot = {
    week: E.s.week,
    offered: E.current.map(d => ({
      id: d.id, cat: d.cat,
      from: d.from || (d._charId ? CHARACTER_DEFS[d._charId].name : 'System'),
      body: d.body,
      chosen: sel.includes(d.id),
      optLabel: sel.includes(d.id) && d.options && selOpts[d.id]
        ? (d.options.find(o => o.key === selOpts[d.id]) || d.options[0]).label : null,
    })),
  };

  const { results, sprintWeeks } = E.resolveTurn(sel, selOpts);
  snapshot.sprintWeeks = sprintWeeks;
  snapshot.outcomes = results;
  gameHistory.push(snapshot);

  sel = [];
  selOpts = {};
  const flash = document.getElementById('flash');
  const lines = [`${sprintWeeks}wk passed`, ...results];
  flash.innerHTML = lines.map(l => `<div>${l}</div>`).join('');
  flash.classList.add('on');
  E.generateDemands();
  render();
  renderHistory();
}

function renderHistory() {
  const trunc = (str, n) => str.length > n ? str.slice(0, n - 1) + '…' : str;
  const catCls   = { p: 'hc-cat-p', c: 'hc-cat-c', t: 'hc-cat-t', e: 'hc-cat-e' };
  const catLabel = { p: 'prod', c: 'cust', t: 'team', e: 'ext' };

  const el = document.getElementById('history-section');
  if (gameHistory.length === 0) { el.innerHTML = ''; return; }

  el.innerHTML = '<div class="history-lbl">History</div>' +
    [...gameHistory].reverse().map(turn => {
      const cards = turn.offered.map(d => `
        <div class="hist-card ${d.chosen ? '' : 'dropped'}">
          <span class="hc-mark">${d.chosen ? '✓' : '✗'}</span>
          <span class="hc-cat ${catCls[d.cat] || ''}">${catLabel[d.cat] || d.cat}</span>
          <span class="hc-from">${d.from}</span>
          <span class="hc-body">${trunc(d.body, 60)}</span>
          ${d.optLabel ? `<span class="hc-opt">→ ${d.optLabel}</span>` : ''}
        </div>`).join('');

      const outcomes = turn.outcomes.length
        ? `<div class="hist-outcomes">${turn.outcomes.map(o => trunc(o, 100)).join('<br>')}</div>`
        : '';

      return `<div class="hist-turn">
        <div class="hist-head">Wk ${turn.week} &nbsp;·&nbsp; ${turn.sprintWeeks}-week sprint</div>
        ${cards}${outcomes}
      </div>`;
    }).join('');
}

document.getElementById('btn').addEventListener('click', advance);
boot();

</script>
